<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_recent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Revisionsunterlagen – GEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#4338ca;--acc-bg:#eef2ff;--acc-bd:#c7d2fe;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 60%,#6366f1 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:12px;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srch{flex:1;min-width:160px;padding:9px 13px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.srch:focus{border-color:var(--acc)}
.sel{padding:9px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13px;background:var(--sur);outline:none;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px;cursor:pointer}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
.dcard{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.12s}
.dcard:hover{border-color:var(--acc-bd)}
.dcard-bar{height:4px}
.dcard-bd{padding:11px 13px}
.dcard-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcard-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:4px}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prog{height:7px;border-radius:999px;background:var(--brd);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--acc)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6}
/* modal */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:920px}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer;flex-shrink:0}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11.5px;font-weight:800;color:var(--txt2);margin-bottom:4px}
.fc{width:100%;padding:9px 11px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;background:var(--sur);outline:none}
.fc:focus{border-color:var(--acc)}
textarea.fc{min-height:80px;resize:vertical;line-height:1.5}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--brd2);border-radius:11px;padding:11px;cursor:pointer;text-align:left;background:var(--sur)}
.opt.on{border-color:var(--acc);background:var(--acc-bg)}
.opt .ot{font-size:13px;font-weight:800}
.opt .od{font-size:11px;color:var(--mut);margin-top:2px}
/* detail overlay */
#detail{position:fixed;inset:0;z-index:700;background:var(--bg);display:none;flex-direction:column}
#detail.open{display:flex}
.dt-hd{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.dt-hd .tt{font-size:15px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-tools{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0}
.dt-body{flex:1;overflow:hidden;display:flex;min-height:0}
.dt-tree{width:290px;flex-shrink:0;border-right:1px solid var(--brd);overflow-y:auto;background:var(--sur);padding:8px}
.dt-main{flex:1;overflow-y:auto;padding:14px}
@media(max-width:820px){.dt-body{flex-direction:column}.dt-tree{width:100%;max-height:34vh;border-right:none;border-bottom:1px solid var(--brd)}}
.kap-row{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px}
.kap-row:hover{background:var(--sur2)}
.kap-row.on{background:var(--acc-bg);font-weight:800}
.kap-row.e2{padding-left:22px;font-size:12px;color:var(--txt2)}
.kap-nr{color:var(--mut);font-weight:800;flex-shrink:0}
.kap-badge{margin-left:auto;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--brd);color:var(--mut)}
.kap-badge.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.ent{border:1.5px solid var(--brd);border-radius:11px;padding:10px 12px;margin-bottom:9px;background:var(--sur)}
.ent.hidden{opacity:.5}
.ent-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent-ic{font-size:16px}
.ent-ti{font-size:13px;font-weight:800;flex:1;min-width:120px}
.ent-src{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sur2);border:1px solid var(--brd);color:var(--mut)}
.ent-st{font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px}
.st-ok{background:var(--grn-bg);color:var(--grn)}
.st-fehlend{background:var(--amber-bg);color:var(--amber)}
.st-angefordert{background:var(--blue-bg);color:var(--blue)}
.ent-acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.ent-body{font-size:12.5px;color:var(--txt2);margin-top:7px;line-height:1.55;white-space:pre-wrap}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:7px}
.tbl th,.tbl td{border:1px solid var(--brd);padding:4px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--sur2);font-weight:800}
.matrix{width:100%;border-collapse:collapse;font-size:11.5px}
.matrix th,.matrix td{border:1px solid var(--brd);padding:5px 7px;text-align:center}
.matrix th{background:var(--sur2);font-weight:800;position:sticky;top:0}
.matrix td.name{text-align:left;font-weight:700}
.mx-ok{color:var(--grn);font-weight:900;cursor:pointer}
.mx-req{color:var(--blue);font-weight:800}
#qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px}
#qrbox img,#qrbox canvas{width:200px;height:200px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.hintbox{background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--txt2);line-height:1.5;margin-bottom:10px}
@media print{.g-nav,.no-print{display:none!important}}
</style>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════

// Pflicht-Dokumenttypen fuer die Vollstaendigkeit (pro Dossier uebersteuerbar)
var REV_PFLICHT_DOKTYPEN = ['datenblatt','bedienungsanleitung','wartungsanleitung','konformitaetserklaerung'];

function revUid(pfx){ return pfx+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).substring(2,7); }
function revNormDok(t){ try{ if(typeof GemaProdukte!=='undefined'&&GemaProdukte.normDokTyp) return GemaProdukte.normDokTyp(t); }catch(e){} return t||'sonstiges'; }

// Kapitel 1,1.1,1.2,2,… aus der ebene-Folge generieren
function revKapitelRenummerieren(kapitel){
  var maj=0, min=0;
  (kapitel||[]).forEach(function(k){
    if(k.ebene===2){ min++; k.nr=maj+'.'+min; }
    else { maj++; min=0; k.nr=String(maj); }
  });
  return kapitel;
}

// Neues Dossier aus einer Vorlage instanziieren (+ Deckblatt-Vorschlag)
function revNeuesDossier(vorlage, ctx){
  ctx=ctx||{};
  var kapitel=(vorlage.kapitel||[]).map(function(k){
    return { id:revUid('kap'), ebene:k.ebene||1, nr:'', titel:k.titel||'', beschreibung:k.beschreibung||'',
             einleitungText:k.einleitungText||'', autoQuellen:(k.autoQuellen||[]).slice(), eintraege:[] };
  });
  revKapitelRenummerieren(kapitel);
  var d={
    id:revUid('rev'), orgId:ctx.orgId||'', objektId:ctx.objektId||'', objektName:ctx.objektName||'',
    gewerk:vorlage.gewerk||'allgemein', titel:ctx.titel||('Revisionsunterlagen '+((REV_GEWERKE[vorlage.gewerk]||{}).label||'')),
    vorlageId:vorlage.id||'', status:'in_arbeit', uebergebenAm:null,
    pflichtDok:REV_PFLICHT_DOKTYPEN.slice(),
    deckblatt:revDeckblattVorschlag(ctx.objekt, ctx.beteiligte, ctx.org, ctx.user),
    kapitel:kapitel, freigabe:null, sammelStand:null,
    erstelltAm:new Date().toISOString(), erstelltVon:ctx.user?{userId:ctx.user.id||'',name:ctx.user.name||''}:null, geaendertAm:new Date().toISOString()
  };
  return d;
}

function _betLine(b){ if(!b)return ''; return [b.firma,(b.vorname?b.vorname+' ':'')+ (b.name||''),[b.plz,b.ort].filter(Boolean).join(' ')].filter(function(x){return x&&x.trim();}).join('\n'); }
function _betByRolle(beteiligte, rolle){ return (beteiligte||[]).filter(function(b){return (b.rolle||'')===rolle;}); }

function revDeckblattVorschlag(objekt, beteiligte, org, user){
  objekt=objekt||{}; beteiligte=beteiligte||[]; org=org||{}; user=user||{};
  var bh=_betByRolle(beteiligte,'Bauherrschaft')[0];
  var arch=_betByRolle(beteiligte,'Architekt / Generalplaner')[0];
  var untAdr=[org.name, org.strasse, [org.plz,org.ort].filter(Boolean).join(' ')].filter(Boolean).join('\n');
  var tel=''; try{ tel=((org.settings||{}).erp||{}).tel||''; }catch(e){}
  if(tel) untAdr+='\nTel. '+tel;
  return {
    dokumentTitel:'Betriebs- und Wartungsanleitung',
    objektName:objekt.name||'', strasse:objekt.strasse||'', plzOrt:[objekt.plz,objekt.ort].filter(Boolean).join(' '),
    anlageNr:objekt.projektnummer||'', version:objekt.revision||'',
    bauherr:_betLine(bh), architekt:_betLine(arch), unternehmer:untAdr,
    bearbeiter:user.name||'', datum:new Date().toISOString().split('T')[0],
    _touched:{}
  };
}

// Produkte des Objekts aus allen Quellen sammeln (dedupliziert)
function revProdukteSammeln(ctx){
  ctx=ctx||{}; var oid=ctx.objektId;
  var out=[]; var byKey={};
  function key(p){ return p.produktId ? ('id:'+p.produktId) : ('nm:'+((p.lieferantId||'')+'|'+(p.produktName||'').toLowerCase())); }
  function add(p, quelle){
    if(!p.produktName && !p.produktId) return;
    if((p.kategorie||'')==='werkzeuge') return;
    var k=key(p); var e=byKey[k];
    if(!e){ e={ produktId:p.produktId||'', produktName:p.produktName||'', kategorie:p.kategorie||'',
               lieferantId:p.lieferantId||'', lieferantFirma:p.lieferantFirma||'', bkpCode:p.bkpCode||'',
               lieferdatum:p.lieferdatum||'', kennwerte:{}, quellen:[] };
           byKey[k]=e; out.push(e); }
    if(!e.produktId && p.produktId) e.produktId=p.produktId;
    if(!e.lieferantFirma && p.lieferantFirma) e.lieferantFirma=p.lieferantFirma;
    if(!e.lieferantId && p.lieferantId) e.lieferantId=p.lieferantId;
    if(!e.bkpCode && p.bkpCode) e.bkpCode=p.bkpCode;
    if(!e.lieferdatum && p.lieferdatum) e.lieferdatum=p.lieferdatum;
    if(!e.kategorie && p.kategorie) e.kategorie=p.kategorie;
    if(p.kennwerte) for(var kk in p.kennwerte){ if(e.kennwerte[kk]==null && p.kennwerte[kk]!=null && p.kennwerte[kk]!=='') e.kennwerte[kk]=p.kennwerte[kk]; }
    e.quellen.push(quelle);
  }
  // 1) Bestellungen
  (ctx.bestellungen||[]).forEach(function(b){
    if(b.objektId!==oid) return; if(b.status==='storniert'||b.status==='abgelehnt') return;
    add({produktId:b.produktId,produktName:b.produktName,kategorie:b.kategorie,lieferantId:b.lieferantId,lieferantFirma:b.lieferantFirma,bkpCode:(b.quelle||{}).bkpCode||'',lieferdatum:(b.geliefert||{}).am||b.bestelltAm||''},{typ:'bestellung',ref:'best:'+(b.nr||b.id)});
  });
  // 2) Offertanfragen (beantwortet)
  (ctx.oas||[]).forEach(function(oa){
    if(!oa||(oa.projekt||{}).objektId!==oid) return; if(oa.status!=='beantwortet') return;
    add({produktId:(oa.antwort||{}).produktId||oa.produktId,produktName:oa.produktName,kategorie:oa.kategorie,lieferantId:oa.lieferantId,lieferantFirma:oa.lieferantFirma,kennwerte:oa.berechnungswerte||{}},{typ:'oa',ref:'oa:'+oa.id});
  });
  // 3) Vormerkungen
  (ctx.vormerkungen||[]).forEach(function(vm){
    add({produktId:vm.produktId,produktName:vm.produktName,kategorie:vm.kategorie,lieferantId:vm.lieferantId,lieferantFirma:vm.lieferantFirma,bkpCode:vm.bkpCode||''},{typ:'vormerkung',ref:'vm:'+vm.id});
  });
  // 4) Gewählte Anlagen
  (ctx.chosen||[]).forEach(function(c){
    add({produktId:c.produktId||'',produktName:c.produktName||c.modell||((REV_GEWERKE[c.kategorie]||{}).label)||c.kategorie,kategorie:c.kategorie,lieferantFirma:c.lieferantFirma||'',kennwerte:c.daten||{}},{typ:'anlagenwahl',ref:'aw:'+c.kategorie});
  });
  // 5) Ausschreibungs-Positionen
  (ctx.ausschreibungen||[]).forEach(function(a){
    if(a.objektId!==oid) return;
    (a.lose||[]).forEach(function(los){
      (los.positionen||[]).forEach(function(p){
        if(!p.istLieferung || p.checked===false) return;
        var of=p.offerte||{};
        add({produktId:'',produktName:of.produktName||p.titel,kategorie:(ctx.lieferungKat&&ctx.lieferungKat(p.lieferungTyp))||'',lieferantId:of.lieferantId||'',lieferantFirma:of.lieferantFirma||'',bkpCode:p.bkp||''},{typ:'ausschreibung',ref:'aus:'+a.id});
      });
    });
  });
  return out;
}

// Auto-Eintraege je Kapitel berechnen. ctx-Accessoren halten die Funktion DOM-frei:
//   ctx.produkte, ctx.beteiligte, ctx.berechnungen, ctx.abnahmen, ctx.serviceAnlagen
//   ctx.getProduktDoks(id)->[], ctx.getKategorieLabel(kat), ctx.getKategorieFelder(kat), ctx.getLieferant(id)
function revSammeln(dossier, ctx){
  ctx=ctx||{}; var prod=ctx.produkte||[]; var result=[]; // [{kapId, entries:[...]}]
  function ae(autoKey, obj){ obj.autoKey=autoKey; obj.quelle=obj.quelle||{typ:'auto',ref:''}; obj.status=obj.status||'ok'; return obj; }
  (dossier.kapitel||[]).forEach(function(kap){
    var entries=[];
    (kap.autoQuellen||[]).forEach(function(q){
      if(q==='beteiligte'){
        var rows=(ctx.beteiligte||[]).map(function(b){ return [b.rolle||'', b.firma||'', ((b.vorname?b.vorname+' ':'')+(b.name||'')).trim(), b.ort||'', b.telefon||b.mobile||'', b.email||'']; });
        entries.push(ae('beteiligte',{id:revUid('ein'),typ:'tabelle',tabellenArt:'beteiligte',titel:'Am Bau Beteiligte',spalten:['Rolle','Firma','Name','Ort','Telefon','E-Mail'],zeilen:rows}));
      } else if(q==='lieferantenverzeichnis'){
        var lr=prod.map(function(p){ var l=ctx.getLieferant?ctx.getLieferant(p.lieferantId):null; var kat=ctx.getKategorieLabel?ctx.getKategorieLabel(p.kategorie):p.kategorie;
          return [kat||p.produktName, p.produktName||'', p.lieferantFirma||(l&&l.firma)||'', (l&&(l.telefon||l.tel))||'', (l&&l.email)||'']; });
        entries.push(ae('lieferantenverzeichnis',{id:revUid('ein'),typ:'tabelle',tabellenArt:'lieferanten',titel:'Lieferantenverzeichnis',spalten:['Gegenstand','Typ/Modell','Lieferant','Telefon','E-Mail'],zeilen:lr}));
      } else if(q==='anlagenliste'){
        var ar=prod.map(function(p){ var kat=ctx.getKategorieLabel?ctx.getKategorieLabel(p.kategorie):p.kategorie; return [kat||'—', p.produktName||'', p.lieferantFirma||'', p.bkpCode||'', (p.quellen[0]||{}).ref||'']; });
        entries.push(ae('anlagenliste',{id:revUid('ein'),typ:'tabelle',tabellenArt:'anlagen',titel:'Anlagenliste',spalten:['Anlage','Produkt','Lieferant','BKP','Quelle'],zeilen:ar}));
      } else if(q==='garantie'){
        var gr=prod.map(function(p){ var g=''; (ctx.serviceAnlagen||[]).forEach(function(sa){ if(sa.produktId&&sa.produktId===p.produktId) g=sa.garantieBis||g; }); return [p.produktName||'', p.lieferantFirma||'', p.lieferdatum?p.lieferdatum.split('T')[0]:'', g]; });
        entries.push(ae('garantie',{id:revUid('ein'),typ:'tabelle',tabellenArt:'garantie',titel:'Garantie-Übersicht',spalten:['Produkt','Lieferant','Lieferdatum','Garantie bis'],zeilen:gr}));
      } else if(q==='wartungstabelle'){
        var kat=REV_WARTUNG_KATALOG[dossier.gewerk]||REV_WARTUNG_KATALOG.sanitaer||[];
        kat.forEach(function(grp,i){ entries.push(ae('wartung:'+grp.gruppe,{id:revUid('ein'),typ:'tabelle',tabellenArt:'wartung',titel:'Wartung: '+grp.gruppe,spalten:REV_WART_SPALTEN.slice(),zeilen:grp.zeilen.map(function(z){return z.slice();})})); });
        var svc=(ctx.serviceAnlagen||[]).filter(function(sa){return sa.objektId===dossier.objektId;});
        if(svc.length){ entries.push(ae('wartung_service',{id:revUid('ein'),typ:'tabelle',tabellenArt:'wartung',titel:'Service-Anlagen (Wartungsintervalle)',spalten:['Anlage','Hersteller/Modell','Intervall (Mt.)','Letzte Wartung'],zeilen:svc.map(function(sa){return [sa.name||'',[sa.hersteller,sa.modell].filter(Boolean).join(' '),String(sa.intervallMonate||''),sa.letzteWartung||''];})})); }
      } else if(q==='kennwerte'){
        prod.forEach(function(p){ var keys=Object.keys(p.kennwerte||{}); if(!keys.length) return;
          var felder=ctx.getKategorieFelder?ctx.getKategorieFelder(p.kategorie):[]; var fmap={}; (felder||[]).forEach(function(f){fmap[f.id]=f;});
          var rows=keys.filter(function(kk){var v=p.kennwerte[kk];return v!=null&&v!=='';}).map(function(kk){ var f=fmap[kk]; var lbl=(f&&f.label)||REV_BW_LABELS[kk]||kk; var u=(f&&f.einheit)?(' '+f.einheit):''; return [lbl, String(p.kennwerte[kk])+u]; });
          if(rows.length) entries.push(ae('kennwerte:'+(p.produktId||p.produktName),{id:revUid('ein'),typ:'tabelle',tabellenArt:'kennwerte',titel:'Auslegungsdaten '+(p.produktName||''),spalten:['Kennwert','Wert'],zeilen:rows,produktName:p.produktName}));
        });
      } else if(q==='berechnungen'){
        (ctx.berechnungen||[]).forEach(function(b){ entries.push(ae('berechnung:'+b.modul,{id:revUid('ein'),typ:'verweis',titel:'Berechnung: '+(b.titel||b.modul),linkUrl:(ctx.modulUrl?ctx.modulUrl(b.modul):'')+(dossier.objektId?'?objekt='+encodeURIComponent(dossier.objektId):''),linkLabel:'Im Berechnungsmodul öffnen'})); });
      } else if(q==='abnahmen'){
        (ctx.abnahmen||[]).forEach(function(ab){ entries.push(ae('abnahme:'+ab.id,{id:revUid('ein'),typ:'verweis',titel:'Abnahmeprotokoll '+(ab.name||'')+(ab.datum?' ('+ab.datum+')':''),linkUrl:'pm_abnahme.html'+(dossier.objektId?'?objekt='+encodeURIComponent(dossier.objektId):''),linkLabel:'Protokoll öffnen — PDF-Ausdruck hier anhängen'})); });
      } else if(q==='textbaustein:wartung_einleitung'){ entries.push(ae('tb:wartung_einleitung',{id:revUid('ein'),typ:'text',titel:'Einleitung',text:REV_TEXTBAUSTEINE.wartung_einleitung})); }
      else if(q==='textbaustein:zustaendigkeit_hygiene'){ entries.push(ae('tb:zustaendigkeit_hygiene',{id:revUid('ein'),typ:'text',titel:'Zuständigkeit Wasserhygiene',text:REV_TEXTBAUSTEINE.zustaendigkeit_hygiene})); }
      else if(q==='textbaustein:abwesenheiten'){ entries.push(ae('tb:abwesenheiten',{id:revUid('ein'),typ:'text',titel:'Vorgehen bei Abwesenheiten',text:REV_TEXTBAUSTEINE.abwesenheiten}));
        entries.push(ae('tb:abwesenheiten_tab',{id:revUid('ein'),typ:'tabelle',tabellenArt:'info',titel:'Massnahmen bei Stagnation',spalten:REV_ABWESENHEIT_TABELLE.spalten.slice(),zeilen:REV_ABWESENHEIT_TABELLE.zeilen.map(function(z){return z.slice();})})); }
      else if(q==='kontrollblatt'){ entries.push(ae('kontrollblatt',{id:revUid('ein'),typ:'tabelle',tabellenArt:'kontrollblatt',titel:'Kontrollblatt',spalten:['Datum','Ausgeführte Kontrolle / Reparatur / Bemerkung','Visum'],zeilen:[]})); }
      else if(q.indexOf('produktdok:')===0){
        var dokTyp=q.split(':')[1];
        prod.forEach(function(p){
          var doks=(ctx.getProduktDoks?ctx.getProduktDoks(p.produktId):[]).filter(function(d){return revNormDok(d.typ)===dokTyp;});
          if(doks.length){ doks.forEach(function(d){ entries.push(ae('pd:'+(p.produktId||p.produktName)+':'+d.id,{id:revUid('ein'),typ:'produktdok',titel:(p.produktName||'')+' — '+(d.name||dokTyp),produktId:p.produktId,produktName:p.produktName,lieferantId:p.lieferantId,lieferantFirma:p.lieferantFirma,dokId:d.id,dokTyp:dokTyp,name:d.name,url:d.url||'',dataUrl:d.dataUrl||'',format:d.format||'pdf',status:'ok'})); }); }
          else if(p.produktId && (dossier.pflichtDok||REV_PFLICHT_DOKTYPEN).indexOf(dokTyp)>=0){
            entries.push(ae('ph:'+(p.produktId||p.produktName)+':'+dokTyp,{id:revUid('ein'),typ:'platzhalter',titel:(p.produktName||'')+' — '+dokTyp+' fehlt',erwartetDokTyp:dokTyp,produktId:p.produktId,produktName:p.produktName,lieferantId:p.lieferantId,lieferantFirma:p.lieferantFirma,status:'fehlend'}));
          }
        });
      }
    });
    if(entries.length) result.push({kapId:kap.id, entries:entries});
  });
  return result;
}

// ADD-ONLY Merge: neue Auto-Eintraege anhaengen, manuell/ausgeblendete NIE anfassen,
// Platzhalter aufloesen, entfallene Auto-Quellen markieren (nie loeschen).
function revMergeAddOnly(dossier, gesammelt){
  var summ={neu:0,aktualisiert:0,fehlend:0,entfernt:0};
  var byKap={}; (gesammelt||[]).forEach(function(g){ byKap[g.kapId]=g.entries; });
  (dossier.kapitel||[]).forEach(function(kap){
    var neueList=byKap[kap.id]||[];
    var neueByKey={}; neueList.forEach(function(e){ if(e.autoKey) neueByKey[e.autoKey]=e; });
    kap.eintraege = kap.eintraege||[];
    // 1) Platzhalter aufloesen: gibt es jetzt einen produktdok-Eintrag fuers gleiche Produkt+Typ?
    kap.eintraege.forEach(function(e){
      if(e.typ==='platzhalter' && e.status!=='ok' && !e.manuellGeaendert){
        var resolved=neueList.find(function(n){ return n.typ==='produktdok' && n.produktId===e.produktId && n.dokTyp===e.erwartetDokTyp; });
        if(resolved){ Object.assign(e,{typ:'produktdok',titel:resolved.titel,dokId:resolved.dokId,dokTyp:resolved.dokTyp,name:resolved.name,url:resolved.url,dataUrl:resolved.dataUrl,format:resolved.format,autoKey:resolved.autoKey,status:'ok'}); summ.aktualisiert++; }
      }
    });
    // 2) bestehende Auto-Eintraege markieren (welche Keys existieren schon)
    var vorhandenKeys={}; kap.eintraege.forEach(function(e){ if(e.autoKey) vorhandenKeys[e.autoKey]=e; });
    // 2a) Singleton-Tabellen aktualisieren (nicht manuell) — Inhalt ersetzen
    Object.keys(neueByKey).forEach(function(ak){
      var n=neueByKey[ak]; var ex=vorhandenKeys[ak];
      if(ex){
        if(!ex.manuellGeaendert && !ex.ausgeblendet && n.typ==='tabelle'){ ex.spalten=n.spalten; ex.zeilen=n.zeilen; ex.titel=ex.titel||n.titel; if(ex.zeilen&&ex.spalten) summ.aktualisiert++; }
        // produktdok/text existieren schon → nichts tun
      } else {
        kap.eintraege.push(n); summ.neu++; if(n.status==='fehlend') summ.fehlend++;
      }
    });
    // 3) entfallene Auto-Quellen markieren
    kap.eintraege.forEach(function(e){
      if(e.quelle && e.quelle.typ==='auto' && e.autoKey && !neueByKey[e.autoKey] && e.typ!=='platzhalter' && !e.manuellGeaendert && !e._geschaetzt){
        if(!e.quelle.entfernt){ e.quelle.entfernt=true; summ.entfernt++; }
      } else if(e.quelle && e.quelle.entfernt && e.autoKey && neueByKey[e.autoKey]){ e.quelle.entfernt=false; }
    });
  });
  dossier.geaendertAm=new Date().toISOString();
  return summ;
}

function revVollstaendigkeit(dossier){
  var pflicht=(dossier&&dossier.pflichtDok)||REV_PFLICHT_DOKTYPEN;
  var res={pflichtTotal:0,vorhanden:0,fehlend:[]};
  var produkte={}; // produktId → {name, doksVorhanden:Set}
  (dossier.kapitel||[]).forEach(function(kap){ (kap.eintraege||[]).forEach(function(e){
    if(e.typ==='produktdok'&&e.produktId){ produkte[e.produktId]=produkte[e.produktId]||{name:e.produktName,lieferantId:e.lieferantId,lieferantFirma:e.lieferantFirma,typen:{},status:{}}; produkte[e.produktId].typen[revNormDok(e.dokTyp)]=true; }
    if(e.typ==='platzhalter'&&e.produktId){ produkte[e.produktId]=produkte[e.produktId]||{name:e.produktName,lieferantId:e.lieferantId,lieferantFirma:e.lieferantFirma,typen:{},status:{}}; produkte[e.produktId].status[e.erwartetDokTyp]=e.status; }
  }); });
  Object.keys(produkte).forEach(function(pid){ var p=produkte[pid];
    pflicht.forEach(function(t){ res.pflichtTotal++; if(p.typen[t]) res.vorhanden++; else res.fehlend.push({produktId:pid,produktName:p.name,lieferantId:p.lieferantId,lieferantFirma:p.lieferantFirma,dokTyp:t,angefordert:p.status[t]==='angefordert'}); });
  });
  return res;
}

function revTokenNeu(){
  try{ var a=new Uint8Array(24); (self.crypto||window.crypto).getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }
  catch(e){ var s=''; for(var i=0;i<48;i++) s+= '0123456789abcdef'[Math.floor(Math.random()*16)]; return s; }
}

// Fuer die oeffentliche Freigabe: token/userIds/dataUrl/ausgeblendete entfernen
function revSanitizeForShare(dossier){
  var d=JSON.parse(JSON.stringify(dossier));
  delete d.freigabe; delete d.sammelStand; if(d.erstelltVon) delete d.erstelltVon.userId;
  (d.kapitel||[]).forEach(function(kap){
    kap.eintraege=(kap.eintraege||[]).filter(function(e){ return !e.ausgeblendet; }).map(function(e){
      if(e.quelle) delete e.quelle.ref;
      if(e.dataUrl && !e.url){ e.nurIntern=true; e.dataUrl=''; }
      else if(e.dataUrl){ delete e.dataUrl; }
      delete e.autoKey; delete e.lieferantId;
      return e;
    });
  });
  return d;
}

  var map={enthaertungsanlage:'sa_enthaertung.html',osmose:'sa_osmose.html',druckerhoehung:'sb_druckerhoehung.html',frischwasserstation:'sa_frischwasserstation.html',abwasserhebeanlage:'sa_abwasserhebeanlage.html',fettabscheider:'sa_fettabscheider.html',oelabscheider:'sa_oelabscheider.html',schlammsammler:'sa_schlammsammler.html',thermische_solaranlage:'sa_solaranlage.html',zirkulation:'sb_zirkulation.html',druckanstieg:'sb_druckanstieg.html',ausdehnungsgefaess:'hz_ausdehnungsgefaess.html',heizungsleitungen:'hz_heizungsleitungen.html',waermegruppen:'hz_waermegruppen.html',heizlast_verbrauch:'hz_heizlast.html',hx_diagramm:'lt_hx_diagramm.html',fluessiggas:'sb_fluessiggas.html',warmwasser_sia385:'sb_warmwasser.html',gasloeschung:'br_gasloeschung.html'};
  return map[modul]||'';
}
function _readAbnahmen(objektId){
  var out=[]; REV_PHASES.forEach(function(ph){
    var key='gema_abnahme_sia_v1__'+objektId+(ph?'@'+ph:'');
    try{ var raw=localStorage.getItem(key); if(!raw)return; var o=JSON.parse(raw); var protos=(o&&o.protocols)||[];
      protos.forEach(function(pr){ out.push({id:pr.id,name:pr.name||'Abnahmeprotokoll',datum:pr.createdAt?fD(pr.createdAt):''}); }); }catch(e){}
  });
  return out;
}
function _readChosen(objektId){
  var out=[]; var kats={}; try{ if(typeof GemaProdukte!=='undefined'&&GemaProdukte.KATEGORIEN) kats=GemaProdukte.KATEGORIEN; }catch(e){}
  Object.keys(kats).forEach(function(kat){ REV_PHASES.forEach(function(ph){
    var key='gema_aw_chosen_'+kat+'__'+objektId+(ph?'@'+ph:'');
    try{ var raw=localStorage.getItem(key); if(!raw)return; var c=JSON.parse(raw); if(!c)return;
      out.push({kategorie:kat,produktId:c.produktId||c.id||'',produktName:c.produktName||c.name||'',modell:c.modell||(c.daten&&c.daten.modell)||'',lieferantFirma:c.lieferantFirma||'',daten:c.daten||c}); }catch(e){}
  }); });
  return out;
}
function _buildSammelCtx(dossier){
  var oid=dossier.objektId; var org=_org();
  var bestellungen=[]; try{ if(typeof GemaBest!=='undefined') bestellungen=GemaBest.getForOrg((org||{}).id)||[]; }catch(e){}
  var oas=[]; try{ if(typeof GemaProdukte!=='undefined') oas=GemaProdukte.getOffertanfragen({status:'beantwortet'})||[]; }catch(e){}
  var vorm=[]; try{ if(typeof GemaProdukte!=='undefined'&&GemaProdukte.getVormerkungen) vorm=GemaProdukte.getVormerkungen(oid)||[]; }catch(e){}
  var chosen=_readChosen(oid);
  var aus=[]; try{ aus=_readPool('gema_aus_pool_v1'); }catch(e){}
  var beteiligte=[]; try{ if(typeof GemaObjekte!=='undefined') beteiligte=GemaObjekte.getBeteiligte(oid)||[]; }catch(e){}
  var berech=[]; try{ if(typeof GemaObjekte!=='undefined'&&GemaObjekte.getBerechnungenForObjekt) berech=GemaObjekte.getBerechnungenForObjekt(oid)||[]; }catch(e){}
  var abn=_readAbnahmen(oid);
  var svc=[]; try{ svc=_readPool('gema_sv_anlagen_pool_v1'); }catch(e){}
  var produkte=revProdukteSammeln({objektId:oid,bestellungen:bestellungen,oas:oas,vormerkungen:vorm,chosen:chosen,ausschreibungen:aus,lieferungKat:function(t){return REV_LIEFTYP_KAT[t]||'';}});
  return { produkte:produkte, beteiligte:beteiligte, berechnungen:berech, abnahmen:abn, serviceAnlagen:svc,
    getProduktDoks:function(id){ try{ return id&&typeof GemaProdukte!=='undefined'?(GemaProdukte.getDokumente(id)||[]):[]; }catch(e){return [];} },
    getKategorieLabel:function(kat){ try{ var k=typeof GemaProdukte!=='undefined'&&GemaProdukte.getKategorie?GemaProdukte.getKategorie(kat):null; return (k&&k.name)||kat||''; }catch(e){return kat||'';} },
    getKategorieFelder:function(kat){ try{ var k=typeof GemaProdukte!=='undefined'&&GemaProdukte.getKategorie?GemaProdukte.getKategorie(kat):null; return (k&&(k.felder||[]).concat(k.matchFelder||[]))||[]; }catch(e){return [];} },
    getLieferant:function(id){ try{ return id&&typeof GemaProdukte!=='undefined'&&GemaProdukte.getLieferant?GemaProdukte.getLieferant(id):null; }catch(e){return null;} },
    modulUrl:_autosaveModulUrl };
}
function revSammelnLauf(dossier, silent){
  var ctx=_buildSammelCtx(dossier);
  var ges=revSammeln(dossier, ctx);
  var summ=revMergeAddOnly(dossier, ges);
  dossier.sammelStand={am:new Date().toISOString(),von:(_me()||{}).name||''};
  saveDossier(dossier);
  if(!silent){ GemaDialog.alert({title:'Aus GEMA aktualisiert',message:'Neu übernommen: '+summ.neu+'\nAktualisiert: '+summ.aktualisiert+'\nFehlende Pflicht-Unterlagen: '+summ.fehlend+(summ.entfernt?('\nQuelle entfallen: '+summ.entfernt):'')}); }
  return summ;
}

  var objF=of.value, q=(document.getElementById('srch').value||'').toLowerCase().trim();

    return;

  else h+=vs.map(function(v){var g=REV_GEWERKE[v.gewerk]||{};return '<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--brd);border-radius:10px;padding:9px;margin-bottom:6px"><span>'+(g.icon||'📁')+'</span><span style="flex:1;font-weight:700;font-size:12.5px">'+E(v.name)+'</span><span style="font-size:11px;color:var(--mut)">'+(v.kapitel||[]).length+' Kapitel</span>'+(_canEdit()?'<button class="btn sm red" onclick="vorlagenDel(\''+v.id+'\')">🗑</button>':'')+'</div>';}).join('');

function vorlagenDel(id){ GemaDialog.confirm({title:'Vorlage löschen',message:'Vorlage wirklich löschen?',danger:true,confirmLabel:'Löschen'}).then(function(ok){ if(!ok)return; _delRec(VPOOL,'revv:',id); vorlagenOpen(); }); }

// ══════════════ VOLLSTÄNDIGKEITS-MATRIX + ANFRAGE ══════════════
function matrixOpen(reqMode){
  var v=revVollstaendigkeit(_det);
  var pflicht=(_det.pflichtDok||REV_PFLICHT_DOKTYPEN);
  // Produkte gruppieren
  var prodMap={}; _det.kapitel.forEach(function(k){(k.eintraege||[]).forEach(function(e){ if((e.typ==='produktdok'||e.typ==='platzhalter')&&e.produktId){ prodMap[e.produktId]=prodMap[e.produktId]||{name:e.produktName,lieferantId:e.lieferantId,lieferantFirma:e.lieferantFirma,typen:{},status:{}}; if(e.typ==='produktdok')prodMap[e.produktId].typen[revNormDok(e.dokTyp)]=true; if(e.typ==='platzhalter')prodMap[e.produktId].status[e.erwartetDokTyp]=e.status; } });});
  var pids=Object.keys(prodMap);
  var dt=(typeof GemaProdukte!=='undefined'&&GemaProdukte.DOK_TYPEN)?GemaProdukte.DOK_TYPEN:{};
  var h='<div class="hintbox">Zeilen = verbaute Produkte, Spalten = Pflicht-Unterlagen. ✓ = vorhanden · leeres Feld ankreuzen = beim Lieferanten anfordern.</div>';
  if(!pids.length){ h+='<div class="empty" style="padding:16px">Noch keine Produkte mit Katalog-Verknüpfung. Erst «↻ Aus GEMA aktualisieren».</div>'; mOpen('Vollständigkeit',h,[{label:'Schliessen',fn:'mClose()'}],'wide'); return; }
  h+='<div style="overflow-x:auto"><table class="matrix"><thead><tr><th class="name">Produkt / Lieferant</th>'+pflicht.map(function(t){return '<th>'+E((dt[t]&&dt[t].label)||t)+'</th>';}).join('')+'</tr></thead><tbody>';
  pids.forEach(function(pid){ var p=prodMap[pid];
    h+='<tr><td class="name">'+E(p.name||'—')+'<br><span style="font-size:10px;color:var(--mut)">'+E(p.lieferantFirma||'')+'</span></td>';
    pflicht.forEach(function(t){ if(p.typen[t])h+='<td class="mx-ok">✓</td>';
      else if(p.status[t]==='angefordert')h+='<td class="mx-req">⏳</td>';
      else h+='<td><input type="checkbox" data-pid="'+E(pid)+'" data-typ="'+E(t)+'"/></td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  mOpen('Vollständigkeit & Anfragen',h,[{label:'Schliessen',fn:'mClose()'},{label:'📨 Markierte anfordern',cls:'pri',fn:'matrixAnfordern()'}],'wide');
}
function matrixAnfordern(){
  if(!_canEdit()){ toast('Keine Berechtigung.'); return; }
  var checks=Array.prototype.slice.call(document.querySelectorAll('#mBody input[type=checkbox]:checked'));
  if(!checks.length){ toast('Nichts markiert.'); return; }
  // Nach Produkt bündeln
  var byProd={};
  checks.forEach(function(c){ var pid=c.dataset.pid,typ=c.dataset.typ; byProd[pid]=byProd[pid]||{typen:[]}; byProd[pid].typen.push(typ); });
  // Produkt-Infos aus Dossier
  var prodInfo={}; _det.kapitel.forEach(function(k){(k.eintraege||[]).forEach(function(e){ if(e.produktId&&!prodInfo[e.produktId])prodInfo[e.produktId]={name:e.produktName,lieferantId:e.lieferantId,lieferantFirma:e.lieferantFirma,kategorie:e.kategorie}; });});
  var me=_me(), org=_org(); var cnt=0;
  Object.keys(byProd).forEach(function(pid){ var pi=prodInfo[pid]||{};
    if(!pi.lieferantId){ return; }
    var a={id:revUid('reva'),orgId:(me||{}).orgId,dossierId:_det.id,objektId:_det.objektId,objektName:_det.objektName,
      angefordertVon:{userId:(me||{}).id,name:(me||{}).name,firma:(org||{}).name,email:(me||{}).email},
      lieferantId:pi.lieferantId,lieferantFirma:pi.lieferantFirma,produktId:pid,produktName:pi.name,kategorie:pi.kategorie||'',
      dokTypen:byProd[pid].typen,nachricht:'Für die Revisionsunterlagen des Projekts «'+(_det.objektName||'')+'» fehlen uns Unterlagen.',
      status:'offen',angefordertAm:new Date().toISOString(),antwort:null};
    saveAnfrage(a); cnt++;
    // Platzhalter im Dossier auf angefordert setzen
    _det.kapitel.forEach(function(k){(k.eintraege||[]).forEach(function(e){ if(e.typ==='platzhalter'&&e.produktId===pid&&byProd[pid].typen.indexOf(e.erwartetDokTyp)>=0){ e.status='angefordert'; e.anfrageId=a.id; } });});
    _revNotifyLieferant(a);
  });
  saveDossier(_det);
  var skipped=Object.keys(byProd).length-cnt;
  mClose(); detRender();
  toast(cnt+' Anfrage(n) gesendet'+(skipped?(' · '+skipped+' ohne Lieferant übersprungen'):''));
}
function entAnfordern(id){ var f=_findEnt(id); if(!f||f.ent.typ!=='platzhalter')return; var e=f.ent;
  if(!e.lieferantId){ toast('Produkt hat keinen verknüpften Lieferanten — bitte Unterlage manuell hochladen.'); return; }
  var me=_me(), org=_org();
  var a={id:revUid('reva'),orgId:(me||{}).orgId,dossierId:_det.id,objektId:_det.objektId,objektName:_det.objektName,
    angefordertVon:{userId:(me||{}).id,name:(me||{}).name,firma:(org||{}).name,email:(me||{}).email},
    lieferantId:e.lieferantId,lieferantFirma:e.lieferantFirma,produktId:e.produktId,produktName:e.produktName,kategorie:e.kategorie||'',
    dokTypen:[e.erwartetDokTyp],nachricht:'Für die Revisionsunterlagen des Projekts «'+(_det.objektName||'')+'» fehlt uns diese Unterlage.',
    status:'offen',angefordertAm:new Date().toISOString(),antwort:null};
  saveAnfrage(a); e.status='angefordert'; e.anfrageId=a.id; saveDossier(_det); _revNotifyLieferant(a); detMain(); toast('Anfrage gesendet');
}
function _revNotifyLieferant(a){
  try{
    var matched=false, link='sys_lieferant_dashboard.html?tab=revision';
    var txt='Projekt '+(a.objektName||'')+': '+(a.produktName||'')+' — '+(a.dokTypen||[]).join(', ');
    if(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers){ (GemaAuth.getUsers()||[]).forEach(function(u){ if(u&&u.lieferantId===a.lieferantId&&u.active!==false){ matched=true; GemaNotify.push({eventKey:'revision_unterlagen_anfrage',empfaengerUserId:u.id,modul:'revisionsunterlagen',typ:'aktion',titel:'Anfrage: Revisions-Unterlagen',text:txt,link:link,objektId:a.objektId||''}); } }); }
    if(!matched){ var orgId=''; try{ var l=GemaProdukte.getLieferant(a.lieferantId); orgId=(l&&l.orgId)||''; }catch(e){} if(orgId&&orgId!=='org_default')GemaNotify.push({eventKey:'revision_unterlagen_anfrage',empfaengerOrgId:orgId,modul:'revisionsunterlagen',typ:'aktion',titel:'Anfrage: Revisions-Unterlagen',text:txt,link:link,objektId:a.objektId||''}); }
  }catch(e){}
}

// ══════════════ FREIGABE / QR ══════════════
function shareOpen(){
  var f=_det.freigabe;
  var h='';
  if(!f||!f.aktiv){
    h='<div class="hintbox">Erstellen Sie einen Freigabe-Link. Jeder mit dem Link oder QR-Code kann die Unterlagen einsehen — ohne GEMA-Login. Ausgeblendete Einträge und nur intern gespeicherte Dateien sind nicht sichtbar.</div>';
    h+='<button class="btn pri" onclick="shareCreate()" style="width:100%">🔗 Freigabe aktivieren & Link erzeugen</button>';
  } else {
    var url=location.origin+'/sys_revision_ansicht.html?t='+f.token;
    h='<div class="fg"><label class="fl">Freigabe-Link</label><input class="fc" id="shUrl" readonly value="'+E(url)+'" onclick="this.select()"/></div>';
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm" onclick="shareCopy()">📋 Link kopieren</button><button class="btn sm" onclick="shareQrPrint()">🖨 QR drucken</button><button class="btn sm" onclick="shareRenew()">↻ Token erneuern</button><button class="btn sm red" onclick="shareOff()">⏸ Deaktivieren</button></div>';
    h+='<div id="qrbox"></div>';
    h+='<div class="hintbox" style="margin-top:12px">Aktiv seit '+fD(f.erstelltAm)+'. Der Bauherr kann die Unterlagen jederzeit über diesen Link/QR abrufen.</div>';
    if(_det.status!=='uebergeben')h+='<button class="btn grn" onclick="shareUebergeben()" style="width:100%">✓ Übergabe an Bauherrschaft vermerken</button>';
  }
  mOpen('Freigabe / QR-Code',h,[{label:'Schliessen',fn:'mClose()'}]);
  if(f&&f.aktiv)setTimeout(function(){ shareRenderQr(location.origin+'/sys_revision_ansicht.html?t='+f.token); },60);
}
function shareCreate(){ _det.freigabe={token:revTokenNeu(),aktiv:true,erstelltAm:new Date().toISOString(),erstelltVon:{userId:(_me()||{}).id,name:(_me()||{}).name},widerrufenAm:null}; saveDossier(_det);
  try{ GemaNotify.push({eventKey:'revision_freigabe_erstellt',empfaengerRoleId:'role_planer',empfaengerOrgId:(_me()||{}).orgId,modul:'revisionsunterlagen',typ:'info',titel:'Revisionsunterlagen freigegeben',text:_det.titel,link:'pm_revisionsunterlagen.html?d='+_det.id}); }catch(e){}
  shareOpen(); }
function shareRenew(){ GemaDialog.confirm({title:'Token erneuern',message:'Der bisherige Link/QR wird ungültig. Fortfahren?',danger:true,confirmLabel:'Erneuern'}).then(function(ok){ if(!ok)return; _det.freigabe.token=revTokenNeu(); saveDossier(_det); shareOpen(); }); }
function shareOff(){ _det.freigabe.aktiv=false; _det.freigabe.widerrufenAm=new Date().toISOString(); saveDossier(_det); shareOpen(); }
function shareCopy(){ var el=document.getElementById('shUrl'); el.select(); try{ document.execCommand('copy'); toast('Link kopiert'); }catch(e){ toast('Bitte manuell kopieren'); } }
function shareUebergeben(){ _det.status='uebergeben'; _det.uebergebenAm=new Date().toISOString(); saveDossier(_det); detRender(); shareOpen(); toast('Als übergeben vermerkt'); }
function shareRenderQr(url){ var box=document.getElementById('qrbox'); if(!box)return; box.innerHTML=''; try{ new QRCode(box,{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">QR-Bibliothek nicht geladen.</div>'; } }
function shareQrPrint(){ var f=_det.freigabe; if(!f)return; var url=location.origin+'/sys_revision_ansicht.html?t='+f.token;
  var tmp=document.createElement('div'); try{ new QRCode(tmp,{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  var img=tmp.querySelector('img,canvas'); var src=img?(img.src||(img.toDataURL&&img.toDataURL())):'';
  var w=window.open('','_blank'); if(!w)return;
  w.document.write('<html><head><title>Revisionsunterlagen QR</title><style>@page{size:A6 landscape;margin:8mm}body{font-family:DM Sans,sans-serif;text-align:center;padding:6mm}img{width:42mm;height:42mm}h1{font-size:15px;margin:6px 0}p{font-size:10px;color:#555;word-break:break-all}</style></head><body><h1>📑 Revisionsunterlagen</h1><div>'+E(_det.objektName||'')+'</div><img src="'+src+'"/><p>'+E(url)+'</p><scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},250);}<\/scr'+'ipt></body></html>');
  w.document.close();
}
