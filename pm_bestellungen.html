<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#b45309;--acc-bg:#fffbeb;--acc-bd:#fcd34d;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#431407 0%,#b45309 60%,#f59e0b 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:12px;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srch{flex:1;min-width:160px;padding:9px 13px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.srch:focus{border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.bst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.bst{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.12s}
.bst:hover{border-color:var(--acc-bd)}
.bst-bar{height:4px}
.bst-bd{padding:11px 13px}
.bst-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bst-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:4px}
.bst-total{font-size:13px;font-weight:900;margin-top:6px}
.bst-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.drow{display:flex;gap:8px;font-size:12.5px;padding:4px 0}
.drow .dl{min-width:130px;color:var(--mut);font-weight:700;flex-shrink:0}
.drow .dv{color:var(--txt);word-break:break-word}
.dsec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--acc);margin:12px 0 4px;padding-top:10px;border-top:1px dashed var(--brd)}
.vrow{display:flex;gap:8px;font-size:11.5px;color:var(--mut);padding:3px 0}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media print{.g-nav,.no-print{display:none!important}}
</style>

<script>
'use strict';
function fixLeadingZero(el){let v=el.value.trim();if(v==='')return;if(/^\./.test(v))v='0'+v;if(/^-\./.test(v))v='-0'+v.slice(1);el.value=String(parseFloat(v));}
</script>
<script>
'use strict';
var _memStore={};
function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2600);}
function fD(iso){if(!iso)return '—';try{var d=new Date(iso);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();}catch(e){return iso;}}
function fDT(iso){if(!iso)return '—';try{var d=new Date(iso);return fD(iso)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}catch(e){return iso;}}
function fDate(d){if(!d)return '—';var p=String(d).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d;}

var _cloudLoaded=false;
var _filter='';
var _detailId=null;

function _me(){try{return GemaAuth.getCurrentUser()||null;}catch(e){return null;}}
function _canWrite(){try{return GemaAuth.can('write','bestellungen');}catch(e){return false;}}
function _myList(){
  var u=_me();if(!u)return [];
  if(typeof GemaBest==='undefined')return [];
  return GemaBest.getForOrg(u.orgId||'').sort(function(a,b){return String(b.bestelltAm||'').localeCompare(String(a.bestelltAm||''));});
}

var CHIPS=[
  {id:'',label:'Alle'},
  {id:'offen',label:'Offen'},
  {id:'bestaetigt',label:'Bestätigt'},
  {id:'geliefert',label:'Geliefert'},
  {id:'abgelehnt',label:'Abgelehnt'},
  {id:'storniert',label:'Storniert'}
];
function setFilter(id){_filter=id;render();}

function render(){
  var list=_myList();
  // KPIs
  var offen=list.filter(function(b){return b.status==='offen';}).length;
  var best=list.filter(function(b){return b.status==='bestaetigt';}).length;
  var unterwegs=list.filter(function(b){return b.status==='geliefert'&&!b.empfangen;}).length;
  var totalOffen=list.filter(function(b){return b.status==='offen'||b.status==='bestaetigt';}).reduce(function(s,b){return s+(b.total||0);},0);
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="v">'+list.length+'</div><div class="l">Bestellungen</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--amber)">'+offen+'</div><div class="l">Offen</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--blue)">'+best+'</div><div class="l">Bestätigt</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--grn)">'+unterwegs+'</div><div class="l">Geliefert · Eingang offen</div></div>'+
    '<div class="kpi"><div class="v">'+(typeof GemaBest!=='undefined'?GemaBest.fmtChf(totalOffen):'0')+'</div><div class="l">CHF in Bestellung</div></div>';
  // Chips
  document.getElementById('chips').innerHTML=CHIPS.map(function(c){
    return '<button class="chip'+(_filter===c.id?' on':'')+'" onclick="setFilter(\''+c.id+'\')">'+c.label+'</button>';
  }).join('');
  // Liste
  var q=(document.getElementById('srch').value||'').toLowerCase().trim();
  var rows=list.filter(function(b){
    if(_filter&&b.status!==_filter)return false;
    if(!q)return true;
    return [b.nr,b.produktName,b.lieferantFirma,b.objektName,(b.quelle||{}).ausName].join(' ').toLowerCase().indexOf(q)>=0;
  });
  var wrap=document.getElementById('listWrap');
  if(!rows.length){
    if(!_cloudLoaded&&!list.length){
      wrap.innerHTML='<div class="card"><div class="empty"><svg width="26" height="26" viewBox="0 0 26 26" style="vertical-align:middle;margin-right:8px"><circle cx="13" cy="13" r="10" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M13 3 a10 10 0 0 1 10 10" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 13 13" to="360 13 13" dur="0.9s" repeatCount="indefinite"/></path></svg>Bestellungen werden geladen …</div></div>';
    } else {
      wrap.innerHTML='<div class="card"><div class="empty">🛒 Keine Bestellungen'+(_filter||q?' mit diesem Filter':'')+'.<br><span style="font-size:12px">Bestellungen entstehen in der Ausschreibung: Nach dem Zuschlag können Sie dort jede Lieferungs-Position direkt beim Lieferanten bestellen.</span></div></div>';
    }
    return;
  }
  wrap.innerHTML='<div class="bst-grid">'+rows.map(cardHtml).join('')+'</div>';
}

function cardHtml(b){
  var s=(typeof GemaBest!=='undefined'&&GemaBest.STATUS[b.status])||{color:'#64748b'};
  var h='<div class="bst" onclick="bstOpen(\''+b.id+'\')">';
  h+='<div class="bst-bar" style="background:'+s.color+'"></div><div class="bst-bd">';
  h+='<div class="bst-title"><span>'+E(b.nr)+'</span>'+(typeof GemaBest!=='undefined'?GemaBest.badgeHtml(b):'')+'</div>';
  h+='<div class="bst-meta">'+E(b.produktName||'—')+' · '+E(b.lieferantFirma||'—')+'<br>'
    +(b.objektName?'🏗 '+E(b.objektName)+'<br>':'')
    +'Bestellt: '+fD(b.bestelltAm)
    +(b.antwort&&b.antwort.liefertermin?' · 🚚 Liefertermin '+fDate(b.antwort.liefertermin):(b.wunschtermin?' · Wunsch: '+fDate(b.wunschtermin):''))
    +'</div>';
  h+='<div class="bst-total">'+b.menge+' '+E(b.einheit||'Stk')+' · CHF '+(typeof GemaBest!=='undefined'?GemaBest.fmtChf(b.total):b.total)+'</div>';
  h+='</div></div>';
  return h;
}

// ── Detail ──
function bstOpen(id){
  var b=(typeof GemaBest!=='undefined')?GemaBest.byId(id):null;
  if(!b)return;
  _detailId=id;
  document.getElementById('dTitle').innerHTML='🛒 '+E(b.nr)+' &nbsp;'+GemaBest.badgeHtml(b);
  var q=b.quelle||{};
  var h='';
  function row(l,v){return '<div class="drow"><span class="dl">'+l+'</span><span class="dv">'+v+'</span></div>';}
  h+=row('Produkt / Anlage','<strong>'+E(b.produktName||'—')+'</strong>'+(b.kategorie?' <span style="color:var(--mut)">('+E(b.kategorie)+')</span>':''));
  h+=row('Lieferant',E(b.lieferantFirma||'—'));
  h+=row('Menge · Preis',b.menge+' '+E(b.einheit||'Stk')+' × CHF '+GemaBest.fmtChf(b.preis)+' = <strong>CHF '+GemaBest.fmtChf(b.total)+'</strong>');
  if(b.objektName)h+=row('Projekt',E(b.objektName));
  if(q.typ==='ausschreibung')h+=row('Quelle','Ausschreibung «'+E(q.ausName||'')+'»'+(q.bkpCode?' · BKP '+E(q.bkpCode):'')+(q.posTitel?' · '+E(q.posTitel):''));
  h+=row('Lieferadresse',E(b.lieferadresse||'—').replace(/\n/g,'<br>'));
  h+=row('Wunschtermin',fDate(b.wunschtermin));
  if(b.bemerkung)h+=row('Bemerkung',E(b.bemerkung));
  h+=row('Bestellt',fDT(b.bestelltAm)+' — '+E(b.bestellerName)+(b.bestellerFirma?' ('+E(b.bestellerFirma)+')':''));
  if(b.antwort){
    h+='<div class="dsec">Antwort des Lieferanten</div>';
    if(b.status==='abgelehnt'){
      h+=row('Abgelehnt',fDT(b.antwort.beantwortetAm)+(b.antwort.nachricht?' — «'+E(b.antwort.nachricht)+'»':''));
    }else{
      if(b.antwort.liefertermin)h+=row('Liefertermin','<strong>'+fDate(b.antwort.liefertermin)+'</strong>');
      if(b.antwort.abNr)h+=row('AB-Nummer',E(b.antwort.abNr));
      if(b.antwort.nachricht)h+=row('Nachricht',E(b.antwort.nachricht));
      var pdf=b.antwort.pdfUrl||b.antwort.pdfDataUrl;
      if(pdf)h+=row('Auftragsbestätigung','<a href="'+E(pdf)+'" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">📄 '+E(b.antwort.pdfName||'PDF öffnen')+'</a>');
      h+=row('Bestätigt',fDT(b.antwort.beantwortetAm)+' — '+E(b.antwort.beantwortetVon||''));
    }
  }
  if(b.geliefert){
    h+='<div class="dsec">Lieferung</div>';
    h+=row('Geliefert gemeldet',fDT(b.geliefert.am)+' — '+E(b.geliefert.von||'')+(b.geliefert.nachricht?' · «'+E(b.geliefert.nachricht)+'»':''));
    h+=row('Wareneingang',b.empfangen?('✓ bestätigt '+fDT(b.empfangen.am)+' — '+E(b.empfangen.von||'')):'<span style="color:var(--amber);font-weight:700">ausstehend</span>');
  }
  if(b.storno){
    h+='<div class="dsec">Storno</div>';
    h+=row('Storniert',fDT(b.storno.am)+' — '+E(b.storno.von||'')+(b.storno.grund?' · «'+E(b.storno.grund)+'»':''));
  }
  if(b.verlauf&&b.verlauf.length){
    h+='<div class="dsec">Verlauf</div>';
    h+=b.verlauf.slice().reverse().map(function(v){
      return '<div class="vrow"><span style="min-width:110px;flex-shrink:0">'+fDT(v.ts)+'</span><span>'+E(v.ev)+(v.von?' — '+E(v.von):'')+'</span></div>';
    }).join('');
  }
  document.getElementById('dBody').innerHTML=h;
  // Footer-Aktionen
  var ft='<button class="btn no-print" onclick="bstPrint(\''+b.id+'\')">🖨 Bestellschein</button>';
  if(_canWrite()){
    if(b.status==='geliefert'&&!b.empfangen)ft+='<button class="btn grn" onclick="bstEmpfang(\''+b.id+'\')">✓ Wareneingang bestätigen</button>';
    if(b.status==='offen'||b.status==='bestaetigt')ft+='<button class="btn red" onclick="bstStorno(\''+b.id+'\')">⊘ Stornieren</button>';
  }
  document.getElementById('dFt').innerHTML=ft;
  document.getElementById('dModal').classList.add('open');
}
function bstClose(){document.getElementById('dModal').classList.remove('open');_detailId=null;}

function bstEmpfang(id){
  GemaDialog.confirm({
    title:'Wareneingang bestätigen',
    message:'Bestätigen, dass die Lieferung vollständig und in Ordnung eingetroffen ist? Der Lieferant wird benachrichtigt.',
    confirmLabel:'✓ Wareneingang bestätigen'
  }).then(function(ok){
    if(!ok)return;
    GemaBest.empfangBestaetigen(id);
    toast('✓ Wareneingang bestätigt');
    render();bstOpen(id);
  });
}
function bstStorno(id){
  GemaDialog.prompt({
    title:'Bestellung stornieren',
    message:'Grund der Stornierung (wird dem Lieferanten mitgeteilt):',
    placeholder:'z.B. Projekt verschoben',
    defaultValue:''
  }).then(function(val){
    if(val===null)return;
    GemaDialog.confirm({
      title:'Stornieren',
      message:'Bestellung wirklich stornieren? Der Lieferant wird benachrichtigt.',
      confirmLabel:'⊘ Stornieren',
      danger:true
    }).then(function(ok){
      if(!ok)return;
      GemaBest.stornieren(id,val);
      toast('⊘ Bestellung storniert');
      render();bstOpen(id);
    });
  });
}

// ── Bestellschein (Print-Fenster, «Als PDF speichern») ──
function bstPrint(id){
  var b=GemaBest.byId(id);if(!b)return;
  var org=null;try{org=GemaAuth.getCurrentOrg&&GemaAuth.getCurrentOrg();}catch(e){}
  var orgName=(org&&org.name)||b.bestellerFirma||'';
  var logo='';try{logo=(org&&(org.logoVector||org.logo))||'';}catch(e){}
  var s=GemaBest.STATUS[b.status]||{};
  var q=b.quelle||{};
  var w=window.open('','_blank');
  if(!w){toast('Pop-up blockiert — bitte erlauben');return;}
  var h='<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>'+E(b.nr)+' – Bestellung</title>';
  h+='<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,900&display=swap" rel="stylesheet">';
  h+='<style>@page{size:A4 portrait;margin:20mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;color:#000;font-size:11pt;line-height:1.5;font-optical-sizing:auto;font-variation-settings:"opsz" 14}'
    +'.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.abs{font-size:9pt;color:#333}.abs strong{font-size:11pt;color:#000}'
    +'.logo img{max-height:18mm;max-width:60mm}.logo .wm{font-size:16pt;font-weight:900;color:#b45309}'
    +'h1{font-size:19pt;font-weight:900;margin:16px 0 2px}.sub{font-size:10pt;color:#555;margin-bottom:18px}'
    +'.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.box{border:1.2px solid #ccc;border-radius:8px;padding:10px 13px}.box .bl{font-size:8pt;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#777;margin-bottom:4px}'
    +'table{border-collapse:collapse;width:100%;margin:6px 0 4px}th{background:#f4f4f4;border-bottom:1.6px solid #999;text-align:left;padding:7px 9px;font-size:8.5pt;text-transform:uppercase;letter-spacing:.4px}td{border-bottom:1px solid #ddd;padding:8px 9px;font-size:10.5pt;vertical-align:top}.num{text-align:right;white-space:nowrap}'
    +'.tot td{border-bottom:none;border-top:2px solid #333;font-weight:900;font-size:11.5pt}'
    +'.note{margin-top:14px;font-size:10pt}.note .bl{font-size:8pt;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#777}'
    +'.foot{margin-top:34px;padding-top:8px;border-top:1px solid #ccc;font-size:8.5pt;color:#777;display:flex;justify-content:space-between}'
    +'.bar{display:flex;justify-content:space-between;align-items:center;background:#fffbeb;border:1.2px solid #fcd34d;border-radius:8px;padding:8px 13px;margin-bottom:16px;font-size:9.5pt}'
    +'.no-print{position:fixed;top:10px;right:10px;display:flex;gap:8px}.no-print button{padding:9px 16px;border-radius:9px;border:1.5px solid #ccc;background:#fff;font-weight:700;cursor:pointer;font-family:inherit}'
    +'@media print{.no-print{display:none!important}}</style></head><body>';
  h+='<div class="no-print"><button onclick="window.print()">🖨 Drucken / Als PDF speichern</button><button onclick="window.close()">Schliessen</button></div>';
  h+='<div class="top"><div class="abs"><strong>'+E(orgName)+'</strong><br>'+E(b.bestellerName||'')+(b.bestellerEmail?'<br>'+E(b.bestellerEmail):'')+(b.bestellerTel?'<br>'+E(b.bestellerTel):'')+'</div>';
  h+='<div class="logo">'+(logo?'<img src="'+E(logo)+'" alt=""/>':'<span class="wm">GEMA</span>')+'</div></div>';
  h+='<div class="abs" style="margin-bottom:4px"><span style="color:#777;font-size:8pt;text-transform:uppercase;letter-spacing:.5px">An</span><br><strong>'+E(b.lieferantFirma||'—')+'</strong></div>';
  h+='<h1>Bestellung '+E(b.nr)+'</h1>';
  h+='<div class="sub">Datum: '+fD(b.bestelltAm)+(b.objektName?' · Projekt: '+E(b.objektName):'')+(q.ausName?' · Ausschreibung: '+E(q.ausName):'')+'</div>';
  h+='<div class="bar"><span>Status: <strong>'+E(s.label||b.status)+'</strong></span>'+(b.antwort&&b.antwort.abNr?'<span>AB-Nr.: <strong>'+E(b.antwort.abNr)+'</strong></span>':'')+(b.antwort&&b.antwort.liefertermin?'<span>Liefertermin: <strong>'+fDate(b.antwort.liefertermin)+'</strong></span>':(b.wunschtermin?'<span>Wunschtermin: <strong>'+fDate(b.wunschtermin)+'</strong></span>':''))+'</div>';
  h+='<table><thead><tr><th>Pos.</th><th>Bezeichnung</th><th class="num">Menge</th><th class="num">Einzelpreis CHF</th><th class="num">Total CHF</th></tr></thead><tbody>';
  h+='<tr><td>1</td><td><strong>'+E(b.produktName||'—')+'</strong>'+(q.bkpCode?'<br><span style="font-size:9pt;color:#777">BKP '+E(q.bkpCode)+(q.posTitel?' · '+E(q.posTitel):'')+'</span>':'')+'</td><td class="num">'+b.menge+' '+E(b.einheit||'Stk')+'</td><td class="num">'+GemaBest.fmtChf(b.preis)+'</td><td class="num">'+GemaBest.fmtChf(b.total)+'</td></tr>';
  h+='<tr class="tot"><td colspan="4">Total (brutto, gemäss Offerte)</td><td class="num">'+GemaBest.fmtChf(b.total)+'</td></tr>';
  h+='</tbody></table>';
  h+='<div class="grid"><div class="box"><div class="bl">Lieferadresse</div>'+E(b.lieferadresse||'—').replace(/\n/g,'<br>')+'</div>';
  h+='<div class="box"><div class="bl">Termine</div>Wunschtermin: '+fDate(b.wunschtermin)+(b.antwort&&b.antwort.liefertermin?'<br>Bestätigter Liefertermin: <strong>'+fDate(b.antwort.liefertermin)+'</strong>':'')+'</div></div>';
  if(b.bemerkung)h+='<div class="note"><div class="bl">Bemerkung</div>'+E(b.bemerkung).replace(/\n/g,'<br>')+'</div>';
  h+='<div class="foot"><span>'+E(orgName)+' · Bestellung '+E(b.nr)+'</span><span>Erstellt mit GEMA am '+fD(new Date().toISOString())+'</span></div>';
  h+='</body></html>';
  w.document.write(h);
  w.document.close();
}

// ── Deep-Link ?b=<id> ──
function _openDeepLink(){
  try{
    var id=new URLSearchParams(location.search).get('b');
    if(id&&GemaBest.byId(id))bstOpen(id);
  }catch(e){}
}

document.addEventListener('DOMContentLoaded',function(){
  try{render();}catch(e){}
  if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection&&typeof GemaBest!=='undefined'){
    Promise.race([
      GemaBest.bind(),
      new Promise(function(r){setTimeout(r,6000);})
    ]).then(function(){_cloudLoaded=true;render();_openDeepLink();})
      .catch(function(){_cloudLoaded=true;render();_openDeepLink();});
  }else{
    _cloudLoaded=true;render();_openDeepLink();
  }
});
window.addEventListener('gema-bestellungen-changed',function(){try{render();}catch(e){}});
</script>
