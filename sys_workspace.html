  // ── Kontextmenü (Rechtsklick) für Eimer — Sidebar, Tab-Leiste, Drawer ──
  var _wsCtxEl=null;
  function _wsCtxClose(){
    if(_wsCtxEl&&_wsCtxEl.parentNode){try{_wsCtxEl.parentNode.removeChild(_wsCtxEl);}catch(e){}}
    _wsCtxEl=null;
  }
  function _wsCtxShow(ev,items){
    ev.preventDefault();ev.stopPropagation();
    _wsCtxClose();
    var el=document.createElement('div');el.className='ws-ctx';
    items.forEach(function(it){
      if(it.sep){var sp=document.createElement('div');sp.className='ws-ctx-sep';el.appendChild(sp);return;}
      var btn=document.createElement('button');
      if(it.danger)btn.className='danger';
      btn.innerHTML=(it.ic?icon(it.ic,14,2):'')+'<span>'+esc(it.label)+'</span>';
      btn.onclick=function(e){e.stopPropagation();_wsCtxClose();it.fn();};
      el.appendChild(btn);
    });
    document.body.appendChild(el);
    var W=el.offsetWidth||210,H=el.offsetHeight||10;
    el.style.left=Math.max(8,Math.min(ev.clientX,window.innerWidth-W-8))+'px';
    el.style.top=Math.max(8,Math.min(ev.clientY,window.innerHeight-H-8))+'px';
    _wsCtxEl=el;
    setTimeout(function(){document.addEventListener('click',_wsCtxClose,{once:true});},0);
    return false;
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape')_wsCtxClose();});
  window.addEventListener('resize',_wsCtxClose);
  document.addEventListener('scroll',_wsCtxClose,true);
  window._wsCtxBucket=function(ev,id){
    var b=buckets.find(function(x){return x.id===id;});if(!b)return true;
    var items=[
      {ic:'bucket',label:'Öffnen',fn:function(){_wsOpen(id);}},
      {ic:'plus',label:'Modul hinzufügen',fn:function(){_wsOpen(id);window._wsOpenModulePicker();}}
    ];
    // Automatisch verwaltete Eimer (Klasse/Übung/Rollen-Eimer) sind fest:
    // der Name folgt der Klasse bzw. der Org-Adresse, und Löschen würde sie
    // der nächste Boot ohnehin neu anlegen — destruktive Aktionen entfallen.
    // Vom Org-Admin erstellte fixe Eimer (pinned ohne autoTyp) bleiben
    // dagegen ganz normal umbenenn- und löschbar.
    if(!b.autoTyp){
      items.push({ic:'pencil',label:'Umbenennen',fn:function(){window._wsCtxRename(id);}});
      items.push({ic:'note',label:'Duplizieren',fn:function(){window._wsDuplicateBucket(id);}});
      // Feedback 05.08.2026: Übungs-/Lernraum-Eimer an die Klasse anfügen
      if(b.subOf)items.push({ic:'chevron',label:'Einordnung aufheben',fn:function(){window._wsSubOfClear(id);}});
      else if(_wsElternKandidaten(b).length)items.push({ic:'grad',label:'Bei einer Klasse einordnen …',fn:function(){window._wsSubOfPick(id);}});
      items.push({sep:true});
      items.push({ic:'x',label:'Löschen',danger:true,fn:function(){window._wsConfirmDelete(id);}});
    }
    return _wsCtxShow(ev,items);
  };

  /* ── Eimer bei einer Klasse einordnen (Feedback 05.08.2026) ────────────
     Mögliche Übergeordnete sind die sichtbaren, hervorgehobenen Org-Eimer
     der eigenen Org (Klassen-Eimer, fixe Firmen-Eimer) — NICHT der Eimer
     selbst und kein Eimer, der schon untergeordnet ist (keine Ketten). */
  function _wsElternKandidaten(b){
    var oid=_curOrgId();
    return buckets.filter(function(x){
      return x.id!==b.id && x.ownerType==='org' && x.ownerOrgId===oid
        && x.pinned && !x.subOf && _canSeeBucket(x);
    });
  }
  window._wsSubOfPick=function(id){
    var b=buckets.find(function(x){return x.id===id;});if(!b)return;
    var kand=_wsElternKandidaten(b);
    if(!kand.length){toast('Keine Klasse vorhanden, der du diesen Eimer anfügen kannst','x');return;}
    var body='<div class="ws-modpicker" style="max-height:300px">'+kand.map(function(k){
      return '<button class="ws-modpicker-item" onclick="_wsSubOfSet(\''+id+'\',\''+k.id+'\')">'
        +'<span class="ws-bucket-row__icon">'+typeIcon(k.type)+'</span>'
        +'<div style="flex:1;min-width:0"><div class="ws-modpicker-name">'+esc(k.name)+'</div>'
        +'<div class="ws-modpicker-desc">'+(k.autoTyp==='klasse'?'Klasse':'Fixer Eimer der Firma')+'</div></div></button>';
    }).join('')+'</div>'
      +'<div class="ws-empty-hint" style="margin-top:12px">Der Eimer erscheint danach eingerückt direkt unter der gewählten Klasse. Wer ihn sehen darf, ändert sich dadurch nicht.</div>';
    openModal('«'+b.name+'» einordnen',body,520);
  };
  window._wsSubOfSet=function(id,parentId){
    var b=buckets.find(function(x){return x.id===id;});
    var p=buckets.find(function(x){return x.id===parentId;});
    if(!b||!p)return;
    b.subOf=parentId;
    b.activity.unshift(_wsAct((_curUser()||{}).name||'Du','bei „'+p.name+'” eingeordnet'));
    _wsCloseModal();save();render();
    toast('Bei «'+p.name+'» eingeordnet','check');
  };
  window._wsSubOfClear=function(id){
    var b=buckets.find(function(x){return x.id===id;});if(!b||!b.subOf)return;
    delete b.subOf;
    b.activity.unshift(_wsAct((_curUser()||{}).name||'Du','Einordnung aufgehoben'));
    save();render();
    toast('Einordnung aufgehoben','check');
  };

  // Umbenennen via Kontextmenü (auch für nicht-aktive Eimer)
  window._wsCtxRename=function(id){
    var b=buckets.find(function(x){return x.id===id;});if(!b)return;
    var body='<div class="ws-form"><div class="ws-form-field"><label>Name</label>'
      +'<input class="ws-input" id="wsRenameInp" value="'+esc(b.name)+'" maxlength="80" onkeydown="if(event.key===\'Enter\')_wsCtxRenameSave(\''+id+'\')"></div>'
      +'<div class="ws-form-actions"><button class="ws-btn ws-btn-ghost" onclick="_wsCloseModal()">Abbrechen</button>'
      +'<button class="ws-btn ws-btn-primary" onclick="_wsCtxRenameSave(\''+id+'\')">Speichern</button></div></div>';
    openModal('Eimer umbenennen',body,420);
    setTimeout(function(){var i=document.getElementById('wsRenameInp');if(i){i.focus();i.select();}},60);
  };
  window._wsCtxRenameSave=function(id){
    var b=buckets.find(function(x){return x.id===id;});if(!b)return;
    var i=document.getElementById('wsRenameInp');
    var v=((i&&i.value)||'').trim();
    if(!v){if(i)i.focus();return;}
    b.name=v;
    _wsCloseModal();save();render();
    toast('Name aktualisiert','pencil');
  };

  // Duplizieren: Kopie mit eigenem Objekt-Kontext — objektId wird bewusst
  // NICHT übernommen (zwei Eimer dürfen sich nie ein Auto-Objekt teilen,
  // sonst greift die Ghost-Resurrection-Falle aus pm_objekte).
  window._wsDuplicateBucket=function(id){
    var b=buckets.find(function(x){return x.id===id;});if(!b)return;
    var copy=JSON.parse(JSON.stringify(b));
    copy.id='ws_'+Date.now();
    copy.name=b.name+' (Kopie)';
    copy.objektId=null;
    // Eine Kopie ist IMMER ein normaler Eimer: weder von der Provisionierung
    // angefasst (autoTyp) noch hervorgehoben/eingerückt (pinned/subOf) und
    // ohne die Zugriffs-Einschränkung des Originals.
    delete copy.autoTyp; delete copy.autoKlasseId;
    delete copy.pinned; delete copy.subOf;
    if(copy.accessControl){ delete copy.accessControl.nurUserIds; delete copy.accessControl.nurRollen; }
    copy.createdAt=new Date().toISOString();
    var cu=_curUser();
    if(cu&&cu.id)copy.createdBy=cu.id;
    copy.activity=[{who:(cu&&cu.name)||'Du',text:'hat den Eimer aus „'+b.name+'” dupliziert',ts:_wsTs()}];
    buckets.push(copy);
    save();render();
    toast('Eimer dupliziert','check');
  };

  // ── Org Helper ──
  function _resolveOrg(){
    if(activeOrg!=='all')return activeOrg;
    try{if(typeof GemaAuth!=='undefined'){var u=GemaAuth.getCurrentUser();if(u&&u.orgId)return u.orgId;}}catch(e){}
    return 'default';
  }

  // ── Auto-Status: AutoSave-Snapshot + Anlagenwahl + echte Offertanfragen ──
  var NO_AUTO_STATUS=['hy_w12','if_werkzeug','if_fahrzeug'];
  // data = GemaAutoSave-Basis (Storage gema_<autosaveName>__<objektId>),

  function _wsAutoStatus(modId,objektId){
    if(NO_AUTO_STATUS.indexOf(modId)>=0)return 'offen';
    var cfg=_WS_STATUS_CFG[modId];
    if(cfg===undefined||cfg===null)return 'offen';

    if(cfg.kategorie){
      // Offertanfrage der Kategorie für dieses Objekt? — echte OA-Kette
      // (GemaProdukte) statt des früheren toten '<base>_offerte'-Keys
      try{
        if(typeof GemaProdukte!=='undefined'&&objektId){
          var oas=(GemaProdukte.getOffertanfragen()||[]).filter(function(oa){
            return oa.projekt&&oa.projekt.objektId===objektId&&oa.kategorie===cfg.kategorie;
          });
          if(oas.some(function(oa){return oa.status==='beantwortet';}))return 'Offerte erhalten';
          if(oas.length)return 'Offerte angefragt';
        }
      }catch(e){}
      var hasAnlage=false;
      try{
        var ak=objektId?cfg.anlage+'__'+objektId:cfg.anlage;
        var ar=localStorage.getItem(ak);
        if(!ar&&!objektId)ar=localStorage.getItem(cfg.anlage);
        if(ar&&ar!=='null'&&ar!=='""')hasAnlage=true;
      }catch(e){}
      if(hasAnlage)return 'Anlage gewählt';
    }

    var sk=objektId?cfg.data+'__'+objektId:cfg.data;
    var data=null;
    try{var raw=localStorage.getItem(sk);if(!raw&&!objektId)raw=localStorage.getItem(cfg.data);if(raw)data=JSON.parse(raw);}catch(e){}
    if(!data)return 'offen';

    // Generische Heuristik über den AutoSave-Snapshot (flache id→Wert-Map;
    // die früheren modul-spezifischen Feld-IDs existieren nach den Modul-
    // Neubauten nicht mehr): gefüllte Felder = in Bearbeitung; Eintrag im
    // Berechnungs-Index (P04, wird bei jedem Save mit Objekt gesetzt) = berechnet.
    var filled=0;
    try{
      Object.keys(data).forEach(function(k){
        if(k==='_ts')return;
        var v=data[k];
        if(v===''||v==null||v===false)return;
        filled++;
      });
    }catch(e){}
    if(!filled)return 'offen';
    try{
      if(objektId&&typeof GemaObjekte!=='undefined'&&GemaObjekte.getBerechnungenForObjekt){
        var idx=GemaObjekte.getBerechnungenForObjekt(objektId)||[];
        var autosaveName=cfg.data.replace(/^gema_/,'');
        if(idx.some(function(e){return e.modul===autosaveName;}))return 'berechnet';
      }
    }catch(e){}
    return 'in Bearbeitung';
  }

  function _wsBucketNameFuerObjekt(o){

  window._wsDoLinkOrCreate=function(){
    var b=bucketSichtbar(activeTab);if(!b)return;
    var sel=document.getElementById('wsObjektSel');
    var newName=(document.getElementById('wsNewObjName')||{}).value;
    // Bei bereits verknüpftem Eimer steht das aktuelle Objekt im Dropdown
    // vorausgewählt. Hat der User stattdessen den Neu-Block ausgefüllt (Name)
    // und im Dropdown NICHTS geändert, gewinnt der Neu-Block.
    var dropdownGeaendert=sel&&sel.value&&sel.value!==b.objektId;

    if(sel&&sel.value&&(dropdownGeaendert||!(newName&&newName.trim()))){
      b.objektId=sel.value;
      var label=sel.options[sel.selectedIndex].text;
      // Eimer-Name automatisch auf die Objekt-Adresse setzen
      try{
        var o=(typeof GemaObjekte!=='undefined'?GemaObjekte.getAll():[]).find(function(x){return x.id===sel.value;});
        var neu=_wsBucketNameFuerObjekt(o);
        if(neu)b.name=neu;
      }catch(e){}
      b.activity.unshift({who:(_curUser()||{}).name||'Du',text:'Objekt verknüpft: '+label,ts:_wsTs()});
      _wsCloseModal();save();render();
      toast('Objekt verknüpft','building');
    }else if(newName&&newName.trim()){
      var typ=(document.getElementById('wsNewObjTyp')||{}).value||'Neubau';
      var strasse=((document.getElementById('wsNewObjStrasse')||{}).value||'').trim();
      var plz=((document.getElementById('wsNewObjPlz')||{}).value||'').trim();
      var ort=((document.getElementById('wsNewObjOrt')||{}).value||'').trim();
      var kanton=((document.getElementById('wsNewObjKanton')||{}).value||'').trim();
      var gemeinde=((document.getElementById('wsNewObjGemeinde')||{}).value||'').trim();
      var objId='obj_'+Date.now();
      var curUser=null;
      try{if(typeof GemaAuth!=='undefined')curUser=GemaAuth.getCurrentUser();}catch(e){}
      var newObj={id:objId,name:newName.trim(),strasse:strasse,plz:plz,ort:ort,kanton:kanton,gemeinde:gemeinde,
        bauvorhaben:typ,status:'aktiv',
        orgId:curUser?curUser.orgId:'org_default',
        erstelltVon:curUser?curUser.id:'',
        createdAt:new Date().toISOString()};
      try{
        var raw=localStorage.getItem('gema_objekte_v1');
        var data=raw?JSON.parse(raw):{objekte:[],beteiligte:[],activeObjektId:null};
        data.objekte.push(newObj);
        localStorage.setItem('gema_objekte_v1',JSON.stringify(data));
        // ADD-ONLY per-Record in die Cloud (kein Diff/Delete), sonst bleibt
        // das Objekt lokal und wird beim naechsten Cloud-Pull verworfen.
        try{ if(typeof GemaObjekte!=='undefined'&&GemaObjekte.upsertObjekt) GemaObjekte.upsertObjekt(newObj); }catch(_e){}
      }catch(e){}
      b.objektId=objId;
      // Eimer-Name automatisch auf die Adresse setzen (Fallback Objektname)
      var neu=_wsBucketNameFuerObjekt(newObj);
      if(neu)b.name=neu;
      b.activity.unshift({who:(_curUser()||{}).name||'Du',text:'Objekt erstellt & verknüpft: '+newName.trim(),ts:_wsTs()});
      _wsCloseModal();save();render();
      toast('Objekt „'+newName.trim()+'" erstellt & verknüpft','check');
    }else{
      toast('Name eingeben oder Objekt auswählen','x');
    }
  };

  window._wsNoteExport=function(){
    var ed=document.getElementById('wsNoteEditor');if(!ed)return;
    var text=ed.innerText||'';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('Notizen in Zwischenablage kopiert','check');});
    }else{
      var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);

  // ── Auto-Objekt: Jeder Eimer bekommt automatisch ein Objekt ──
  // AUSSER dem Rollen-/Direkt-Modul-Eimer (Feedback 11.08.2026 — «Lieferanten
  // Dashboard soll nicht zur Auswahl stehen»): dessen Auto-Objekt landete als
  // ganz normales Projekt in JEDER Objekt-Auswahl der Berechnungen, obwohl
  // «Lieferanten-Dashboard» kein Bauprojekt ist. Der Eimer bettet nur eine
  // Seite ein und braucht gar kein Objekt.
  // Der Übungs-Eimer der Klassen (autoTyp 'uebung') ist bewusst NICHT
  // betroffen — dort laufen echte Berechnungen auf dem Auto-Objekt.
  function _wsOhneObjekt(b){ return !!(b && (b.direktModul || b.autoTyp==='rolle')); }
  function _wsEnsureObjekt(b){
    // Kein Auto-Objekt für Rollen-/Direkt-Modul-Eimer. Wichtig ist auch der
    // ZWEITE Effekt: die Wiederbelebung weiter unten (objektId gesetzt, Objekt
    // fehlt → neu anlegen) greift damit nicht mehr — ein in pm_objekte
    // gelöschtes «Lieferanten-Dashboard»-Objekt kommt nicht zurück.
    if(_wsOhneObjekt(b))return null;
    // Wenn der Eimer bereits eine objektId hat: pruefen, ob das Objekt
    // noch im pm_objekte-Bestand existiert. Wenn nicht (geloescht,
    // archiviert, Org-Wechsel), legen wir es neu unter derselben ID an —
    // sonst zeigt setActiveId auf eine tote ID und die Berechnungsmodule
    // finden das Objekt nicht.
    if(b.objektId){
      try {
        var raw0 = localStorage.getItem('gema_objekte_v1');
        var data0 = raw0 ? JSON.parse(raw0) : null;
        if (data0 && (data0.objekte||[]).find(function(o){ return o.id === b.objektId; })) {
          return b.objektId;  // Objekt existiert noch → alles gut
        }
      } catch(e) {}
      // b.objektId vorhanden aber Objekt fehlt → unten neu anlegen mit
      // derselben ID, damit Cross-Modul-Referenzen weiter funktionieren.
    }
    var objId = b.objektId || ('obj_ws_'+b.id);
    var curUser=null;
    try{if(typeof GemaAuth!=='undefined')curUser=GemaAuth.getCurrentUser();}catch(e){}
    var newObj={id:objId,name:b.name,strasse:'',plz:'',ort:'',
      bauvorhaben:(TYPES[b.type]||TYPES.project).label,status:'aktiv',
      orgId:curUser?curUser.orgId:'org_default',
      erstelltVon:curUser?curUser.id:'',
      createdAt:b.createdAt||new Date().toISOString()};
    try{
      var raw=localStorage.getItem('gema_objekte_v1');
      var data=raw?JSON.parse(raw):{objekte:[],beteiligte:[],activeObjektId:null};
      if(!data.objekte.find(function(o){return o.id===objId;})){
        data.objekte.push(newObj);
        localStorage.setItem('gema_objekte_v1',JSON.stringify(data));
        // ADD-ONLY per-Record in die Cloud (kein Diff/Delete), sonst bleibt
        // das Objekt lokal und wird beim naechsten Cloud-Pull verworfen.
        try { if(typeof GemaObjekte!=='undefined'&&GemaObjekte.upsertObjekt) GemaObjekte.upsertObjekt(newObj);
              else if(typeof GemaObjekte!=='undefined'&&GemaObjekte.refresh) GemaObjekte.refresh(); } catch(e) {}
      }
    }catch(e){}
    b.objektId=objId;
    save();
    return objId;
  }

  // ── Render ──
  // ── Firmenfarbe für hervorgehobene Eimer (Feedback 05.08.2026) ──────
  // Die --ws-pin*-Variablen (Schimmer der pinned-Zeilen) kommen aus der
  // Org-Primärfarbe. Flächen = sehr helle Weiss-Mischungen; die Textfarbe
  // läuft durch denselben Kontrastschutz wie die Berichts-PDFs (Richtung
  // Schwarz skalieren, bis ≥ 4.5:1 gegen Weiss — Knallgelb wird lesbares
  // Gold statt unlesbarem Hellgelb). Ohne Farbe: Variablen entfernen →
  // CSS-Fallback-Blau. Memoisiert über _wsPinAkt (render() läuft oft).
  function _wsHex6(c){var m=/^#?([0-9a-f]{6})$/i.exec(String(c||'').trim());return m?('#'+m[1].toLowerCase()):null;}
  function _wsRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function _wsMixWhite(h,p){var r=_wsRgb(h);var f=function(x){return Math.round(x+(255-x)*p);};return 'rgb('+f(r[0])+','+f(r[1])+','+f(r[2])+')';}
  function _wsKontrastInk(h){
    var r=_wsRgb(h);
    var lum=function(a){var f=function(x){x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);};return 0.2126*f(a[0])+0.7152*f(a[1])+0.0722*f(a[2]);};
    for(var i=0;i<24&&(1.05/(lum(r)+0.05))<4.5;i++){r=r.map(function(x){return Math.max(0,Math.round(x*0.88));});}
    return '#'+r.map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  }
  var _wsPinAkt='__init__';
  function _wsPinFarben(){
    var prim=null;
    try{
      var o=(typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentOrg&&GemaAuth.getCurrentOrg())||null;
      prim=_wsHex6(o&&o.settings&&o.settings.pdfFarben&&o.settings.pdfFarben.primary);
    }catch(e){}
    if(prim===_wsPinAkt)return;
    _wsPinAkt=prim;
    var st=document.documentElement.style;
    if(!prim){
      ['--ws-pin1','--ws-pin2','--ws-pin1h','--ws-pin2h','--ws-pin1a','--ws-pin2a','--ws-pin-bd','--ws-pin-ink']
        .forEach(function(k){st.removeProperty(k);});
      return;
    }
    st.setProperty('--ws-pin1',_wsMixWhite(prim,0.90));
    st.setProperty('--ws-pin2',_wsMixWhite(prim,0.96));
    st.setProperty('--ws-pin1h',_wsMixWhite(prim,0.85));
    st.setProperty('--ws-pin2h',_wsMixWhite(prim,0.93));
    st.setProperty('--ws-pin1a',_wsMixWhite(prim,0.80));
    st.setProperty('--ws-pin2a',_wsMixWhite(prim,0.90));
    st.setProperty('--ws-pin-bd',_wsMixWhite(prim,0.62));
    st.setProperty('--ws-pin-ink',_wsKontrastInk(prim));
  }

  /* «… N mehr» aufklappen (Bugfix Feedback 31.07.2026, Tim Löhrer): der
     Zustand lebt in einer PERSISTENTEN Map pro Liste — der frühere Code
     schrieb `_exp` auf das DOM-Element (wird beim Re-Render weggeworfen)
     und las `_expanded` von einem frischen Filter-Array → Klick tat nichts. */
  var _wsExpand={};

  // Reihenfolge in der Org-Sektion: FIXE Eimer (pinned) zuoberst, jeder
  // direkt gefolgt von seinen untergeordneten (subOf) — z.B. Klassen-Eimer
  // mit dem Übungs-Eimer darunter. Danach die normalen Org-Eimer.
  // KRITISCH: ein untergeordneter Eimer ohne sichtbaren Übergeordneten wird
  // NIE verschluckt, sondern normal eingereiht.
  function _wsOrder(list){
    var pinned=list.filter(function(b){return b.pinned&&!b.subOf;});
    var subs=list.filter(function(b){return b.subOf;});
    var rest=list.filter(function(b){return !b.pinned&&!b.subOf;});
    var out=[];
    function push(p){
      if(out.indexOf(p)<0)out.push(p);
      subs.forEach(function(s){ if(s.subOf===p.id&&out.indexOf(s)<0) out.push(s); });
    }
    pinned.forEach(push);
    var restOut=[];
    rest.forEach(function(p){
      restOut.push(p);
      subs.forEach(function(s){ if(s.subOf===p.id&&out.indexOf(s)<0&&restOut.indexOf(s)<0) restOut.push(s); });
    });
    // Waise (Übergeordneter nicht sichtbar) wird NIE verschluckt
    subs.forEach(function(s){ if(out.indexOf(s)<0&&restOut.indexOf(s)<0) restOut.push(s); });
    return out.concat(restOut);
  }

  function renderSidebar(){
    var visible=buckets.filter(_canSeeBucket);
    var oid=_curOrgId();
    var orgName='Organisation';
    try{var co=_getOrgs()[0];if(co)orgName=co.name;}catch(e){}
    var orgOwn=visible.filter(function(b){return b.ownerType==='org'&&b.ownerOrgId===oid;});
    var personal=visible.filter(function(b){return b.ownerType==='personal';});
    var guest=visible.filter(function(b){return _isGuestBucket(b);});
    /* Feedback 05.08.2026: «Übungsumgebung / Lernraum soll sich bei den
       jeweiligen Klassen anfügen» — ein PERSÖNLICHER Eimer, der einer Klasse
       zugeordnet ist (subOf), wird bei der Klasse gezeigt statt unten in der
       eigenen Liste. Ohne sichtbaren Übergeordneten bleibt er, wo er war. */
    var orgIds={};orgOwn.forEach(function(b){orgIds[b.id]=1;});
    var angehaengt=personal.filter(function(b){return b.subOf&&orgIds[b.subOf];});
    if(angehaengt.length){
      personal=personal.filter(function(b){return angehaengt.indexOf(b)<0;});
      orgOwn=orgOwn.concat(angehaengt);
    }
    var orgBuckets=_wsOrder(orgOwn);

    var filterOrg=function(list){
      if(activeOrg==='all')return list;
      return list.filter(function(b){return(b.ownerOrgId||b.org)===activeOrg;});
    };
    orgBuckets=filterOrg(orgBuckets);

    function renderList(list,emptyText,which){
      var exp=!!_wsExpand[which];
      // Fixe Eimer (+ ihre untergeordneten) stehen vorne und werden NIE
      // hinter «… N mehr» versteckt — sie sind der Einstiegspunkt.
      var fix=list.filter(function(b){return b.pinned||b.subOf;}).length;
      var vis=exp?list:list.slice(0,Math.max(5,fix));
      var html=vis.length?vis.map(bucketRowHtml).join(''):'<div class="ws-empty-hint">'+emptyText+'</div>';
      if(list.length>5)html+='<button class="ws-more-btn" style="font-size:12px;color:var(--ink-3);padding:6px 10px;text-align:left;border-radius:var(--r-sm);width:100%;border:none;background:none;cursor:pointer" onclick="_wsToggleExpand(\''+which+'\')" onmouseover="this.style.background=\'#F4F5F7\'" onmouseout="this.style.background=\'none\'">'+(exp?'… weniger anzeigen':'… '+(list.length-5)+' mehr')+'</button>';
      return html;
    }
    var lbl=document.getElementById('wsOrgLabel');if(lbl)lbl.textContent=orgName;
    document.getElementById('wsOrgBuckets').innerHTML=renderList(orgBuckets,'Keine Org-Eimer','org');
    document.getElementById('wsPersonal').innerHTML=renderList(personal,'Keine persönlichen Eimer','personal');
    var guestEl=document.getElementById('wsGuestBuckets');
    var guestSec=document.getElementById('wsGuestSection');
    if(guestEl)guestEl.innerHTML=renderList(guest,'','guest');
    if(guestSec)guestSec.style.display=guest.length?'':'none';
    var sBtn=document.getElementById('wsSettingsBtn');
    if(sBtn)sBtn.classList.toggle('active',_showSettings);
  }

  /** Die zuletzt besuchten Module des Geräts (dieselbe Quelle wie der
      🕒-Knopf in der Navigation) — gefiltert auf Module, die es im
      Workspace gibt, die der Nutzer sehen darf und die noch nicht im
      Eimer liegen. */
  function _wsZuletztModule(b,max){
    var out=[];
    var drin=(b.modules||[]).map(function(m){return m.mod;});
    var liste=[];
    try{ if(typeof GemaRecent!=='undefined'&&GemaRecent.list) liste=GemaRecent.list()||[]; }catch(e){}
    liste.forEach(function(r){
      if(out.length>=(max||5))return;
      var mod=MODULES.find(function(x){return x.id===(r&&r.key);});
      if(!mod||!_wsModAllowed(mod))return;
      if(drin.indexOf(mod.id)>=0)return;
      if(out.some(function(m){return m.id===mod.id;}))return;
      out.push(mod);
    });
    return out;
  }

        +'<em>+</em><span>'+esc(m.name)+'</span></button>';

  function renderContent(){
    var b=bucketSichtbar(activeTab);if(!b)return;
    var t=TYPES[b.type]||TYPES.project;
    var noMods=b.modules.length===0;
    // Direkt integriertes Modul (Feedback 05.08.2026): der Eimer IST die
    // Übersicht — die Seite wird eingebettet (?embed=1 blendet dort die
    // Navigation aus) statt hinter einer Kachel zu liegen.
    var direktMod=b.direktModul?MODULES.find(function(x){return x.id===b.direktModul;}):null;

    var modsHtml='';
    if(direktMod){
      modsHtml='<div class="ws-direkt-wrap">'
        +'<div class="ws-direkt-bar"><span>'+esc(direktMod.name)+'</span>'
        +'<a class="ws-btn ws-btn-ghost" href="'+direktMod.href+'" onclick="_wsMerkPfad(\''+b.id+'\')" style="padding:5px 10px;font-size:12px">'+icon('arrow-right',13)+' Im Vollbild öffnen</a></div>'
        +'<iframe class="ws-direkt-frame" src="'+direktMod.href+(direktMod.href.indexOf('?')>=0?'&':'?')+'embed=1" title="'+esc(direktMod.name)+'"></iframe></div>';
    }else if(noMods){
      modsHtml='<div class="ws-mod-hero-row">'+_wsHeroAdd()+_wsHeroVorlagen(b)+_wsHeroZuletzt(b)+'</div>';
    }else{
      var objId=_wsEnsureObjekt(b);
      // objId kann null sein (Eimer ohne Auto-Objekt) — dann NICHT das aktive

    var btnS=document.getElementById('wsMobSidebar');
    var btnC=document.getElementById('wsMobContent');
    var btnN=document.getElementById('wsMobNotes');
    if(btnS)btnS.classList.toggle('active',view==='sidebar');
    if(btnC)btnC.classList.toggle('active',view==='content');
    if(btnN)btnN.classList.toggle('active',view==='notes');
    // Sidebar-Drawer
    var overlay=document.getElementById('wsDrawerOverlay');
    var drawer=document.getElementById('wsDrawerSidebar');
    if(view==='sidebar'){
      if(overlay)overlay.classList.add('open');
      if(drawer){drawer.classList.add('open');renderDrawer();}
      if(notesCol)notesCol.classList.remove('mobile-show');
      if(contentArea)contentArea.style.display='flex';
      return;
    }else{
      if(overlay)overlay.classList.remove('open');
      if(drawer)drawer.classList.remove('open');
    }
    if(view==='notes'){
      if(notesCol)notesCol.classList.add('mobile-show');
      if(contentArea)contentArea.style.display='none';
      if(tabBar)tabBar.style.display='none';

      if(notesCol)notesCol.classList.remove('mobile-show');

  // ── Templates (Vorlagen) — cloud-synct pro ORG (07/2026) ──
  // Eimer-Vorlagen sind gemeinsame Arbeitspraxis der Firma und lagen
  // vorher NUR im localStorage des Geräts. Ein Record pro Org
  // (`wstpl:<orgId>`), localStorage bleibt Lese-Cache; Änderungen sind
  // Last-Write-Wins (selten gleichzeitig editiert).
  var TPL_KEY='gema_ws_templates_v1';
  var SETTINGS_KEY='gema_ws_settings_v1';
  function loadTemplates(){try{return JSON.parse(localStorage.getItem(TPL_KEY)||'[]');}catch(e){return [];}}
  function saveTemplates(t){
    try{localStorage.setItem(TPL_KEY,JSON.stringify(t));}catch(e){}
    try{
      var oid=_curOrgId();
      if(oid&&typeof GemaSync!=='undefined'&&GemaSync.saveRecord)
        GemaSync.saveRecord(MK,'wstpl:'+oid,{orgId:oid,templates:t||[]}).catch(function(){});
    }catch(e){}
  }
  (function(){
    // Boot-Pull der Org-Vorlagen (Cloud gewinnt)
    try{
      var oid=_curOrgId();
      if(!oid||typeof GemaSync==='undefined'||!GemaSync.loadRecord)return;
      GemaSync.loadRecord(MK,'wstpl:'+oid).then(function(rec){
        if(!rec||!rec.data||!Array.isArray(rec.data.templates))return;
        try{localStorage.setItem(TPL_KEY,JSON.stringify(rec.data.templates));}catch(e){}
      }).catch(function(){});
    }catch(e){}
  })();
  function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');}catch(e){return {};}}
  function saveSettingsData(s){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));}catch(e){}}

  // ── PWA-Installation ──
  function _wsRenderPwaState(){
    if(typeof GemaPWA === 'undefined') return;
    var btn=document.getElementById('wsPwaBtn');
    var desc=document.getElementById('wsPwaDesc');
    var iosHelp=document.getElementById('wsPwaIosHelp');
    var installed=document.getElementById('wsPwaInstalled');
    if(!btn) return; // Settings-Tab ist nicht offen
    var status=GemaPWA.getStatus();
    if(installed) installed.style.display=(status==='installed')?'':'none';
    if(iosHelp) iosHelp.style.display=(status==='manual_ios')?'':'none';
    if(status==='installed'){
      btn.style.display='none';
      desc.textContent='GEMA ist bereits als App auf diesem Gerät installiert.';
    }else if(status==='ready'){
      btn.style.display='';
      btn.disabled=false;
      btn.style.opacity='1';
      desc.textContent='Progressive Web App — startet wie eine native App und funktioniert offline.';
    }else if(status==='manual_ios'){
      btn.style.display='none';
      desc.textContent='GEMA als App auf dem Home-Bildschirm hinzufügen — siehe Hinweis unten.';
    }else{
      btn.style.display='';
      btn.disabled=true;
      btn.style.opacity='.55';
      desc.textContent='Dieser Browser unterstützt die direkte Installation nicht. In Chrome/Edge auf Android oder Desktop verfügbar.';
    }
  }
  window._wsInstallPWA=function(){
    if(typeof GemaPWA==='undefined') return;
    GemaPWA.install().then(function(res){
      if(res.outcome==='accepted'||res.outcome==='installed') toast('App wird installiert','check');
      else if(res.outcome==='dismissed') toast('Installation abgebrochen','x');
      else toast('Aktuell nicht verfügbar','x');
      _wsRenderPwaState();
    });
  };
  // Status nach Settings-Render und bei Aenderungen aktualisieren

  // ── Tab Persistence ──
  // KRITISCH — die offenen Tabs gehören dem BENUTZER, nicht dem Browser-Tab.
  // Der Schlüssel trägt darum die User-ID: nach einem Konto-Wechsel (auch ohne
  // Logout — der Admin-Benutzerwechsel tauscht die Session im laufenden Tab)
  // beginnt der neue Nutzer mit SEINEN Tabs statt mit denen des vorherigen.
  // Zusätzlich wird beim Wiederherstellen gegen _canSeeBucket gefiltert: ein
  // Eimer, den man nicht sehen darf, kommt nie als Tab zurück.
  function _tabsKey(){var u=_curUserId();return 'ws_tabs'+(u?'_'+u:'');}
  /** Der frühere, ungescopte Schlüssel — genau er trug die Tabs des vorherigen
      Nutzers über den Konto-Wechsel. Einmalig abräumen; ein Tab-Zustand ist
      flüchtige Geräte-UI, da geht nichts Wertvolles verloren. */
  function _tabsAltWeg(){
    try{ if(_curUserId()) sessionStorage.removeItem('ws_tabs'); }catch(e){}
  }
  function saveTabs(){
    try{sessionStorage.setItem(_tabsKey(),JSON.stringify({open:openTabs,active:activeTab}));}catch(e){}
  }
  function loadTabs(){
    _tabsAltWeg();
    try{
      var r=sessionStorage.getItem(_tabsKey());
      if(r){var d=JSON.parse(r);openTabs=d.open||[];activeTab=d.active||null;}
      else {openTabs=[];activeTab=null;}
      openTabs=openTabs.filter(function(id){return !!bucketSichtbar(id);});
      if(activeTab&&!bucketSichtbar(activeTab))activeTab=openTabs[0]||null;
    }catch(e){openTabs=[];activeTab=null;}
  }
  var _origSave=save;
  save=function(){_origSave();saveTabs();};

    var arr=[];
    try{
      arr=(typeof GemaSync!=='undefined'&&GemaSync.getCached&&GemaSync.getCached('gema_schule_klassen_pool_v1'))||[];
      if(!arr.length){var r=localStorage.getItem('gema_schule_klassen_pool_v1');arr=r?JSON.parse(r):[];}
    }catch(e){ arr=[]; }
    if(!Array.isArray(arr))arr=[];
    return arr.filter(function(k){
      if(!k||!k.id||k.archiviert)return false;
      return (k.studentIds||[]).indexOf(u.id)>=0||(k.dozentIds||[]).indexOf(u.id)>=0;

  /* Dozenten UND Studierende aus den eigenen Klassen (Feedback 05.08.2026
     «Dozent und Student ergänzen»). Eine Quelle für beide — der Einladen-
     Dialog listet sie zusammen, `_wsDozKandidaten` ist nur noch die
     Dozenten-Sicht darauf (Test-Hook + der separate Schnellzugriff). */
  function _wsKlassenKandidaten(){
    var u=_curUser();if(!u)return [];
    var b=bucketSichtbar(activeTab);
    var drin={};
    if(b)(b.beteiligte||[]).forEach(function(p){if(p.userId)drin[p.userId]=1;});
    var alle=[];
    try{alle=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[];}catch(e){}
    var out=[],gesehen={};
    _wsMeineKlassen().forEach(function(k){
      [['dozentIds','Dozent'],['studentIds','Studierende']].forEach(function(paar){
        (k[paar[0]]||[]).forEach(function(id){
          if(id===u.id||gesehen[id]||drin[id])return;
          gesehen[id]=1;
          var us=alle.find(function(x){return x.id===id;});
          if(us&&us.active===false)return;   // deaktiviertes Konto nie anbieten
          out.push({id:id,name:us?(us.name||us.username):id,rolle:paar[1],klasse:k.name||''});
        });
      });
    });
    return out;
  }
  function _wsDozKandidaten(){
    return _wsKlassenKandidaten().filter(function(k){return k.rolle==='Dozent';});

      Studierende. `_wsDozentAdd` bleibt als Name bestehen (Schnellzugriff +
      Drift-Guard), gibt aber nur die Rolle vor. */
  window._wsKlasseAdd=function(userId,rolle){
    var b=bucketSichtbar(activeTab);if(!b)return;
    rolle=rolle||'Dozent';
    var alle=[];try{alle=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[];}catch(e){}
    var u=alle.find(function(x){return x.id===userId;});
    var name=u?(u.name||u.username):userId;
    if((b.beteiligte||[]).some(function(p){return p.userId===userId;})){ _wsCloseModal(); return; }
    b.members.push(_initials(name));
    b.beteiligte.push({userId:userId,role:rolle,name:name,org:'',intern:true});
    if(!b.accessControl)b.accessControl={orgVisible:true,invitedUsers:[],revokedUsers:[]};
    if((b.accessControl.invitedUsers||[]).indexOf(userId)<0)b.accessControl.invitedUsers.push(userId);
    // Ein eingeschränkter Eimer (Klassen-/Fix-Eimer) muss die eingeladene
    // Person ausdrücklich durchlassen — sonst lädt man jemanden ein, der
    // nichts sieht.
    if(Array.isArray(b.accessControl.nurUserIds)&&b.accessControl.nurUserIds.indexOf(userId)<0)
      b.accessControl.nurUserIds.push(userId);
    var cu=_curUser();
    b.activity.unshift(_wsAct((cu&&cu.name)||'Du','hat '+name+' als '+rolle+' eingeladen'));
    save();render();
    try{
      if(typeof GemaNotify!=='undefined')GemaNotify.push({

  /* Mitgliederübersicht — der Chip im Kopf öffnet die Liste (Feedback
     05.08.2026 «soll anwählbar sein» + 06.08.2026 «Mitglieder sollen
     angezeigt werden, wenn man drauf klickt»): die erste Fassung las NUR
     `beteiligte` — beim Klassen-/Übungs-Eimer stehen die Mitglieder aber in
     der KLASSE bzw. in accessControl.nurUserIds, die Liste war dort leer,
     obwohl der Chip zählte. `_wsMitgliederListe` ist seither die EINE
     Wahrheit für Chip-Zähler UND Liste. */
  function _wsMitgliederListe(b){
    var out=[], seen={}, byId=null;
    function userById(id){
      if(!byId){
        byId={};
        try{
          ((typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[]).forEach(function(u){ if(u&&u.id)byId[u.id]=u; });
        }catch(e){}
      }
      return byId[id]||null;
    }
    function add(e){
      if(e.userId){ if(seen[e.userId])return; seen[e.userId]=1; }
      out.push(e);
    }
    // 1) Klassen-Eimer: die KLASSE ist die Wahrheit (LIVE aus dem Pool-Cache)
    var k=(b.autoTyp==='klasse')?_wsKlasseVon(b):null;
    if(k){
      (k.dozentIds||[]).forEach(function(id){
        var u=userById(id);
        add({userId:id,name:(u&&(u.name||u.username))||'Unbekanntes Konto',sub:'Dozent',badge:'Klasse'});
      });
      (k.studentIds||[]).forEach(function(id){
        var u=userById(id);
        add({userId:id,name:(u&&(u.name||u.username))||'Unbekanntes Konto',sub:'Studierende',badge:'Klasse'});
      });
    }
    // 2) Explizit Beteiligte (eingeladen; entfernbar via betIdx)
    (b.beteiligte||[]).forEach(function(p,idx){
      if(p.userId&&seen[p.userId])return;
      if(p.userId)seen[p.userId]=1;
      out.push({userId:p.userId||'',name:p.name,sub:(p.role||'Mitglied')+(p.org?' · '+p.org:''),badge:p.intern?'intern':'extern',betIdx:idx});
    });
    // 3) Zugriffs-Personen (Übungs-Eimer, fixe Eimer, Lerngruppen). Beim
    //    Klassen-Eimer nur als FALLBACK, wenn die Klasse (noch) nicht im
    //    Cache liegt — nurUserIds ist dort bloss die Kopie.
    if(!k){
      ((b.accessControl||{}).nurUserIds||[]).forEach(function(id){
        if(seen[id])return;
        var u=userById(id);
        add({userId:id,name:(u&&(u.name||u.username))||'Unbekanntes Konto',sub:_wsRoleName(u)||'Mitglied',badge:'Zugriff'});
      });
    }
    // 4) Ersteller (nur von Hand angelegte Eimer — bei autoTyp ist der
    //    «Ersteller» bloss, wer den Workspace zuerst öffnete)
    if(b.createdBy&&!b.autoTyp&&!seen[b.createdBy]){
      var cu=userById(b.createdBy);
      if(cu)add({userId:b.createdBy,name:cu.name||cu.username||'',sub:_wsRoleName(cu)||'Mitglied',badge:'Ersteller'});
    }
    return out;
  }

  // ── Resize Panels ──
  function initResize(handleId,getTarget,side){
    var handle=document.getElementById(handleId);if(!handle)return;
    var dragging=false,startX=0,startW=0,target=null;
    handle.addEventListener('mousedown',function(e){
      target=typeof getTarget==='function'?getTarget():document.getElementById(getTarget);
      if(!target)return;
      dragging=true;startX=e.clientX;startW=target.offsetWidth;
      handle.classList.add('active');
      document.body.style.cursor='col-resize';document.body.style.userSelect='none';
      e.preventDefault();
    });
    document.addEventListener('mousemove',function(e){
      if(!dragging)return;
      var delta=e.clientX-startX;
      var newW=side==='left'?startW+delta:startW-delta;
      newW=Math.max(200,Math.min(500,newW));
      target.style.width=newW+'px';
    });
    document.addEventListener('mouseup',function(){
      if(!dragging)return;
      dragging=false;handle.classList.remove('active');
      document.body.style.cursor='';document.body.style.userSelect='';
    });
  }

  // ── Auto-Eimer für Klassen (Dozent UND Studierende) ─────────────────
  // Es gibt KEINE eigene «Klassen»-Sektion: der Klassen-Eimer lebt in der
  // Org der Schule und erscheint dort zuoberst hervorgehoben.
  // (a) KLASSEN-Eimer = EIN GETEILTER Org-Eimer je Klasse
  //     (`ws_kl_<klasseId>`, pinned, `nurUserIds` = Dozenten + Studierende):
  //     Dozent und Studierende sehen ihn automatisch bei sich im Workspace.
  // (b) ÜBUNGS-Eimer = PRO STUDENT (`subOf` = Klassen-Eimer, `nurUserIds`
  //     = nur diese Person). Bewusst NICHT geteilt: die Berechnungsmodule
  //     speichern per Objekt — ein geteilter Übungs-Eimer liesse die
  //     Studierenden gegenseitig ihre Berechnungen überschreiben. Name =
  //     ADRESSE der Schul-Org, mit eigenem Objekt (echter Projekt-Kontext);
  //     Module = die vom Dozenten freigeschalteten, ADD-ONLY nachgeführt
  //     (selbst Entferntes kommt wieder, Entzogenes wird NIE gelöscht).
  // Dazu die Klassen-Chatgruppe (alle Studierenden + Dozenten).
  function _wsIsStudent(){
    var u=_curUser();
    return !!(u&&u.roleIds&&u.roleIds.indexOf('role_student')>=0&&u.roleIds.indexOf('role_admin')<0);
  }
  function _wsOrgAdresse(){
    try{
      var o=(typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentOrg&&GemaAuth.getCurrentOrg())||null;
      if(!o)return {name:'Übungsobjekt',strasse:'',plz:'',ort:'',hat:false};
      var a=o.adresse||{};
      var label=[a.strasse,[a.plz,a.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      // `hat` = die Org hat eine echte Adresse. Nur dann wird ein bereits
      // vergebener Name nachgezogen — sonst überschriebe der Fallback
      // (Org-Name) eine gepflegte Adresse wieder.
      return {name:label||o.name||'Übungsobjekt',strasse:a.strasse||'',plz:a.plz||'',ort:a.ort||'',hat:!!label};
    }catch(e){ return {name:'Übungsobjekt',strasse:'',plz:'',ort:'',hat:false}; }
  }
  // Klassen-Modul-KEYS (z.B. 'lu_tabelle') → Workspace-Datei-IDs
  // (z.B. 'sb_lu_tabelle') über die umgedrehte FILE_MAP; nur Dateien,
  // die es im MODULES-Katalog wirklich gibt.
  function _wsModKeyToFileId(key){
    try{
      var fm=(typeof GemaAuth!=='undefined'&&GemaAuth.getFileMap&&GemaAuth.getFileMap())||{};
      var hit=null;
      Object.keys(fm).forEach(function(file){
        if(hit||fm[file]!==key)return;
        if(MODULES.some(function(m){return m.id===file;}))hit=file;
      });
      return hit;
    }catch(e){ return null; }
  }
  function _wsUserNames(ids){
    var out=[];
    try{
      var alle=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[];
      (ids||[]).forEach(function(id){
        var u=alle.find(function(x){return x.id===id;});
        if(u)out.push(u.name||u.username||'');
      });
    }catch(e){}
    return out.filter(Boolean).sort();
  }
  // (a) Geteilter Klassen-Eimer in der Org der Schule
  function _wsKlassenEimer(k,u){
    var changed=false, now=new Date().toISOString();
    var id='ws_kl_'+k.id;
    var oid=k.orgId||u.orgId||'org_default';
    var teilnehmer=(k.dozentIds||[]).concat(k.studentIds||[]).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
    var namen=_wsUserNames(teilnehmer);
    var b=buckets.find(function(x){return x.id===id;});
    if(!b){
      b={id:id,name:k.name||'Meine Klasse',type:'training',ownerType:'org',ownerOrgId:oid,
        createdBy:u.id,autoTyp:'klasse',autoKlasseId:k.id,pinned:true,
        accessControl:{orgVisible:false,invitedUsers:[],revokedUsers:[],nurUserIds:teilnehmer},
        org:'',members:namen,modules:[{mod:'ab_klassen',status:'offen'}],
        activity:[{who:'GEMA',text:'Klassen-Eimer automatisch angelegt',ts:_wsTs()}],
        beteiligte:[],notes:[],objektId:null,createdAt:now};
      buckets.push(b);changed=true;
    }else{
      if(k.name&&b.name!==k.name){b.name=k.name;changed=true;}
      if(b.ownerType!=='org'){b.ownerType='org';changed=true;}
      if(b.ownerOrgId!==oid){b.ownerOrgId=oid;changed=true;}
      if(b.pinned!==true){b.pinned=true;changed=true;}
      if(b.autoKlasseId!==k.id){b.autoKlasseId=k.id;changed=true;}
      if(!b.accessControl)b.accessControl={orgVisible:false,invitedUsers:[],revokedUsers:[]};
      var alt=(b.accessControl.nurUserIds||[]).slice().sort().join('|');
      if(alt!==teilnehmer.slice().sort().join('|')){b.accessControl.nurUserIds=teilnehmer;changed=true;}
      if((b.members||[]).join('|')!==namen.join('|')&&namen.length){b.members=namen;changed=true;}
      if(!(b.modules||[]).some(function(m){return m.mod==='ab_klassen';})){
        b.modules=b.modules||[];b.modules.unshift({mod:'ab_klassen',status:'offen'});changed=true;
      }
    }
    return {id:id,changed:changed};
  }
  // (b) Übungs-Eimer je Studentin/Student, eingerückt unter der Klasse
  function _wsUebungsEimer(k,u,parentId){
    var changed=false, now=new Date().toISOString();
    var adr=_wsOrgAdresse();
    var oid=k.orgId||u.orgId||'org_default';
    var id='ws_ue_'+k.id+'_'+u.id;
    var b=buckets.find(function(x){return x.id===id;});
    if(!b){
      b={id:id,name:adr.name,type:'training',ownerType:'org',ownerOrgId:oid,
        createdBy:u.id,autoTyp:'uebung',autoKlasseId:k.id,subOf:parentId,
        accessControl:{orgVisible:false,invitedUsers:[],revokedUsers:[],nurUserIds:[u.id]},
        org:'',members:[],modules:[],
        activity:[{who:'GEMA',text:'Übungs-Eimer automatisch angelegt',ts:_wsTs()}],
        beteiligte:[],notes:[],objektId:null,createdAt:now};
      buckets.push(b);changed=true;
    }else{
      // Altbestand (persönlicher Eimer) auf die Org umziehen — die
      // Übungs-Berechnungen darin bleiben unangetastet.
      if(b.ownerType!=='org'){b.ownerType='org';changed=true;}
      if(b.ownerOrgId!==oid){b.ownerOrgId=oid;changed=true;}
      if(b.subOf!==parentId){b.subOf=parentId;changed=true;}
      if(b.pinned){delete b.pinned;changed=true;}
      if(!b.accessControl)b.accessControl={orgVisible:false,invitedUsers:[],revokedUsers:[]};
      if((b.accessControl.nurUserIds||[]).join('|')!==u.id){b.accessControl.nurUserIds=[u.id];changed=true;}
      // Name nachziehen, sobald die Org ihre Adresse gepflegt hat
      if(adr.hat&&b.name!==adr.name){b.name=adr.name;changed=true;}
    }
    (k.module||[]).forEach(function(key){
      var fid=_wsModKeyToFileId(key);
      if(!fid)return;
      if(b.modules.some(function(m){return m.mod===fid;}))return;
      b.modules.push({mod:fid,status:'offen'});changed=true;
    });
    // Auto-Objekt MIT der Org-Adresse (nicht die leere _wsEnsureObjekt-
    // Vorlage) — die Übungs-Berechnungen laufen auf diesem Objekt.
    var objId='obj_ws_'+b.id;
    var neu={id:objId,name:adr.name,strasse:adr.strasse,plz:adr.plz,ort:adr.ort,
      bauvorhaben:'Übung',status:'aktiv',orgId:oid,erstelltVon:u.id,createdAt:now};
    try{
      var raw=localStorage.getItem('gema_objekte_v1');
      var data=raw?JSON.parse(raw):{objekte:[],beteiligte:[],activeObjektId:null};
      var vor=(data.objekte||[]).find(function(o){return o.id===objId;});
      if(!vor){
        data.objekte.push(neu);
        localStorage.setItem('gema_objekte_v1',JSON.stringify(data));
        if(typeof GemaObjekte!=='undefined'&&GemaObjekte.upsertObjekt)GemaObjekte.upsertObjekt(neu);
      }else if(adr.hat&&(vor.name!==adr.name||vor.strasse!==adr.strasse||vor.plz!==adr.plz||vor.ort!==adr.ort)){
        // Adresse erst nachträglich gepflegt → Objekt nachziehen
        vor.name=adr.name;vor.strasse=adr.strasse;vor.plz=adr.plz;vor.ort=adr.ort;
        localStorage.setItem('gema_objekte_v1',JSON.stringify(data));
        if(typeof GemaObjekte!=='undefined'&&GemaObjekte.upsertObjekt)GemaObjekte.upsertObjekt(vor);
      }
    }catch(e){}
    if(b.objektId!==objId){b.objektId=objId;changed=true;}
    return changed;
  }
  // Altbestand: der frühere PERSÖNLICHE Klassen-Eimer je Student
  // (`ws_kl_<klasseId>_<userId>`) wird vom geteilten Org-Eimer abgelöst.
  // Unberührte Hüllen (nur das Klassen-Modul) verschwinden; hat jemand
  // darin gearbeitet, bleibt der Eimer als normaler persönlicher Eimer
  // stehen (Datenerhalt) — die Auto-Sperren fallen weg.
  function _wsAltKlassenEimer(k,u){
    var alt=buckets.find(function(x){return x.id==='ws_kl_'+k.id+'_'+u.id;});
    if(!alt)return false;
    var unberuehrt=(alt.notes||[]).length===0&&(alt.beteiligte||[]).length===0&&
      (alt.modules||[]).filter(function(m){return m.mod!=='ab_klassen';}).length===0;
    if(unberuehrt){ buckets=buckets.filter(function(x){return x!==alt;}); return true; }
    delete alt.autoTyp; delete alt.autoKlasseId; return true;
  }
  function _wsKlassenProvision(){
    var u=_curUser();if(!u||!u.id)return;
    var istStudent=_wsIsStudent();
    var fertig=function(klassen){
      try{
        var meine=(klassen||[]).filter(function(k){
          if(!k||!k.id||k.archiviert)return false;
          var st=Array.isArray(k.studentIds)&&k.studentIds.indexOf(u.id)>=0;
          var doz=Array.isArray(k.dozentIds)&&k.dozentIds.indexOf(u.id)>=0;
          return st||doz;
        });
        if(!meine.length)return;
        var changed=false,ersterKlassenEimer=null;
        meine.forEach(function(k){
          var kl=_wsKlassenEimer(k,u);
          if(kl.changed)changed=true;
          if(!ersterKlassenEimer)ersterKlassenEimer=kl.id;
          if(istStudent){
            if(_wsUebungsEimer(k,u,kl.id))changed=true;
            if(_wsAltKlassenEimer(k,u))changed=true;
          }
        });
        if(changed){ save(); render(); try{ if(window._wsNatRefresh)window._wsNatRefresh(); }catch(e){} }
        // Studierende landen beim ersten Einstieg direkt im Klassen-Eimer
        if(istStudent&&!openTabs.length&&ersterKlassenEimer){
          var erster=buckets.find(function(x){return x.id===ersterKlassenEimer;});
          if(erster)window._wsOpen(erster.id);
        }
        // Klassen-Chatgruppe (idempotent — stabile Thread-ID pro Klasse)
        meine.forEach(function(k){
          try{
            if(typeof GemaChat!=='undefined'&&GemaChat.ensureGruppe)
              GemaChat.ensureGruppe({gruppeId:'klasse_'+k.id,titel:k.name,
                userIds:(k.dozentIds||[]).concat(k.studentIds||[]),
                kontext:{typ:'klasse',refId:k.id,label:k.name,url:'ab_klassen.html?k='+k.id}});
          }catch(e){}
        });
      }catch(e){}
    };
    var cacheRead=function(){
      try{
        var arr=(typeof GemaSync!=='undefined'&&GemaSync.getCached&&GemaSync.getCached('gema_schule_klassen_pool_v1'))||null;
        if(!Array.isArray(arr)||!arr.length){
          var r=localStorage.getItem('gema_schule_klassen_pool_v1');
          arr=r?JSON.parse(r):[];
        }
        return Array.isArray(arr)?arr:[];
      }catch(e){ return []; }
    };
    if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection){
      GemaSync.bindCollection('schule','gema_schule_klassen_pool_v1','sklasse:','id')
        .then(function(rows){ fertig(Array.isArray(rows)&&rows.length?rows:cacheRead()); })
        .catch(function(){ fertig(cacheRead()); });
    }else{
      fertig(cacheRead());
    }
  }

  // ── Fixe Eimer der Firma (Org-Admin) ────────────────────────────────
  // Hervorgehobene Org-Eimer, die der Org-Admin für die ganze Firma, für
  // ausgewählte Personen oder für ganze Rollen anlegt. Der Zugriff läuft
  // über `accessControl.nurUserIds` bzw. `nurRollen` (_bucketScopeOk);
  // ohne beides gilt der Eimer für die ganze Org. Automatisch erzeugte
  // (autoTyp) stehen in derselben Liste, sind aber nicht editierbar.
  function _wsFixeEimer(){
    var oid=_curOrgId();
    return buckets.filter(function(b){return b.pinned&&b.ownerType==='org'&&b.ownerOrgId===oid&&!b.subOf;});
  }
  function _wsOrgUsers(){
    try{
      var oid=_curOrgId();
      return ((typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[])
        .filter(function(u){return u&&u.orgId===oid&&u.status!=='inaktiv';});
    }catch(e){ return []; }
  }
  function _wsOrgRollen(){
    try{
      var alle=(typeof GemaAuth!=='undefined'&&GemaAuth.getRoles&&GemaAuth.getRoles())||[];
      var benutzt={};
      _wsOrgUsers().forEach(function(u){ (u.roleIds||[]).forEach(function(r){benutzt[r]=true;}); });
      var liste=alle.filter(function(r){return benutzt[r.id];});
      return liste.length?liste:alle;
    }catch(e){ return []; }
  }
  function _wsRollenName(id){
    var r=_wsOrgRollen().find(function(x){return x.id===id;});
    return (r&&r.name)||id;
  }
  function _wsFixScopeText(b){
    var ac=b.accessControl||{};
    if(Array.isArray(ac.nurUserIds)&&ac.nurUserIds.length){
      var namen=_wsUserNames(ac.nurUserIds);
      return namen.length?('Personen: '+namen.join(', ')):(ac.nurUserIds.length+' Personen');
    }
    if(Array.isArray(ac.nurRollen)&&ac.nurRollen.length)
      return 'Rollen: '+ac.nurRollen.map(_wsRollenName).join(', ');
    return 'Ganze Firma';
  }
  window._wsFixModus=function(v){
    var p=document.getElementById('wsFixPersonen'),r=document.getElementById('wsFixRollen');
    if(p)p.style.display=(v==='personen'?'block':'none');
    if(r)r.style.display=(v==='rollen'?'block':'none');
  };
  window._wsFixEdit=function(id){
    var b=id?buckets.find(function(x){return x.id===id;}):null;
    var ac=(b&&b.accessControl)||{};
    var pers=(ac.nurUserIds||[]),roll=(ac.nurRollen||[]);
    var modus=pers.length?'personen':(roll.length?'rollen':'org');
    var zeile=function(val,label,chk,cls){
      return '<label class="'+cls+'" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer">'
        +'<input type="checkbox" value="'+esc(val)+'"'+(chk?' checked':'')+' style="width:16px;height:16px;accent-color:var(--navy)">'
        +'<span style="font-size:13px;font-weight:500">'+esc(label)+'</span></label>';
    };
    var body='<div class="ws-form">'
      +'<div class="ws-form-field"><label>Name</label>'
      +'<input class="ws-input" id="wsFixName" placeholder="z.B. Firmen-Handbuch" value="'+esc(b?b.name:'')+'"></div>'
      +'<div class="ws-form-field"><label>Wer sieht diesen Eimer?</label>'
      +'<select class="ws-input" id="wsFixModus" onchange="_wsFixModus(this.value)">'
      +'<option value="org"'+(modus==='org'?' selected':'')+'>Ganze Firma</option>'
      +'<option value="personen"'+(modus==='personen'?' selected':'')+'>Bestimmte Personen</option>'
      +'<option value="rollen"'+(modus==='rollen'?' selected':'')+'>Bestimmte Rollen (Mitarbeitergruppen)</option>'
      +'</select></div>'
      +'<div class="ws-form-field" id="wsFixPersonen" style="display:'+(modus==='personen'?'block':'none')+'">'
      +'<label>Personen</label><div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px">'
      +_wsOrgUsers().map(function(u){return zeile(u.id,u.name||u.username||u.id,pers.indexOf(u.id)>=0,'ws-fix-user');}).join('')
      +'</div></div>'
      +'<div class="ws-form-field" id="wsFixRollen" style="display:'+(modus==='rollen'?'block':'none')+'">'
      +'<label>Rollen</label><div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px">'
      +_wsOrgRollen().map(function(r){return zeile(r.id,r.name||r.id,roll.indexOf(r.id)>=0,'ws-fix-role');}).join('')
      +'</div></div>'
      +'<p style="font-size:12.5px;color:var(--ink-2);margin:-4px 0 4px">Module fügst du nach dem Speichern direkt im Eimer hinzu.</p>'
      +'<div class="ws-form-actions"><button class="ws-btn ws-btn-ghost" onclick="_wsCloseModal()">Abbrechen</button>'
      +'<button class="ws-btn ws-btn-primary" onclick="_wsFixSave(\''+esc(id||'')+'\')">Speichern</button></div></div>';
    openModal(b?'Fixer Eimer bearbeiten':'Neuer fixer Eimer',body,540);
  };
  window._wsFixSave=function(id){
    var name=(document.getElementById('wsFixName').value||'').trim();
    if(!name){ toast('Bitte einen Namen eingeben','x'); return; }
    var modus=document.getElementById('wsFixModus').value;
    var sammle=function(sel){
      return Array.prototype.slice.call(document.querySelectorAll('.'+sel+' input:checked'))
        .map(function(i){return i.value;});
    };
    var ids=modus==='personen'?sammle('ws-fix-user'):[];
    var rollen=modus==='rollen'?sammle('ws-fix-role'):[];
    if(modus==='personen'&&!ids.length){ toast('Bitte mindestens eine Person wählen','x'); return; }
    if(modus==='rollen'&&!rollen.length){ toast('Bitte mindestens eine Rolle wählen','x'); return; }
    var u=_curUser()||{};
    var b=id?buckets.find(function(x){return x.id===id;}):null;
    if(!b){
      b={id:'ws_fix_'+Date.now().toString(36),name:name,type:'project',ownerType:'org',
        ownerOrgId:_curOrgId(),createdBy:u.id,pinned:true,
        accessControl:{orgVisible:true,invitedUsers:[],revokedUsers:[]},
        org:'',members:[],modules:[],
        activity:[{who:u.name||'GEMA',text:'Fixer Eimer erstellt',ts:_wsTs()}],
        beteiligte:[],notes:[],objektId:null,createdAt:new Date().toISOString()};
      buckets.push(b);
    }else{ b.name=name; }
    b.accessControl=b.accessControl||{orgVisible:true,invitedUsers:[],revokedUsers:[]};
    if(ids.length)b.accessControl.nurUserIds=ids; else delete b.accessControl.nurUserIds;
    if(rollen.length)b.accessControl.nurRollen=rollen; else delete b.accessControl.nurRollen;
    save();_wsCloseModal();render();_renderSettings();
    toast('Fixer Eimer gespeichert','check');
  };
  window._wsFixDelete=function(id){
    var b=buckets.find(function(x){return x.id===id;});
    if(!b||b.autoTyp)return;
    _wsConfirmDelete(id);
  };

  // ── Automatische Rollen-Eimer (z.B. Lieferanten-Dashboard) ──────────
  // Ein Eimer je Org, sichtbar für alle Lieferanten-/Produktlieferanten-
  // Rollen (Rollen-Präfix-Match wie überall in GEMA). Angelegt wird er
  // erst, wenn eine solche Person den Workspace öffnet.
  // `direkt`: das Modul ist FIX IM EIMER INTEGRIERT (Feedback 05.08.2026
  // — «nicht als Modul im Workspace, sondern fix im Bucket, sodass man
  // direkt die Übersicht hat»): der Eimer-Inhalt zeigt die Seite direkt
  // eingebettet (?embed=1) statt einer Modul-Kachel; eine früher als
  // Kachel angelegte Instanz wird beim Provisionieren entfernt.
  var AUTO_ROLLEN_EIMER=[
    {key:'lieferant',name:'Lieferanten-Dashboard',rollen:['role_lieferant','role_produktlieferant'],
     direkt:'sys_lieferant_dashboard',modules:[]}
  ];
  function _wsAutoRollenEimer(){
    var u=_curUser();if(!u||!u.id)return false;
    var rl=u.roleIds||[];var oid=_curOrgId();var changed=false;
    AUTO_ROLLEN_EIMER.forEach(function(def){
      var passt=def.rollen.some(function(p){return rl.some(function(r){return r===p||String(r).indexOf(p)===0;});});
      if(!passt)return;
      var id='ws_auto_'+def.key+'_'+oid;
      var b=buckets.find(function(x){return x.id===id;});
      if(!b){
        b={id:id,name:def.name,type:'project',ownerType:'org',ownerOrgId:oid,createdBy:u.id,
          autoTyp:'rolle',pinned:true,
          accessControl:{orgVisible:false,invitedUsers:[],revokedUsers:[],nurRollen:def.rollen},
          org:'',members:[],modules:[],
          activity:[{who:'GEMA',text:'Automatisch angelegt',ts:_wsTs()}],
          beteiligte:[],notes:[],objektId:null,createdAt:new Date().toISOString()};
        buckets.push(b);changed=true;
      }
      if(b.pinned!==true){b.pinned=true;changed=true;}
      /* Altbestand: eine frühere Instanz lief als Modul-KACHEL und hat sich
         dabei ein Auto-Objekt angelegt («Lieferanten-Dashboard» stand danach
         in jeder Objekt-Auswahl). Der Eimer lässt die Referenz hier LOS —
         das Objekt selbst wird bewusst NICHT gelöscht (an einem Objekt können
         Daten hängen); es lässt sich in pm_objekte → «🧹 Aufräumen» entfernen
         und kommt danach nicht mehr zurück, weil _wsEnsureObjekt für diesen
         Eimer nichts mehr anlegt. */
      if(b.objektId){b.objektId=null;changed=true;}
      if(def.direkt){
        if(b.direktModul!==def.direkt){b.direktModul=def.direkt;changed=true;}
        var vorher=(b.modules||[]).length;
        b.modules=(b.modules||[]).filter(function(m){return m.mod!==def.direkt;});
        if(b.modules.length!==vorher)changed=true;
      }
      def.modules.forEach(function(mid){
        if(!MODULES.some(function(m){return m.id===mid;}))return;
        if((b.modules||[]).some(function(m){return m.mod===mid;}))return;
        b.modules=b.modules||[];b.modules.push({mod:mid,status:'offen'});changed=true;
      });
    });
    return changed;
  }
  function _wsAutoProvision(){
    try{ if(_wsAutoRollenEimer()){ save(); render(); try{ if(window._wsNatRefresh)window._wsNatRefresh(); }catch(e){} } }catch(e){}
    _wsKlassenProvision();
  }

  // ── Init ──
  // Stale-while-revalidate: sofort aus dem Pool-Cache rendern, danach
  // Cloud-Pull (bindCollection) + einmalige Legacy-Blob-Migration.
  /* Rückweg aus einem Modul: sys_workspace.html?eimer=<id> öffnet genau
     diesen Eimer. Läuft nach dem Cache-Render UND nach dem Cloud-Pull —
     auf einem frischen Gerät liegt der Eimer beim ersten Lauf noch nicht
     im Cache. `bucketSichtbar` filtert wie überall. */
  var _deepEimer='';
  try{ _deepEimer=new URLSearchParams(location.search).get('eimer')||''; }catch(e){}
  function _wsDeepLink(){
    if(!_deepEimer||!bucketSichtbar(_deepEimer))return false;
    if(activeTab===_deepEimer&&openTabs.indexOf(_deepEimer)>=0)return false;
    activeTab=_deepEimer;
    if(openTabs.indexOf(_deepEimer)<0)openTabs.push(_deepEimer);
    _showSettings=false;saveTabs();
    return true;
  }
  load();loadTabs();_wsDeepLink();render();
  (function(){
    if(typeof GemaSync==='undefined'||!GemaSync.bindCollection){ _wsAutoProvision(); return; }
    GemaSync.bindCollection(MK, POOL, PF, 'id').then(function(){
      // Ungespeicherte lokale Änderung unterwegs? Dann den frischen Stand
      // nicht adoptieren (der Push läuft gleich; nächster Boot pullt neu).
      if(_saveT) { _migrateLegacy(); }
      else { load(); _migrateLegacy(); _wsDeepLink(); render(); }
      // Native Handy-Screen liest den Pool nur beim Render — nach dem
      // asynchronen Pull/der Migration explizit auffrischen, sonst bleibt
      // die Eimer-Liste dort bis zur nächsten Interaktion leer.
      try{ if(window._wsNatRefresh) window._wsNatRefresh(); }catch(e){}
      // Auto-Eimer NACH dem Pool-Pull anlegen (sonst würde ein frisch
      // angelegter Eimer gegen den noch leeren Cache doppelt geprüft).
      _wsAutoProvision();
    }).catch(function(){ _wsAutoProvision(); });
  })();
  // Test-/Cross-Modul-Hooks (Leser in index.html/pm_objekte + Native-Screen)
  window._wsHooks={ pool:_poolRead, canSee:_canSeeBucket, buckets:function(){return buckets;},
    save:save, flush:_saveFlush, migrate:_migrateLegacy, load:function(){load();render();},
    provision:function(){_wsAutoProvision();}, scopeOk:_bucketScopeOk, order:_wsOrder,
    wann:_wsWann, dozKandidaten:_wsDozKandidaten, klassenKandidaten:_wsKlassenKandidaten,
    zuletzt:_wsZuletztModule, fbListe:_wsFbListe,
    templates:{load:function(){return loadTemplates();}, save:function(t){saveTemplates(t);}} };
  initResize('wsResizeSidebar','wsSidebar','left');
  initResize('wsResizeNotes','wsNotesCol','right');
})();
</script>

      {selector:'.ws-org-pills',title:'Organisation filtern',text:'Filtere deine Eimer nach Organisation. «Alle» zeigt sämtliche Eimer, oder wähle eine bestimmte Org um nur deren Projekte zu sehen.',placement:'right',icon:'🏢'},
      {selector:'.ws-search',title:'Schnelle Suche',text:'Suche blitzschnell nach Eimern oder Modulen. Tippe einfach den Namen ein — Ergebnisse erscheinen sofort als Dropdown.',placement:'bottom',icon:'🔍'},

<script>
/* ═══ GEMA Native — iPhone-Ansicht (Screen «Workspace» aus gema-native-screens.html) ═══
   Cockpit mit ECHTEN KPIs aus den Sync-Pools (Stunden Woche, Einsätze heute, Prüfungen
   fällig, offene Rapporte), Zuletzt-verwendet (GemaRecent) + Eimer-Liste. Die kleinen
   Fälligkeits-/Minuten-Helfer sind bewusst lokal dupliziert (Engines leben in den Modulen). */
(function(){
  if(typeof GemaNativeMobil==='undefined') return;
  var NE=GemaNativeMobil.esc, nat=null;
  function pool(k){ try{ if(typeof GemaSync!=='undefined'&&GemaSync.getCached){var a=GemaSync.getCached(k);if(a&&a.length)return a;} var r=localStorage.getItem(k); if(r){var d=JSON.parse(r); if(Array.isArray(d)) return d;} }catch(e){} return []; }
  function user(){ try{ return GemaAuth.getCurrentUser(); }catch(e){ return null; } }
  function heute(){ return new Date().toISOString().slice(0,10); }
  function moStart(){ var d=new Date(); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d.toISOString().slice(0,10); }
  function einMin(e){
    function m(s){ if(!s||!/^\d{1,2}:\d{2}$/.test(s)) return null; var p=s.split(':'); return (+p[0])*60+(+p[1]); }
    var a=m(e.von),b=m(e.bis); if(a==null||b==null) return 0; if(b<=a) b+=1440;
    return Math.max(0,(b-a)-(parseInt(e.pauseMin,10)||0));
  }
  function addMonate(isoS,n){ var d=new Date(isoS+'T12:00:00'); if(isNaN(d)) return null; d.setMonth(d.getMonth()+n); return d; }
  function tageBis(d){ if(!d) return null; return Math.round((d-new Date().setHours(0,0,0,0))/86400000); }
  function kpis(){
    var u=user(); if(!u) return {std:'0,0',eins:0,pruef:0,rap:0};
    var ws=moStart(), we=heute();
    var min=pool('gema_std_pool_v1').filter(function(t){ return !t.typ&&t.userId===u.id&&t.datum>=ws; })
      .reduce(function(s,t){ return s+(t.eintraege||[]).reduce(function(x,e){ return x+einMin(e); },0); },0);
    var eins=pool('gema_einsatz_pool_v1').filter(function(ev){
      if(ev.orgId!==u.orgId||ev.typ==='ferien') return false;
      var d=ev.dauerTage||1, end=new Date(ev.datum+'T12:00:00'); if(isNaN(end)) return false;
      end.setDate(end.getDate()+d-1);
      return ev.datum<=we&&we<=end.toISOString().slice(0,10);
    }).length;
    var pruef=pool('gema_werkzeug').filter(function(t){
      if(t.orgId!==u.orgId) return false;
      var lc=t.lifecycleStatus||'aktiv'; if(lc==='ausgemustert'||lc==='verkauft') return false;
      var due=[];
      if(t.hasService&&t.lastService&&t.serviceInterval) due.push(addMonate(t.lastService,+t.serviceInterval));
      if(t.hasElec&&t.lastElec&&t.elecInterval) due.push(addMonate(t.lastElec,+t.elecInterval));
      if(t.hasLeiter&&t.lastLeiter&&t.leiterInterval) due.push(addMonate(t.lastLeiter,+t.leiterInterval));
      return due.some(function(d){ var td=tageBis(d); return td!==null&&td<=30; });
    }).length;
    var rap=pool('gema_regie_pool_v1').filter(function(r){ return r.orgId===u.orgId&&(r.status==='entwurf'||r.status==='eingereicht'); }).length;
    return {std:(Math.round(min/6)/10).toFixed(1).replace('.',','),eins:eins,pruef:pruef,rap:rap};
  }
  function buckets(){
    // per-Record-Pool (Haupt-IIFE) inkl. Sichtbarkeits-Filter; der alte
    // Geräte-Blob bleibt Fallback für den Boot-Moment vor der Migration.
    try{ if(window._wsHooks) return _wsHooks.pool().filter(_wsHooks.canSee); }catch(e){}
    try{ var r=localStorage.getItem('gema_ws_pool_v1')||localStorage.getItem('gema_workspace_v1'); if(r){ var d=JSON.parse(r); if(Array.isArray(d)) return d; } }catch(e){}
    return [];
  }
  /* Eimer-Navigation KOMPLETT nativ (Feedback 29.07.2026): Übersicht →
     Eimer-Detail (Module öffnen/hinzufügen) → zurück; neuer Eimer via ＋ in
     der Bottom-Navbar. Der frühere Eimer-Tap schaltete via setPref('klassisch')
     DAUERHAFT auf die Desktop-Ansicht um — auf dem iPhone unbenutzbar
     (Coachmark-Schleier über der Desktop-Sidebar). Der Trap ist entfernt;
     ein damit gesetzter Geräte-Cache wird in gema_native_mobil geheilt. */
  var TYP_LBL={project:'Bauprojekt',training:'Übung','private':'Privat'};
  var TYP_IC={project:'🏗',training:'🎓','private':'👤'};
  var CAT_EMO={sanitaer:'💧',gas:'🛢',heizung:'🔥',lueftung:'🌬',brandschutz:'🧯',pm:'📁',hygiene:'🚿',schaden:'💦',spengler:'🏠',infra:'🔧',immo:'🏢'};
  // Status-Werte wie der Desktop-Auto-Status (_wsAutoStatus) sie liefert
  var ST_COL={offen:'#94a3b8',bearbeitung:'#d97706','in Bearbeitung':'#d97706',berechnet:'#16a34a','Anlage gewählt':'#7c3aed','Offerte angefragt':'#2563eb'};
  var ST_LBL={offen:'offen',bearbeitung:'in Bearbeitung'};
  var curId=null;   // geöffneter Eimer (null = Übersicht)

  function katalog(){ try{ return window._wsModulesHook?window._wsModulesHook():null; }catch(e){ return null; } }
  function bucketById(id){ return buckets().find(function(b){ return b&&b.id===id; })||null; }
  function modMeta(modId){
    var k=katalog();
    return (k&&(k.modules||[]).find(function(m){ return m.id===modId; }))||{id:modId,name:modId,cat:''};
  }
  function modStatus(b,m){
    var st=m.status||'offen';
    try{ if(window._wsAutoStatusHook){ var a=window._wsAutoStatusHook(m.mod,b.objektId); if(a) st=a; } }catch(e){}
    return st;
  }
  function chevron(){ return '<svg class="gn-chevron" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>'; }

  function renderUebersicht(root){
    var k=kpis(), u=user();
    var org=''; try{ var o=GemaAuth.getCurrentOrg(); org=(o&&o.name)||''; }catch(e){}
    var recent=[]; try{
      var cur=(GemaRecent.currentKey)||'sys_workspace';
      recent=(GemaRecent.list()||[]).filter(function(r){ return r&&r.key&&r.key!==cur&&r.key!=='sys_workspace'; }).slice(0,6);
    }catch(e){}
    var bks=buckets();
    root.innerHTML=
      /* data-gn-noback: die Übersicht IST die Startseite des Projektleiters —
         eine Zurück-Taste zeigte auf index.html, von wo der Rollen-Redirect
         sofort hierher zurückwirft. Der Benutzeravatar kommt zentral aus
         gema_native_mobil (injectAvatar) in die Toolbar. */
      '<div class="gn-compact" data-gn-compact data-gn-noback><b>Workspace</b></div>'
      +'<div class="gn-screen" data-gn-scroll>'
        +'<div class="gn-toolbar" data-gn-noback>'
          +'<div class="gn-large-title"><h1>Workspace</h1><p>'+NE(org||(u&&u.name)||'')+'</p></div>'
        +'</div>'
        +'<div class="gn-stats">'
          +'<div class="gn-stat"><div class="gn-stat-k">Stunden Woche</div><div class="gn-stat-v">'+NE(k.std)+'</div><div class="gn-stat-sub">erfasst</div></div>'
          +'<div class="gn-stat"><div class="gn-stat-k">Einsätze heute</div><div class="gn-stat-v">'+k.eins+'</div><div class="gn-stat-sub">Termine</div></div>'
          +'<div class="gn-stat"><div class="gn-stat-k">Prüfungen fällig</div><div class="gn-stat-v"'+(k.pruef?' style="color:var(--gn-danger)"':'')+'>'+k.pruef+'</div><div class="gn-stat-sub">Werkzeug ≤ 30 Tage</div></div>'
          +'<div class="gn-stat"><div class="gn-stat-k">Offene Rapporte</div><div class="gn-stat-v">'+k.rap+'</div><div class="gn-stat-sub">Regie</div></div>'
        +'</div>'
        +'<div class="gn-label">Meine Eimer</div><div class="gn-list">'
          +(bks.length?bks.map(function(b){
            return '<div class="gn-row gn-row--lg" data-nat-bucket="'+NE(b.id)+'"><span class="gn-row-ic" style="--gn-row-bg:var(--gn-c-projekt)">'+(TYP_IC[b.type]||'🗂')+'</span>'
              +'<span class="gn-row-body"><span class="gn-row-title">'+NE(b.name||'Eimer')+'</span><span class="gn-row-sub">'+((b.modules||[]).length)+' Module · '+(TYP_LBL[b.type]||'Eimer')+'</span></span>'
              +chevron()+'</div>';
          }).join(''):'<div class="gn-row"><span class="gn-row-body"><span class="gn-row-title" style="color:var(--gn-ink-3);font-weight:500">Noch kein Eimer — unten mit ＋ erstellen</span></span></div>')
        +'</div>'
        +(recent.length?('<div class="gn-label">Zuletzt verwendet</div><div class="gn-list">'
          +recent.map(function(r){
            var lbl=''; try{ lbl=GemaRecent.label(r.key); }catch(e){ lbl=r.key; }
            return '<div class="gn-row" data-nat-href="'+NE(r.key)+'.html"><span class="gn-row-ic" style="--gn-row-bg:var(--gn-c-sanitaer)">📄</span>'
              +'<span class="gn-row-body"><span class="gn-row-title">'+NE(lbl)+'</span></span>'+chevron()+'</div>';
          }).join('')+'</div>'):'')
      +'</div>';
  }

  function renderDetail(root,b){
    var mods=(b.modules||[]);
    // Direkt integriertes Modul (Lieferanten-Dashboard): auf dem Handy als
    // erste Zeile — ein iframe taugt dort nicht, die Seite öffnet normal.
    var direktRow='';
    if(b.direktModul){
      var dm=modMeta(b.direktModul);
      direktRow='<div class="gn-row gn-row--lg" data-nat-href="'+NE((dm.href||dm.id+'.html'))+'"><span class="gn-row-ic" style="--gn-row-bg:var(--gn-c-projekt)">🏭</span>'
        +'<span class="gn-row-body"><span class="gn-row-title">'+NE(dm.name||'Dashboard')+'</span><span class="gn-row-sub">direkt integriert</span></span>'
        +chevron()+'</div>';
    }
    var rows=mods.map(function(m){
      var meta=modMeta(m.mod), st=modStatus(b,m);
      var href=(meta.href||meta.id+'.html')+(b.objektId?'?objekt='+encodeURIComponent(b.objektId):'');
      return '<div class="gn-row" data-nat-href="'+NE(href)+'"><span class="gn-row-ic" style="--gn-row-bg:var(--gn-c-projekt)">'+(CAT_EMO[meta.cat]||'📄')+'</span>'
        +'<span class="gn-row-body"><span class="gn-row-title">'+NE(meta.name)+'</span>'
        +'<span class="gn-row-sub"><span style="display:inline-block;width:8px;height:8px;border-radius:99px;background:'+(ST_COL[st]||ST_COL.offen)+';margin-right:5px;vertical-align:1px"></span>'+NE(ST_LBL[st]||st)+'</span></span>'
        +chevron()+'</div>';
    }).join('');
    rows=direktRow+rows;
    if(!rows) rows='<div class="gn-row"><span class="gn-row-body"><span class="gn-row-title" style="color:var(--gn-ink-3);font-weight:500">Noch keine Module in diesem Eimer</span></span></div>';
    root.innerHTML=
      '<div class="gn-compact" data-gn-compact><b>'+NE(b.name||'Eimer')+'</b></div>'
      +'<div class="gn-screen" data-gn-scroll>'
        +'<button class="gn-back" data-nat-zurueck><svg viewBox="0 0 11 18" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 1.5-8 7.5 8 7.5"/></svg>Eimer</button>'
        +'<div class="gn-toolbar"><div class="gn-large-title"><h1>'+NE(b.name||'Eimer')+'</h1>'
          +'<p>'+(TYP_IC[b.type]||'🗂')+' '+(TYP_LBL[b.type]||'Eimer')+' · '+mods.length+' Module</p></div></div>'
        +'<div class="gn-label">Module</div><div class="gn-list">'+rows+'</div>'
        +'<div class="gn-list" style="margin-top:10px"><button class="gn-select" data-nat-addmod><span class="k">＋ Modul hinzufügen</span><span class="v">›</span></button></div>'
      +'</div>';
  }

  function render(root){
    var b=curId?bucketById(curId):null;
    if(curId&&!b) curId=null;   // Eimer gelöscht/entzogen → zurück zur Übersicht
    if(b) renderDetail(root,b); else renderUebersicht(root);
    wire(root);
  }

  // Delegierte Klicks NUR EINMAL binden (render ersetzt nur innerHTML — ein
  // Listener pro Render würde sich aufsummieren; Muster index-Home-Screen).
  function wire(root){
    if(root.__wsNatWired) return; root.__wsNatWired=true;
    // Die zentral injizierte ‹-Toolbar-Taste (data-gn-back) macht history.back —
    // im Eimer-Detail soll sie stattdessen zur Übersicht führen (capture-Phase
    // läuft VOR dem goBack-Listener von gema_native_mobil). Die Übersicht selbst
    // trägt data-gn-noback und hat gar keine.
    root.addEventListener('click',function(e){
      if(!curId||!e.target.closest||!e.target.closest('[data-gn-back]')) return;
      e.stopPropagation();e.preventDefault();
      curId=null; if(nat) nat.refresh();
    },true);
    root.addEventListener('click',function(e){
      var t=e.target;
      if(t.closest&&t.closest('[data-nat-zurueck]')){ curId=null; if(nat) nat.refresh(); return; }
      var bk=t.closest&&t.closest('[data-nat-bucket]');
      if(bk){ curId=bk.getAttribute('data-nat-bucket'); if(nat) nat.refresh(); return; }
      var am=t.closest&&t.closest('[data-nat-addmod]');
      if(am){ openAddModSheet(); return; }
      var h=t.closest&&t.closest('[data-nat-href]');
      if(h){ location.href=h.getAttribute('data-nat-href'); return; }
    });
  }

  // ＋ Modul hinzufügen — natives Sheet, permission-gefiltert über den EINEN
  // Modul-Katalog der Seite (_wsModulesHook); das Hinzufügen läuft über die
  // echten Funktionen _wsOpen + _wsPickModule (Validierung/Save/Activity).
  function openAddModSheet(){
    var b=bucketById(curId), k=katalog();
    if(!b||!k||!nat) return;
    var existing=(b.modules||[]).map(function(m){ return m.mod; });
    var html='';
    (k.cats||[]).forEach(function(cat){
      var mods=(k.modules||[]).filter(function(m){ return m.cat===cat.id&&(!k.allowed||k.allowed(m)); });
      if(!mods.length) return;
      html+='<div class="gn-label">'+NE(cat.label)+'</div><div class="gn-list">'
        +mods.map(function(m){
          var da=existing.indexOf(m.id)>=0;
          return '<button type="button" class="gn-select"'+(da?' disabled style="opacity:.45"':' data-nat-addpick="'+NE(m.id)+'"')+'>'
            +'<span class="k">'+(CAT_EMO[cat.id]||'📄')+' '+NE(m.name)
            +(da?'<small style="display:block;font-weight:400;color:var(--gn-ink-3)">bereits hinzugefügt</small>':'')
            +'</span><span class="v">'+(da?'✓':'＋')+'</span></button>';
        }).join('')+'</div>';
    });
    var sh=nat.sheet({title:'Modul hinzufügen',html:html});
    if(!sh) return;
    sh.addEventListener('click',function(e){
      var p=e.target.closest&&e.target.closest('[data-nat-addpick]'); if(!p) return;
      var modId=p.getAttribute('data-nat-addpick');
      try{ window._wsOpen(curId); window._wsPickModule(modId); }catch(err){}
      nat.closeSheet();
      setTimeout(function(){ if(nat) nat.refresh(); },450);
    });
  }

  // ＋ Neuer Eimer — Name + Typ im Sheet → echte Erstellung via _wsNatCreate,
  // danach direkt ins Detail des neuen Eimers.
  function openCreateSheet(){
    if(!nat) return;
    var typ={v:'project'};
    var sh=nat.sheet({title:'Neuer Eimer',saveLabel:'Erstellen',
      html:'<div class="gn-field"><label>Bezeichnung *</label><input class="gn-input" id="wsNatNeuName" placeholder="z.B. Neubau Musterstrasse"></div>'
        +'<div class="gn-field"><label>Typ</label><div class="gn-seg-chips">'
        +['project','training','private'].map(function(t,i){
          return '<button type="button" class="gn-chip-sel'+(i===0?' is-active':'')+'" data-nat-typ="'+t+'">'+TYP_IC[t]+' '+TYP_LBL[t]+'</button>';
        }).join('')
        +'</div></div>',
      onSave:function(s){
        var name=((s.querySelector('#wsNatNeuName')||{}).value||'').trim();
        if(!name){ try{ alert('Bitte eine Bezeichnung eingeben.'); }catch(e){} return false; }
        var id=null; try{ id=window._wsNatCreate(name,typ.v); }catch(e){}
        if(id){ curId=id; setTimeout(function(){ if(nat) nat.refresh(); },450); }
      }});
    if(!sh) return;
    sh.addEventListener('click',function(e){
      var c=e.target.closest&&e.target.closest('[data-nat-typ]'); if(!c) return;
      typ.v=c.getAttribute('data-nat-typ');
      var all=sh.querySelectorAll('[data-nat-typ]');
      for(var i=0;i<all.length;i++) all[i].classList.toggle('is-active',all[i]===c);
    });
  }

  nat=GemaNativeMobil.mount({render:render,plus:{title:'Neu',items:function(){
    return [{label:'🪣 Neuer Eimer',hint:'Bauprojekt, Übung oder privat',fn:openCreateSheet}];
  }}});
  // Auffrisch-Hook für die Haupt-IIFE (nach Cloud-Pull/Legacy-Migration)
  window._wsNatRefresh=function(){ try{ if(nat) nat.refresh(); }catch(e){} };
})();
</script>
</body>
</html>
