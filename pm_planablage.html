<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#b45309;--acc-bg:#fffbeb;--acc-bd:#fcd34d;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap;text-decoration:none}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#431407 0%,#b45309 60%,#fbbf24 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.vtabs{display:inline-flex;border:1.5px solid var(--brd2);border-radius:11px;overflow:hidden;background:var(--sur);flex-wrap:wrap}
.vtab{padding:9px 14px;border:none;background:transparent;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;min-height:40px}
.vtab.on{background:var(--acc);color:#fff}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card-bd{padding:13px 15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid;white-space:nowrap}
.b-out{background:var(--sur);color:var(--mut);border-color:var(--brd2)}
.b-grn{background:var(--grn-bg);color:var(--grn);border-color:var(--grn-bd)}
.b-amber{background:var(--amber-bg);color:#b45309;border-color:var(--amber-bd)}
.b-red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.b-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.b-acc{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.itm{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.itm-bd{padding:12px 13px}
.itm-title{font-size:14px;font-weight:900;word-break:break-word}
.itm-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:3px}
.itm-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:11.5px;font-weight:800;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.fld textarea{min-height:74px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld .hint{font-size:10.5px;color:var(--mut);margin-top:3px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:520px){.fld-row{grid-template-columns:1fr}}
.frg-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--brd);font-size:12.5px;flex-wrap:wrap}
.frg-row .who{flex:1;min-width:150px}
.upbar{height:10px;border-radius:99px;background:var(--sur2);border:1px solid var(--brd);overflow:hidden;margin-top:8px}
.upbar i{display:block;height:100%;background:var(--acc);border-radius:99px;width:0%}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px}
.pfoto{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--brd2);cursor:pointer}
/* ── PDF-Viewer (Vollbild) ── */
#pvWrap{position:fixed;inset:0;z-index:1000;background:#3d434d;display:none;flex-direction:column}
#pvWrap.open{display:flex}
.pv-top{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:#1f2530;flex-wrap:wrap}
.pv-name{color:#fff;font-size:12.5px;font-weight:800;max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-btn{min-width:36px;height:36px;padding:0 9px;border-radius:9px;border:1px solid #46506033;background:#2c3442;color:#dfe5ee;font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pv-btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pv-btn:disabled{opacity:.35;cursor:default}
.pv-sep{width:1px;height:24px;background:#ffffff22;margin:0 2px}
.pv-pg{color:#cfd6e0;font-size:12px;font-weight:800;white-space:nowrap}
.pv-farb{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff55;cursor:pointer;padding:0}
.pv-farb.on{border-color:#fff;box-shadow:0 0 0 2px #ffffff44}
.pv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:18px}
#pvStage{position:relative;box-shadow:0 6px 30px rgba(0,0,0,.45);background:#fff;flex-shrink:0}
#pvStage canvas{display:block}
#pvSvg{position:absolute;inset:0;touch-action:none}
#pvSvg .shp{cursor:pointer}
#pvSvg .shp.sel{filter:drop-shadow(0 0 3px rgba(37,99,235,.9))}
#pvSvg text{font-family:'DM Sans',sans-serif;font-weight:700}
.pv-pin{cursor:pointer}
.pv-hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827ee;color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:99px;z-index:5;white-space:nowrap}
/* ── Layer-Panel + Gewerk-Chips ── */
.pv-pop{position:absolute;top:calc(52px + env(safe-area-inset-top));right:10px;z-index:20;background:#fff;border:1px solid var(--brd2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:10px 12px;min-width:230px;max-width:88vw}
.pv-pop h4{margin:0 0 7px;font-size:12px;font-weight:800;color:var(--txt)}
.lyr-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;font-weight:700;color:var(--txt);cursor:pointer;user-select:none}
.lyr-row input{accent-color:var(--acc)}
.lyr-row .cnt{margin-left:auto;font-size:10.5px;color:var(--mut);font-weight:800}
.lyr-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1.5px solid #ffffffaa;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.lyr-sel{font-weight:700;font-size:12px;border:1.5px solid var(--brd2);border-radius:8px;padding:5px 7px;background:var(--sur)}
.lyr-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--brd2);background:var(--sur);font-size:11px;font-weight:800;cursor:pointer;user-select:none}
.lyr-chip.on{border-color:var(--acc);background:#fffbeb}
.frg-chips{display:none;width:100%;gap:5px;flex-wrap:wrap;padding:4px 0 2px}
.frg-chips.show{display:flex}
.pv-lyrsel{height:36px;border-radius:9px;border:1px solid #46506033;background:#2c3442;color:#dfe5ee;font-size:12px;font-weight:800;padding:0 6px;max-width:130px}
@media print{.g-nav,.no-print{display:none!important}}
</style>

<script>
function fixLeadingZero(el){
  let v = el.value.trim();
  if (v === '') return;
  if (/^\./.test(v)) v = '0' + v;
  if (/^-\./.test(v)) v = '-0' + v.slice(1);
  if(!isNaN(parseFloat(v))) el.value = String(parseFloat(v));
}
</script>

<script>
/*ENGINE-START*/
(function(w){
  'use strict';
  function pabNormMail(x){ return String(x || '').trim().toLowerCase(); }
  // Lesen: eigene Org ODER per E-Mail freigegeben (lesen oder bearbeiten)
  function pabKannLesen(dok, user, modulRead){
    if(!dok || !user) return false;
    if(dok.orgId === user.orgId) return !!modulRead;
    var me = pabNormMail((user.profile && user.profile.email) || user.username);
    if(!me) return false;
    return (dok.freigaben || []).some(function(f){ return pabNormMail(f.email) === me; });
  }
  // Bearbeiten (Annotationen, Pendenzen-Verwaltung am Dokument):
  // eigene Org mit write ODER externe Freigabe mit Recht «bearbeiten»
  function pabKannBearbeiten(dok, user, modulWrite){
    if(!dok || !user) return false;
    if(dok.orgId === user.orgId) return !!modulWrite;
    var me = pabNormMail((user.profile && user.profile.email) || user.username);
    if(!me) return false;
    return (dok.freigaben || []).some(function(f){ return pabNormMail(f.email) === me && f.recht === 'bearbeiten'; });
  }
  // Pendenz-Statusmaschine: offen → erledigt (Abarbeiter) → geprueft (Verwalter);
  // zurueckweisen setzt erledigt → offen. Ungueltig = null (Muster GemaBest).
  function pabPendUebergang(status, aktion){
    status = status || 'offen';
    if(aktion === 'erledigen' && status === 'offen') return 'erledigt';
    if(aktion === 'pruefen' && status === 'erledigt') return 'geprueft';
    if(aktion === 'zurueckweisen' && (status === 'erledigt' || status === 'geprueft')) return 'offen';
    return null;
  }
  function pabFmtSize(b){
    b = Number(b) || 0;
    if(b >= 1024*1024*1024) return (b/1024/1024/1024).toFixed(2) + ' GB';
    if(b >= 1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
    if(b >= 1024) return Math.round(b/1024) + ' KB';
    return b + ' B';
  }
  // ── Gewerk-Layer ──────────────────────────────────────────────────
  // Jede Markierung/Pendenz liegt auf einem Gewerk-Layer (Altdaten ohne
  // Feld zählen als «allgemein»). Standardfarben = User-Vorgabe 07/2026:
  // Sanitär grün, Heizung rot, Lüftung blau, Klima violett, Elektro amber,
  // Allgemein grau (+ Spenglerei cyan — eigene GEMA-Rolle/Dachberichte).
  var PAB_LAYER = [
    { id:'sanitaer',   label:'Sanitär',    farbe:'#16a34a' },
    { id:'heizung',    label:'Heizung',    farbe:'#dc2626' },
    { id:'lueftung',   label:'Lüftung',    farbe:'#2563eb' },
    { id:'klima',      label:'Klima',      farbe:'#7c3aed' },
    { id:'elektro',    label:'Elektro',    farbe:'#d97706' },
    { id:'spenglerei', label:'Spenglerei', farbe:'#0891b2' },
    { id:'allgemein',  label:'Allgemein',  farbe:'#475569' }
  ];
  function pabLayerById(id){
    for(var i = 0; i < PAB_LAYER.length; i++) if(PAB_LAYER[i].id === id) return PAB_LAYER[i];
    return PAB_LAYER[PAB_LAYER.length - 1];   // allgemein
  }
  // Freitext/Org-Kategorie/Beteiligten-Rolle → Gewerk-Layer
  function pabGewerkVonText(t){
    t = String(t || '').toLowerCase();
    if(t.indexOf('sanit') >= 0) return 'sanitaer';
    if(t.indexOf('heiz') >= 0 || t.indexOf('hlkk') >= 0) return 'heizung';
    if(t.indexOf('lüft') >= 0 || t.indexOf('lueft') >= 0) return 'lueftung';
    if(t.indexOf('klima') >= 0 || t.indexOf('kält') >= 0 || t.indexOf('kaelt') >= 0) return 'klima';
    if(t.indexOf('elektr') >= 0) return 'elektro';
    if(t.indexOf('speng') >= 0 || t.indexOf('dach') >= 0) return 'spenglerei';
    return 'allgemein';
  }
  // Welche Layer darf der User auf diesem Dokument SEHEN?
  //   null  = alle (Eigentümer-Org — Projekt-Owner sieht immer alles)
  //   Array = nur diese Layer (Externe via Freigabe; Default = eigenes
  //           Gewerk + Allgemein, «alle» bzw. explizite Auswahl möglich;
  //           das eigene Gewerk ist IMMER enthalten — man sieht, was man
  //           selbst zeichnet)
  //   []    = keine (kein Zugriff)
  function pabLayerSicht(dok, user){
    if(!dok || !user) return [];
    if(dok.orgId === user.orgId) return null;
    var me = pabNormMail((user.profile && user.profile.email) || user.username);
    if(!me) return [];
    var f = (dok.freigaben || []).find(function(x){ return pabNormMail(x.email) === me; });
    if(!f) return [];
    var own = f.gewerk || 'allgemein';
    if(f.layers === 'alle') return null;
    if(Array.isArray(f.layers) && f.layers.length){
      var out = f.layers.slice();
      if(out.indexOf(own) < 0) out.push(own);
      return out;
    }
    return own === 'allgemein' ? ['allgemein'] : [own, 'allgemein'];
  }
  // Anzeige-Farbe eines Shapes: frei gewählte Farbe, solange nur EIN Layer
  // aktiv ist — sind mehrere Layer gleichzeitig sichtbar, wechselt die
  // Darstellung auf die Gewerkfarbe (User-Entscheid: Zuordnung erkennbar).
  function pabShapeFarbe(s, mehrereLayer){
    var lay = pabLayerById(s && s.layer);
    if(mehrereLayer) return lay.farbe;
    return (s && s.farbe) || lay.farbe;
  }
  w.pabNormMail = pabNormMail; w.pabKannLesen = pabKannLesen; w.pabKannBearbeiten = pabKannBearbeiten;
  w.pabPendUebergang = pabPendUebergang; w.pabFmtSize = pabFmtSize;
  w.PAB_LAYER = PAB_LAYER; w.pabLayerById = pabLayerById; w.pabGewerkVonText = pabGewerkVonText;
  w.pabLayerSicht = pabLayerSicht; w.pabShapeFarbe = pabShapeFarbe;
})(typeof window !== 'undefined' ? window : globalThis);
/*ENGINE-END*/
</script>

<script>
(function(){
  'use strict';
  var MK = 'planablage';
  var LSD = 'gema_pab_dok_pool_v1',   PFD = 'pabd:';
  var LSA = 'gema_pab_annot_pool_v1', PFA = 'paba:';
  var LSP = 'gema_pab_pend_pool_v1',  PFP = 'pabp:';
  var KATS = [
    {id:'plan',     label:'📐 Pläne'},
    {id:'dokument', label:'📄 Dokumente'},
    {id:'foto',     label:'📷 Fotos'},
    {id:'sonstiges',label:'📦 Sonstiges'}
  ];
  var FARBEN = ['#dc2626','#2563eb','#16a34a','#d97706','#111827'];
  var TAB = 'doks', _cloudLoaded = false, _objFilter = '', _katFilter = '', _pendFilter = 'offen';

  function $id(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function todayIso(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function uid(p){ return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function toast(msg){
    var t = $id('toast'); if(!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
  function fmtDatum(iso){
    if(!iso) return '—';
    var p = String(iso).slice(0,10).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
  }
  function fmtDatumZeit(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return fmtDatum(iso);
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth()+1) + '.' + d.getFullYear() + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function user(){ return (typeof GemaAuth !== 'undefined') ? GemaAuth.getCurrentUser() : null; }
  function myMail(){ var u = user(); return u ? pabNormMail((u.profile && u.profile.email) || u.username) : ''; }
  function canWrite(){ try{ return GemaAuth.can('write', MK); }catch(e){ return false; } }
  function kannLesen(d){ return pabKannLesen(d, user(), true); }
  function kannBearbeiten(d){ return pabKannBearbeiten(d, user(), canWrite()); }

  // ── Pools (PreBoot-Journal-Muster wie if_arbeitskleider) ─────────
  var _preBoot = [], _bootDone = false;
  function cached(key){
    try{ if(typeof GemaSync !== 'undefined' && GemaSync.getCached) return GemaSync.getCached(key) || []; }catch(e){}
    try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; }
  }
  function _preBootApply(){
    _preBoot.forEach(function(op){
      var all = cached(op.k).slice();
      if(op.t === 'save'){
        var i = all.findIndex(function(x){ return x && x.id === op.rec.id; });
        if(i >= 0) all[i] = op.rec; else all.push(op.rec);
      } else {
        all = all.filter(function(x){ return x && x.id !== op.id; });
      }
      try{ localStorage.setItem(op.k, JSON.stringify(all)); }catch(e){}
    });
    _preBoot = [];
  }
  function saveRec(storageKey, prefix, rec){
    var all = cached(storageKey).slice();
    var i = all.findIndex(function(x){ return x && x.id === rec.id; });
    if(i >= 0) all[i] = rec; else all.push(rec);
    try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
    if(!_bootDone) _preBoot.push({ t:'save', k: storageKey, rec: rec });
    if(typeof GemaSync !== 'undefined' && GemaSync.saveRecord){
      GemaSync.saveRecord(MK, prefix + rec.id, rec).catch(function(){});
    }
  }
  function delRec(storageKey, prefix, id){
    var all = cached(storageKey).filter(function(x){ return x && x.id !== id; });
    try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
    if(!_bootDone) _preBoot.push({ t:'del', k: storageKey, id: id });
    if(typeof GemaSync !== 'undefined' && GemaSync.deleteRecord){
      GemaSync.deleteRecord(MK, prefix + id).catch(function(){});
    }
  }
  // Sichtbarkeit: eigene Org ODER an mich freigegeben (E-Mail-Match, cross-org)
  function dokAll(){
    var u = user(); if(!u) return [];
    var arr = cached(LSD).filter(function(d){ return d && kannLesen(d); });
    arr.sort(function(a,b){ return (b.hochgeladenAm||'') < (a.hochgeladenAm||'') ? -1 : 1; });
    return arr;
  }
  function dokById(id){ return cached(LSD).find(function(d){ return d && d.id === id; }) || null; }
  function pendAll(){
    var u = user(); if(!u) return [];
    var me = myMail();
    var arr = cached(LSP).filter(function(p){
      if(!p) return false;
      if(p.orgId === u.orgId) return true;                                       // eigene Org: alles
      if(me && pabNormMail(p.zustaendig && p.zustaendig.email) === me) return true; // mir zugewiesen: immer
      if(p.erstelltVon && p.erstelltVon.userId === u.id) return true;             // von mir erfasst: immer
      var d = p.dokId ? dokById(p.dokId) : null;
      if(!d || !kannLesen(d)) return false;
      // Externe sehen über den Plan-Bezug nur Pendenzen ihrer freigegebenen
      // Layer — der Elektriker sieht die Sanitär-Pendenzen NICHT.
      var sicht = pabLayerSicht(d, u);
      return sicht === null || sicht.indexOf(p.layer || 'allgemein') >= 0;
    });
    arr.sort(function(a,b){ return (b.erstelltAm||'') < (a.erstelltAm||'') ? -1 : 1; });
    return arr;
  }
  function annotFor(dokId){
    return cached(LSA).find(function(a){ return a && a.id === dokId; }) || null;
  }
  function objekte(){
    try{ return (GemaObjekte.getAll && GemaObjekte.getAll()) || []; }catch(e){ return []; }
  }
  function objName(id){
    var o = objekte().find(function(x){ return x.id === id; });
    return o ? (o.name || o.nummer || id) : '';
  }
  function beteiligteFor(objektId){
    var bets = cached('gema_betpool_v1') || [];
    return bets.filter(function(b){ return b && b.objektId === objektId && (b.email || '').trim(); });
  }
  function orgUsers(){
    var u = user(); if(!u) return [];
    return ((GemaAuth.getUsers && GemaAuth.getUsers()) || []).filter(function(x){
      return x && x.orgId === u.orgId && x.active !== false;
    });
  }
  function resolveUserByMail(mail){
    mail = pabNormMail(mail); if(!mail) return null;
    return ((GemaAuth.getUsers && GemaAuth.getUsers()) || []).find(function(x){
      return x && (pabNormMail(x.profile && x.profile.email) === mail || pabNormMail(x.username) === mail);
    }) || null;
  }
  function notify(opts){
    try{ if(typeof GemaNotify !== 'undefined') GemaNotify.push(opts); }catch(e){}
  }

  // ── Änderungslog (rec.log[] — wandert mit dem Record, cross-org sichtbar) ──
  // pabLog mutiert nur; der Aufrufer speichert den Record direkt danach.
  var LOG_MAX = 200;
  function pabLog(rec, aktion, text){
    var me = user();
    rec.log = rec.log || [];
    rec.log.push({ ts: new Date().toISOString(), von: { userId: me ? me.id : '', name: me ? (me.name || '') : '' }, aktion: aktion, text: text || '' });
    if(rec.log.length > LOG_MAX) rec.log = rec.log.slice(-LOG_MAX);
  }
  var LOG_AKT = {
    hochgeladen:{l:'Hochgeladen',b:'b-grn'}, freigabe:{l:'Freigaben',b:'b-acc'},
    kommentar:{l:'Kommentar',b:'b-out'}, markierung:{l:'Markierungen',b:'b-blue'},
    erfasst:{l:'Erfasst',b:'b-grn'}, geaendert:{l:'Geändert',b:'b-out'},
    zugewiesen:{l:'Zugewiesen',b:'b-blue'}, erledigt:{l:'Erledigt',b:'b-amber'},
    geprueft:{l:'Geprüft',b:'b-grn'}, zurueckgewiesen:{l:'Zurückgewiesen',b:'b-red'}
  };
  window.pabLogOpen = function(kind, id){
    var rec = kind === 'pend' ? pendById(id) : dokById(id);
    if(!rec) return;
    if(kind !== 'pend' && !kannLesen(rec)) return;
    var eintraege = (rec.log || []).slice();
    var hatAkt = function(a){ return eintraege.some(function(e){ return e.aktion === a; }); };
    // Legacy-Records ohne Log: bekannte Zeitstempel als virtuelle Einträge
    if(kind === 'pend'){
      if(rec.erstelltAm && !hatAkt('erfasst')) eintraege.push({ ts: rec.erstelltAm, von: rec.erstelltVon || {}, aktion: 'erfasst', text: rec.titel || '' });
      if(rec.erledigtAm && !hatAkt('erledigt')) eintraege.push({ ts: rec.erledigtAm, von: rec.erledigtVon || {}, aktion: 'erledigt', text: '' });
    } else {
      if(rec.hochgeladenAm && !hatAkt('hochgeladen')) eintraege.push({ ts: rec.hochgeladenAm, von: rec.hochgeladenVon || {}, aktion: 'hochgeladen', text: (rec.datei && rec.datei.name) || '' });
    }
    eintraege.sort(function(a, b){ return (a.ts || '') < (b.ts || '') ? 1 : -1; });   // neueste zuerst
    var rows = eintraege.map(function(e){
      var ak = LOG_AKT[e.aktion] || { l: e.aktion || '—', b: 'b-out' };
      return '<div style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--brd)">' +
        '<span class="badge ' + ak.b + '" style="flex-shrink:0;margin-top:1px">' + esc(ak.l) + '</span>' +
        '<div style="flex:1;min-width:0;font-size:12.5px">' +
          (e.text ? '<div style="color:var(--txt)">' + esc(e.text) + '</div>' : '') +
          '<div style="color:var(--mut);font-size:11px">' + esc((e.von && e.von.name) || '—') + ' · ' + fmtDatumZeit(e.ts) + '</div>' +
        '</div></div>';
    }).join('');
    showModal('<div class="modal-hd"><h3>🕘 Verlauf — ' + esc(kind === 'pend' ? (rec.titel || 'Pendenz') : (rec.name || 'Dokument')) + '</h3><button class="modal-x gema-read-ok" onclick="pabCloseModal()">✕</button></div>' +
      '<div class="modal-bd">' + (rows || '<div class="empty">Noch keine Einträge.</div>') + '</div>' +
      '<div class="modal-ft"><button class="btn gema-read-ok" onclick="pabCloseModal()">Schliessen</button></div>');
  };

  // ── Binär-Upload direkt nach Supabase Storage (grosse Dateien, kein Base64) ──
  // Grenzen: Free-Plan max. 50 MB pro Datei (Dashboard-Einstellung), 1 GB Storage
  // total; Pro-Plan 100 GB inkl., per-Datei-Limit im Dashboard erhöhbar.
  function pabUploadBinary(file, path, onProgress){
    return new Promise(function(resolve, reject){
      var base = '', key = '', tok = '';
      try{ base = GemaSync.SB_URL; key = GemaSync.SB_KEY; tok = (GemaSync.getAuthToken && GemaSync.getAuthToken()) || ''; }catch(e){}
      if(!base || !key){ reject(new Error('Cloud nicht konfiguriert')); return; }
      var url = base + '/storage/v1/object/gema-fotos/' + path;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + (tok || key));
      xhr.setRequestHeader('apikey', key);
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      if(xhr.upload && onProgress) xhr.upload.onprogress = function(ev){
        if(ev.lengthComputable) onProgress(Math.round(ev.loaded / ev.total * 100));
      };
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          resolve({ url: base + '/storage/v1/object/public/gema-fotos/' + path, path: path });
        } else if(xhr.status === 413 || /exceeded|maximum allowed size|too large/i.test(xhr.responseText || '')){
          reject(new Error('LIMIT'));
        } else {
          reject(new Error('Upload fehlgeschlagen (HTTP ' + xhr.status + ')'));
        }
      };
      xhr.onerror = function(){ reject(new Error('Upload fehlgeschlagen (Netzwerk)')); };
      xhr.send(file);
    });
  }

  // ── Rendering ─────────────────────────────────────────────────────
  function render(){
    var host = $id('pabContent'); if(!host) return;
    try{ renderToolbar(); }catch(e){}
    try{
      if(TAB === 'pend') renderPendenzen(host);
      else renderDoks(host);
    }catch(e){
      host.innerHTML = '<div class="card"><div class="card-bd" style="color:var(--red);font-size:12.5px">Fehler beim Rendern: ' + esc(e.message) + '</div></div>';
    }
  }
  function renderToolbar(){
    var tabs = $id('pabTabs'); if(!tabs) return;
    var offen = pendAll().filter(function(p){ return (p.status || 'offen') === 'offen'; }).length;
    tabs.innerHTML =
      '<button class="vtab' + (TAB === 'doks' ? ' on' : '') + '" data-tab="doks" onclick="pabTab(\'doks\')">📁 Dokumente</button>' +
      '<button class="vtab' + (TAB === 'pend' ? ' on' : '') + '" data-tab="pend" onclick="pabTab(\'pend\')">📌 Pendenzen' + (offen ? ' <span class="badge b-red" style="margin-left:4px">' + offen + '</span>' : '') + '</button>';
    var up = $id('btnUpload'); if(up) up.style.display = canWrite() ? '' : 'none';
    var pd = $id('btnPend'); if(pd) pd.style.display = canWrite() ? '' : 'none';
    var of = $id('pabObjFilter');
    if(of && of.options.length <= 1){
      objekte().forEach(function(o){
        var opt = document.createElement('option');
        opt.value = o.id; opt.textContent = o.name || o.nummer || o.id;
        of.appendChild(opt);
      });
    }
  }
  window.pabTab = function(t){ TAB = t; render(); };
  window.pabObjChanged = function(v){ _objFilter = v; render(); };

  function spinnerHtml(){
    return '<div class="empty"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 40"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg><div style="margin-top:8px">Daten werden geladen …</div></div>';
  }
  function ladend(){ return !_cloudLoaded && cached(LSD).length === 0 && cached(LSP).length === 0; }

  // ── Dokumente-Tab ────────────────────────────────────────────────
  function renderDoks(host){
    if(ladend()){ host.innerHTML = spinnerHtml(); return; }
    var doks = dokAll().filter(function(d){
      if(_objFilter && d.objektId !== _objFilter) return false;
      if(_katFilter && (d.kategorie || 'plan') !== _katFilter) return false;
      return true;
    });
    var h = '<div class="tb no-print"><div class="chips">' +

    var objs = objekte();

  window.pabUploadStart = function(){
    var me = user(); if(!me || !canWrite()) return;
    var inp = $id('up_file');
    if(!inp || !inp.files || !inp.files[0]){ toast('Bitte Datei wählen'); return; }
    var f = inp.files[0];
    var name = (($id('up_name') || {}).value || '').trim() || f.name;
    var objektId = ($id('up_obj') || {}).value || '';
    var kategorie = ($id('up_kat') || {}).value || 'plan';
    var safe = String(f.name).replace(/[^a-zA-Z0-9._-]+/g, '_').slice(-80);
    var path = 'planablage/' + me.orgId + '/' + Date.now() + '_' + safe;
    var go = $id('up_go'); if(go) go.disabled = true;
    var prog = $id('up_prog'); if(prog) prog.style.display = '';
    pabUploadBinary(f, path, function(pct){
      var i = $id('up_prog_i'); if(i) i.style.width = pct + '%';
      var t = $id('up_prog_t'); if(t) t.textContent = 'Hochladen … ' + pct + '%';
    }).then(function(res){
      var rec = {
        id: uid('pab'), orgId: me.orgId, objektId: objektId, objektName: objektId ? objName(objektId) : '',
        name: name, kategorie: kategorie,
        datei: { name: f.name, url: res.url, size: f.size, mime: f.type || '' },
        freigaben: [], kommentare: [], log: [],
        hochgeladenVon: { userId: me.id, name: me.name || '' }, hochgeladenAm: new Date().toISOString()
      };
      pabLog(rec, 'hochgeladen', f.name + ' (' + pabFmtSize(f.size) + ')');
      saveRec(LSD, PFD, rec);
      pabCloseModal(); toast('Hochgeladen — ' + pabFmtSize(f.size));
      TAB = 'doks'; render();
    }).catch(function(err){
      if(go) go.disabled = false;
      if(prog) prog.style.display = 'none';
      if(err && err.message === 'LIMIT'){
        GemaDialog.alert({ title: 'Datei zu gross', message: 'Die Datei überschreitet das Upload-Limit von Supabase Storage (Standard 50 MB pro Datei im Free-Plan). Das Limit lässt sich im Supabase-Dashboard unter Storage → Settings erhöhen (Pro-Plan bis 50 GB pro Datei).' });
      } else {
        toast((err && err.message) || 'Upload fehlgeschlagen');
      }
    });
  };

  // ── Freigaben (Beteiligte: lesen / bearbeiten, cross-org via E-Mail) ──
  // Zeile im Freigabe-Dialog: Recht + Gewerk (eigener Layer der Person) +
  // Layer-Sicht (Eigenes+Allgemein / Alle / explizite Auswahl per Chips)
  function frgRowHtml(email, name, f, guessGewerk){
    var recht = f ? f.recht : '';
    var gewerk = (f && f.gewerk) || guessGewerk || 'allgemein';
    var sicht = f ? (f.layers === 'alle' ? 'alle' : (Array.isArray(f.layers) && f.layers.length ? 'auswahl' : 'eigene')) : 'eigene';
    var selLayers = (f && Array.isArray(f.layers)) ? f.layers : [];
    return '<div class="frg-row" data-mail="' + esc(email) + '">' +
      '<span class="who"><b>' + esc(name || email) + '</b>' + (name ? '<br><span style="color:var(--mut);font-size:11px">' + esc(email) + '</span>' : '') + '</span>' +
      '<select class="lyr-sel frg-recht" title="Zugriffsrecht"><option value=""' + (!recht ? ' selected' : '') + '>kein Zugriff</option><option value="lesen"' + (recht === 'lesen' ? ' selected' : '') + '>👁 lesen</option><option value="bearbeiten"' + (recht === 'bearbeiten' ? ' selected' : '') + '>✏️ bearbeiten</option></select>' +
      '<select class="lyr-sel frg-gewerk" title="Gewerk der Person (ihr Zeichen-Layer)">' +
        PAB_LAYER.map(function(l){ return '<option value="' + l.id + '"' + (gewerk === l.id ? ' selected' : '') + '>' + esc(l.label) + '</option>'; }).join('') +
      '</select>' +
      '<select class="lyr-sel frg-sicht" title="Welche Layer sieht die Person?" onchange="pabFreiSicht(this)">' +
        '<option value="eigene"' + (sicht === 'eigene' ? ' selected' : '') + '>Eigenes + Allgemein</option>' +
        '<option value="alle"' + (sicht === 'alle' ? ' selected' : '') + '>Alle Layer</option>' +
        '<option value="auswahl"' + (sicht === 'auswahl' ? ' selected' : '') + '>Auswahl …</option>' +
      '</select>' +
      '<div class="frg-chips' + (sicht === 'auswahl' ? ' show' : '') + '">' +
        PAB_LAYER.map(function(l){ return '<span class="lyr-chip' + (selLayers.indexOf(l.id) >= 0 ? ' on' : '') + '" data-lyr="' + l.id + '" onclick="this.classList.toggle(\'on\')"><span class="lyr-dot" style="background:' + l.farbe + '"></span>' + esc(l.label) + '</span>'; }).join('') +
      '</div>' +
      '</div>';
  }
  window.pabFreiSicht = function(sel){
    var row = sel.closest('.frg-row'); if(!row) return;
    var chips = row.querySelector('.frg-chips');
    if(chips) chips.classList.toggle('show', sel.value === 'auswahl');
  };
  window.pabFreigaben = function(id){
    var d = dokById(id); if(!d || !kannBearbeiten(d)) return;
    var bets = d.objektId ? beteiligteFor(d.objektId) : [];
    var frei = d.freigaben || [];
    var seen = {};
    var rows = '';
    bets.forEach(function(b){
      var mail = pabNormMail(b.email); if(!mail || seen[mail]) return; seen[mail] = 1;
      var f = frei.find(function(x){ return pabNormMail(x.email) === mail; });
      rows += frgRowHtml(b.email, (b.name || b.firma || '') + (b.rolle ? ' · ' + b.rolle : ''), f, pabGewerkVonText((b.rolle || '') + ' ' + (b.firma || '')));
    });
    frei.forEach(function(f){
      var mail = pabNormMail(f.email); if(seen[mail]) return; seen[mail] = 1;
      rows += frgRowHtml(f.email, f.name || '', f, f.gewerk);
    });
    showModal('<div class="modal-hd"><h3>🔒 Freigaben — ' + esc(d.name) + '</h3><button class="modal-x gema-read-ok" onclick="pabCloseModal()">✕</button></div>' +
      '<div class="modal-bd">' +
      '<div class="hint" style="margin-bottom:8px">Beteiligte des Projekts + freie E-Mail-Adressen. «lesen» = ansehen &amp; kommentieren, «bearbeiten» = zusätzlich Markierungen &amp; Pendenzen (auf dem eigenen Gewerk-Layer). <b>Layer-Sicht</b>: Standard sieht die Person nur ihr Gewerk + Allgemein — dem Architekten/der Bauleitung gibst du «Alle Layer». Deine eigene Firma sieht immer alles.</div>' +
      '<div id="frgList">' + (rows || '<div class="empty">Keine Beteiligten mit E-Mail am Projekt.</div>') + '</div>' +
      '<div class="fld" style="margin-top:10px"><label>Weitere E-Mail freigeben</label><div style="display:flex;gap:6px"><input type="email" id="frg_mail" placeholder="name@firma.ch" style="flex:1"/><button class="btn sm" onclick="pabFreiAdd()">＋</button></div></div>' +
      '</div>' +
      '<div class="modal-ft"><button class="btn gema-read-ok" onclick="pabCloseModal()">Abbrechen</button>' +
      '<button class="btn pri" onclick="pabFreiSave(\'' + esc(id) + '\')">💾 Speichern</button></div>');
  };
  window.pabFreiAdd = function(){
    var inp = $id('frg_mail'); var mail = pabNormMail(inp && inp.value);
    if(!mail || mail.indexOf('@') < 1){ toast('Gültige E-Mail eingeben'); return; }
    var list = $id('frgList'); if(!list) return;
    if(list.querySelector('[data-mail="' + mail + '"]')){ toast('Bereits in der Liste'); return; }
    var div = document.createElement('div');
    div.innerHTML = frgRowHtml(mail, '', { recht: 'lesen' }, 'allgemein');
    list.appendChild(div.firstChild);
    inp.value = '';
  };
  window.pabFreiSave = function(id){
    var d = dokById(id); if(!d || !kannBearbeiten(d)) return;
    var me = user();
    var vorher = {};
    (d.freigaben || []).forEach(function(f){ vorher[pabNormMail(f.email)] = f.recht; });
    var vorherJson = JSON.stringify(d.freigaben || []);
    var neu = [];
    document.querySelectorAll('#frgList .frg-row').forEach(function(row){
      var mail = row.getAttribute('data-mail');
      var recht = (row.querySelector('.frg-recht') || {}).value || '';
      if(!recht) return;
      var f = { email: mail, recht: recht, gewerk: (row.querySelector('.frg-gewerk') || {}).value || 'allgemein' };
      var sicht = (row.querySelector('.frg-sicht') || {}).value || 'eigene';
      if(sicht === 'alle') f.layers = 'alle';
      else if(sicht === 'auswahl'){
        f.layers = [].slice.call(row.querySelectorAll('.lyr-chip.on')).map(function(c){ return c.getAttribute('data-lyr'); });
        if(!f.layers.length) delete f.layers;   // leere Auswahl = Default (eigenes + Allgemein)
      }
      neu.push(f);
    });
    // Änderungslog: wer kam dazu, wessen Recht änderte, wem wurde entzogen
    var plus = [], minus = [], chg = [];
    neu.forEach(function(f){
      var m = pabNormMail(f.email), v = vorher[m];
      if(v === undefined) plus.push(f.email + ' (' + f.recht + ')');
      else if(v !== f.recht) chg.push(f.email + ' → ' + f.recht);
    });
    Object.keys(vorher).forEach(function(m){
      if(!neu.some(function(f){ return pabNormMail(f.email) === m; })) minus.push(m);
    });
    var teile = [];
    if(plus.length) teile.push('freigegeben: ' + plus.join(', '));
    if(chg.length) teile.push('Recht geändert: ' + chg.join(', '));
    if(minus.length) teile.push('entzogen: ' + minus.join(', '));
    if(!teile.length && vorherJson !== JSON.stringify(neu)) teile.push('Gewerk / Layer-Sicht angepasst');
    if(teile.length) pabLog(d, 'freigabe', teile.join(' · '));
    d.freigaben = neu;
    saveRec(LSD, PFD, d);
    // Notify NEU freigegebene (aufgelöster GEMA-User)
    neu.forEach(function(f){
      if(vorher[pabNormMail(f.email)]) return;
      var zu = resolveUserByMail(f.email);
      if(zu && me && zu.id !== me.id){
        notify({ eventKey: 'plan_dokument_freigegeben', empfaengerUserId: zu.id, modul: MK, typ: 'info',
          titel: 'Plandialog: Dokument freigegeben',
          text: '«' + d.name + '»' + (d.objektName ? ' — ' + d.objektName : '') + ' (' + (f.recht === 'bearbeiten' ? 'bearbeiten' : 'lesen') + ')',
          link: 'pm_planablage.html?d=' + d.id });
      }
    });
    pabCloseModal(); toast('Freigaben gespeichert'); render();
  };

  window.pabPendFoto = function(inp){
    if(!inp.files || !inp.files[0]) return;
    var f = inp.files[0];
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1600, w = img.width, h = img.height;
        if(Math.max(w, h) > max){ var sc = max / Math.max(w, h); w = Math.round(w*sc); h = Math.round(h*sc); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.82);
        var eintrag = { dataUrl: dataUrl };
        _pendFotos.push(eintrag);
        var host = $id('pd_fotos');
        if(host) host.innerHTML += '<img class="pfoto" src="' + dataUrl + '"/>';
        if(typeof GemaStorage !== 'undefined' && GemaStorage.uploadDataUrl){
          GemaStorage.uploadDataUrl(dataUrl, 'planablage/' + ((user() || {}).orgId || 'x') + '/pendenzen')
            .then(function(res){ eintrag.url = res.url; delete eintrag.dataUrl; })
            .catch(function(){});
        }
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
    inp.value = '';
  };

  window.pabPendAktion = function(id, aktion){

    var neu = pabPendUebergang(p.status, aktion);
    if(!neu) return;
    var frage = aktion === 'erledigen' ? 'Pendenz als erledigt melden?' : (aktion === 'pruefen' ? 'Erledigung prüfen und abschliessen?' : null);
    var doIt = function(kommentar){
      p.status = neu;
      if(aktion === 'erledigen'){ p.erledigtAm = new Date().toISOString(); p.erledigtVon = { userId: me.id, name: me.name || '' }; }
      if(kommentar){ p.kommentare = p.kommentare || []; p.kommentare.push({ von: { userId: me.id, name: me.name || '' }, text: kommentar, am: new Date().toISOString() }); }

      saveRec(LSP, PFP, p);

          titel: 'Pendenz erledigt', text: p.titel + ' — ' + (me.name || ''), link: 'pm_planablage.html?p=' + p.id });
      }
      toast(aktion === 'erledigen' ? 'Als erledigt gemeldet' : (aktion === 'pruefen' ? 'Geprüft' : 'Zurückgewiesen'));
      render();

  // Eigenes Gewerk des eingeloggten Users (Org-Kategorie → Layer)

      var org = orgs.find(function(o){ return o.id === u.orgId; }) || {};

  window.pabViewerOpen = function(dokId, seite, hiPendId){
    var d = dokById(dokId); if(!d || !kannLesen(d)) return;

    PV.hideAll = false;
    PV.chg = {};                                           // geänderte Seiten (fürs Änderungslog)
    PV.layerVis = {};                                      // eigene Anzeige: alles an
    erlaubteLayer().forEach(function(id){ PV.layerVis[id] = true; });
    var frei = meineFreigabe(d);
    PV.drawLayer = PV.extern ? ((frei && frei.gewerk) || 'allgemein') : myGewerk();

    var laySel;
    if(PV.extern){
      laySel = '<span class="pv-pg" title="Dein Zeichen-Layer (aus der Freigabe)" style="display:inline-flex;align-items:center;gap:5px"><span class="lyr-dot" style="background:' + lay.farbe + '"></span>' + esc(lay.label) + '</span>';
    } else {
      laySel = '<select class="pv-lyrsel" id="pvLayerSel" title="Zeichen-Layer (Gewerk)" onchange="pabDrawLayer(this.value)">' +
        PAB_LAYER.map(function(l){ return '<option value="' + l.id + '"' + (PV.drawLayer === l.id ? ' selected' : '') + '>' + esc(l.label) + '</option>'; }).join('') + '</select>';
    }
    host.innerHTML = TOOLS.map(function(t){
      return '<button class="pv-btn' + (PV.tool === t.id ? ' on' : '') + '" title="' + t.t + '" onclick="pabTool(\'' + t.id + '\')">' + t.ic + '</button>';
    }).join('') + ' ' + laySel;
    $id('pvFarben').innerHTML = FARBEN.map(function(f){
      return '<button class="pv-farb' + (PV.farbe === f ? ' on' : '') + '" style="background:' + f + '" onclick="pabFarbe(\'' + f + '\')" title="Farbe"></button>';
    }).join('');
  }
  window.pabTool = function(t){ PV.tool = t; PV.sel = null; renderTools(); drawShapes(); updDel(); };
  window.pabFarbe = function(f){ PV.farbe = f; renderTools(); };
  window.pabDrawLayer = function(v){ PV.drawLayer = v || 'allgemein'; renderTools(); };
  window.pabViewerLog = function(){ if(PV.dok) pabLogOpen('dok', PV.dok.id); };
  // 👁 Master-Toggle: sauberer Plan ohne Markierungen/Pins (für ALLE Rollen)
  window.pabEye = function(){
    PV.hideAll = !PV.hideAll;
    renderTools(); drawShapes(); renderLayerPanel();
  };
  // 🗂 Layer-Panel: pro erlaubtem Layer ein-/ausblenden
  window.pabLayerPanel = function(){
    var p = $id('pvLayerPanel'); if(!p) return;
    if(p.style.display !== 'none'){ p.style.display = 'none'; return; }
    p.style.display = '';        // ERST sichtbar schalten — renderLayerPanel
    renderLayerPanel();          // bricht bei display:none bewusst ab
  };
  function renderLayerPanel(){
    var p = $id('pvLayerPanel'); if(!p || p.style.display === 'none') return;
    var arr = seiteShapes();
    var pins = pendAll().filter(function(x){ return x.dokId === (PV.dok && PV.dok.id) && (x.seite || 1) === PV.seite && x.pin; });
    var ids = erlaubteLayer();
    var rows = ids.map(function(id){
      var l = pabLayerById(id);
      var n = arr.filter(function(s){ return (s.layer || 'allgemein') === id; }).length +
              pins.filter(function(x){ return (x.layer || 'allgemein') === id; }).length;
      return '<label class="lyr-row"><input type="checkbox"' + (PV.layerVis[id] ? ' checked' : '') + (PV.hideAll ? ' disabled' : '') + ' onchange="pabLayerToggle(\'' + id + '\',this.checked)"/>' +
        '<span class="lyr-dot" style="background:' + l.farbe + '"></span>' + esc(l.label) +
        '<span class="cnt">' + (n || '') + '</span></label>';
    }).join('');
    p.innerHTML = '<h4>🗂 Layer (diese Seite)</h4>' + rows +
      '<label class="lyr-row" style="border-top:1px dashed var(--brd);margin-top:5px;padding-top:8px"><input type="checkbox"' + (PV.hideAll ? ' checked' : '') + ' onchange="pabEye()"/>👁 Alles ausblenden (sauberer Plan)</label>' +
      (PV.sicht !== null ? '<div style="font-size:10.5px;color:var(--mut);margin-top:5px">Du siehst die für dich freigegebenen Layer.</div>' : '');
  }
  window.pabLayerToggle = function(id, on){
    PV.layerVis[id] = !!on;
    drawShapes(); renderLayerPanel();
  };

  function renderSeite(){
    PV.pdf.getPage(PV.seite).then(function(page){
      var body = $id('pvBody');
      var vw1 = page.getViewport({ scale: 1 });
      if(!PV.scale) PV.scale = Math.max(0.4, Math.min(2.5, (body.clientWidth - 40) / vw1.width));
      var vp = page.getViewport({ scale: PV.scale });
      var c = $id('pvCanvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      sizeSvg(c.width, c.height);
      $id('pvPg').textContent = 'Seite ' + PV.seite + ' / ' + PV.seiten;
      return page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }).then(function(){ drawShapes(); renderLayerPanel(); });
  }
  function sizeSvg(w, h){
    var svg = $id('pvSvg');
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var st = $id('pvStage'); st.style.width = w + 'px'; st.style.height = h + 'px';
  }
  function seiteShapes(){
    var k = String(PV.seite);
    if(!PV.shapes[k]) PV.shapes[k] = [];
    return PV.shapes[k];
  }
  function W(){ return $id('pvCanvas').width; }
  function H(){ return $id('pvCanvas').height; }
  // Shapes sind auf die Seitengrösse normiert (0..1) — zoom-unabhängig
  function nx(px){ return px / W(); }
  function ny(px){ return px / H(); }
  function X(n){ return n * W(); }
  function Y(n){ return n * H(); }

  var _pvMulti = false;   // >1 Layer sichtbar → Darstellung in Gewerkfarbe
  function shapeSvg(s, idx){
    var col = pabShapeFarbe(s, _pvMulti);
    var sw = Math.max(1.6, W() * 0.0022);
    var selCls = (PV.sel === s.id) ? ' sel' : '';
    var attrs = ' class="shp' + selCls + '" data-sid="' + s.id + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"';
    if(s.typ === 'rect') return '<rect' + attrs + ' x="' + X(Math.min(s.x1,s.x2)) + '" y="' + Y(Math.min(s.y1,s.y2)) + '" width="' + Math.abs(X(s.x2)-X(s.x1)) + '" height="' + Math.abs(Y(s.y2)-Y(s.y1)) + '" rx="3"/>';
    if(s.typ === 'kreis') return '<ellipse' + attrs + ' cx="' + (X(s.x1)+X(s.x2))/2 + '" cy="' + (Y(s.y1)+Y(s.y2))/2 + '" rx="' + Math.abs(X(s.x2)-X(s.x1))/2 + '" ry="' + Math.abs(Y(s.y2)-Y(s.y1))/2 + '"/>';
    if(s.typ === 'pfeil') return pfeilSvg(X(s.x1), Y(s.y1), X(s.x2), Y(s.y2), col, sw, s.id, selCls);
    if(s.typ === 'frei'){
      var pts = (s.pts || []).map(function(p){ return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ');
      return '<polyline' + attrs + ' points="' + pts + '" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    if(s.typ === 'text'){
      var fs = Math.max(11, W() * 0.016);
      return '<text class="shp' + selCls + '" data-sid="' + s.id + '" x="' + X(s.x1) + '" y="' + Y(s.y1) + '" fill="' + col + '" font-size="' + fs + '" paint-order="stroke" stroke="#ffffff" stroke-width="' + (fs*0.18) + '">' + esc(s.text || '') + '</text>';
    }
    if(s.typ === 'callout'){
      var fs2 = Math.max(11, W() * 0.015);
      var pad = fs2 * 0.5;
      var tw = (s.text || '').length * fs2 * 0.56 + pad * 2;
      var th = fs2 + pad * 1.6;
      var bx = X(s.x1), by = Y(s.y1);
      var g = '<g class="shp' + selCls + '" data-sid="' + s.id + '">';
      g += pfeilSvg(bx + tw / 2, by + th, X(s.x2), Y(s.y2), col, sw, s.id, '', true);
      g += '<rect x="' + bx + '" y="' + by + '" width="' + tw + '" height="' + th + '" rx="4" fill="#ffffff" stroke="' + col + '" stroke-width="' + sw + '"/>';
      g += '<text x="' + (bx + pad) + '" y="' + (by + th - pad * 0.9) + '" fill="' + col + '" font-size="' + fs2 + '">' + esc(s.text || '') + '</text>';
      return g + '</g>';
    }
    return '';
  }
  function pfeilSvg(x1, y1, x2, y2, col, sw, sid, selCls, bare){
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var L = Math.max(8, sw * 4.5);
    var a1x = x2 - L * Math.cos(ang - 0.42), a1y = y2 - L * Math.sin(ang - 0.42);
    var a2x = x2 - L * Math.cos(ang + 0.42), a2y = y2 - L * Math.sin(ang + 0.42);
    var core = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + sw + '"/>' +
      '<path d="M' + x2 + ' ' + y2 + ' L' + a1x + ' ' + a1y + ' L' + a2x + ' ' + a2y + ' Z" fill="' + col + '"/>';
    if(bare) return core;
    return '<g class="shp' + (selCls || '') + '" data-sid="' + sid + '">' + core + '</g>';
  }
  function pinsSvg(){
    var pins = pendAll().filter(function(p){ return p.dokId === (PV.dok && PV.dok.id) && (p.seite || 1) === PV.seite && p.pin && layerSichtbar(p.layer); });
    return pins.map(function(p, i){
      var col = (p.status || 'offen') === 'offen' ? '#dc2626' : (p.status === 'erledigt' ? '#d97706' : '#16a34a');
      var r = Math.max(10, W() * 0.012);
      var cx = X(p.pin.x), cy = Y(p.pin.y);
      var hi = PV.hiPend === p.id ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r*1.9) + '" fill="none" stroke="' + col + '" stroke-width="2.5" opacity="0.55"/>' : '';
      return '<g class="pv-pin" data-pid="' + p.id + '">' + hi +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col + '" stroke="#fff" stroke-width="2"/>' +
        '<text x="' + cx + '" y="' + (cy + r*0.38) + '" fill="#fff" font-size="' + (r*1.05) + '" text-anchor="middle" font-weight="800">' + (i+1) + '</text></g>';
    }).join('');
  }
  function drawShapes(){
    var svg = $id('pvSvg');
    // Render-Filter: Layer-Sichtbarkeit (Freigabe-Grenze + eigenes Ausblenden
    // + 👁-Master-Toggle). PV.shapes bleibt IMMER vollständig (siehe Open).
    var arr = seiteShapes().filter(function(s){ return layerSichtbar(s.layer); });
    var distinct = {};
    arr.forEach(function(s){ distinct[s.layer || 'allgemein'] = 1; });
    _pvMulti = Object.keys(distinct).length > 1;
    svg.innerHTML = arr.map(shapeSvg).join('') + pinsSvg() + (PV.temp || '');
  }
  function updDel(){
    var b = $id('pvDel'); if(!b) return;
    b.disabled = !PV.sel;
  }
  window.pabUndo = function(){
    if(!PV.canEdit) return;
    var me = user(); var arr = seiteShapes();
    for(var i = arr.length - 1; i >= 0; i--){
      if(arr[i].von && arr[i].von.userId === (me && me.id)){ arr.splice(i, 1); PV.dirty = true; break; }
    }
    PV.sel = null; drawShapes(); updDel(); queueAnnot();
  };
  window.pabDelSel = function(){
    if(!PV.canEdit || !PV.sel) return;
    var arr = seiteShapes();
    var i = arr.findIndex(function(s){ return s.id === PV.sel; });
    if(i >= 0){
      if(PV.extern){   // Hard-Guard: Externe löschen nur eigene Shapes
        var me = user();
        if(!(arr[i].von && me && arr[i].von.userId === me.id)){ PV.sel = null; updDel(); return; }
      }
      arr.splice(i, 1); PV.dirty = true;
    }
    PV.sel = null; drawShapes(); updDel(); queueAnnot();
  };
  var _annotT = null;
  function queueAnnot(){
    var st = $id('pvSaveState'); if(st) st.textContent = '⏳';
    if(PV.dirty && PV.chg) PV.chg[PV.seite] = 1;   // fürs Änderungslog beim Schliessen
    renderLayerPanel();
    clearTimeout(_annotT);
    _annotT = setTimeout(flushAnnot, 900);
  }
  function flushAnnot(){
    clearTimeout(_annotT); _annotT = null;
    if(!PV.dok || !PV.dirty) return;
    PV.dirty = false;
    var rec = { id: PV.dok.id, orgId: PV.dok.orgId, seiten: PV.shapes, aktualisiertAm: new Date().toISOString() };
    saveRec(LSA, PFA, rec);
    var st = $id('pvSaveState'); if(st){ st.textContent = '✓ gespeichert'; setTimeout(function(){ if(st.textContent === '✓ gespeichert') st.textContent = ''; }, 1800); }
  }
  // Pointer-Interaktion auf dem SVG-Overlay
  function svgPos(ev){
    var r = $id('pvSvg').getBoundingClientRect();
    var x = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX) - r.left;
    var y = (ev.touches && ev.touches[0] ? ev.touches[0].clientY : ev.clientY) - r.top;
    return { x: Math.max(0, Math.min(1, nx(x))), y: Math.max(0, Math.min(1, ny(y))) };
  }
  function neuShape(base){
    var me = user();
    return Object.assign({ id: uid('shp'), farbe: PV.farbe, layer: PV.drawLayer || 'allgemein', von: { userId: me ? me.id : '', name: me ? me.name : '' }, am: new Date().toISOString() }, base);
  }
  var _down = null;
  function onDown(ev){
    if(!PV.dok) return;
    var t = ev.target.closest ? ev.target.closest('.pv-pin') : null;
    if(t){ pabPinKlick(t.getAttribute('data-pid')); return; }
    if(PV.tool === 'hand' || !PV.canEdit){
      var sh = ev.target.closest ? ev.target.closest('.shp') : null;
      PV.sel = null;
      if(sh && PV.canEdit){
        var sid = sh.getAttribute('data-sid');
        if(PV.extern){
          // Externe (Freigabe «bearbeiten») löschen nur EIGENE Markierungen
          var meS = user();
          var sOwn = seiteShapes().find(function(x){ return x.id === sid; });
          if(sOwn && sOwn.von && meS && sOwn.von.userId === meS.id) PV.sel = sid;
        } else {
          PV.sel = sid;
        }
      }
      drawShapes(); updDel();
      return;
    }
    ev.preventDefault();
    var p = svgPos(ev);
    if(PV.tool === 'pin'){
      var preset = { dokId: PV.dok.id, seite: PV.seite, pin: { x: p.x, y: p.y }, objektId: PV.dok.objektId, layer: PV.drawLayer };
      PV.tool = 'hand'; renderTools();
      pabPendNeu('', preset);
      return;
    }
    if(PV.tool === 'text'){
      GemaDialog.prompt({ title: 'Text einfügen', placeholder: 'z.B. Achtung Leitungsführung' }).then(function(txt){
        if(txt === null) return; txt = (txt || '').trim(); if(!txt) return;
        seiteShapes().push(neuShape({ typ: 'text', x1: p.x, y1: p.y, text: txt }));
        PV.dirty = true; drawShapes(); queueAnnot();
      });
      return;
    }
    if(PV.tool === 'callout'){
      GemaDialog.prompt({ title: 'Textbox mit Pfeil', message: 'Text der Box — der Pfeil zeigt auf die geklickte Stelle.', placeholder: 'z.B. Durchbruch hier' }).then(function(txt){
        if(txt === null) return; txt = (txt || '').trim(); if(!txt) return;
        seiteShapes().push(neuShape({ typ: 'callout', x1: Math.max(0, p.x - 0.14), y1: Math.max(0, p.y - 0.1), x2: p.x, y2: p.y, text: txt }));
        PV.dirty = true; drawShapes(); queueAnnot();
      });
      return;
    }
    _down = p;
    if(PV.tool === 'frei') PV.pts = [[p.x, p.y]];
  }
  function onMove(ev){
    if(!_down || !PV.canEdit) return;
    ev.preventDefault();
    var p = svgPos(ev);
    var sw = Math.max(1.6, W() * 0.0022);
    if(PV.tool === 'frei'){
      var last = PV.pts[PV.pts.length - 1];
      if(Math.abs(p.x - last[0]) + Math.abs(p.y - last[1]) > 0.004) PV.pts.push([p.x, p.y]);
      PV.temp = '<polyline fill="none" stroke="' + PV.farbe + '" stroke-width="' + sw + '" stroke-linecap="round" points="' + PV.pts.map(function(q){ return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') + '"/>';
    } else if(PV.tool === 'rect'){
      PV.temp = '<rect fill="none" stroke="' + PV.farbe + '" stroke-width="' + sw + '" x="' + X(Math.min(_down.x,p.x)) + '" y="' + Y(Math.min(_down.y,p.y)) + '" width="' + Math.abs(X(p.x)-X(_down.x)) + '" height="' + Math.abs(Y(p.y)-Y(_down.y)) + '"/>';
    } else if(PV.tool === 'kreis'){
      PV.temp = '<ellipse fill="none" stroke="' + PV.farbe + '" stroke-width="' + sw + '" cx="' + (X(_down.x)+X(p.x))/2 + '" cy="' + (Y(_down.y)+Y(p.y))/2 + '" rx="' + Math.abs(X(p.x)-X(_down.x))/2 + '" ry="' + Math.abs(Y(p.y)-Y(_down.y))/2 + '"/>';
    } else if(PV.tool === 'pfeil'){
      PV.temp = pfeilSvg(X(_down.x), Y(_down.y), X(p.x), Y(p.y), PV.farbe, sw, 'tmp', '', true);
    }
    drawShapes();
  }
  function onUp(ev){
    if(!_down || !PV.canEdit) return;
    var p = svgPos(ev);
    var dist = Math.abs(p.x - _down.x) + Math.abs(p.y - _down.y);
    if(PV.tool === 'frei' && PV.pts && PV.pts.length > 2){
      seiteShapes().push(neuShape({ typ: 'frei', pts: PV.pts }));
      PV.dirty = true;
    } else if((PV.tool === 'rect' || PV.tool === 'kreis' || PV.tool === 'pfeil') && dist > 0.008){
      seiteShapes().push(neuShape({ typ: PV.tool, x1: _down.x, y1: _down.y, x2: p.x, y2: p.y }));
      PV.dirty = true;
    }
    _down = null; PV.pts = null; PV.temp = null;
    drawShapes(); queueAnnot();
  }
  window.pabPinKlick = function(pid){
    var p = pendById(pid); if(!p) return;
    var st = PSTAT[p.status || 'offen'];
    var msg = (p.beschrieb ? p.beschrieb + '\n\n' : '') + 'Status: ' + st.l +
      (p.zustaendig && (p.zustaendig.name || p.zustaendig.email) ? '\nZuständig: ' + (p.zustaendig.name || p.zustaendig.email) : '');
    if((p.status || 'offen') === 'offen'){
      GemaDialog.confirm({ title: '📌 ' + p.titel, message: msg + '\n\nAls erledigt melden?', confirmLabel: '✓ Erledigt' }).then(function(ok){
        if(!ok) return;
        var me = user();
        p.status = 'erledigt'; p.erledigtAm = new Date().toISOString(); p.erledigtVon = { userId: me.id, name: me.name || '' };
        pabLog(p, 'erledigt', 'via Plan-Pin');
        saveRec(LSP, PFP, p);
        if(p.erstelltVon && p.erstelltVon.userId && p.erstelltVon.userId !== me.id){
          notify({ eventKey: 'plan_pendenz_erledigt', empfaengerUserId: p.erstelltVon.userId, modul: MK, typ: 'erfolg',
            titel: 'Pendenz erledigt', text: p.titel, link: 'pm_planablage.html?p=' + p.id });
        }
        toast('Als erledigt gemeldet'); drawShapes();
      });
    } else {
      GemaDialog.alert({ title: '📌 ' + p.titel, message: msg });
    }
  };

  // ── Modal-Infrastruktur ───────────────────────────────────────────
  function showModal(inner){
    var host = $id('pabModalHost'); if(!host) return;
    host.innerHTML = '<div class="modal-bg open" onclick="if(event.target===this)pabCloseModal()"><div class="modal">' + inner + '</div></div>';
    if(typeof GemaScroll !== 'undefined' && GemaScroll.lock) try{ GemaScroll.lock(); }catch(e){}
  }
  window.pabCloseModal = function(){
    var host = $id('pabModalHost'); if(host) host.innerHTML = '';
    if(typeof GemaScroll !== 'undefined' && GemaScroll.unlock) try{ GemaScroll.unlock(); }catch(e){}
  };
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if($id('pabModalHost') && $id('pabModalHost').firstChild){ window.pabCloseModal(); return; }
    if($id('pvWrap') && $id('pvWrap').classList.contains('open')) window.pabViewerClose();
  });

  // ── Boot ──────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function(){
    if(!$id('pabContent') || !$id('pabTabs')) return;   // Kein-Zugriff-Body
    var u = user(); if(!u) return;
    var svg = $id('pvSvg');
    if(svg){
      svg.addEventListener('pointerdown', onDown);
      svg.addEventListener('pointermove', onMove);
      svg.addEventListener('pointerup', onUp);
      svg.addEventListener('pointerleave', onUp);
    }
    render();
    var timeout = new Promise(function(r){ setTimeout(r, 6000); });
    if(typeof GemaSync !== 'undefined' && GemaSync.bindCollection){
      var bindP = Promise.all([
        GemaSync.bindCollection(MK, LSD, PFD, 'id'),
        GemaSync.bindCollection(MK, LSA, PFA, 'id'),
        GemaSync.bindCollection(MK, LSP, PFP, 'id')
      ]);
      Promise.race([bindP, timeout]).then(function(){ _cloudLoaded = true; render(); });
      bindP.then(function(){ _bootDone = true; _preBootApply(); _cloudLoaded = true; render(); deepLink(); })
           .catch(function(){ _bootDone = true; _preBootApply(); _cloudLoaded = true; render(); });
    } else {
      _bootDone = true; _cloudLoaded = true; render();
    }
    if(typeof GemaObjekte !== 'undefined' && GemaObjekte.ready){
      GemaObjekte.ready.then(function(){ render(); }).catch(function(){});
    }
    setTimeout(deepLink, 800);
  });
  var _dlDone = false;
  function deepLink(){
    if(_dlDone) return;
    try{
      var qp = new URLSearchParams(location.search);
      var d = qp.get('d'), p = qp.get('p');
      if(d && dokById(d)){ _dlDone = true; pabViewerOpen(d); }
      else if(p && pendById(p)){
        _dlDone = true; TAB = 'pend'; _pendFilter = 'alle'; render();
        var el = $id('pend_' + p);
        if(el){ el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.boxShadow = '0 0 0 3px var(--acc)'; }
      }
    }catch(e){}
  }

  // Test-Hooks
  window._pabHooks = {
    render: render, dokAll: dokAll, pendAll: pendAll, dokById: dokById, pendById: pendById,
    kannLesen: kannLesen, kannBearbeiten: kannBearbeiten, canWrite: canWrite,
    saveDok: function(rec){ saveRec(LSD, PFD, rec); }, savePend: function(rec){ saveRec(LSP, PFP, rec); },
    annotFor: annotFor, seiteShapes: function(){ return seiteShapes(); }, PV: PV,
    setTab: function(t){ TAB = t; render(); }, cloudLoaded: function(){ return _cloudLoaded; },
    myGewerk: myGewerk, layerSichtbar: layerSichtbar, multi: function(){ return _pvMulti; },
    saveAnnot: function(rec){ saveRec(LSA, PFA, rec); }
  };
})();
</script>
<script src="gema_scroll.js"></script>
<script src="gema_mobile_menu.js"></script>
