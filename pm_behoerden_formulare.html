<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#0369a1;--acc-bg:#eff6ff;--acc-bd:#bae6fd;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a 0%,#0369a1 60%,#0ea5e9 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.srch{flex:1;min-width:160px;padding:9px 13px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.srch:focus{border-color:var(--acc)}
.sel{padding:9px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13px;background:var(--sur);outline:none;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px;cursor:pointer}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
.fcard{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.12s}
.fcard:hover{border-color:var(--acc-bd)}
.fcard-bar{height:4px}
.fcard-bd{padding:11px 13px}
.fcard-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fcard-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:4px}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prog{height:7px;border-radius:999px;background:var(--brd);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--acc)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:920px}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer;flex-shrink:0}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11.5px;font-weight:800;color:var(--txt2);margin-bottom:4px}
.fc{width:100%;padding:9px 11px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;background:var(--sur);outline:none}
.fc:focus{border-color:var(--acc)}
.hintbox{background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--txt2);line-height:1.5;margin-bottom:10px}
/* detail */
#detail{position:fixed;inset:0;z-index:700;background:var(--bg);display:none;flex-direction:column}
#detail.open{display:flex}
.dt-hd{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.dt-hd .tt{font-size:15px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-tools{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0}
.dt-main{flex:1;overflow-y:auto;padding:14px}
.dt-in{max-width:900px;margin:0 auto}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;border:1.5px solid var(--brd);border-radius:11px;padding:9px 11px;margin-bottom:8px;background:var(--sur)}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.frow .flab{font-size:12.5px;font-weight:800;grid-column:1/-1}
.frow .fsub{font-size:10.5px;color:var(--mut);font-weight:600}
.frow.man .flab::after{content:'✏ manuell';font-size:9px;color:var(--amber);margin-left:6px;font-weight:800}
.wsec{border:1.5px solid var(--brd);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--sur)}
.wsec.changed{border-color:var(--amber-bd);background:var(--amber-bg)}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media print{.g-nav,.no-print{display:none!important}}
</style>

function fixLeadingZero(el){let v=el.value.trim();if(v==='')return;if(/^\./.test(v))v='0'+v;if(/^-\./.test(v))v='-0'+v.slice(1);el.value=String(parseFloat(v));}

<script>
'use strict';
/* ═══════════ ENGINE-START — DOM-frei, Node-testbar ═══════════ */
// GEMA-Datenquellen für die Feld-Zuordnung (gemaMap)
var BF_SOURCES = [
  {g:'Objekt', items:[['objekt.name','Objekt-/Projektname'],['objekt.strasse','Strasse + Nr.'],['objekt.plzort','PLZ Ort'],['objekt.plz','PLZ'],['objekt.ort','Ort'],['objekt.kanton','Kanton'],['objekt.gemeinde','Gemeinde'],['objekt.projektnummer','Projekt-/Parzellen-Nr.'],['objekt.bauvorhaben','Bauvorhaben']]},
  {g:'Bauherrschaft', items:[['bauherr.firma','Bauherr Firma'],['bauherr.name','Bauherr Name'],['bauherr.strasse','Bauherr Strasse'],['bauherr.plzort','Bauherr PLZ Ort'],['bauherr.telefon','Bauherr Telefon'],['bauherr.email','Bauherr E-Mail']]},
  {g:'Architekt', items:[['architekt.firma','Architekt Firma'],['architekt.name','Architekt Name'],['architekt.strasse','Architekt Strasse'],['architekt.plzort','Architekt PLZ Ort'],['architekt.telefon','Architekt Telefon'],['architekt.email','Architekt E-Mail']]},
  {g:'Planer', items:[['planer.firma','Planer Firma'],['planer.name','Planer Name'],['planer.strasse','Planer Strasse'],['planer.plzort','Planer PLZ Ort'],['planer.telefon','Planer Telefon'],['planer.email','Planer E-Mail']]},
  {g:'Unternehmer', items:[['unternehmer.firma','Unternehmer Firma'],['unternehmer.name','Unternehmer Name'],['unternehmer.strasse','Unternehmer Strasse'],['unternehmer.plzort','Unternehmer PLZ Ort'],['unternehmer.telefon','Unternehmer Telefon'],['unternehmer.email','Unternehmer E-Mail']]},
  {g:'Eigene Firma', items:[['org.name','Eigene Firma Name'],['org.strasse','Eigene Firma Strasse'],['org.plzort','Eigene Firma PLZ Ort'],['org.telefon','Eigene Firma Telefon'],['org.email','Eigene Firma E-Mail']]},
  {g:'Sonstiges', items:[['user.name','Sachbearbeiter Name'],['user.email','Sachbearbeiter E-Mail'],['datum.heute','Heutiges Datum']]}
];
var BF_ROLLE_MAP = { bauherr:'Bauherrschaft', architekt:'Architekt / Generalplaner', planer:'Sanitärplaner', unternehmer:'Unternehmer / Installateur' };

function bfUid(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).substring(2,7); }
function bfMapLabel(key){ for(var i=0;i<BF_SOURCES.length;i++){ var it=BF_SOURCES[i].items.find(function(x){return x[0]===key;}); if(it)return it[1]; } return key; }

function _betPick(beteiligte, rolle){ return (beteiligte||[]).filter(function(b){return (b.rolle||'')===rolle;})[0]||null; }
function _betField(b, field){ if(!b)return ''; switch(field){
  case 'firma': return b.firma||'';
  case 'name': return ((b.vorname?b.vorname+' ':'')+(b.name||'')).trim();
  case 'strasse': return b.strasse||'';
  case 'plzort': return [b.plz,b.ort].filter(Boolean).join(' ');
  case 'telefon': return b.telefon||b.mobile||'';
  case 'email': return b.email||'';
} return ''; }

// gemaMap-Schlüssel → Wert aus ctx {objekt, beteiligte, org, user, heute}
function bfResolveMap(key, ctx){
  if(!key) return '';
  ctx=ctx||{}; var o=ctx.objekt||{}, org=ctx.org||{}, u=ctx.user||{};
  var parts=key.split('.'); var src=parts[0], f=parts[1];
  if(src==='objekt'){ switch(f){
    case 'name':return o.name||''; case 'strasse':return o.strasse||''; case 'plz':return o.plz||''; case 'ort':return o.ort||'';
    case 'plzort':return [o.plz,o.ort].filter(Boolean).join(' '); case 'kanton':return o.kanton||''; case 'gemeinde':return o.gemeinde||'';
    case 'projektnummer':return o.projektnummer||''; case 'bauvorhaben':return o.bauvorhaben||''; } return ''; }
  if(src==='bauherr'||src==='architekt'||src==='planer'||src==='unternehmer'){ return _betField(_betPick(ctx.beteiligte, BF_ROLLE_MAP[src]), f); }
  if(src==='org'){ switch(f){
    case 'name':return org.name||''; case 'strasse':return org.strasse||''; case 'plzort':return [org.plz,org.ort].filter(Boolean).join(' ');
    case 'telefon':{ try{return ((org.settings||{}).erp||{}).tel||'';}catch(e){return '';} }

  if(src==='user'){ if(f==='name')return u.name||''; if(f==='email')return u.email||''; return ''; }
  if(src==='datum'&&f==='heute'){ return ctx.heute||''; }
  return '';
}

// ── pdf-lib lazy ──
function _loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){rej(new Error('Bibliothek nicht ladbar'));}; document.head.appendChild(s); }); }
async function _ensurePdfLib(){ if(window.PDFLib) return window.PDFLib; await _loadScript(CDN_PDFLIB); if(!window.PDFLib) throw new Error('PDF-Bibliothek nicht verfügbar (offline?)'); return window.PDFLib; }

async function bfReadAcro(bytes){
  var PL=await _ensurePdfLib();
  var doc=await PL.PDFDocument.load(bytes,{ignoreEncryption:true});
  var fields=[]; var form;
  try{ form=doc.getForm(); }catch(e){ return {acro:false, fields:[]}; }
  var fs=[]; try{ fs=form.getFields(); }catch(e){ return {acro:false, fields:[]}; }
  fs.forEach(function(f){ var cn=(f.constructor&&f.constructor.name)||''; var name=''; try{name=f.getName();}catch(e){return;}
    var typ='text', options=null;
    if(cn==='PDFCheckBox')typ='checkbox';
    else if(cn==='PDFDropdown'||cn==='PDFOptionList'){typ='dropdown'; try{options=f.getOptions();}catch(e){}}
    else if(cn==='PDFRadioGroup'){typ='dropdown'; try{options=f.getOptions();}catch(e){}}
    else if(cn==='PDFButton'||cn==='PDFSignature')return;
    fields.push({name:name,typ:typ,options:options});
  });
  return {acro:fields.length>0, fields:fields};
}
function _truthy(v){ v=String(v==null?'':v).toLowerCase().trim(); return v==='true'||v==='1'||v==='ja'||v==='yes'||v==='x'||v==='on'; }
async function bfFillPdf(bytes, felder){
  var PL=await _ensurePdfLib();
  var doc=await PL.PDFDocument.load(bytes,{ignoreEncryption:true});
  var form=doc.getForm();
  (felder||[]).forEach(function(fd){ if(!fd.name) return; var v=fd.wert;
    try{
      if(fd.typ==='checkbox'){ var cb=form.getCheckBox(fd.name); if(_truthy(v))cb.check(); else cb.uncheck(); }
      else if(fd.typ==='dropdown'){ if(v){ try{ form.getDropdown(fd.name).select(String(v)); }catch(e){ try{ form.getRadioGroup(fd.name).select(String(v)); }catch(e2){} } } }
      else { form.getTextField(fd.name).setText(String(v==null?'':v)); }
    }catch(e){ /* Feld fehlt/typ mismatch → überspringen */ }
  });
  try{ form.updateFieldAppearances(); }catch(e){}
  return await doc.save();
}

function wizFile(inp){ if(!inp.files||!inp.files.length)return; var file=inp.files[0];

    wizStat('KI analysiert das Formular …');
    if(acro.acro){ ai=await GemaClaude.analyzeForm({ fieldNames:acro.fields.map(function(f){return {name:f.name,type:f.typ};}), fileBase64:_wiz.dataUrl, mediaType:'application/pdf', filename:(_wiz.file&&_wiz.file.name)||'formular.pdf' }); }

  if(can){ tools.push('<select class="sel" style="min-height:32px;font-size:12px" onchange="detStatus(this.value)"><option value="">Status…</option><option value="entwurf">Entwurf</option><option value="bereit">Bereit</option><option value="eingereicht">Eingereicht</option></select>');
    tools.push('<button class="btn sm" onclick="detRename()">✏️ Titel</button>');
    tools.push('<button class="btn sm" onclick="detSaveVorlage()">💾 Als Vorlage</button>');
    tools.push('<button class="btn sm red" onclick="detDelete()">🗑</button>'); }
  document.getElementById('dtTools').innerHTML=tools.join('');
  detMain();
}
function detMain(){
  var can=_canEdit(); var h='';
  // Watcher
  h+='<div class="wsec'+(_det.sourceChanged?' changed':'')+'"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px"><strong style="font-size:13px">🔎 Änderungs-Überwachung</strong>'+(_det.sourceChanged?'<span class="pill" style="background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)">Quelle geändert '+(_det.sourceChangedAt?fD(_det.sourceChangedAt):'')+'</span>':'')+'</div>';
  h+='<div class="fg" style="margin-bottom:6px"><input class="fc" id="wUrlEdit" '+(can?'':'readonly')+' value="'+E(_det.sourceUrl||'')+'" placeholder="Quell-URL des Formulars (https://…)"/></div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);align-items:center">';
  if(can){ h+='<button class="btn sm" onclick="detWatchSave()">URL speichern</button><button class="btn sm" onclick="detWatchCheck()">🔎 Jetzt prüfen</button>'; if(_det.sourceChanged)h+='<button class="btn sm" onclick="detWatchSeen()">✓ Änderung gesehen</button>'; }
  h+='<span>'+(_det.sourceLastChecked?('zuletzt geprüft: '+fD(_det.sourceLastChecked)):(_det.sourceUrl?'noch nicht geprüft':'keine URL hinterlegt'))+'</span></div>';
  h+='<div style="font-size:11px;color:var(--mut);margin-top:6px">Die tägliche Server-Prüfung meldet Änderungen automatisch dem GEMA-Admin — auch ohne dass jemand das Modul öffnet.</div></div>';
  // Felder
  var felder=_det.felder||[];
  h+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:4px 0 8px"><strong style="font-size:14px">Formularfelder ('+bfVollstaendigkeit(felder).gefuellt+'/'+felder.length+')</strong>'+(can?'<button class="btn sm" onclick="detAddField()">＋ Feld</button>':'')+'</div>';
  if(!felder.length)h+='<div class="empty">Keine Felder.</div>';
  else h+=felder.map(fieldRow).join('');
  document.getElementById('dtMain').innerHTML=h;
}
function _optHtml(sel){ var cur=sel||''; return BF_SOURCES.map(function(g){ return '<optgroup label="'+E(g.g)+'">'+g.items.map(function(it){ return '<option value="'+E(it[0])+'"'+(cur===it[0]?' selected':'')+'>'+E(it[1])+'</option>'; }).join('')+'</optgroup>'; }).join(''); }
function fieldRow(fd){
  var can=_canEdit();
  var input;
  if(fd.typ==='checkbox'){ input='<label style="display:inline-flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" '+(_truthy(fd.wert)?'checked':'')+' '+(can?'':'disabled')+' onchange="fieldSet(\''+fd.id+'\',this.checked?\'true\':\'\',true)"/> angekreuzt</label>'; }
  else if(fd.typ==='dropdown'&&fd.options&&fd.options.length){ input='<select class="fc" '+(can?'':'disabled')+' onchange="fieldSet(\''+fd.id+'\',this.value,true)"><option value="">—</option>'+fd.options.map(function(o){return '<option value="'+E(o)+'"'+(fd.wert===o?' selected':'')+'>'+E(o)+'</option>';}).join('')+'</select>'; }
  else { input='<input class="fc" '+(can?'':'readonly')+' value="'+E(fd.wert||'')+'" oninput="fieldSet(\''+fd.id+'\',this.value,true)" placeholder="—"/>'; }
  var mapSel='<select class="fc" '+(can?'':'disabled')+' style="font-size:12px" onchange="fieldMap(\''+fd.id+'\',this.value)"><option value="">— keine Zuordnung —</option>'+_optHtml(fd.gemaMap)+'</select>';
  return '<div class="frow'+(fd.manuell?' man':'')+'"><div class="flab">'+E(fd.label||fd.name)+(fd.gemaMap?'<div class="fsub">↳ '+E(bfMapLabel(fd.gemaMap))+'</div>':'')+'</div>'
    +'<div>'+input+'</div>'
    +'<div style="grid-column:1/-1">'+mapSel+(can&&(!fd.name||fd.manuellAdd)?' <button class="btn sm red" style="margin-top:4px" onclick="fieldDel(\''+fd.id+'\')">🗑 Feld</button>':'')+'</div></div>';
}
function _fd(id){ return (_det.felder||[]).find(function(f){return f.id===id;}); }
function fieldSet(id,val,manuell){ var f=_fd(id); if(!f)return; f.wert=val; if(manuell)f.manuell=true; saveForm(_det); }
function fieldMap(id,map){ var f=_fd(id); if(!f)return; f.gemaMap=map; f.manuell=false; var v=bfResolveMap(map,_ctxFor(_det.objektId)); if(v!=='')f.wert=v; saveForm(_det); detMain(); }
function fieldDel(id){ _det.felder=(_det.felder||[]).filter(function(f){return f.id!==id;}); saveForm(_det); detMain(); }
function detAddField(){ GemaDialog.prompt({title:'Neues Feld',placeholder:'Feld-Beschriftung'}).then(function(lbl){ if(!lbl)return; _det.felder.push({id:bfUid('fd'),name:bfUid('mf'),label:lbl,typ:'text',options:null,gemaMap:'',wert:'',manuell:false,manuellAdd:true}); saveForm(_det); detMain(); }); }
function detRefill(){ bfAutoFill(_det.felder,_ctxFor(_det.objektId)); saveForm(_det); detMain(); toast('Aus Projektdaten neu befüllt (manuelle Felder unangetastet)'); }
function detStatus(v){ if(!v)return; _det.status=v; saveForm(_det); detRender(); toast('Status: '+v); }
function detRename(){ GemaDialog.prompt({title:'Titel',defaultValue:_det.titel||''}).then(function(v){ if(v==null)return; _det.titel=v; saveForm(_det); detRender(); }); }
function detDelete(){ GemaDialog.confirm({title:'Formular löschen',message:'Dieses Formular wirklich löschen?',danger:true,confirmLabel:'Löschen'}).then(function(ok){ if(!ok)return; _delRec(POOL,'bform:',_det.id); detClose(); }); }
function detOpenOriginal(){ var src=_det.pdf.url||_det.pdf.dataUrl; if(src)window.open(src,'_blank'); }
async function _origBytes(){ if(_det.pdf.dataUrl) return _dataUrlToBytes(_det.pdf.dataUrl);
  if(_det.pdf.url){ var r=await fetch(_det.pdf.url); if(!r.ok){ var m=_det.pdf.url.match(/^https?:\/\/[^/]+(\/storage\/v1\/.*)$/); if(m){ r=await fetch(location.origin+'/sb'+m[1]); } } if(r&&r.ok) return new Uint8Array(await r.arrayBuffer()); }
  throw new Error('Original-PDF nicht ladbar'); }
async function detFill(){
  if(typeof window.PDFLib==='undefined'){ toast('PDF-Bibliothek wird geladen …'); }
  try{ var bytes=await _origBytes(); var out=await bfFillPdf(bytes,_det.felder);
    var blob=new Blob([out],{type:'application/pdf'}); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=(_det.titel||'Formular').replace(/[^a-zA-Z0-9\-_]+/g,'_')+'_ausgefuellt.pdf'; document.body.appendChild(a); a.click(); setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    toast('Ausgefülltes PDF heruntergeladen');
  }catch(e){ toast('Ausfüllen fehlgeschlagen: '+(e.message||'Fehler')); }
}
function detDatenblatt(){
  var f=_det; var org=_org()||{}; var w=window.open('','_blank'); if(!w){ toast('Pop-up blockiert.'); return; }
  var rows=(f.felder||[]).map(function(fd){ return '<tr><td>'+E(fd.label||fd.name)+'</td><td>'+E(fd.typ==='checkbox'?(_truthy(fd.wert)?'☒ angekreuzt':'☐'):(fd.wert||'—'))+'</td></tr>'; }).join('');
  var html='<!doctype html><html><head><meta charset="utf-8"><title>'+E(f.titel)+'</title><style>@page{size:A4;margin:16mm}body{font-family:DM Sans,Arial,sans-serif;color:#0f172a}h1{font-size:19px;margin:0 0 2px}.sub{color:#64748b;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:12px}td{border:1px solid #dbe0ea;padding:6px 9px;vertical-align:top}td:first-child{font-weight:700;width:42%;background:#f4f6fb}.tb{position:fixed;top:10px;right:10px}@media print{.tb{display:none}}</style></head><body>'
    +'<div class="tb"><button onclick="window.print()">Drucken / PDF</button></div>'
    +'<h1>'+E(f.titel||'Formular')+'</h1><div class="sub">'+E(org.name||'')+' · '+E(f.behoerde||'')+' · Objekt: '+E(f.objektName||'')+' · '+_heute()+'</div>'
    +'<table><tbody>'+rows+'</tbody></table></body></html>';
  w.document.write(html); w.document.close();
}
function detSaveVorlage(){ GemaDialog.prompt({title:'Als Büro-Vorlage speichern',placeholder:'Name der Vorlage',defaultValue:_det.titel}).then(function(name){ if(!name)return;
  var v={ id:bfUid('bformv'), orgId:(_me()||{}).orgId, name:name, behoerde:_det.behoerde||'', sourceUrl:_det.sourceUrl||'', acro:_det.acro,
    pdf:_det.pdf?{name:_det.pdf.name,url:_det.pdf.url||'',dataUrl:_det.pdf.dataUrl||''}:null,
    felderSchema:(_det.felder||[]).map(function(f){return {name:f.name,label:f.label,typ:f.typ,options:f.options||null,gemaMap:f.gemaMap||''};}),
    erstelltVon:{userId:(_me()||{}).id,name:(_me()||{}).name}, erstelltAm:new Date().toISOString() };
  _saveRec(VPOOL,'bformv:',v); toast('Vorlage gespeichert'); }); }

// ══════════════ WATCHER ══════════════
function detWatchSave(){ _det.sourceUrl=((document.getElementById('wUrlEdit')||{}).value||'').trim(); saveForm(_det); toast('URL gespeichert'); }
function detWatchCheck(){ _det.sourceUrl=((document.getElementById('wUrlEdit')||{}).value||'').trim(); saveForm(_det); bfWatchCheck(_det, !_det.sourceHash); }
function detWatchSeen(){ _det.sourceChanged=false; saveForm(_det); detMain(); toast('Als gesehen markiert'); }
function bfWatchCheck(f, baseline){
  if(!f.sourceUrl){ toast('Keine URL hinterlegt.'); return; }
  toast('Formular-URL wird geprüft …');
  fetch('/.netlify/functions/form-watch?url='+encodeURIComponent(f.sourceUrl)).then(function(r){
    if(r.status===404) throw new Error('Prüf-Function nicht deployed');
    return r.json();
  }).then(function(res){
    if(!res.ok){ toast('Prüfung fehlgeschlagen: '+(res.error||'unbekannt')); return; }
    f.sourceLastChecked=new Date().toISOString(); f.sourceEtag=res.etag||''; f.sourceLastModified=res.lastModified||'';
    if(baseline||!f.sourceHash){ f.sourceHash=res.hash; f.sourceChanged=false; saveForm(_det===f?_det:f); toast('Ausgangsstand gespeichert — die Quelle wird ab jetzt überwacht.'); }
    else if(res.hash!==f.sourceHash){ f.sourceChanged=true; f.sourceChangedAt=new Date().toISOString(); f.sourceHashPrev=f.sourceHash; f.sourceHash=res.hash; saveForm(_det===f?_det:f); _notifyAdminChanged(f); toast('⚠ Das Formular hat sich geändert!'); }
    else { saveForm(_det===f?_det:f); toast('Formular unverändert.'); }
    if(_det&&_det.id===f.id)detMain();
  }).catch(function(err){ toast('Prüfung nicht möglich: '+(err.message||'offline')); });
}
function _notifyAdminChanged(f){ try{ if(typeof GemaNotify!=='undefined')GemaNotify.push({eventKey:'behoerde_formular_geaendert',empfaengerRoleId:'role_admin',modul:'behoerden_formulare',typ:'warnung',titel:'Behördenformular geändert',text:(f.titel||'Formular')+' — '+(f.objektName||'')+': die Quelle hat sich geändert.',link:'pm_behoerden_formulare.html?f='+f.id,objektId:f.objektId||''}); }catch(e){} }
function checkAll(){ var list=getForms().filter(function(f){return f.sourceUrl;}); if(!list.length){ toast('Kein Formular mit hinterlegter URL.'); return; } toast('Prüfe '+list.length+' Formular(e) …'); list.forEach(function(f){ bfWatchCheck(f, !f.sourceHash); }); }

function vorlagenOpen(){ var vs=getVorlagen();
  var h='<div class="hintbox">Büro-eigene Formular-Vorlagen (Feld-Zuordnungen wiederverwendbar). Neue Vorlagen entstehen im Formular über «💾 Als Vorlage».</div>';
  if(!vs.length)h+='<div class="empty" style="padding:16px">Noch keine Vorlagen.</div>';
  else h+=vs.map(function(v){return '<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--brd);border-radius:10px;padding:9px;margin-bottom:6px"><span>📄</span><span style="flex:1;font-weight:700;font-size:12.5px">'+E(v.name)+'</span><span style="font-size:11px;color:var(--mut)">'+(v.felderSchema||[]).length+' Felder</span>'+(_canEdit()?'<button class="btn sm red" onclick="vorlagenDel(\''+v.id+'\')">🗑</button>':'')+'</div>';}).join('');
  mOpen('Formular-Vorlagen',h,[{label:'Schliessen',fn:'mClose()'}]);
}
function vorlagenDel(id){ GemaDialog.confirm({title:'Vorlage löschen',message:'Vorlage wirklich löschen?',danger:true,confirmLabel:'Löschen'}).then(function(ok){ if(!ok)return; _delRec(VPOOL,'bformv:',id); vorlagenOpen(); }); }

function mOpen(title,body,foot,wide){ document.getElementById('mTitle').textContent=title; document.getElementById('mBody').innerHTML=body; document.getElementById('mFt').innerHTML=(foot||[]).map(function(b){return '<button class="btn '+(b.cls||'')+'" onclick="'+b.fn+'">'+E(b.label)+'</button>';}).join(''); document.getElementById('modalBox').className='modal'+(wide?' wide':''); document.getElementById('modal').classList.add('open'); }
function mClose(){ document.getElementById('modal').classList.remove('open'); }

function _openDeepLink(){ try{ var p=new URLSearchParams(location.search); var fid=p.get('f'); if(fid){ var f=_readPool(POOL).find(function(x){return x.id===fid;}); if(f)detOpen(fid); } }catch(e){} }
document.addEventListener('DOMContentLoaded',function(){
  try{render();}catch(e){}
  if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection){
    Promise.race([ Promise.all([ GemaSync.bindCollection(MK,POOL,'bform:','id'), GemaSync.bindCollection(MK,VPOOL,'bformv:','id') ]), new Promise(function(r){setTimeout(r,6000);}) ])
      .then(function(){ _cloudLoaded=true; try{render();}catch(e){} _openDeepLink(); })
      .catch(function(){ _cloudLoaded=true; try{render();}catch(e){} _openDeepLink(); });
  } else { _cloudLoaded=true; render(); _openDeepLink(); }
});
window.addEventListener('gema-bform-changed',function(){ try{ if(document.getElementById('detail').classList.contains('open')){ detReload(); if(_det)detRender(); } render(); }catch(e){} });
