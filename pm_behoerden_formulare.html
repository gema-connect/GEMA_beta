<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#0369a1;--acc-bg:#eff6ff;--acc-bd:#bae6fd;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --hi:#f59e0b;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a 0%,#0369a1 60%,#0ea5e9 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--brd2);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--sur);color:var(--mut);font-size:12.5px;font-weight:800;padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.srch{flex:1;min-width:160px;padding:9px 13px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.srch:focus{border-color:var(--acc)}
.sel{padding:9px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13px;background:var(--sur);outline:none;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px;cursor:pointer}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
.fcard{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;transition:.12s}
.fcard:hover{border-color:var(--acc-bd)}
.fcard-bar{height:4px}
.fcard-bd{padding:11px 13px}
.fcard-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.fcard-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:4px}
.fcard-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prog{height:7px;border-radius:999px;background:var(--brd);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--acc)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer;flex-shrink:0}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11.5px;font-weight:800;color:var(--txt2);margin-bottom:4px}
.fc{width:100%;padding:9px 11px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;background:var(--sur);outline:none}
.fc:focus{border-color:var(--acc)}
.hintbox{background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--txt2);line-height:1.5;margin-bottom:10px}
/* detail split-view */
#detail{position:fixed;inset:0;z-index:700;background:var(--bg);display:none;flex-direction:column}
#detail.open{display:flex}
.dt-hd{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.dt-hd .tt{font-size:15px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-tools{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0}
.split{flex:1;display:flex;min-height:0}
.split-left{flex:1.3;min-width:0;overflow:auto;background:#525863;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.split-right{width:390px;flex-shrink:0;overflow-y:auto;background:var(--sur);border-left:1px solid var(--brd);padding:14px}
@media(max-width:900px){.split{flex-direction:column}.split-left{flex:none;max-height:46vh}.split-right{width:100%;border-left:none;border-top:1px solid var(--brd)}}
.pdfpage{position:relative;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);flex-shrink:0}
.pdfpage canvas{display:block}
.fld-ov{position:absolute;box-sizing:border-box;border:1px solid rgba(3,105,161,.5);background:rgba(186,230,253,.28);border-radius:2px;cursor:pointer;overflow:hidden}
.fld-ov:hover{background:rgba(186,230,253,.5)}
.fld-ov input{width:100%;height:100%;border:none;background:transparent;padding:0 2px;font-family:inherit;color:#0f172a;outline:none}
.fld-ov.cb{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--acc)}
.fld-ov.hi,.frow.hi{outline:2.5px solid var(--hi);outline-offset:1px;background:rgba(245,158,11,.18);border-color:var(--hi)}
.frow.hi{box-shadow:0 0 0 2.5px var(--hi)}
.zsec-h{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:6px 0 8px}
.frow{border:1.5px solid var(--brd);border-radius:11px;padding:9px 11px;margin-bottom:8px;background:var(--sur);transition:.12s}
.frow .flab{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.frow.man .flab::after{content:'✏';font-size:10px;color:var(--amber)}
.frow .fsub{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px}
.frow-in{margin-top:6px}
.mini{font-size:10.5px;color:var(--mut);background:none;border:none;cursor:pointer;font-weight:700;padding:2px 4px}
.mini:hover{color:var(--acc)}
.wsec{border:1.5px solid var(--brd);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--sur)}
.wsec.changed{border-color:var(--amber-bd);background:var(--amber-bg)}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media print{.g-nav,.no-print{display:none!important}}
</style>

var BF_ROLLE_MAP = { bauherr:'Bauherrschaft', architekt:'Architekt / Generalplaner', planer:'Sanitärplaner', unternehmer:'Unternehmer / Installateur' };

function bfUid(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).substring(2,7); }
function bfMapLabel(key){ for(var i=0;i<BF_SOURCES.length;i++){ var it=BF_SOURCES[i].items.find(function(x){return x[0]===key;}); if(it)return it[1]; } return key; }

function _betPick(beteiligte, rolle){ return (beteiligte||[]).filter(function(b){return (b.rolle||'')===rolle;})[0]||null; }
function _betField(b, field){ if(!b)return ''; switch(field){
  case 'firma': return b.firma||'';
  case 'name': return ((b.vorname?b.vorname+' ':'')+(b.name||'')).trim();
  case 'strasse': return b.strasse||'';
  case 'plzort': return [b.plz,b.ort].filter(Boolean).join(' ');
  case 'telefon': return b.telefon||b.mobile||'';
  case 'email': return b.email||'';
} return ''; }

function bfResolveMap(key, ctx){
  if(!key) return '';
  ctx=ctx||{}; var o=ctx.objekt||{}, org=ctx.org||{}, u=ctx.user||{};
  var parts=key.split('.'); var src=parts[0], f=parts[1];
  if(src==='objekt'){ switch(f){
    case 'name':return o.name||''; case 'strasse':return o.strasse||''; case 'plz':return o.plz||''; case 'ort':return o.ort||'';
    case 'plzort':return [o.plz,o.ort].filter(Boolean).join(' '); case 'kanton':return o.kanton||''; case 'gemeinde':return o.gemeinde||'';
    case 'projektnummer':return o.projektnummer||''; case 'bauvorhaben':return o.bauvorhaben||''; } return ''; }
  if(src==='bauherr'||src==='architekt'||src==='planer'||src==='unternehmer'){ return _betField(_betPick(ctx.beteiligte, BF_ROLLE_MAP[src]), f); }
  if(src==='org'){ switch(f){
    case 'name':return org.name||''; case 'strasse':return org.strasse||''; case 'plzort':return [org.plz,org.ort].filter(Boolean).join(' ');
    case 'telefon':{ try{return ((org.settings||{}).erp||{}).tel||'';}catch(e){return '';} }
    case 'email':{ try{return ((org.settings||{}).erp||{}).email||'';}catch(e){return '';} } } return ''; }
  if(src==='user'){ if(f==='name')return u.name||''; if(f==='email')return u.email||''; return ''; }
  if(src==='datum'&&f==='heute'){ return ctx.heute||''; }
  return '';
}

function bfAutoFill(felder, ctx){
  (felder||[]).forEach(function(fd){ if(fd.manuell) return; if(fd.gemaMap){ var v=bfResolveMap(fd.gemaMap, ctx); if(v!=='') fd.wert=v; } });
  return felder;
}

// AcroForm-Felder + KI zusammenführen. zuordnung = die KI hat eine GEMA-Quelle
// vorgeschlagen (Feld ist einem Beteiligten/Objekt zugeordnet) → erscheint
// rechts in der Zuordnungsliste; sonst nur im PDF ausfüllbar.
function bfMergeFields(acroFields, aiFelder){
  var aiByName={}; (aiFelder||[]).forEach(function(a){ if(a && a.name) aiByName[a.name]=a; });
  if(acroFields && acroFields.length){
    return acroFields.map(function(af){ var ai=aiByName[af.name]||{};
      return { id:bfUid('fd'), name:af.name, label:(ai.label||af.name), typ:(af.typ||ai.typ||'text'), options:(af.options||null), gemaMap:(ai.gemaMap||''), zuordnung:!!ai.gemaMap, wert:'', manuell:false }; });
  }
  return (aiFelder||[]).map(function(a){ return { id:bfUid('fd'), name:a.name||bfUid('f'), label:a.label||a.name||'Feld', typ:a.typ||'text', options:null, gemaMap:a.gemaMap||'', zuordnung:!!a.gemaMap, wert:'', manuell:false }; });
}

// Zuordnungsfeld = explizit markiert; Altbestand (v1) ohne Flag aber mit gemaMap
// wird als Zuordnungsfeld interpretiert (defensive Migration, kein Cloud-Write).
function bfZuordnungsFelder(felder){ return (felder||[]).filter(function(f){ return f.zuordnung===true || (f.zuordnung===undefined && !!f.gemaMap); }); }
function bfVollstaendigkeit(felder){ var z=bfZuordnungsFelder(felder); var t=z.length, g=z.filter(function(f){return String(f.wert||'').trim()!=='';}).length; return {total:t, gefuellt:g}; }

async function bfReadAcro(bytes){
  var PL=await _ensurePdfLib();
  var doc=await PL.PDFDocument.load(bytes,{ignoreEncryption:true});
  var fields=[]; var form;
  try{ form=doc.getForm(); }catch(e){ return {acro:false, fields:[]}; }
  var fs=[]; try{ fs=form.getFields(); }catch(e){ return {acro:false, fields:[]}; }
  fs.forEach(function(f){ var cn=(f.constructor&&f.constructor.name)||''; var name=''; try{name=f.getName();}catch(e){return;}
    var typ='text', options=null;
    if(cn==='PDFCheckBox')typ='checkbox';
    else if(cn==='PDFDropdown'||cn==='PDFOptionList'){typ='dropdown'; try{options=f.getOptions();}catch(e){}}
    else if(cn==='PDFRadioGroup'){typ='dropdown'; try{options=f.getOptions();}catch(e){}}
    else if(cn==='PDFButton'||cn==='PDFSignature')return;
    fields.push({name:name,typ:typ,options:options});
  });
  return {acro:fields.length>0, fields:fields};
}
async function bfFillPdf(bytes, felder){
  var PL=await _ensurePdfLib();
  var doc=await PL.PDFDocument.load(bytes,{ignoreEncryption:true});
  var form=doc.getForm();
  (felder||[]).forEach(function(fd){ if(!fd.name) return; var v=fd.wert;
    try{
      if(fd.typ==='checkbox'){ var cb=form.getCheckBox(fd.name); if(_truthy(v))cb.check(); else cb.uncheck(); }
      else if(fd.typ==='dropdown'){ if(v){ try{ form.getDropdown(fd.name).select(String(v)); }catch(e){ try{ form.getRadioGroup(fd.name).select(String(v)); }catch(e2){} } } }
      else { form.getTextField(fd.name).setText(String(v==null?'':v)); }
    }catch(e){}
  });
  try{ form.updateFieldAppearances(); }catch(e){}
  return await doc.save();
}

function wizFile(inp){ if(!inp.files||!inp.files.length)return; var file=inp.files[0];
  if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){ toast('Bitte ein PDF wählen.'); return; }

  _wiz.file=file; var rd=new FileReader(); rd.onload=function(){ _wiz.dataUrl=rd.result; _wiz.bytes=_dataUrlToBytes(rd.result); var nm=document.getElementById('wName'); if(nm&&!nm.value)nm.value=file.name.replace(/\.pdf$/i,''); }; rd.readAsDataURL(file);

async function wizCreate(){

    else { ai=await GemaClaude.analyzeForm({ fileBase64:_wiz.dataUrl, mediaType:'application/pdf', filename:(_wiz.file&&_wiz.file.name)||'formular.pdf' }); }
  }catch(e){ ai={behoerde:'',felder:[]}; if(!acro.acro){ wizStat('KI nicht verfügbar und PDF hat keine Formularfelder — bitte ausfüllbares PDF verwenden.'); _wiz.busy=false; return; } toast('KI-Zuordnung übersprungen (nicht verfügbar).'); }

// ── LEFT: interaktives PDF (pdf.js) mit Overlay; Fallback = Feldliste ──
async function renderLeft(){
  var left=document.getElementById('dtLeft'); if(!left)return;
  var can=_canEdit();
  left.innerHTML='<div style="color:#fff;font-size:13px;opacity:.85;padding:20px">PDF wird geladen …</div>';
  var bytes=null;
  try{ bytes=await _origBytes(); }catch(e){ bytes=null; }
  if(!bytes){ _pdfOk=false; left.innerHTML=''; leftFallback(left,can); return; }
  var reqDet=_det;
  try{
    var pdfjs=await _ensurePdfJs();
    var doc=await pdfjs.getDocument({data:bytes.slice()}).promise;
    if(_det!==reqDet){ return; }
    left.innerHTML='';
    var byName={}; (_det.felder||[]).forEach(function(f){ if(f.name)byName[f.name]=f; });
    var scale=1;
    for(var pn=1; pn<=doc.numPages; pn++){
      var page=await doc.getPage(pn);
      if(pn===1){ var vp1=page.getViewport({scale:1}); var avail=Math.max(320,(left.clientWidth||600)-32); scale=Math.min(2.0, Math.max(0.6, avail/vp1.width)); }
      var vp=page.getViewport({scale:scale});
      var pageDiv=document.createElement('div'); pageDiv.className='pdfpage'; pageDiv.style.width=vp.width+'px'; pageDiv.style.height=vp.height+'px';
      var canvas=document.createElement('canvas'); canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height); pageDiv.appendChild(canvas);
      left.appendChild(pageDiv);
      await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
      var anns=[]; try{ anns=await page.getAnnotations({intent:'display'}); }catch(e){}
      anns.forEach(function(a){ if(a.subtype!=='Widget'||!a.fieldName)return; var fd=byName[a.fieldName]; if(!fd)return;
        var vr=vp.convertToViewportRectangle(a.rect); var x=Math.min(vr[0],vr[2]),y=Math.min(vr[1],vr[3]),w=Math.abs(vr[2]-vr[0]),h=Math.abs(vr[3]-vr[1]);
        var ov=document.createElement('div'); ov.className='fld-ov'+(fd.typ==='checkbox'?' cb':''); ov.style.left=x+'px'; ov.style.top=y+'px'; ov.style.width=w+'px'; ov.style.height=h+'px'; ov.setAttribute('data-fid',fd.id); ov.title=(fd.label||fd.name);
        _bindOverlay(ov, fd, h, can);
        pageDiv.appendChild(ov);
      });
    }
    _pdfOk=true;
    if(_selFid)_frameLeft(_selFid,false);
  }catch(e){ _pdfOk=false; left.innerHTML=''; leftFallback(left,can); }
}
function _bindOverlay(ov, fd, h, can){
  if(_detKind==='inst' && fd.typ==='checkbox'){
    ov.innerHTML=_truthy(fd.wert)?'✓':'';
    ov.style.fontSize=Math.min(h*0.9,20)+'px';
    ov.onclick=function(e){ e.stopPropagation(); if(!can)return; fd.wert=_truthy(fd.wert)?'':'true'; fd.manuell=true; ov.innerHTML=_truthy(fd.wert)?'✓':''; _saveDet(); _syncRight(fd); selField(fd.id,'left'); };
  } else if(_detKind==='inst' && (fd.typ==='text' || (fd.typ==='dropdown'&&!(fd.options&&fd.options.length)))){
    var inp=document.createElement('input'); inp.type='text'; inp.value=fd.wert||''; if(!can)inp.readOnly=true;
    inp.style.fontSize=Math.max(8,Math.min(h*0.62,15))+'px';
    inp.oninput=function(){ fd.wert=inp.value; fd.manuell=true; _saveDet(); _syncRight(fd); };
    inp.onfocus=function(){ selField(fd.id,'left'); };
    ov.appendChild(inp);
  } else if(_detKind==='inst' && fd.typ==='dropdown' && fd.options&&fd.options.length){
    var sel=document.createElement('select'); sel.style.width='100%'; sel.style.height='100%'; sel.style.border='none'; sel.style.background='transparent'; sel.style.fontSize=Math.max(8,Math.min(h*0.6,14))+'px'; if(!can)sel.disabled=true;
    sel.innerHTML='<option value=""></option>'+fd.options.map(function(o){return '<option'+(fd.wert===o?' selected':'')+'>'+E(o)+'</option>';}).join('');
    sel.onchange=function(){ fd.wert=sel.value; fd.manuell=true; _saveDet(); _syncRight(fd); };
    sel.onfocus=function(){ selField(fd.id,'left'); };
    ov.appendChild(sel);
  } else {
    // Definition-Modus: kein Wert, nur Auswahl/Umrahmung
    ov.onclick=function(e){ e.stopPropagation(); selField(fd.id,'left'); };
  }
}
function leftFallback(left, can){

  h+=felder.map(function(fd){
    var inp='';
    if(_detKind==='inst'){
      if(fd.typ==='checkbox') inp='<label style="font-size:13px;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" '+(_truthy(fd.wert)?'checked':'')+' '+(can?'':'disabled')+' onchange="fieldSet(\''+fd.id+'\',this.checked?\'true\':\'\',true)"/> angekreuzt</label>';
      else if(fd.typ==='dropdown'&&fd.options&&fd.options.length) inp='<select class="fc" '+(can?'':'disabled')+' onchange="fieldSet(\''+fd.id+'\',this.value,true)"><option value="">—</option>'+fd.options.map(function(o){return '<option'+(fd.wert===o?' selected':'')+'>'+E(o)+'</option>';}).join('')+'</select>';
      else inp='<input class="fc" '+(can?'':'readonly')+' value="'+E(fd.wert||'')+'" oninput="fieldSet(\''+fd.id+'\',this.value,true)"/>';
    }
    return '<div class="frow" data-fid="'+E(fd.id)+'"><div class="flab">'+E(fd.label||fd.name)+(fd.zuordnung?' <span class="pill" style="background:var(--acc-bg);color:var(--acc)">Zuordnung</span>':'')+'</div>'
      +(_detKind==='inst'?'<div class="frow-in">'+inp+'</div>':'')
      +(can?'<div style="margin-top:5px"><button class="mini" onclick="fieldZuordnung(\''+E(fd.id)+'\','+(!fd.zuordnung)+')">'+(fd.zuordnung?'✕ aus Zuordnung':'⇄ als Zuordnungsfeld')+'</button></div>':'')
      +'</div>';
  }).join('')+'</div>';
  left.innerHTML=h;
}

function defDelete(id){ GemaDialog.confirm({title:'Vorlage löschen',message:'Formular aus dem Pool löschen? Bereits ausgefüllte Instanzen bleiben erhalten.',danger:true,confirmLabel:'Löschen'}).then(function(ok){ if(!ok)return; _delRec(DEFPOOL,'bformdef:',id); if(_det&&_det.id===id)detClose(); else render(); }); }

async function _origBytes(){ var pdf=_det.pdf||{}; if(pdf.dataUrl) return _dataUrlToBytes(pdf.dataUrl);
  if(pdf.url){ var r=await fetch(pdf.url); if(!r.ok){ var m=pdf.url.match(/^https?:\/\/[^/]+(\/storage\/v1\/.*)$/); if(m){ r=await fetch(location.origin+'/sb'+m[1]); } } if(r&&r.ok) return new Uint8Array(await r.arrayBuffer()); }
  return null; }
async function detFill(){
  try{ var bytes=await _origBytes(); if(!bytes)throw new Error('Original-PDF nicht ladbar'); var out=await bfFillPdf(bytes.slice(),_det.felder);
    var blob=new Blob([out],{type:'application/pdf'}); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=(_det.titel||'Formular').replace(/[^a-zA-Z0-9\-_]+/g,'_')+'_ausgefuellt.pdf'; document.body.appendChild(a); a.click(); setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    toast('Ausgefülltes PDF heruntergeladen');
  }catch(e){ toast('Ausfüllen fehlgeschlagen: '+(e.message||'Fehler')); }
}
function detDatenblatt(){
  var f=_det; var org=_org()||{}; var w=window.open('','_blank'); if(!w){ toast('Pop-up blockiert.'); return; }
  var rows=(f.felder||[]).map(function(fd){ return '<tr><td>'+E(fd.label||fd.name)+'</td><td>'+E(fd.typ==='checkbox'?(_truthy(fd.wert)?'☒':'☐'):(fd.wert||'—'))+'</td></tr>'; }).join('');
  var html='<!doctype html><html><head><meta charset="utf-8"><title>'+E(f.titel)+'</title><style>@page{size:A4;margin:16mm}body{font-family:DM Sans,Arial,sans-serif;color:#0f172a}h1{font-size:19px;margin:0 0 2px}.sub{color:#64748b;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:12px}td{border:1px solid #dbe0ea;padding:6px 9px;vertical-align:top}td:first-child{font-weight:700;width:42%;background:#f4f6fb}.tb{position:fixed;top:10px;right:10px}@media print{.tb{display:none}}</style></head><body>'
    +'<div class="tb"><button onclick="window.print()">Drucken / PDF</button></div>'
    +'<h1>'+E(f.titel||'Formular')+'</h1><div class="sub">'+E(org.name||'')+' · Objekt: '+E(f.objektName||'')+' · '+_heute()+'</div>'
    +'<table><tbody>'+rows+'</tbody></table></body></html>';
  w.document.write(html); w.document.close();
  if(window.GemaPrintA4)GemaPrintA4.apply(w);
}

// ══════════════ WATCHER (auf der Definition) ══════════════
function detWatchSave(){ _det.sourceUrl=((document.getElementById('wUrlEdit')||{}).value||'').trim(); _saveDet(); toast('URL gespeichert'); }
function detWatchCheck(){ _det.sourceUrl=((document.getElementById('wUrlEdit')||{}).value||'').trim(); _saveDet(); bfWatchCheck(_det, !_det.sourceHash); }
function detWatchSeen(){ _det.sourceChanged=false; _saveDet(); renderRight(); toast('Als gesehen markiert'); }
function bfWatchCheck(d, baseline){
  if(!d.sourceUrl){ toast('Keine URL hinterlegt.'); return; }
  toast('Formular-URL wird geprüft …');
  var _fwHdr={}; try{ var _t=(window.GemaSync&&GemaSync.getAuthToken&&GemaSync.getAuthToken())||''; if(_t)_fwHdr['Authorization']='Bearer '+_t; }catch(e){}
  fetch('/.netlify/functions/form-watch?url='+encodeURIComponent(d.sourceUrl), {headers:_fwHdr}).then(function(r){ if(r.status===404)throw new Error('Prüf-Function nicht deployed'); if(r.status===401)throw new Error('Nicht angemeldet — bitte neu einloggen'); return r.json(); }).then(function(res){
    if(!res.ok){ toast('Prüfung fehlgeschlagen: '+(res.error||'unbekannt')); return; }
    d.sourceLastChecked=new Date().toISOString(); d.sourceEtag=res.etag||''; d.sourceLastModified=res.lastModified||'';
    if(baseline||!d.sourceHash){ d.sourceHash=res.hash; d.sourceChanged=false; saveDef(d); toast('Ausgangsstand gespeichert — wird ab jetzt überwacht.'); }
    else if(res.hash!==d.sourceHash){ d.sourceChanged=true; d.sourceChangedAt=new Date().toISOString(); d.sourceHashPrev=d.sourceHash; d.sourceHash=res.hash; saveDef(d); _notifyAdminChanged(d); toast('⚠ Das Formular hat sich geändert!'); }
    else { saveDef(d); toast('Formular unverändert.'); }
    if(_det&&_det.id===d.id&&_detKind==='def')renderRight();
  }).catch(function(err){ toast('Prüfung nicht möglich: '+(err.message||'offline')); });
}
function _notifyAdminChanged(d){ try{ if(typeof GemaNotify!=='undefined')GemaNotify.push({eventKey:'behoerde_formular_geaendert',empfaengerRoleId:'role_admin',modul:'behoerden_formulare',typ:'warnung',titel:'Behördenformular geändert',text:(d.name||'Formular')+': die Quelle hat sich geändert.',link:'pm_behoerden_formulare.html?d='+d.id}); }catch(e){} }
function checkAll(){ var list=getDefs().filter(function(d){return d.sourceUrl;}); if(!list.length){ toast('Kein Formular mit hinterlegter URL.'); return; } toast('Prüfe '+list.length+' Formular(e) …'); list.forEach(function(d){ bfWatchCheck(d, !d.sourceHash); }); }

function mOpen(title,body,foot,wide){ document.getElementById('mTitle').textContent=title; document.getElementById('mBody').innerHTML=body; document.getElementById('mFt').innerHTML=(foot||[]).map(function(b){return '<button class="btn '+(b.cls||'')+'" onclick="'+b.fn+'">'+E(b.label)+'</button>';}).join(''); document.getElementById('modalBox').className='modal'+(wide?' wide':''); document.getElementById('modal').classList.add('open'); }
function mClose(){ document.getElementById('modal').classList.remove('open'); }

function _openDeepLink(){ try{ var p=new URLSearchParams(location.search); var did=p.get('d'); if(did){ var d=_readPool(DEFPOOL).find(function(x){return x.id===did;}); if(d){defOpen(did);return;} } var fid=p.get('f'); if(fid){ var f=_readPool(POOL).find(function(x){return x.id===fid;}); if(f)instOpen(fid); } }catch(e){} }
document.addEventListener('DOMContentLoaded',function(){
  // Feedback-Overlay initialisieren (injiziert das gfb-DOM) — ohne init() tat
  // der 🔴-Feedback-Button nichts, weil start() das Overlay nicht findet.
  try{ if(typeof GemaFeedback!=='undefined') GemaFeedback.init('behoerden_formulare','Behörden & Formulare'); }catch(e){}
  try{render();}catch(e){}
  if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection){
    Promise.race([ Promise.all([ GemaSync.bindCollection(MK,DEFPOOL,'bformdef:','id'), GemaSync.bindCollection(MK,POOL,'bform:','id') ]), new Promise(function(r){setTimeout(r,6000);}) ])
      .then(function(){ _cloudLoaded=true; try{render();}catch(e){} _openDeepLink(); })
      .catch(function(){ _cloudLoaded=true; try{render();}catch(e){} _openDeepLink(); });
  } else { _cloudLoaded=true; render(); _openDeepLink(); }
});
window.addEventListener('gema-bform-changed',function(){ try{ if(!document.getElementById('detail').classList.contains('open')) render(); }catch(e){} });
