<meta name="apple-mobile-web-app-capable" content="yes"/>

<title>GEMA – Meine Prüfungen</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f3f5fb;--sur:#fff;--sur2:#f7f8fc;
  --brd:#e0e4ef;--brd2:#c8cfdf;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --teal:#0f766e;--teal-bg:#f0fdfa;--teal-bd:#99f6e4;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amb:#d97706;--amb-bg:#fffbeb;--amb-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#93c5fd;
  --r-sm:8px;--r-lg:18px;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --sans:'DM Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overflow-x:hidden;overflow-x:clip}
::placeholder{color:#cbd5e1}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);box-shadow:var(--sh-sm)}
.g-nav-inner{padding:0 24px;height:52px;display:flex;align-items:center;gap:0}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:14px}
.g-nav-bc{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.bc-cat{color:var(--mut);text-decoration:none;font-weight:600}
.bc-sep{color:var(--mut2)}
.bc-cur{font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.gema-feedback-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.g-page{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.hero{background:linear-gradient(135deg,#0f172a,#134e4a 55%,#0f766e);border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:18px}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-left{display:flex;align-items:center;gap:14px;min-width:0}
.hero-ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.hero-title{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hero-sub{font-size:12.5px;color:#a7c3c0;margin-top:2px}
.sec-title{font-size:13px;font-weight:900;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column}
.card-bar{height:5px;background:linear-gradient(90deg,#0f766e,#14b8a6)}
.card-body{padding:13px 16px 12px;flex:1}
.card-tt{font-size:14.5px;font-weight:800;line-height:1.3}
.card-sub{font-size:12px;color:var(--mut);margin-top:2px}
.card-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--txt2)}
.card-ft{padding:10px 16px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.teal{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd)}
.badge.grey{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.badge.amb{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bd)}
.badge.grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.badge.blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--teal);color:#fff}
.btn.grn{background:var(--grn);color:#fff}
.btn.ghost{background:var(--sur);border:1.5px solid var(--brd2);color:var(--txt2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{background:var(--sur);border:1.5px dashed var(--brd2);border-radius:var(--r-lg);padding:44px 20px;text-align:center;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:10px}
.spinner-wrap{display:flex;justify-content:center;padding:50px 0}
/* Runner-Overlay */
.ov{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ov.open{display:block}
.run-head{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.run-title{font-size:13.5px;font-weight:800;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-timer{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;padding:3px 14px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.run-timer.warn{background:#7c2d12;border-color:#ea580c;color:#fdba74}
.run-timer.crit{background:#7f1d1d;border-color:#dc2626;color:#fecaca;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.run-progress{font-size:12px;font-weight:700;color:#94a3b8}
.run-save{font-size:11px;font-weight:700;color:#94a3b8}
.tol-banner{background:var(--amb-bg);border-bottom:1.5px solid var(--amb-bd);color:#92400e;font-size:13px;font-weight:700;text-align:center;padding:9px 14px}
.ov-body{max-width:860px;margin:0 auto;padding:18px 20px 130px}
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:16px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:9px;padding:12px 18px;border-bottom:1px solid var(--brd);background:var(--sur2);flex-wrap:wrap}
.panel-hd-title{font-size:13.5px;font-weight:800;flex:1}
.panel-body{padding:16px 18px}
.inp{width:100%;border:1.5px solid var(--brd2);border-radius:var(--r-sm);padding:9px 11px;font-size:15px;background:var(--sur);color:var(--txt)}
.inp:focus{outline:none;border-color:var(--teal)}
textarea.inp{min-height:96px;resize:vertical}
.frage{font-size:14px;white-space:pre-wrap}
.img-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.img-chip{position:relative;width:110px;height:80px;border-radius:9px;overflow:hidden;border:1px solid var(--brd2);background:var(--sur2);display:block}
.img-chip img{width:100%;height:100%;object-fit:cover}
.img-chip .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:26px}
.img-chip .x{position:absolute;top:2px;right:2px;background:rgba(15,23,42,.75);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:11px;cursor:pointer}
.mc-opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--brd);border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s}
.mc-opt:hover{border-color:var(--brd2)}
.mc-opt.on{border-color:var(--teal-bd);background:var(--teal-bg)}
.mc-opt input{width:17px;height:17px;accent-color:var(--teal);margin-top:1px;flex-shrink:0}
.feld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.feld-box label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px}
.feld-inline{display:flex;align-items:stretch}
.feld-inline .inp{border-radius:var(--r-sm) 0 0 var(--r-sm);border-right:none}
.feld-unit{display:flex;align-items:center;padding:0 10px;border:1.5px solid var(--brd2);border-left:none;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--sur2);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.tools-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--teal-bd);background:var(--teal-bg);color:var(--teal);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:800;text-decoration:none;cursor:pointer}
.upl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* Ergebnis */
.res-note{font-size:44px;font-weight:900;line-height:1}
.kor-comment{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:9px}
.kor-comment b{color:var(--blue)}
.loes-box{background:var(--grn-bg);border:1px solid var(--grn-bd);border-radius:10px;padding:11px 13px;font-size:13px;margin-top:9px;white-space:pre-wrap}
.loes-label{font-size:11px;font-weight:900;color:var(--grn);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ans-view{background:var(--sur2);border:1px solid var(--brd);border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:8px;white-space:pre-wrap}
.marked-line{background:#fde68a;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;border-radius:3px;padding:0 3px}
.abgeben-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--brd);padding:11px 18px calc(11px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;gap:12px;align-items:center}
.abgeben-bar.show{display:flex}
.foot{margin-top:36px;text-align:center;color:var(--mut2);font-size:12px}
@media(max-width:640px){
  .g-page{padding:14px 14px 70px}
  .hero{padding:14px 16px}
  .hero-title{font-size:17px}
  .ov-body{padding:14px 12px 150px}
  .run-timer{font-size:19px}
}
</style>

<script>
(function(){
'use strict';

var S=window.GemaSchule;
var _cloudLoaded=false;

var RUN={p:null,abg:null,dirty:false,saveTimer:null,tick:null,autosub:false};

function me(){return (typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentUser())||null;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ═══════ Liste ═══════
function meinePruefungen(){
  var u=me();if(!u)return [];
  var list=S.istDozent()?S.pruefungenForDozent():S.pruefungenForStudent();
  return list.filter(function(p){return p.status!=='entwurf';});
}
function renderList(){
  var wrap=document.getElementById('listWrap');
  var u=me();if(!u)return;
  var list=meinePruefungen();
  if(!list.length){
    wrap.innerHTML=_cloudLoaded
      ?'<div class="empty"><div class="big">📝</div><div style="font-weight:800;font-size:15px;margin-bottom:5px">Keine Prüfungen</div><div style="font-size:12.5px">Sobald dein Dozent eine Prüfung aufschaltet, erscheint sie hier.</div></div>'
      :'<div class="spinner-wrap"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="90 60" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg></div>';
    return;
  }
  // eigene Abgaben laden (parallel, dann rendern)
  Promise.all(list.map(function(p){return S.loadMeineAbgabe(p.id);})).then(function(abgs){
    var gruppen={aktiv:[],geplant:[],abgegeben:[],publiziert:[]};
    list.forEach(function(p,i){
      var abg=abgs[i];
      var r=S.rest(p,u.id,S.jetzt());
      // Publiziert zaehlt auch fuer nie abgegebene, aber korrigierte
      // Autosave-Staende (Browser einfach geschlossen)
      if(p.publiziertAm&&abg&&abg.gestartetAm)gruppen.publiziert.push({p:p,abg:abg});
      else if(abg&&abg.abgegebenAm)gruppen.abgegeben.push({p:p,abg:abg});
      else if(r.phase==='laufend'||r.phase==='toleranz')gruppen.aktiv.push({p:p,abg:abg});
      else if(r.phase==='geplant')gruppen.geplant.push({p:p,abg:abg});
      else gruppen.abgegeben.push({p:p,abg:abg}); // beendet ohne Abgabe
    });
    var h='';
    var karte=function(x,typ){
      var p=x.p,abg=x.abg;
      var klasse=S.klasseById(p.klasseId);
      var r=S.rest(p,u.id,S.jetzt());
      var ft='';
      if(typ==='aktiv'){
        ft='<span class="badge '+(r.phase==='toleranz'?'amb':'grn')+'">'+(r.phase==='toleranz'?'Toleranzzeit läuft':'● Läuft — noch '+S.fmtMs(r.ms))+'</span>'+
           '<button class="btn grn" onclick="slStart(\''+p.id+'\')">'+(abg&&abg.gestartetAm?'▶ Fortsetzen':'▶ Starten')+'</button>';
      }else if(typ==='geplant'){
        ft='<span class="badge blue">Beginn '+S.fmtZeit(p.startAm)+'</span><span class="badge grey">in '+S.fmtMs(r.ms)+'</span>';
      }else if(typ==='abgegeben'){
        ft=abg&&abg.abgegebenAm
          ?'<span class="badge grn">✓ Abgegeben '+S.fmtZeit(abg.abgegebenAm)+'</span>'+(abg.verspaetet?'<span class="badge amb">verspätet</span>':'')+
            (p.nachAbgabeEinsehen!==false?'<button class="btn ghost sm" onclick="slEinsicht(\''+p.id+'\')">👁 Meine Abgabe</button>':'')
          :(abg&&abg.gestartetAm
            ?'<span class="badge amb">Zeit abgelaufen — dein Stand wurde gesichert</span>'
            :'<span class="badge grey">Beendet — keine Abgabe</span>');
      }else if(typ==='publiziert'){
        var note=(abg.noteManuell!=null&&abg.noteManuell!=='')?parseFloat(abg.noteManuell):abg.note;
        ft='<span class="badge teal" style="font-size:13px">Note '+S.noteFmt(note)+'</span>'+
           '<button class="btn primary sm" onclick="slResultat(\''+p.id+'\')">📊 Resultat ansehen</button>';
      }
      return '<div class="card"><div class="card-bar"></div><div class="card-body">'+
        '<div class="card-tt">'+esc(p.titel)+'</div>'+
        '<div class="card-sub">'+esc(klasse?klasse.name:'')+(p.teil?' · '+esc(p.teil):'')+'</div>'+
        '<div class="card-meta"><span class="chip">'+(p.aufgaben||[]).length+' Aufgaben</span><span class="chip">'+S.totalPunkte(p)+' P.</span>'+
        (p.hilfsmittel?'<span class="chip">Hilfsmittel: '+esc(p.hilfsmittel)+'</span>':'')+'</div>'+
        '</div><div class="card-ft">'+ft+'</div></div>';
    };
    if(gruppen.aktiv.length)h+='<div class="sec-title">🟢 Jetzt aktiv</div><div class="grid">'+gruppen.aktiv.map(function(x){return karte(x,'aktiv');}).join('')+'</div>';
    if(gruppen.geplant.length)h+='<div class="sec-title">📅 Anstehend</div><div class="grid">'+gruppen.geplant.map(function(x){return karte(x,'geplant');}).join('')+'</div>';
    if(gruppen.publiziert.length)h+='<div class="sec-title">📊 Resultate</div><div class="grid">'+gruppen.publiziert.map(function(x){return karte(x,'publiziert');}).join('')+'</div>';
    if(gruppen.abgegeben.length)h+='<div class="sec-title">✓ Abgegeben / Beendet</div><div class="grid">'+gruppen.abgegeben.map(function(x){return karte(x,'abgegeben');}).join('')+'</div>';
    wrap.innerHTML=h||'<div class="empty"><div class="big">📝</div>Keine Prüfungen.</div>';
  });
}

// ═══════ Runner ═══════
window.slStart=function(pid){
  var u=me();if(!u)return;
  var p=S.pruefungById(pid);
  if(!p)return;
  // Serverzeit VOR dem Start erzwingen — die Prüfungszeit muss für alle
  // gleich laufen, unabhängig von der Gerätuhr (syncZeit ist best-effort:
  // ohne Serverantwort gilt der letzte bekannte Offset bzw. Gerätezeit).
  S.syncZeit(true).then(function(){
  var r=S.rest(p,u.id,S.jetzt());
  if(r.phase!=='laufend'&&r.phase!=='toleranz'){renderList();return;}
  S.loadMeineAbgabe(pid).then(function(abg){
    if(abg&&abg.abgegebenAm){renderList();return;}
    if(!abg){
      abg={
        id:S.abgabeId(pid,u.id),orgId:p.orgId,pruefungId:pid,klasseId:p.klasseId,
        userId:u.id,userName:u.name||u.username||'',
        gestartetAm:S.jetztIso(),antworten:{}
      };
    }
    RUN.p=p;RUN.abg=abg;RUN.autosub=false;
    // Tools der Berechnungsaufgaben bis Toleranz-Ende freischalten
    var f=S.fenster(p,u.id);
    var tools=[];
    (p.aufgaben||[]).forEach(function(a){(a.tools||[]).forEach(function(t){if(tools.indexOf(t)<0)tools.push(t);});});
    if(tools.length&&f.toleranzEnde)S.addExamTools(tools,f.toleranzEnde);
    S.saveAbgabe(abg).catch(function(){});
    renderRunner();
    document.getElementById('runOv').classList.add('open');
    document.body.style.overflow='hidden';
    startTick();
  });
  });
};
window.slRunnerSchliessen=function(){
  slFlush();
  stopTick();
  document.getElementById('runOv').classList.remove('open');
  document.body.style.overflow='';
  renderList();
};
function mischAufgaben(p,uid){
  var arr=(p.aufgaben||[]).slice();
  return p.mischen?S.shuffle(arr,p.id+'|'+uid):arr;
}
function mischOptionen(p,a,uid){
  var arr=(a.mcOptionen||[]).slice();
  return p.mischen?S.shuffle(arr,p.id+'|'+uid+'|'+a.id):arr;
}
function renderRunner(){
  var p=RUN.p,abg=RUN.abg,u=me();
  document.getElementById('runTitle').textContent=p.titel;
  var body=document.getElementById('runBody');
  var aufg=mischAufgaben(p,u.id);
  var h='';
  if(p.regeln){
    h+='<div class="panel"><div class="panel-hd"><span>📜</span><span class="panel-hd-title">Regeln & Hilfsmittel</span></div>'+
      '<div class="panel-body" style="font-size:12.5px;color:var(--txt2)">'+
      (p.hilfsmittel?'<div style="margin-bottom:6px"><b>Hilfsmittel:</b> '+esc(p.hilfsmittel)+'</div>':'')+
      '<ul style="margin-left:16px">'+p.regeln.split('\n').filter(function(x){return x.trim();}).map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div></div>';
  }
  aufg.forEach(function(a,i){
    var ant=(abg.antworten||{})[a.id]||{};
    h+='<div class="panel" id="aufg_'+a.id+'"><div class="panel-hd"><span>'+({freitext:'✍️',mc:'☑️',berechnung:'🧮'}[a.typ]||'')+'</span>'+
      '<span class="panel-hd-title">Aufgabe '+(i+1)+' von '+aufg.length+(a.titel?' — '+esc(a.titel):'')+'</span>'+
      '<span class="chip">'+(a.punkte||0)+' P.</span></div>'+
      '<div class="panel-body">'+
      '<div class="frage">'+esc(a.frage||'')+'</div>';
    // Bilder / Datenblätter
    if((a.bilder||[]).length){
      h+='<div class="img-chips">'+(a.bilder||[]).map(function(b){
        var src=S.dateiSrc(b);
        return '<a class="img-chip" href="'+esc(src)+'" target="_blank" rel="noopener" title="'+esc(b.name||'')+'">'+
          (b.type==='application/pdf'?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'"/>')+'</a>';
      }).join('')+'</div>';
    }
    // Tools
    if(a.typ==='berechnung'&&(a.tools||[]).length){
      h+='<div class="tools-row">'+(a.tools||[]).map(function(t){
        var url=S.moduleUrl(t);
        return url?'<a class="tool-btn" href="'+esc(url)+'" target="_blank" rel="noopener">🧮 '+esc(S.moduleLabel(t))+' öffnen ↗</a>':'';
      }).join('')+'</div>';
    }
    // Eingaben
    if(a.typ==='mc'){
      var sel=ant.mc||[];
      h+='<div style="margin-top:11px;font-size:12px;color:var(--mut);font-weight:700">'+(a.mcMehrfach?'Mehrere Antworten möglich':'Eine Antwort wählen')+'</div>';
      h+=mischOptionen(p,a,u.id).map(function(o){
        var on=sel.indexOf(o.id)>=0;
        return '<label class="mc-opt'+(on?' on':'')+'"><input type="'+(a.mcMehrfach?'checkbox':'radio')+'" name="mc_'+a.id+'" data-aufg="'+a.id+'" data-opt="'+o.id+'" '+(on?'checked':'')+' onchange="slMc(this)"/> <span>'+esc(o.text||'')+'</span></label>';
      }).join('');
    }
    if(a.typ==='berechnung'&&(a.antwortFelder||[]).length){
      h+='<div class="feld-grid">'+(a.antwortFelder||[]).map(function(f){
        var v=(ant.werte||{})[f.id];
        return '<div class="feld-box"><label>'+esc(f.label||'')+'</label><div class="feld-inline">'+
          '<input class="inp" type="text" inputmode="decimal" value="'+esc(v==null?'':v)+'" oninput="slWert(\''+a.id+'\',\''+f.id+'\',this.value)" placeholder="0.0"/>'+
          (f.einheit?'<span class="feld-unit">'+esc(f.einheit)+'</span>':'')+
        '</div></div>';
      }).join('')+'</div>';
    }
    if(a.typ!=='mc'){
      h+='<div style="margin-top:11px"><label style="font-size:12px;font-weight:700;color:var(--txt2);display:block;margin-bottom:4px">'+(a.typ==='berechnung'?'Rechenweg / Antwort':'Antwort')+'</label>'+
        '<textarea class="inp" data-text="'+a.id+'" oninput="slText(\''+a.id+'\',this.value)" placeholder="Antwort hier eintragen …">'+esc(ant.text||'')+'</textarea></div>';
    }
    // Upload
    if(a.uploadErlaubt){
      var dateien=ant.dateien||[];
      h+='<div class="upl-row"><button class="btn ghost sm" onclick="slUpload(\''+a.id+'\')">📎 Datei / Foto hochladen</button>'+
        '<span style="font-size:11.5px;color:var(--mut)">Fotos (Handskizzen) oder PDF</span></div>'+
        '<div class="img-chips" id="upl_'+a.id+'">'+dateien.map(function(d,di){
          var src=S.dateiSrc(d);
          return '<div class="img-chip">'+(d.type==='application/pdf'?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'"/>')+
            '<button class="x" onclick="slDateiWeg(\''+a.id+'\','+di+')">✕</button></div>';
        }).join('')+'</div>';
    }
    h+='</div></div>';
  });
  body.innerHTML=h;
  document.getElementById('abgBar').classList.add('show');
  updateProgress();
  updateTimer();
}
function updateProgress(){
  if(!RUN.p||!RUN.abg)return;
  var f=S.fortschritt(RUN.p,RUN.abg);
  var el=document.getElementById('runProgress');
  if(el)el.textContent=f.beantwortet+' / '+f.total+' beantwortet';
  var hint=document.getElementById('abgHint');
  if(hint)hint.textContent=f.beantwortet<f.total?(f.total-f.beantwortet)+' Aufgabe(n) noch offen':'Alle Aufgaben beantwortet';
}
// ── Timer (läuft auf Serverzeit — S.jetzt(), nie Date.now()) ──
function startTick(){
  stopTick();
  RUN.tickCount=0;
  RUN.tick=setInterval(updateTimer,1000);
  updateTimer();
}
function stopTick(){if(RUN.tick){clearInterval(RUN.tick);RUN.tick=null;}}
function updateTimer(){
  var u=me();
  if(!RUN.p||!u)return;
  // Serverzeit alle 5 Minuten nachjustieren (Drift/Netzwechsel)
  RUN.tickCount=(RUN.tickCount||0)+1;
  if(RUN.tickCount%300===0)S.syncZeit(true);
  var sh=document.getElementById('syncHint');
  if(sh)sh.style.display=S.zeitStatus().synced?'none':'';
  var r=S.rest(RUN.p,u.id,S.jetzt());
  var el=document.getElementById('runTimer');
  var banner=document.getElementById('tolBanner');
  if(r.phase==='laufend'){
    el.textContent=S.fmtMs(r.ms);
    el.className='run-timer'+(r.ms<2*60000?' crit':(r.ms<10*60000?' warn':''));
    banner.style.display='none';
  }else if(r.phase==='toleranz'){
    el.textContent=S.fmtMs(r.ms);
    el.className='run-timer crit';
    banner.style.display='';
    banner.textContent='⚠ Die Prüfungszeit ist abgelaufen — Toleranzzeit läuft. Jetzt abgeben! (Abgabe wird als «verspätet» markiert)';
  }else if(r.phase==='beendet'){
    el.textContent='0:00';
    el.className='run-timer crit';
    if(!RUN.autosub&&RUN.abg&&!RUN.abg.abgegebenAm){
      RUN.autosub=true;
      doAbgeben(true);
    }
  }
}
// ── Antworten erfassen ──
function ant(aufgId){
  RUN.abg.antworten=RUN.abg.antworten||{};
  return RUN.abg.antworten[aufgId]=RUN.abg.antworten[aufgId]||{};
}
window.slText=function(aufgId,val){ant(aufgId).text=val;slSaveSoon();};
window.slWert=function(aufgId,feldId,val){
  var a=ant(aufgId);
  a.werte=a.werte||{};
  a.werte[feldId]=val;
  slSaveSoon();
};
window.slMc=function(inp){
  var aufgId=inp.getAttribute('data-aufg');
  var optId=inp.getAttribute('data-opt');
  var a=ant(aufgId);
  a.mc=a.mc||[];
  if(inp.type==='radio'){
    a.mc=[optId];
    document.querySelectorAll('input[name="mc_'+aufgId+'"]').forEach(function(x){
      x.closest('.mc-opt').classList.toggle('on',x.checked);
    });
  }else{
    if(inp.checked){if(a.mc.indexOf(optId)<0)a.mc.push(optId);}
    else a.mc=a.mc.filter(function(x){return x!==optId;});
    inp.closest('.mc-opt').classList.toggle('on',inp.checked);
  }
  slSaveSoon();
};
window.slUpload=function(aufgId){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*,application/pdf';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f)return;
    var u=me();
    var saveState=document.getElementById('runSave');
    if(saveState)saveState.textContent='lädt Datei hoch …';
    S.uploadDatei(f,'schule/'+(RUN.p?RUN.p.orgId:'org')+'/abgaben/'+RUN.p.id,{maxMb:10}).then(function(meta){
      var a=ant(aufgId);
      a.dateien=a.dateien||[];
      a.dateien.push(meta);
      slSaveSoon();
      renderRunnerUploads(aufgId);
    }).catch(function(e){
      GemaDialog.alert({title:'Upload',message:e&&e.message||'Upload fehlgeschlagen.'});
      if(saveState)saveState.textContent='';
    });
  };
  inp.click();
};
window.slDateiWeg=function(aufgId,di){
  var a=ant(aufgId);
  (a.dateien||[]).splice(di,1);
  slSaveSoon();
  renderRunnerUploads(aufgId);
};
function renderRunnerUploads(aufgId){
  var host=document.getElementById('upl_'+aufgId);
  if(!host)return;
  var a=ant(aufgId);
  host.innerHTML=(a.dateien||[]).map(function(d,di){
    var src=S.dateiSrc(d);
    return '<div class="img-chip">'+(d.type==='application/pdf'?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'"/>')+
      '<button class="x" onclick="slDateiWeg(\''+aufgId+'\','+di+')">✕</button></div>';
  }).join('');
  updateProgress();
}
// ── Autosave ──
function slSaveSoon(){
  RUN.dirty=true;
  updateProgress();
  var el=document.getElementById('runSave');
  if(el)el.textContent='speichert …';
  clearTimeout(RUN.saveTimer);
  RUN.saveTimer=setTimeout(slFlush,1400);
}
function slFlush(){
  clearTimeout(RUN.saveTimer);
  if(!RUN.dirty||!RUN.abg)return;
  RUN.dirty=false;
  var f=S.fortschritt(RUN.p,RUN.abg);
  RUN.abg.fortschritt={beantwortet:f.beantwortet,total:f.total};
  S.saveAbgabe(RUN.abg).then(function(){
    var el=document.getElementById('runSave');
    if(el)el.textContent='✓ gespeichert '+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(){
    // Cloud-Push fehlgeschlagen: lokal ist alles gesichert; dirty wieder
    // setzen, damit das 20-s-Intervall den Push automatisch nachholt.
    RUN.dirty=true;
    var el=document.getElementById('runSave');
    if(el)el.textContent='⚠ offline — lokal gesichert, wird nachgeholt';
  });
}
setInterval(function(){if(RUN.dirty)slFlush();},20000);
window.addEventListener('pagehide',slFlush);
document.addEventListener('visibilitychange',function(){if(document.hidden)slFlush();});
// ── Abgeben ──
window.slAbgeben=function(){
  if(!RUN.p||!RUN.abg)return;
  var f=S.fortschritt(RUN.p,RUN.abg);
  var msg='Prüfung jetzt abgeben?';
  if(f.beantwortet<f.total)msg='⚠ '+(f.total-f.beantwortet)+' Aufgabe(n) sind noch unbeantwortet. Trotzdem abgeben?';
  GemaDialog.confirm({title:'Prüfung abgeben',message:msg+' Nach der Abgabe sind keine Änderungen mehr möglich.',confirmLabel:'Abgeben'}).then(function(ok){
    if(!ok)return;
    doAbgeben(false);
  });
};
function doAbgeben(auto){
  var u=me();
  if(!RUN.p||!RUN.abg||RUN.abg.abgegebenAm)return;
  var fen=S.fenster(RUN.p,u.id);
  var now=S.jetzt();
  RUN.abg.abgegebenAm=S.jetztIso();
  RUN.abg.verspaetet=!!(fen.ende&&now>fen.ende);
  RUN.abg.autoAbgabe=!!auto;
  RUN.dirty=true;
  slFlush();
  stopTick();
  // Dozent benachrichtigen
  var p=RUN.p;
  var doz=p.erstelltVon;
  if(doz&&doz!==u.id){
    try{
      GemaNotify.push({
        eventKey:'schule_abgabe_eingegangen',empfaengerUserId:doz,modul:'schule',typ:'info',
        titel:'Abgabe: '+(u.name||u.username||''),
        text:'«'+p.titel+'» — '+(RUN.abg.fortschritt?RUN.abg.fortschritt.beantwortet+'/'+RUN.abg.fortschritt.total+' beantwortet':'abgegeben')+(RUN.abg.verspaetet?' · verspätet':''),
        link:'ab_pruefungen.html?p='+p.id
      });
    }catch(e){}
  }
  document.getElementById('abgBar').classList.remove('show');
  document.getElementById('runBody').innerHTML=
    '<div class="empty" style="background:var(--grn-bg);border-color:var(--grn-bd)"><div class="big">✅</div>'+
    '<div style="font-weight:900;font-size:17px;color:var(--grn);margin-bottom:6px">'+(auto?'Zeit abgelaufen — automatisch abgegeben':'Prüfung abgegeben')+'</div>'+
    '<div style="font-size:13px;color:var(--txt2)">'+(RUN.abg.verspaetet?'Die Abgabe erfolgte in der Toleranzzeit und ist als «verspätet» markiert.<br>':'')+
    (p.nachAbgabeEinsehen!==false?'Du kannst deine Abgabe in der Übersicht weiterhin einsehen.':'Die Abgabe ist eingereicht — die Einsicht ist bis zur Veröffentlichung der Resultate deaktiviert.')+'</div>'+
    '<button class="btn primary" style="margin-top:16px" onclick="slRunnerSchliessen()">→ Zur Übersicht</button></div>';
  document.getElementById('tolBanner').style.display='none';
}

// ═══════ Einsicht (nach Abgabe) & Resultat (nach Publish) ═══════
window.slEinsicht=function(pid){
  var p=S.pruefungById(pid);
  if(!p||p.nachAbgabeEinsehen===false)return;
  S.loadMeineAbgabe(pid).then(function(abg){
    if(!abg)return;
    renderErgebnis(p,abg,null,false);
  });
};
window.slResultat=function(pid){
  var p=S.pruefungById(pid);
  if(!p||!p.publiziertAm)return;
  S.loadMeineAbgabe(pid).then(function(abg){
    if(!abg)return;
    if(p.loesungNachPublish){
      // Lösung NUR in den Speicher laden (nie in localStorage)
      S.loadLoesungMem(pid).then(function(loes){
        renderErgebnis(p,abg,loes,true);
      });
    }else{
      renderErgebnis(p,abg,null,true);
    }
  });
};
window.slResSchliessen=function(){
  document.getElementById('resOv').classList.remove('open');
  document.body.style.overflow='';
};
function renderErgebnis(pub,abg,loes,publiziert){
  var u=me();
  var p=loes?S.mergePruefung(pub,loes):pub;
  document.getElementById('resTitle').textContent=(publiziert?'Resultat — ':'Meine Abgabe — ')+p.titel;
  var max=S.totalPunkte(p);
  var h='';
  if(publiziert){
    var ap=S.abgabePunkte(p,abg);
    var note=(abg.noteManuell!=null&&abg.noteManuell!=='')?parseFloat(abg.noteManuell):S.note(ap.punkte,max,p.rundung);
    h+='<div class="panel"><div class="panel-body" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">'+
      '<div class="res-note" style="color:'+S.noteFarbe(note)+'">'+S.noteFmt(note)+'</div>'+
      '<div><div style="font-size:15px;font-weight:800">'+ap.punkte+' von '+max+' Punkten</div>'+
      '<div style="font-size:12px;color:var(--mut)">Abgegeben '+S.fmtZeit(abg.abgegebenAm)+(abg.verspaetet?' · verspätet':'')+(abg.korrigiertVon?' · korrigiert von '+esc(abg.korrigiertVon):'')+'</div></div>'+
    '</div></div>';
  }else{
    h+='<div class="panel"><div class="panel-body" style="font-size:13px;color:var(--txt2)">✓ Abgegeben '+S.fmtZeit(abg.abgegebenAm)+(abg.verspaetet?' · <b style="color:var(--amb)">verspätet</b>':'')+' — die Korrektur ist noch nicht veröffentlicht.</div></div>';
  }
  var aufgList=mischAufgabenFuer(p,u?u.id:'');
  aufgList.forEach(function(a,i){
    var antw=(abg.antworten||{})[a.id]||{};
    var kor=(abg.korrektur||{})[a.id]||{};
    h+='<div class="panel"><div class="panel-hd"><span>'+({freitext:'✍️',mc:'☑️',berechnung:'🧮'}[a.typ]||'')+'</span>'+
      '<span class="panel-hd-title">Aufgabe '+(i+1)+(a.titel?' — '+esc(a.titel):'')+'</span>'+
      (publiziert?'<span class="chip" style="font-weight:900">'+(kor.punkte!=null&&kor.punkte!==''?kor.punkte:'–')+' / '+(a.punkte||0)+' P.</span>':'<span class="chip">'+(a.punkte||0)+' P.</span>')+
      '</div><div class="panel-body">'+
      '<div class="frage" style="color:var(--txt2);font-size:13px">'+esc(a.frage||'')+'</div>';
    // Meine Antwort
    if(a.typ==='mc'){
      var sel=antw.mc||[];
      h+='<div style="margin-top:9px">'+(a.mcOptionen||[]).map(function(o){
        var isSel=sel.indexOf(o.id)>=0;
        var korrekt=(loes&&o.korrekt);
        return '<div class="mc-opt'+(isSel?' on':'')+'" style="cursor:default">'+(isSel?'☑':'◻')+' <span>'+esc(o.text||'')+'</span>'+
          (korrekt?'<span style="margin-left:auto;color:var(--grn);font-weight:800;font-size:11.5px">✓ richtig</span>':'')+'</div>';
      }).join('')+'</div>';
    }else{
      var txt=(antw.text||'').trim();
      var marked=kor.markierteZeilen||[];
      if(txt)h+='<div class="ans-view">'+txt.split('\n').map(function(line,li){
        return marked.indexOf(li)>=0?'<span class="marked-line">'+esc(line||' ')+'</span>':esc(line||' ');
      }).join('\n')+'</div>';
      else h+='<div class="ans-view" style="color:var(--mut)">Keine Text-Antwort.</div>';
    }
    if((a.antwortFelder||[]).length){
      h+='<div style="margin-top:8px;font-size:13px">'+(a.antwortFelder||[]).map(function(f){
        var w=(antw.werte||{})[f.id];
        var sollTxt=(loes&&f.loesung!=null&&f.loesung!=='')?' <span style="color:var(--grn);font-weight:700">(Lösung: '+esc(f.loesung)+(f.einheit?' '+esc(f.einheit):'')+')</span>':'';
        return '<div>• '+esc(f.label||'')+': <b>'+esc(w==null||w===''?'—':w)+(f.einheit?' '+esc(f.einheit):'')+'</b>'+sollTxt+'</div>';
      }).join('')+'</div>';
    }
    // Dateien (annotierte Version zeigen, falls vorhanden)
    var dateien=antw.dateien||[];
    if(dateien.length){
      h+='<div class="img-chips">'+dateien.map(function(d,di){
        var annot=publiziert&&kor.annotiert&&kor.annotiert[di];
        var src=annot?(annot.url||annot.dataUrl):S.dateiSrc(d);
        return '<a class="img-chip" href="'+esc(src)+'" target="_blank" rel="noopener" style="width:130px;height:96px">'+
          (d.type==='application/pdf'&&!annot?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'"/>')+'</a>'+
          (annot?'<div style="font-size:10.5px;color:var(--red);font-weight:700;align-self:center">✏️ mit Korrektur-Anmerkungen</div>':'');
      }).join('')+'</div>';
    }
    // Kommentar + Lösung
    if(publiziert&&kor.kommentar)h+='<div class="kor-comment"><b>Kommentar:</b> '+esc(kor.kommentar)+'</div>';
    if(loes&&(a.loesung||(a.loesungBilder||[]).length)){
      h+='<div class="loes-box"><div class="loes-label">Musterlösung</div>'+esc(a.loesung||'');
      if((a.loesungBilder||[]).length){
        h+='<div class="img-chips">'+(a.loesungBilder||[]).map(function(b){
          var src=S.dateiSrc(b);
          return '<a class="img-chip" href="'+esc(src)+'" target="_blank" rel="noopener">'+(b.type==='application/pdf'?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'"/>')+'</a>';
        }).join('')+'</div>';
      }
      h+='</div>';
    }
    h+='</div></div>';
  });
  document.getElementById('resBody').innerHTML=h;
  document.getElementById('resOv').classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('resOv').scrollTop=0;
}
function mischAufgabenFuer(p,uid){
  var arr=(p.aufgaben||[]).slice();
  return p.mischen?S.shuffle(arr,p.id+'|'+uid):arr;
}

// ═══════ Boot ═══════
document.addEventListener('DOMContentLoaded',function(){
  try{renderList();}catch(e){}
  var t=new Promise(function(res){setTimeout(res,6000);});
  Promise.race([S.bind({loesungen:false}),t]).then(function(){
    // Erst auf den Serverzeit-Abgleich warten — Gruppierung und
    // Deep-Link-Phasen-Check dürfen nie auf der Gerätuhr entscheiden.
    return S.syncZeit();
  }).then(function(){
    _cloudLoaded=true;
    if(S.istStudent())S.refreshStudentMods();
    S.scanErinnerungen();
    renderList();
    try{
      var params=new URLSearchParams(location.search);
      var pid=params.get('p');
      if(pid){
        var p=S.pruefungById(pid);
        var u=me();
        if(p&&u){
          var r=S.rest(p,u.id,S.jetzt());
          if(p.publiziertAm)slResultat(pid);
          else if(r.phase==='laufend'||r.phase==='toleranz')slStart(pid);
        }
      }
    }catch(e){}
  });
  // Countdown in der Liste alle 30 s auffrischen
  setInterval(function(){
    if(!document.getElementById('runOv').classList.contains('open')&&
       !document.getElementById('resOv').classList.contains('open'))renderList();
  },30000);
  if(typeof GemaFeedback!=='undefined')GemaFeedback.init('pruefung_live','Meine Prüfungen');
});
})();
</script>
<script src="gema_scroll.js"></script>
<script src="gema_mobile_menu.js"></script>
</body>
