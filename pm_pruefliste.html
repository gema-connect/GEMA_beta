<!DOCTYPE html>
<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_editlock.js"></script>
<script src="gema_recent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GEMA"/>
<title>Prüfliste – GEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#0e7490;--acc-bg:#ecfeff;--acc-bd:#a5f3fc;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --viol:#7c3aed;--viol-bg:#f5f3ff;--viol-bd:#ddd6fe;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}

/* NAV */
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}

/* PAGE */
.pg{max-width:1100px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:16px 20px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a 0%,#334155 45%,#0e7490 100%);position:relative;overflow:hidden;box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hero-title{font-size:17px;font-weight:900;color:#fff;letter-spacing:-.2px}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;line-height:1.4}

/* TABBAR */
.tabbar{display:flex;gap:6px;margin-bottom:12px;background:var(--sur);border:1.5px solid var(--brd);border-radius:12px;padding:5px}
.tabbar button{flex:1;padding:9px 8px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--acc);color:#fff}

/* TOOLBAR */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tb select{flex:1;min-width:150px;padding:11px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);color:var(--txt);outline:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13.5px;font-weight:700;cursor:pointer;min-height:44px;white-space:nowrap;transition:.12s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.ghost{border-style:dashed;background:transparent;color:var(--mut)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12.5px}

/* STATUS-CHIPS FILTER */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.kpi b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.kpi span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}

/* KARTEN */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:.12s}
.card:active{transform:scale(.985)}
.card-bar{height:5px}
.card-bd{padding:12px 14px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-nr{font-size:12px;font-weight:900;color:var(--acc);background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:6px;padding:2px 8px}
.card-title{font-size:14.5px;font-weight:800;line-height:1.3;margin-bottom:4px;word-break:break-word}
.card-meta{font-size:12px;color:var(--mut);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-left:auto;white-space:nowrap}
.b-offen{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.b-abgeschlossen{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.empty{padding:38px 16px;text-align:center;color:var(--mut);font-size:14px;background:var(--sur);border:1.5px dashed var(--brd2);border-radius:14px}

/* VOLLBILD-EDITOR */
.ov{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;flex-direction:column}
.ov.open{display:flex}
.ov-hd{background:var(--sur);border-bottom:1.5px solid var(--brd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0}
.ov-back{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:17px;cursor:pointer;flex-shrink:0}
.ov-title{font-size:15px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* Aktionsleiste OBEN (Muster pm_erp #edFt): kleine, einheitliche Buttons, horizontal scrollbar */
.ov-ft{background:var(--sur);border-bottom:1.5px solid var(--brd);padding:7px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.ov-ft::-webkit-scrollbar{height:0}
.ov-ft .btn{flex:0 0 auto;min-width:auto;min-height:32px;padding:6px 12px;font-size:12.5px;border-radius:8px;font-weight:700}
.ov-ft .gema-feedback-btn{margin-left:auto;flex:0 0 auto;padding:6px 11px;font-size:12px}
.wrap{max-width:820px;margin-left:auto;margin-right:auto}
.sec{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sec-hd{padding:11px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.sec-hd h3{font-size:13.5px;font-weight:800}
.sec-hd .hint{font-size:11px;color:var(--mut);font-weight:600;margin-left:auto}
/* Aufklappbarer Sektions-Kopf + Chip-Mehrfachauswahl (Feedback 28.07.2026) */
.sec-fold{cursor:pointer;user-select:none}
.sec-fold:hover{background:var(--brd,#e5e7eb)}
.fold-caret{display:inline-block;width:12px;font-size:10px;color:var(--mut)}
.chipsel{display:flex;flex-wrap:wrap;gap:7px}
.chipsel .chip{min-height:34px;padding:6px 12px;font-size:12px}
.chipsel .chip:disabled{opacity:.55;cursor:not-allowed}
/* Prüfart-Zeile + Bauteil-Block (Feedback 28.07.2026) */
.pruefart{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--brd2)}
.pa-lbl{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-right:2px}
.ans-btn.sm{padding:5px 11px;font-size:12px;min-height:32px}
.bauteil{border:1px solid var(--brd2);border-radius:9px;padding:9px 11px;margin-bottom:9px;background:var(--sur2)}
.bt-hd{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.sec-bd{padding:13px 14px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:15px;background:var(--sur);color:var(--txt);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{min-height:70px;resize:vertical;line-height:1.45}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fld-row{grid-template-columns:1fr}}

/* ANLAGE + PRÜFPUNKTE */
.anlage{border:1.5px solid var(--brd2);border-radius:14px;margin-bottom:12px;background:var(--sur);overflow:hidden}
.anlage-hd{padding:10px 12px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anlage-ic{font-size:18px;flex-shrink:0}
.anlage-hd input{flex:1;min-width:120px;padding:9px 10px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;font-weight:700;background:var(--sur);outline:none}
.anlage-hd input.small{flex:0 1 150px;font-weight:600;font-size:13px}
.anlage-bd{padding:11px 12px}
.pkt{border:1.5px solid var(--brd);border-radius:11px;padding:10px;margin-bottom:8px;background:var(--sur2)}
.pkt-hd{display:flex;align-items:flex-start;gap:8px}
.pkt-t{flex:1;min-width:0}
.pkt-name{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.pkt-sub{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:5px}
.q-global{background:#eef2ff;color:#4338ca}
.q-org{background:var(--acc-bg);color:var(--acc)}
.q-objekt{background:var(--viol-bg);color:var(--viol)}
.q-begehung{background:var(--amber-bg);color:var(--amber)}
.pflicht-star{color:var(--red);font-weight:900}
.pkt-tools{display:flex;gap:6px;flex-shrink:0}
/* Feedback 29.07.2026: Notiz-/Lösch-Buttons grösser + klar sichtbar — die
   🗑-Emoji rendert v.a. auf iOS als dünne, blasse Glyphe; ein getönter
   Hintergrund + Rahmen macht die Aktion erkennbar. .row-del war vorher ein
   komplett UNGESTYLTER Browser-Button. */
.icobtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.icobtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.icobtn .cnt{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.row-del{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--red-bd);background:var(--red-bg);color:var(--red);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-del:active,.icobtn:active{transform:scale(.94)}
.ov-ft .btn.red{font-size:15px;padding:6px 10px}
.ans{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ans-btn{padding:8px 12px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer;min-height:40px}
.ans-btn.on{color:#fff}
.ans-btn.on.on-gut{background:var(--grn);border-color:var(--grn)}
.ans-btn.on.on-maessig{background:var(--amber);border-color:var(--amber)}
.ans-btn.on.on-schlecht{background:var(--red);border-color:var(--red)}
.ans-btn.on.on-nicht_bewertet{background:var(--mut);border-color:var(--mut)}
.ans input.numin,.ans input.txtin{padding:9px 11px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;background:var(--sur);outline:none;min-height:40px}
.ans input.numin{width:120px}.ans input.txtin{flex:1;min-width:150px}
/* Feedback 29.07.2026: iPad/Handy kompakter — die Antwort-Buttons
   (vorhanden / nicht vorhanden / nicht beurteilbar) und die Bedienelemente
   der Liste waren auf Touch-Geräten zu wuchtig. Greift auf schmalen Fenstern
   UND auf allen Touch-Geräten (auch iPad quer, 1024px+). Nur Buttons/Chips
   schrumpfen — Eingabefelder bleiben ≥16px (iOS-Fokus-Zoom-Regel). */
@media (max-width:820px), (hover:none) and (pointer:coarse){
  .ans-btn{padding:6px 10px;font-size:12px;min-height:34px;border-radius:8px}
  .ans-btn.sm{padding:4px 9px;font-size:11px;min-height:29px}
  .ans{gap:5px;margin-top:7px}
  .ans input.numin,.ans input.txtin{min-height:34px;padding:7px 10px}
  .btn{min-height:40px;padding:9px 13px;font-size:13px}
  .btn.sm{min-height:33px;padding:6px 10px;font-size:12px}
  .chip{min-height:33px;padding:6px 11px;font-size:12px}
  .tb select{padding:9px 10px;min-width:130px}
  .kpi{padding:8px 10px}
  .kpi b{font-size:17px}
  .kpi span{font-size:9px}
  .pkt{padding:9px}
  .anlage-hd{padding:8px 10px}
  .anlage-hd input{padding:8px 9px}
}
.bw-chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.bw-gut{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.bw-maessig{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.bw-schlecht{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.bw-nicht_bewertet{background:#f1f5f9;color:var(--mut);border:1px solid var(--brd2)}
.pkt-more{margin-top:9px;padding-top:9px;border-top:1px dashed var(--brd2);display:none}
.pkt-more.open{display:block}
.pkt-more label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin:8px 0 4px}
.pkt-more select,.pkt-more textarea{width:100%;padding:9px 10px;border:1.5px solid var(--brd2);border-radius:9px;font-size:13.5px;background:var(--sur);outline:none}
/* Empfehlungs-Vorlagen als wählbare Chips (Feedback 29.07.2026) */
.empf-chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.empf-chip{padding:7px 11px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur);font-size:12.5px;font-weight:600;color:var(--txt2);cursor:pointer;text-align:left;line-height:1.35;max-width:100%}
.empf-chip.on{border-color:var(--grn);background:#f0fdf4;color:#15803d}
/* Bauteil-Felder einzeln wählbar (Feedback 29.07.2026, Prüfpunkt-Editoren) */
.btsel{display:flex;flex-wrap:wrap;gap:8px}
.btchk{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1.5px solid var(--brd2);border-radius:9px;background:var(--sur);font-size:13px;font-weight:600;color:var(--txt2);cursor:pointer}
.btchk input{width:17px;height:17px;accent-color:var(--acc);margin:0}
.btchk:has(input:checked){border-color:var(--acc);background:#ecfeff}
.pkt-more textarea{min-height:54px;resize:vertical;line-height:1.4}
.fotos{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.foto{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1.5px solid var(--brd);background:#000}
.foto img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.foto .fx{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:6px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;line-height:1}
.foto .fx.fshare{right:auto;left:2px;background:rgba(29,78,216,.75)}
/* Foto wartet noch auf den Bucket (offline aufgenommen) */
.foto.wartet{border-color:#f59e0b}
.foto .foto-wait{position:absolute;left:2px;bottom:2px;background:rgba(245,158,11,.94);color:#fff;font-size:10px;border-radius:5px;padding:1px 4px;line-height:1.35}
.foto .foto-fehlt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#f1f5f9;color:#94a3b8}
/* Titelbild (Deckblatt des Berichts) */
.titelbild{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.titelbild .tb-add{width:52px;height:52px;font-size:19px}
.titelbild .tb-hint{font-size:11.5px;color:var(--mut);font-weight:600}
.titelbild .tb-empty{font-size:12px;color:var(--mut);font-weight:600}
.tb-prev{position:relative;width:100%;max-width:280px;border-radius:11px;overflow:hidden;border:1.5px solid var(--brd);background:#000}
.tb-prev img{display:block;width:100%;max-height:170px;object-fit:cover;cursor:pointer}
.tb-prev .fx{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:7px;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.art-grid{display:flex;gap:7px;flex-wrap:wrap}
.art-chip{padding:9px 13px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:42px}
.art-chip:active{background:var(--acc-bg);border-color:var(--acc-bd)}

/* BEWERTUNGS-KPI (Begehung) */
.bwkpi{display:flex;gap:7px;flex-wrap:wrap}
.bwkpi .b{flex:1;min-width:78px;border:1.5px solid var(--brd);border-radius:11px;padding:8px 10px;text-align:center;background:var(--sur)}
.bwkpi .b b{font-size:19px;font-weight:900;display:block}
.bwkpi .b span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}

/* VERWALTUNG-Tabellen/Zeilen */
.vseg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.vseg button{padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:800;color:var(--mut);cursor:pointer}
.vseg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vrow{border:1.5px solid var(--brd);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:var(--sur);display:flex;align-items:flex-start;gap:10px}
.vrow.inaktiv{opacity:.55}
.vrow .vt{flex:1;min-width:0}
.vrow .vn{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.vrow .vs{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vrow .vtools{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:5px;background:#f1f5f9;color:var(--mut)}
.subhd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.subhd::after{content:'';flex:1;height:1px;background:var(--brd)}

/* MODALS */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:15px;font-weight:900;flex:1}
.modal-x{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer}
/* Feedback aus dem Modal heraus — die Modals verdecken die Nav (und damit den
   Nav-Feedback-Knopf), sonst gäbe es in diesen Ansichten kein Feedback. */
.modal-x.fb-x{border-color:#fecaca;background:#fef2f2}
.modal-bd{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0}
.modal-ft .btn{flex:1}
.dup{background:var(--amber-bg);border:1.5px solid var(--amber-bd);border-radius:11px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:#92400e}
.dup .dupitem{display:flex;gap:8px;align-items:center;margin-top:6px}
.dup .dupitem .dn{flex:1;font-weight:700}
.radio-list{display:flex;flex-direction:column;gap:7px}
.radio-list label{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:600}
.radio-list label.on{border-color:var(--acc);background:var(--acc-bg)}
.radio-list input{margin-top:2px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1200;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* Speicher-Status unten rechts (Kanon if_trocknung/pm_erp/pm_abnahme) —
   der Vollbild-Editor liegt bei z-index 900, das Badge MUSS darüber. */
.save-status{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;z-index:1150;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--brd2);box-shadow:0 8px 24px rgba(15,23,42,.14);font-size:12.5px;font-weight:600;color:var(--txt);transition:opacity .25s,transform .25s}
.save-status.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
.save-status .save-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
.save-status .save-spinner{width:14px;height:14px;border:2px solid var(--brd2);border-top-color:#2563eb;border-radius:50%;animation:saveSpin .7s linear infinite}
.save-status .save-check{color:#16a34a;font-weight:800;font-size:14px}
.save-status .save-err{color:#dc2626;font-weight:800;font-size:14px}
.save-status.pending{color:#64748b}
.save-status.saving{color:#2563eb;border-color:#bfdbfe}
.save-status.saved{color:#16a34a;border-color:#bbf7d0;background:#f0fdf4}
.save-status.error{color:#dc2626;border-color:#fecaca;background:#fef2f2}
@keyframes saveSpin{to{transform:rotate(360deg)}}
@media(max-width:640px){.save-status{bottom:calc(14px + env(safe-area-inset-bottom));right:14px;padding:6px 11px;font-size:11.5px}}
@media print{.g-nav,.no-print,.save-status{display:none!important}}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PRÜFLISTE — Begehungen, individuelle & Standard-Prüfpunkte, Bericht
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/*ENGINE-START*/
/* DOM-frei, Node-testbar (window._prEngine). Alle Bewertungs-/Duplikat-/
   Merge-Logik lebt hier. */

var PR_ANTWORTTYPEN = {
  ja_nein_nb: { label:'Ja / Nein / n.b.', kurz:'Ja/Nein', kind:'select', optionen:[
    { v:'ja',   l:'Ja',                bewertung:'gut' },
    { v:'nein', l:'Nein',              bewertung:'schlecht' },
    { v:'nb',   l:'nicht beurteilbar', bewertung:'nicht_bewertet' } ] },
  /* «nicht vorhanden» ist KEIN Mangel: es gibt nichts zu beurteilen → Zustand
     entfällt (grau, nicht bearbeitbar) statt «schlecht» (User-Entscheid 07/2026). */
  vorhanden_nb: { label:'vorhanden / nicht vorhanden / n.b.', kurz:'Vorhanden', kind:'select', optionen:[
    { v:'vorhanden',       l:'vorhanden',          bewertung:'gut' },
    { v:'nicht_vorhanden', l:'nicht vorhanden',    bewertung:'nicht_bewertet' },
    { v:'nb',              l:'nicht beurteilbar',  bewertung:'nicht_bewertet' } ] },
  zustand: { label:'gut / mässig / schlecht / nicht geprüft', kurz:'Zustand', kind:'select', optionen:[
    { v:'gut',            l:'gut',            bewertung:'gut' },
    { v:'maessig',        l:'mässig',         bewertung:'maessig' },
    { v:'schlecht',       l:'schlecht',       bewertung:'schlecht' },
    { v:'nicht_geprueft', l:'nicht geprüft',  bewertung:'nicht_bewertet' } ] },
  /* «nicht beurteilbar» seit Prüfbericht-Feedback 30.07.2026 (Bericht 1, S. 4) —
     Option ANGEHÄNGT, bestehende Werte bleiben unangetastet (Bestandsschutz). */
  auffaellig: { label:'keine Auffälligkeit / Auffälligkeit / n.b.', kurz:'Auffälligkeit', kind:'select', optionen:[
    { v:'keine',     l:'keine Auffälligkeit',      bewertung:'gut' },
    { v:'vorhanden', l:'Auffälligkeit vorhanden',  bewertung:'schlecht' },
    { v:'nb',        l:'nicht beurteilbar',        bewertung:'nicht_bewertet' } ] },
  /* Feedback 28.07.2026 */
  sichtbar_nb: { label:'sichtbar / nicht sichtbar / k.A.', kurz:'Sichtbar', kind:'select', optionen:[
    { v:'sichtbar',       l:'sichtbar',       bewertung:'gut' },
    { v:'nicht_sichtbar', l:'nicht sichtbar', bewertung:'nicht_bewertet' },
    { v:'ka',             l:'k.A.',           bewertung:'nicht_bewertet' } ] },
  /* skala:'intensitaet' — der Zustand heisst hier tief/mittel/hoch statt
     gut/mässig/schlecht (Feedback 29.07.2026: ein Geruch ist nicht «gut»,
     seine Intensität ist tief/mittel/hoch). Intern bleiben die Werte
     gut/maessig/schlecht — Aggregation, Ampel und Altdaten unverändert. */
  geruch: { label:'Geruchsemission: feststellbar / keine Auffälligkeiten', kurz:'Geruch', kind:'select',
    pruefart:true, skala:'intensitaet', optionen:[
    { v:'keine',         l:'keine Auffälligkeiten', bewertung:'gut' },
    { v:'feststellbar',  l:'feststellbar',          bewertung:'schlecht' },
    { v:'nb',            l:'nicht beurteilbar',     bewertung:'nicht_bewertet' } ] },
  zahl: { label:'Zahleneingabe',     kurz:'Zahl', kind:'zahl' },
  text: { label:'kurze Texteingabe', kurz:'Text', kind:'text' }
};
var PR_ANTWORTTYP_DEFAULT = 'ja_nein_nb';

/* Prüfart bei Antworttypen mit pruefart:true (z.B. Geruchsemission) */
var PR_PRUEFARTEN = [
  { v:'nasal',     l:'Nasal' },
  { v:'messgeraet', l:'Messgerät' }
];

/* Bauteil-Angaben (Feedback 28.07.2026) — nur bei Prüfpunkten mit `bauteil:true`.
   Alle Felder sind Freitext; Hersteller/Material bieten zusätzlich Vorschläge. */
var PR_HERSTELLER = ['Biral','Hänny','Kessel','VonRoll','ACO','Jung Pumpen','Grundfos','Nussbaum','Geberit'];
var PR_MATERIALIEN = ['Kunststoff','Gusseisen','Stahl','CNS (Chromstahl)','Steinzeug','Beton','Kupfer'];

/* Nutzungen der Liegenschaft (Feedback 28.07.2026, Objekt-Ebene, mehrfach) */
var PR_NUTZUNGEN = [
  { id:'wohnungen',  label:'Wohnungen' },
  { id:'ladenlokal', label:'Ladenlokal' },
  { id:'restaurant', label:'Restaurant' },
  { id:'bar',        label:'Bar' },
  { id:'buero',      label:'Büro' },
  { id:'andere',     label:'andere' }
];
function prNutzungLabel(id){
  var n=PR_NUTZUNGEN.filter(function(x){return x.id===id;})[0];
  return n?n.label:String(id||'');
}
/** Nutzungen einer Begehung als lesbare Zeile («andere» → Freitext). */
function prNutzungenText(b){
  b=b||{};
  var ids=Array.isArray(b.nutzungen)?b.nutzungen:[];
  var out=ids.map(function(id){
    if(id==='andere') return String(b.nutzungFrei||'').trim() || 'andere';
    return prNutzungLabel(id);
  }).filter(Boolean);
  return out.join(' · ');
}

/* Art der Begehung (Feedback 28.07.2026) — steuert Karten- und Bericht-Titel. */
var PR_ARTEN = [
  { id:'begehung',        label:'Begehung' },
  { id:'kontrolle',       label:'Kontrolle' },
  { id:'zustandsanalyse', label:'Zustandsanalyse' },
  { id:'einschaetzung',   label:'Einschätzung' }
];
/* «frei» blendet ein Textfeld ein — die Art ist damit auch beschreibbar
   (Feedback 28.07.2026), z.B. «Zustandsaufnahme vor Umbau». */
PR_ARTEN.push({ id:'frei', label:'Eigene Bezeichnung …' });
function prArtLabel(id, frei){
  if(id==='frei') return String(frei||'').trim() || 'Begehung';
  var a=PR_ARTEN.filter(function(x){return x.id===id;})[0];
  return a?a.label:'Begehung';
}

var PR_BEWERTUNGEN = {
  gut:            { label:'gut',           farbe:'#16a34a' },
  maessig:        { label:'mässig',        farbe:'#d97706' },
  schlecht:       { label:'schlecht',      farbe:'#dc2626' },
  nicht_bewertet: { label:'nicht bewertet', farbe:'#94a3b8' }
};
/* Zustands-Auswahl im Editor: «nicht bewertet» steht ZUERST — der Zustand wird
   nie automatisch gesetzt (Feedback 25.07.2026), das Feld startet also leer. */
var PR_BEWERTUNG_REIHE = ['nicht_bewertet','gut','maessig','schlecht'];

/* Zustands-Skalen (Feedback 29.07.2026): die WERTE bleiben überall
   gut/maessig/schlecht — nur die BESCHRIFTUNG folgt dem Antworttyp
   (skala:'intensitaet' → tief/mittel/hoch, z.B. Geruchsemission). */
var PR_ZUSTAND_SKALEN = {
  standard:    { gut:'gut',  maessig:'mässig', schlecht:'schlecht', nicht_bewertet:'nicht bewertet' },
  intensitaet: { gut:'tief', maessig:'mittel', schlecht:'hoch',     nicht_bewertet:'nicht bewertet' }
};
function prZustandSkala(antworttyp){
  var t=PR_ANTWORTTYPEN[antworttyp];

/* Bauteil-Felder EINZELN wählbar (Feedback 29.07.2026): `bauteilFelder` =
   {hersteller:true,…} am Punkt; Legacy `bauteil:true` ohne das Objekt = alle

var PR_BAUTEIL_FELDER = [
  { id:'hersteller', label:'Hersteller' },
  { id:'typ',        label:'Typ' },
  { id:'baujahr',    label:'Baujahr' },
  { id:'material',   label:'Material' },

];
function prBauteilFelder(def){

  if(f && typeof f==='object'){
    return PR_BAUTEIL_FELDER.map(function(x){return x.id;}).filter(function(id){ return !!f[id]; });
  }
  /* Legacy bauteil:true = die klassischen VIER Felder (Bestandsschutz) —
     «Letzte Wartung / Ersatz» erscheint nur, wenn es explizit gewählt ist. */

/* Laufende Nummer bei mehrfach vorhandenen gleichen Prüfpunkten in einer
   Anlage (Feedback 30.07.2026: «2. gleicher Prüfpunkt → Nummerierung 1/2/…»).
   Reine ANZEIGE — die Bezeichnung im Datensatz bleibt unverändert, damit der
   Standardlisten-Sync sie weiter nachziehen kann. '' wenn eindeutig. */
function prPunktNr(anlage, pi){
  var punkte=(anlage&&anlage.punkte)||[];
  var p=punkte[pi]; if(!p) return '';
  var key=String(p.bezeichnung||'').trim().toLowerCase();
  if(!key) return '';
  var gleiche=[], idx=-1;
  punkte.forEach(function(r,i){
    if(String(r.bezeichnung||'').trim().toLowerCase()===key){ if(i===pi) idx=gleiche.length; gleiche.push(i); }
  });
  return (gleiche.length>1 && idx>=0) ? String(idx+1) : '';
}

/* Empfehlungs-Vorlagen: EINE pro Zeile — in der Begehung einzeln wählbar

function prEmpfItems(e){
  return String(e||'').split(/\n+/).map(function(s){ return s.replace(/^[-•*]\s*/,'').trim(); }).filter(Boolean);

/* Vorlagen-Änderungen in OFFENE Berichte nachziehen (Feedback 29.07.2026).
   anlage.punkte wird gegen die aktuelle effektive Standardliste gemergt:
   – neue aktive Punkte werden ANGEHÄNGT (unbeantwortet),
   – bestehende (Match über punktId) bekommen die Definitions-Felder
     nachgezogen (Bezeichnung, Untergruppe, Pflicht, Empfehlungs-Vorlage,
     Bauteil-Flags; Antworttyp NUR solange unbeantwortet),
   – Nutzer-Daten (Antwort, Zustand, Bemerkung, eigene Empfehlung, Fotos)
     bleiben IMMER unangetastet; individuelle Punkte (quelle 'begehung')
     ebenso; entfernte/deaktivierte Punkte werden NIE gelöscht.
   Abgeschlossene Begehungen bleiben Snapshot — der Aufrufer ruft die
   Funktion nur für offene. Rückgabe {neu, aktualisiert}. */
function prSyncPunkte(anlage, effektiv){
  var res={neu:0, aktualisiert:0};
  if(!anlage) return res;
  anlage.punkte=anlage.punkte||[];
  /* Mehrfach eingefügte gleiche Punkte (Feedback 30.07.2026): pro punktId ALLE
     Zeilen führen — jede Kopie bekommt die Definitions-Änderungen nachgezogen. */
  var byId={};
  anlage.punkte.forEach(function(r){ if(r && r.punktId) (byId[r.punktId]=byId[r.punktId]||[]).push(r); });
  (effektiv||[]).forEach(function(p){
    var rows=byId[p.id];
    /* Firmen-Anpassung eines GEMA-Punkts (basisId): bestehende Zeilen offener
       Begehungen laufen unter der GEMA-Id weiter — ohne dieses Match würde die
       Anpassung als NEUER Punkt angehängt und die alte Zeile bliebe stehen
       (Duplikat). Die Zeile behält ihre punktId, bekommt aber die Felder. */
    if((!rows || !rows.length) && p.basisId) rows=byId[p.basisId];
    if(!rows || !rows.length){
      anlage.punkte.push({ key:'pk_sync_'+p.id, punktId:p.id, quelle:p.quelle||'global', individuell:false,
        bezeichnung:p.bezeichnung, untergruppe:p.untergruppe||'', antworttyp:p.antworttyp||'ja_nein_nb', pflicht:!!p.pflicht,
        standardbewertung:p.standardbewertung||'schlecht', empfehlungVorlage:p.empfehlung||'',
        bauteil:!!p.bauteil, bauteilFelder:p.bauteilFelder||null,
        antwort:null, bewertung:'nicht_bewertet', bemerkung:'', empfehlung:'', fotos:[] });
      res.neu++;
      return;
    }
    rows.forEach(function(row){
      if(row.individuell) return;                     // in der Begehung angepasst → nie überschreiben
      var vorher=JSON.stringify([row.bezeichnung,row.untergruppe,row.pflicht,row.standardbewertung,row.empfehlungVorlage,row.bauteil,row.bauteilFelder,row.antworttyp]);
      row.bezeichnung=p.bezeichnung;
      row.untergruppe=p.untergruppe||'';
      row.pflicht=!!p.pflicht;
      row.standardbewertung=p.standardbewertung||'schlecht';
      row.empfehlungVorlage=p.empfehlung||'';
      row.bauteil=!!p.bauteil;
      row.bauteilFelder=p.bauteilFelder||null;
      var unbeantwortet = (row.antwort===undefined||row.antwort===null||row.antwort==='')
        && (row.bewertung==null||row.bewertung==='nicht_bewertet');
      if(unbeantwortet) row.antworttyp=p.antworttyp||'ja_nein_nb';
      var nachher=JSON.stringify([row.bezeichnung,row.untergruppe,row.pflicht,row.standardbewertung,row.empfehlungVorlage,row.bauteil,row.bauteilFelder,row.antworttyp]);
      if(vorher!==nachher) res.aktualisiert++;
    });
  });
  return res;
}

function prAutoBewertung(antworttyp, antwortV){

  var o = null; for(var i=0;i<t.optionen.length;i++){ if(t.optionen[i].v===antwortV){o=t.optionen[i];break;} }
  return (o && o.bewertung) || 'nicht_bewertet';
}
function prAntwortLabel(antworttyp, antwortV){
  var t = PR_ANTWORTTYPEN[antworttyp];

  if(t.kind==='zahl'||t.kind==='text'){
    /* Zahl-/Text-Punkte kennen seit 30.07.2026 «nicht beurteilbar» (antwort='nb') —
       nie den Rohwert «nb» anzeigen. */
    if(antwortV==='nb') return 'nicht beurteilbar';
    return (antwortV==null||antwortV==='')?'':String(antwortV);
  }
  var o = (t.optionen||[]).filter(function(x){return x.v===antwortV;})[0];

}

/* Antworten, bei denen es NICHTS zu beurteilen gibt → Zustand entfällt
   (grau, gesperrt; auch für Altdaten mit gespeicherter Bewertung «schlecht»).
   «nicht vorhanden» seit 07/2026, «nicht beurteilbar»/«nicht sichtbar»/«k.A.»
   und «nicht geprüft» seit Feedback 28.07.2026. */
var PR_ZUSTAND_ENTFAELLT = { nicht_vorhanden:1, nb:1, nicht_sichtbar:1, ka:1, nicht_geprueft:1 };
function prZustandEntfaellt(p){
  return !!(p && p.antwort && PR_ZUSTAND_ENTFAELLT[p.antwort]);
}

/* Zustands-Zusammenzug: zeilen=[{antwort,bewertung,antworttyp?}].
   Prüfbericht-Feedback 30.07.2026 («die Zahlen stimmen nicht» — 7 Prüfpunkte,
   nur 4 gezählt): jeder Punkt landet in GENAU EINER Kategorie, die Summe geht
   immer auf: gut + maessig + schlecht + entfaellt + nicht_bewertet + offen = total.
   - entfaellt      = Antwort in PR_ZUSTAND_ENTFAELLT (nicht vorhanden / n.b. / …)
   - gut/mäss./schl.= gesetzter Zustand zählt IMMER — auch OHNE Antwort (Bericht 2:
                      Hausanschluss «schlecht» bei leerer Antwort wurde als offen
                      verschluckt, weil der offen-Return VOR der Zustands-Zählung lief)
   - offen          = weder Antwort noch Zustand
   - nicht_bewertet = beantwortet, Zustand noch offen
   Die ANZEIGEN fassen offen + nicht_bewertet als «offen» zusammen (alles, was
   noch keiner End-Kategorie zugeordnet ist) und zeigen entfaellt separat. */
function prBegehungBewertung(zeilen){
  var z = { gut:0, maessig:0, schlecht:0, entfaellt:0, nicht_bewertet:0, offen:0, total:0 };
  (zeilen||[]).forEach(function(r){
    z.total++;
    if(prZustandEntfaellt(r)){ z.entfaellt++; return; }
    var bw = r.bewertung;
    if(bw==='gut'||bw==='maessig'||bw==='schlecht'){ z[bw]++; return; }
    var beantwortet = r.antwort!==undefined && r.antwort!==null && r.antwort!=='';
    if(!beantwortet){ z.offen++; return; }
    z.nicht_bewertet++;
  });
  var gesamt = 'nicht_bewertet';
  if(z.schlecht>0) gesamt='schlecht';
  else if(z.maessig>0) gesamt='maessig';
  else if(z.gut>0) gesamt='gut';
  return { gut:z.gut, maessig:z.maessig, schlecht:z.schlecht, entfaellt:z.entfaellt, nicht_bewertet:z.nicht_bewertet, offen:z.offen, total:z.total, gesamt:gesamt };
}

/* Normalisierung + Ähnlichkeit (Duplikat-Erkennung) */
function prNorm(s){
  return String(s||'').toLowerCase()
    .replace(/[äöü]/g,function(m){return {'ä':'ae','ö':'oe','ü':'ue'}[m];})
    .replace(/ß/g,'ss')
    .replace(/[^a-z0-9 ]+/g,' ')
    .replace(/\s+/g,' ').trim();
}
function prTokens(s){ return prNorm(s).split(' ').filter(Boolean); }
function prAehnlichkeit(a,b){
  var ta={}, tb={}, na=0, nb=0;
  prTokens(a).forEach(function(t){ if(!ta[t]){ta[t]=1;na++;} });
  prTokens(b).forEach(function(t){ if(!tb[t]){tb[t]=1;nb++;} });
  if(!na||!nb) return 0;
  var inter=0, uni={}; Object.keys(ta).forEach(function(t){ uni[t]=1; if(tb[t])inter++; }); Object.keys(tb).forEach(function(t){ uni[t]=1; });
  var jac = inter/Object.keys(uni).length;
  var xa=prNorm(a), xb=prNorm(b);
  var sub = (xa&&xb&&(xa.indexOf(xb)>=0||xb.indexOf(xa)>=0)) ? 0.25 : 0;
  return Math.min(1, jac+sub);
}
function prFindeAehnliche(bezeichnung, anlagenart, punkte, schwelle){
  if(schwelle==null) schwelle=0.6;
  return (punkte||[]).map(function(p){
      return { punkt:p, sim: prAehnlichkeit(bezeichnung,p.bezeichnung) + (p.anlagenart===anlagenart?0.1:0) };
    })
    .filter(function(x){ return x.sim>=schwelle; })
    .sort(function(x,y){ return y.sim-x.sim; })
    .map(function(x){ return { punkt:x.punkt, aehnlichkeit:Math.min(1,x.sim) }; });
}

/* Effektive Prüfpunktliste einer Anlagenart (global + org + objekt gemergt).
   ctx = {global:[], org:[], objekt:[], overrides:{punktId:{aktiv:false}}, objektId} */
function prEffektivePunkte(anlagenart, ctx){
  ctx = ctx || {};
  var overrides = ctx.overrides || {};
  function aktiv(p){ return p.aktiv!==false && p.status!=='vorschlag' && p.status!=='abgelehnt'; }
  function passt(p){ return p.anlagenart===anlagenart && aktiv(p) && overrides[p.id]==null; }
  /* Firmen-Anpassung eines GEMA-Punkts (org-Record mit basisId, 31.07.2026):
     unterdrückt das GEMA-Original per ID — unabhängig von Namensgleichheit
     und Anlagenart (Umbenennen/Umkategorisieren bricht die Ersetzung nicht).
     Bewusst auch bei DEAKTIVIERTER Anpassung: deaktiviert = Punkt für die
     Firma aus; das GEMA-Original kommt nur über das ENTFERNEN der Anpassung
     zurück (prPkResetAnpassung). */
  var basis = {};
  (ctx.org||[]).forEach(function(p){ if(p && p.basisId && p.status!=='vorschlag' && p.status!=='abgelehnt') basis[p.basisId]=1; });
  var glob = (ctx.global||[]).filter(function(p){ return passt(p) && !basis[p.id]; });
  var org  = (ctx.org||[]).filter(passt);
  var obj  = (ctx.objekt||[]).filter(function(p){ return p.anlagenart===anlagenart && aktiv(p) && p.objektId===ctx.objektId; });
  var seen = {}, out = [];
  function add(arr, quelle){ arr.forEach(function(p){
    var k = prNorm(p.bezeichnung)+'|'+(p.untergruppe||'');
    if(seen[k]) return; seen[k]=1;
    var c={}; for(var kk in p){ if(p.hasOwnProperty(kk)) c[kk]=p[kk]; } c.quelle=quelle; out.push(c);
  }); }
  add(org,'org'); add(glob,'global'); add(obj,'objekt');
  out.sort(function(a,b){ return (a.reihenfolge||0)-(b.reihenfolge||0) || prNorm(a.bezeichnung).localeCompare(prNorm(b.bezeichnung)); });
  return out;
}

function cached(key){
  try{ if(typeof GemaSync!=='undefined' && GemaSync.getCached) return GemaSync.getCached(key)||[]; }catch(e){}
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function _preBootApply(){
  _preBoot.forEach(function(op){
    var all = cached(op.k).slice();
    if(op.t==='save'){ var i=all.findIndex(function(x){return x&&x.id===op.rec.id;}); if(i>=0)all[i]=op.rec; else all.push(op.rec); }
    else { all = all.filter(function(x){return x&&x.id!==op.id;}); }
    try{ localStorage.setItem(op.k, JSON.stringify(all)); }catch(e){}
  });
  _preBoot=[];
}
/* Speichern ist local-first: der lokale Pool wird IMMER zuerst geschrieben
   (durable), der Cloud-Push haengt daran. Faellt das Internet aus, reiht
   GemaSync den Record in seine Outbox und sendet ihn automatisch nach —
   verloren geht nichts. Sichtbar wird das ueber das Status-Badge unten
   rechts (Kanon if_trocknung/pm_erp/pm_abnahme). Scheitert schon der
   LOKALE Write (Speicher-Quota, z.B. grosse Fotos im Record), ist das ein
   echter Fehler und wird ebenfalls gemeldet — frueher verschwand er still
   im leeren catch. */
function saveRec(storageKey, prefix, rec){
  rec.updatedAt = new Date().toISOString();
  var all = cached(storageKey).slice();
  var i = all.findIndex(function(x){return x&&x.id===rec.id;});
  if(i>=0) all[i]=rec; else all.push(rec);
  var lokalOk = true;
  try{ localStorage.setItem(storageKey, JSON.stringify(all)); }
  catch(e){ lokalOk = false; try{ console.warn('[Prüfliste] Lokal speichern fehlgeschlagen:', e && e.message); }catch(_){} }
  if(!_bootDone) _preBoot.push({t:'save', k:storageKey, rec:rec});
  if(!lokalOk) _setSaveStatus('error','Speicher voll — bitte Fotos verkleinern');
  if(typeof GemaSync==='undefined' || !GemaSync.saveRecord) return Promise.resolve(lokalOk);
  return GemaSync.saveRecord(MK, prefix+rec.id, rec)
    .then(function(){ return lokalOk; })
    .catch(function(e){ if(lokalOk) _setSaveStatus('error', (e && e.queued) ? 'Noch nicht hochgeladen — wird nachgeholt' : ''); return false; });
}
function delRec(storageKey, prefix, id){
  var all = cached(storageKey).filter(function(x){return x&&x.id!==id;});
  try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
  if(!_bootDone) _preBoot.push({t:'del', k:storageKey, id:id});
  if(typeof GemaSync!=='undefined' && GemaSync.deleteRecord) GemaSync.deleteRecord(MK, prefix+id).catch(function(){});
}
/* ─── Speicher-Status-Badge ─── */
var _saveHideT=null;
function _setSaveStatus(s, txt){
  if(_saveHideT){ clearTimeout(_saveHideT); _saveHideT=null; }
  var el=$id('saveStatus');
  if(!el){ el=document.createElement('div'); el.id='saveStatus'; el.className='save-status hidden'; document.body.appendChild(el); }
  el.classList.remove('hidden','pending','saving','saved','error');
  if(s==='pending'){ el.classList.add('pending'); el.innerHTML='<span class="save-dot"></span><span>Änderungen werden gespeichert …</span>'; }
  else if(s==='saving'){ el.classList.add('saving'); el.innerHTML='<span class="save-spinner"></span><span>Wird gespeichert …</span>'; }
  else if(s==='saved'){ el.classList.add('saved'); el.innerHTML='<span class="save-check">✓</span><span>Gespeichert</span>';
    _saveHideT=setTimeout(function(){ var e=$id('saveStatus'); if(e) e.classList.add('hidden'); },2000); }
  else if(s==='error'){ el.classList.add('error'); el.innerHTML='<span class="save-err">⚠</span><span>'+esc(txt||'Noch nicht hochgeladen — wird nachgeholt')+'</span>'; }
}

   Definitionen (Bezeichnung, Empfehlungs-Vorlage, Bauteil-Felder …) werden
   nachgezogen; Antworten/Fotos/eigene Empfehlungen bleiben unangetastet.
   Abgeschlossene Begehungen bleiben Snapshot. */
function syncOffeneBegehung(){
  if(!_cur || _cur.status==='abgeschlossen') return;
  var neu=0, akt=0;
  (_cur.anlagen||[]).forEach(function(a){
    var r=prSyncPunkte(a, effektivePunkte(a.anlagenart, _cur.objektId));
    neu+=r.neu; akt+=r.aktualisiert;
  });
  if(neu||akt){
    saveBeg(_cur);
    var teile=[]; if(neu) teile.push(neu+' Punkt'+(neu>1?'e':'')+' ergänzt'); if(akt) teile.push(akt+' aktualisiert');
    toast('Standardliste: '+teile.join(' · '));
  }
}
function openEditor(){
  try{ syncOffeneBegehung(); }catch(e){}
  // Gleichzeitig-Bearbeiten-Warnung: Lock pro BEGEHUNG (Datensatz) — nur
  // solange sie offen ist; eine abgeschlossene Begehung wird nicht mehr
  // bearbeitet. prCloseEditor loest den Lock wieder.
  try{
    if(window.GemaEditLock && _cur){
      if(_cur.status!=='abgeschlossen') GemaEditLock.watch({key:'prbeg:'+_cur.id, label:(_cur.nr||'Begehung')+(_cur.objektName?' · '+_cur.objektName:'')});
      else GemaEditLock.stop();
    }
  }catch(e){}
  renderEditor(); $id('edOv').classList.add('open');
}
window.prCloseEditor=function(){
  try{ if(window.GemaEditLock) GemaEditLock.stop(); }catch(e){}
  flushSave();                                  // pending Debounce-Save NIE verlieren
  $id('edOv').classList.remove('open'); _cur=null; render();
};

var _saveT=null;
/* Transiente UI-Flags (_open …) nie in den Record serialisieren. */
function _cleanBeg(b){
  return JSON.parse(JSON.stringify(b, function(k,v){ return (typeof k==='string' && k.charAt(0)==='_') ? undefined : v; }));
}
function saveBeg(b){
  b=b||_cur; if(!b) return;
  clearTimeout(_saveT); _saveT=null;
  _setSaveStatus('saving');
  return saveRec(BEG_POOL, BEG_PF, _cleanBeg(b)).then(function(ok){
    if(ok) _setSaveStatus('saved');
    return ok;
  });
}
function touch(){ if(!_cur) return; _setSaveStatus('pending'); clearTimeout(_saveT); _saveT=setTimeout(function(){ saveBeg(_cur); },700); }
function flushSave(){ if(_saveT && _cur){ saveBeg(_cur); } }
// pagehide allein ist auf iOS-Safari unzuverlaessig — visibilitychange
// deckt Tab-Wechsel/App-in-den-Hintergrund mit ab (Kanon pm_abnahme/pm_erp).
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') flushSave(); });
// Backstop: eine haengengebliebene Debounce-Aenderung nie vergessen
setInterval(flushSave, 60000);

/* Fotos */
var _prPhotoInput=null, _photoTarget=null;
/* Datei-Auswahl. quelle='kamera' erzwingt die Kamera, 'galerie' öffnet die
   Mediathek und erlaubt Mehrfachauswahl (Feedback 25.07.2026 — am Handy war
   bisher NUR die Kamera erreichbar).
   KRITISCH (iOS): Der Input MUSS im DOM hängen. WebKit sammelt einen detached
   Input ein, während die Kamera offen ist → das change-Event feuert nie und
   das Foto ist still weg. */
function prPickFiles(quelle, multiple, cb){
  if(_prPhotoInput && _prPhotoInput.parentNode){ try{_prPhotoInput.parentNode.removeChild(_prPhotoInput);}catch(e){} }
  _prPhotoInput=null;
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  if(quelle==='kamera') inp.setAttribute('capture','environment');
  if(multiple) inp.multiple=true;
  inp.style.cssText='position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0;pointer-events:none';
  inp.onchange=function(){
    var files=Array.prototype.slice.call(inp.files||[]);
    if(inp.parentNode){ try{inp.parentNode.removeChild(inp);}catch(e){} }
    if(_prPhotoInput===inp) _prPhotoInput=null;
    if(!files.length) return;
    var zuGross=files.filter(function(f){ return f.size>10*1024*1024; }).length;
    files=files.filter(function(f){ return f.size<=10*1024*1024; });
    if(zuGross) GemaDialog.alert({title:'Datei zu gross',message:zuGross+' Bild(er) über 10 MB wurden übersprungen.'});
    if(files.length) cb(files);
  };
  document.body.appendChild(inp); _prPhotoInput=inp; inp.click();
}
window.prAddFoto=function(ai,pi,quelle){
  _photoTarget={ai:ai,pi:pi};
  /* multiple auf BEIDEN Wegen (Feedback 29.07.2026 «mehrere Fotos auf
     einmal»): die Mediathek (🖼) zeigt die Mehrfachauswahl, und auch der
     📷-Weg erlaubt sie überall dort, wo statt der Kamera ein Dateidialog
     erscheint (Desktop/iPad mit Dateiwahl); die echte Kamera bleibt
     naturgemäss Einzelbild — capture ignoriert multiple. */
  prPickFiles(quelle||'kamera', true, function(files){
    /* seriell, damit die Reihenfolge der Auswahl erhalten bleibt */
    (function next(i){
      if(i>=files.length) return;
      prResizeStoreFoto(files[i], function(){ next(i+1); });
    })(0);
  });
};
/* Bild verkleinern → dataUrl (JPEG). cb(dataUrl) bzw. cb(null) bei Fehler. */
function prResizeToDataUrl(file, cb){
  var reader=new FileReader();
  reader.onerror=function(){ GemaDialog.alert({title:'Fehler',message:'Foto konnte nicht gelesen werden.'}); cb(null); };
  reader.onload=function(e){
    var img=new Image();
    img.onerror=function(){ GemaDialog.alert({title:'Fehler',message:'Foto-Format nicht unterstützt.'}); cb(null); };
    img.onload=function(){
      var maxW=1600, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var du=c.toDataURL('image/jpeg',0.82);
      if(du.length>2*1024*1024) du=c.toDataURL('image/jpeg',0.5);
      if(du.length>2*1024*1024){ GemaDialog.alert({title:'Foto zu gross',message:'Bitte kleineres Bild verwenden.'}); cb(null); return; }
      cb(du);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
/* ═══ FOTOS LIEGEN IM BUCKET, NIE ALS BASE64 IM DATENSATZ ═══
   Früher wanderte das frisch aufgenommene Bild als `dataUrl` in den Record
   und wurde SOFORT gespeichert — das Base64 landete damit in der Cloud
   (mehrere hundert KB pro Foto) und blieb dort für immer, wenn der spätere
   Storage-Upload scheiterte. Jetzt trägt der Record NUR `{url}` bzw.
   solange der Upload aussteht `{pendingId}`; das Bild selbst liegt in einer
   eigenen, rein LOKALEN Warteschlange und wird nachgesendet, sobald wieder
   Netz da ist. So bleibt die Erfassung auf der Baustelle offline möglich,
   ohne dass je ein Base64-Bild in die Cloud geht. */
/* ── Warteschlange in INDEXEDDB statt localStorage (Prüfbericht-Feedback
   30.07.2026, Bericht 3: «offline nur 4 Fotos Kamera + 2 Mediathek, dann
   blockiert es»). localStorage ist auf iOS auf ~5 MB gedeckelt und wird mit
   allen Pool-Caches GETEILT — nach wenigen Fotos war das Quota erschöpft und
   der «Speicher voll»-Dialog blockierte jede weitere Aufnahme. IndexedDB
   fasst hunderte MB.
   KRITISCH — synchroner Memory-Spiegel `_fotoQMem`: imgSrc() liest die Queue
   SYNCHRON beim Rendern, IndexedDB ist async. Beim Boot lädt _fotoQInit()
   alle IDB-Einträge (+ localStorage-Altbestand) in den Spiegel und MIGRIERT
   die Alt-Einträge nach IDB (der localStorage-Key wird geleert — entlastet
   das Quota sofort, auch für die Pool-Caches). _fotoQPut schreibt den
   Spiegel synchron (kann nicht scheitern → die Erfassung blockiert nie mehr)
   und IDB asynchron; ohne IndexedDB bleibt der bisherige localStorage-Weg. */
var PR_FOTOQ='gema_pr_fotoq_v1';
var _fotoQMem=null;      // null = _fotoQInit noch nicht durch
var _fotoQDbP=null, _fotoQInitP=null, _fotoQWarn=false;
function _fotoQLsAll(){ try{ return JSON.parse(localStorage.getItem(PR_FOTOQ)||'{}')||{}; }catch(e){ return {}; } }
function _fotoQLsWrite(q){ try{ localStorage.setItem(PR_FOTOQ, JSON.stringify(q)); return true; }catch(e){ return false; } }
function _fotoQDbOpen(){
  if(_fotoQDbP) return _fotoQDbP;
  _fotoQDbP=new Promise(function(res){
    if(!window.indexedDB) return res(null);
    try{
      var rq=indexedDB.open('gema_pruefliste_fotoq_v1',1);
      rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore('fotos'); }catch(e){} };
      rq.onsuccess=function(){ res(rq.result); };
      rq.onerror=function(){ res(null); };
      rq.onblocked=function(){ res(null); };
    }catch(e){ res(null); }
  });
  return _fotoQDbP;
}
function _fotoQIdb(mode, fn){   // fn(store); Promise<ok:bool>
  return _fotoQDbOpen().then(function(db){
    if(!db) return false;
    return new Promise(function(res){
      try{
        var tx=db.transaction('fotos',mode);
        fn(tx.objectStore('fotos'));
        tx.oncomplete=function(){ res(true); };
        tx.onerror=tx.onabort=function(){ res(false); };
      }catch(e){ res(false); }
    });
  });
}
function _fotoQInit(){
  if(_fotoQInitP) return _fotoQInitP;
  _fotoQInitP=_fotoQDbOpen().then(function(db){
    var ls=_fotoQLsAll();
    if(!db){ _fotoQMem=_fotoQMem||ls; return; }   // kein IDB → localStorage-Weg wie bisher
    return new Promise(function(res){
      var out={};
      try{
        var rq=db.transaction('fotos','readonly').objectStore('fotos').openCursor();
        rq.onsuccess=function(){ var c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
        rq.onerror=function(){ res(out); };
      }catch(e){ res(out); }
    }).then(function(idb){
      /* Frühe Puts (vor Init-Abschluss) behalten — nie überschreiben */
      var mem=_fotoQMem||{};
      Object.keys(idb).forEach(function(k){ if(!(k in mem)) mem[k]=idb[k]; });
      var lsIds=Object.keys(ls);
      lsIds.forEach(function(k){ if(!(k in mem)) mem[k]=ls[k]; });
      _fotoQMem=mem;
      /* Editor schon offen (Deep-Link) und wartende Fotos erst jetzt lesbar →
         nachzeichnen; NIE während einer laufenden Eingabe (Fokus-Regel). */
      try{
        if(_cur && Object.keys(mem).length && typeof renderEditor==='function'){
          var ae=document.activeElement;
          if(!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) renderEditor();
        }
      }catch(e){}
      /* Einmalige Migration localStorage → IDB, danach LS-Key leeren (entlastet
         das Quota sofort). Als Rückgabe verkettet — _fotoQInit ist erst
         resolved, wenn auch die Migration durch ist (deterministisch). */
      if(lsIds.length){
        return _fotoQIdb('readwrite',function(st){ lsIds.forEach(function(k){ st.put(ls[k],k); }); })
          .then(function(ok){ if(ok){ try{ localStorage.removeItem(PR_FOTOQ); }catch(e){} } });
      }
    });
  }).catch(function(){ _fotoQMem=_fotoQMem||_fotoQLsAll(); });
  return _fotoQInitP;
}
function _fotoQAll(){ return _fotoQMem || _fotoQLsAll(); }
function _fotoQPut(id,du){
  if(_fotoQMem===null) _fotoQMem=_fotoQLsAll();   // Put vor Init-Abschluss
  _fotoQMem[id]=du;
  _fotoQIdb('readwrite',function(st){ st.put(du,id); }).then(function(ok){
    if(ok) return;
    var q=_fotoQLsAll(); q[id]=du;                 // Fallback ohne IndexedDB
    if(!_fotoQLsWrite(q) && !_fotoQWarn){
      _fotoQWarn=true;
      toast('⚠ Foto nur im Sitzungsspeicher — bitte bald online gehen, der Upload läuft dann automatisch');
    }
  });
  return true;   // Memory-Put kann nicht scheitern — kein Blockieren mehr
}
function _fotoQGet(id){
  if(!id) return '';
  if(_fotoQMem && _fotoQMem[id]) return _fotoQMem[id];
  return _fotoQLsAll()[id]||'';
}
function _fotoQDel(id){
  if(!id) return;
  if(_fotoQMem) delete _fotoQMem[id];
  _fotoQIdb('readwrite',function(st){ st['delete'](id); });
  var q=_fotoQLsAll(); if(q[id]){ delete q[id]; _fotoQLsWrite(q); }
}
/* Wartet dieses Foto noch auf den Bucket? (Anzeige = imgSrc, s.o.) */
function fotoWartet(f){ return !!(f && !f.url && f.pendingId); }

/* Alle wartenden Bilder aller Begehungen hochladen (nach dem Erfassen, bei
   «online», beim Seitenstart). Erfolg → Record bekommt die URL, das lokale
   Original wird gelöscht. */
var _fotoUpLauft=false;
function prFotoUpload(){
  /* Erst die IndexedDB-Queue laden (inkl. localStorage-Migration) — deckt alle
     Aufrufer ab (Boot, online-Event, Intervall, nach dem Erfassen). */
  if(_fotoQMem===null) return _fotoQInit().then(function(){ return prFotoUpload(); });
  if(_fotoUpLauft) return Promise.resolve(0);
  if(typeof window.GemaStorage==='undefined' || !GemaStorage.isConfigured || !GemaStorage.isConfigured()) return Promise.resolve(0);
  var q=_fotoQAll(); var ids=Object.keys(q);
  if(!ids.length) return Promise.resolve(0);
  _fotoUpLauft=true;
  var oid=(myOrgId()||'org').replace(/[^A-Za-z0-9_-]/g,'');
  var begs=cached(BEG_POOL), erledigt=0;
  /* pendingId → alle Stellen, an denen es vorkommt (Record + evtl. _cur) */
  function stellen(id){
    var out=[];
    function scan(b){
      if(!b) return;
      if(b.titelbild && b.titelbild.pendingId===id) out.push({b:b,f:b.titelbild});
      (b.anlagen||[]).forEach(function(a){ (a.punkte||[]).forEach(function(p){
        (p.fotos||[]).forEach(function(f){ if(f&&f.pendingId===id) out.push({b:b,f:f}); });
      }); });
    }
    begs.forEach(scan); if(_cur) scan(_cur);
    return out;
  }
  var kette=Promise.resolve();
  ids.forEach(function(id){
    kette=kette.then(function(){
      var ziele=stellen(id);
      if(!ziele.length){ _fotoQDel(id); return; }   // verwaist → aufräumen
      return GemaStorage.uploadDataUrl(q[id],'pruefliste/'+oid).then(function(res){
        if(!res||!res.url) return;
        var betroffen=[];
        ziele.forEach(function(z){ z.f.url=res.url; delete z.f.pendingId; if(betroffen.indexOf(z.b)<0) betroffen.push(z.b); });
        betroffen.forEach(function(b){ saveRec(BEG_POOL, BEG_PF, _cleanBeg(b)); });
        _fotoQDel(id); erledigt++;
        if(_cur && betroffen.indexOf(_cur)>=0) renderEditor();
      }).catch(function(){ /* offline/Storage weg → bleibt in der Warteschlange */ });
    });
  });
  return kette.then(function(){ _fotoUpLauft=false; return erledigt; })
              .catch(function(){ _fotoUpLauft=false; return erledigt; });
}
window.addEventListener('online', function(){ prFotoUpload(); });

/* Foto aufs Gerät sichern (Feedback 31.07.2026 Sandro: «Fotos … soll es auf
   dem Handy bei Fotos speichern») — der Browser kann NICHT direkt in die
   Foto-Mediathek schreiben; der Weg ist das System-Share-Sheet (Web Share
   Level 2 mit Datei → iOS/Android «Bild sichern»), Fallback = Download. */
window.prFotoTeilen=function(ai,pi,fi){
  if(!_cur)return;
  var f=((_cur.anlagen[ai]||{}).punkte[pi]||{}).fotos; f=f&&f[fi]; if(!f)return;

  fetch(src).then(function(r){return r.blob();}).then(function(bl){
    var file=new File([bl],'pruefpunkt_foto_'+(fi+1)+'.jpg',{type:bl.type||'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      return navigator.share({files:[file],title:'Prüfpunkt-Foto'}).catch(function(){});
    }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(bl); a.download=file.name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(e){} a.remove(); },400);
  }).catch(function(){
    try{ GemaDialog.alert({title:'Foto sichern',message:'Das Foto konnte nicht geladen werden — bitte Verbindung prüfen.'}); }catch(e){}
  });
};

function renderStandardliste(){
  var el=$id('vContent'); if(!el) return;

  h+='<div class="tb no-print"><select id="stdArtF" onchange="prStdArtF(this.value)"><option value="">Alle Anlagenarten</option>'

  var orgP=stdOrgAll().filter(function(p){ return p.status!=='vorschlag' && p.status!=='abgelehnt'; });

  var anp={}; orgP.forEach(function(p){ if(p.basisId) anp[p.basisId]=p; });
  if(_stdArtFilter){ glob=glob.filter(function(p){return p.anlagenart===_stdArtFilter;}); orgP=orgP.filter(function(p){return p.anlagenart===_stdArtFilter;}); }
  function sortP(a,b){ return (a.reihenfolge||0)-(b.reihenfolge||0) || prNorm(a.bezeichnung).localeCompare(prNorm(b.bezeichnung)); }
  glob.sort(sortP); orgP.sort(sortP);

  if(orgP.length){
    h+='<div class="subhd">🏢 Firmen-Standardpunkte</div>';
    orgP.forEach(function(p){ h+=stdRow(p,'org',canM,canSuper,ovr,anp); });
  }

  if(canM&&!canSuper) h+='<div class="mini" style="display:block;margin:0 0 8px;color:var(--mut)">✏️ passt einen GEMA-Punkt für deine Firma an — der Standard bleibt für andere Organisationen unverändert, «↺» stellt ihn wieder her.</div>';
  if(!glob.length) h+='<div class="empty">Keine Punkte.</div>';
  glob.forEach(function(p){ h+=stdRow(p,'global',canM,canSuper,ovr,anp); });
  el.innerHTML=h;
}
window.prStdArtF=function(v){ _stdArtFilter=v; renderStandardliste(); };
function stdRow(p, scope, canM, canSuper, ovr, anp){
  anp=anp||{};
  var t=PR_ANTWORTTYPEN[p.antworttyp]||{};
  var angepasst = scope==='global' && anp[p.id];                 // Firmen-Anpassung ersetzt diesen GEMA-Punkt
  var istAnpassung = scope==='org' && p.basisId;                 // dieser Org-Punkt IST eine Anpassung
  var deaktiviert = (p.aktiv===false) || (scope==='global' && ovr[p.id]) || !!angepasst;
  // Org-Manager (auch ohne Super-Admin) dürfen GEMA-Punkte anpassen —
  // prPkEdit legt dafür eine Firmen-Kopie mit basisId an (31.07.2026)
  var canEditThis = scope==='global' ? (canSuper||canM) : canM;
  var h='<div class="vrow'+(deaktiviert?' inaktiv':'')+'"><div class="vt">';
  h+='<div class="vn">'+(p.pflicht?'<span class="pflicht-star">*</span> ':'')+esc(p.bezeichnung)+'</div>';
  h+='<div class="vs"><span class="mini">'+esc(prArt(p.anlagenart).label)+'</span>'+(p.untergruppe?'<span class="mini">'+esc(p.untergruppe)+'</span>':'')
    +'<span class="mini">'+esc(t.kurz||p.antworttyp)+'</span>'
    +(p._default?'<span class="mini">GEMA-Basis</span>':'')
    +(angepasst?'<span class="mini" style="background:#fef3c7;color:#92400e">✎ durch Firma angepasst</span>':'')
    +(istAnpassung?'<span class="mini" style="background:#fef3c7;color:#92400e">✎ Anpassung eines GEMA-Punkts</span>':'')
    +(deaktiviert&&!angepasst?'<span class="mini" style="background:#fee2e2;color:#b91c1c">Inaktiv'+(scope==='global'&&ovr[p.id]?' (Firma)':'')+'</span>':'')
    +'</div></div><div class="vtools">';
  if(canEditThis){
    h+='<button class="btn sm" onclick="prPkEdit(\''+esc(p.id)+'\',\''+scope+'\')" title="'+(scope==='global'&&!canSuper?'Für die eigene Firma anpassen':'Bearbeiten')+'">✏️</button>';
    h+='<button class="btn sm" onclick="prPkLog(\''+esc(p.id)+'\',\''+scope+'\')" title="Änderungsprotokoll">🕘</button>';
    if(scope==='global'){
      if(angepasst){
        h+='<button class="btn sm" onclick="prPkResetAnpassung(\''+esc(p.id)+'\')" title="Firmen-Anpassung entfernen — der GEMA-Standard gilt wieder">↺ Anpassung entfernen</button>';
      } else if(canSuper){
        h+='<button class="btn sm" onclick="prPkToggleGlobal(\''+esc(p.id)+'\')">'+(p.aktiv===false?'Aktiv':'Inaktiv')+'</button>';
        h+='<button class="btn sm red" onclick="prPkDelGlobal(\''+esc(p.id)+'\')">🗑</button>';
      } else {
        h+='<button class="btn sm" onclick="prPkHideForOrg(\''+esc(p.id)+'\')">'+(ovr[p.id]?'Einblenden':'Für Firma ausblenden')+'</button>';
      }
    } else {
      h+='<button class="btn sm" onclick="prPkToggleOrg(\''+esc(p.id)+'\')">'+(p.aktiv===false?'Aktiv':'Inaktiv')+'</button>';
      if(istAnpassung){
        h+='<button class="btn sm" onclick="prPkResetAnpassung(\''+esc(p.basisId)+'\')" title="Anpassung entfernen — der GEMA-Standardpunkt gilt wieder">↺</button>';
      } else {
        h+='<button class="btn sm red" onclick="prPkDelOrg(\''+esc(p.id)+'\')">🗑</button>';
      }
    }
  } else if(canM && scope==='global'){
    // Org-Manager darf globalen Punkt für die eigene Firma ausblenden
    h+='<button class="btn sm" onclick="prPkHideForOrg(\''+esc(p.id)+'\')">'+(ovr[p.id]?'Einblenden':'Für Firma ausblenden')+'</button>';
  }
  h+='</div></div>';
  return h;
}

/* Prüfpunkt-Editor (Modal) */
/* Bauteil-Felder-Checkboxen — GETEILT von allen drei Prüfpunkt-Editoren
   (Verwaltung, Vorschlag, «Prüfpunkt ergänzen»); eine Wahrheit für Markup
   und Collector (Feedback 29.07.2026 «Hersteller / Jahr etc. einzeln»). */
function bauteilCheckboxHtml(prefix, def){
  var an=prBauteilFelder(def||{});
  return '<div class="fld"><label>Bauteil-Angaben <span style="font-weight:600;color:var(--mut)">— einzeln wählbar</span></label>'
    +'<div class="btsel">'+PR_BAUTEIL_FELDER.map(function(f){
      return '<label class="btchk"><input type="checkbox" id="'+prefix+f.id+'" '+(an.indexOf(f.id)>=0?'checked':'')+'> '+esc(f.label)+'</label>';
    }).join('')+'</div></div>';
}
function bauteilCollect(prefix){
  var o={}, any=false;
  PR_BAUTEIL_FELDER.forEach(function(f){ var el=$id(prefix+f.id); if(el&&el.checked){ o[f.id]=true; any=true; } });
  return { bauteil:any, bauteilFelder:any?o:null };
}

var _pkEdit=null;
window.prPkNew=function(){
  _pkEdit={ id:uid('prstd'), scope:'org', orgId:myOrgId(), bezeichnung:'', anlagenart:(prAnlagenarten()[0]||{}).id||'allgemein', untergruppe:'',
    antworttyp:PR_ANTWORTTYP_DEFAULT, pflicht:false, standardbewertung:'schlecht', empfehlung:'', aktiv:true, reihenfolge:9999,
    status:'aktiv', ersteller:{userId:(me()||{}).id||'',name:myName()}, erstelltAm:new Date().toISOString(), version:1, log:[] , _new:true };
  openPkEditor('Neuer Prüfpunkt');
};
window.prPkEdit=function(id,scope){
  /* Org-Manager (ohne Super-Admin) auf einem GEMA-Punkt: die Bearbeitung
     legt eine FIRMEN-Anpassung an (org-Record mit basisId — ersetzt das
     Original nur für die eigene Org). Existiert schon eine Anpassung,
     wird DIESE weiterbearbeitet (nie eine zweite Kopie). */
  if(scope==='global' && !prIsSuper()){
    var anp=stdOrgAll().filter(function(x){ return x.basisId===id && x.status!=='vorschlag' && x.status!=='abgelehnt'; })[0];
    if(anp){
      _pkEdit=JSON.parse(JSON.stringify(anp)); _pkEdit.scope='org'; _pkEdit._new=false;
      openPkEditor('Firmen-Anpassung bearbeiten');
      return;
    }
    var g=stdGlobalMerged().filter(function(x){return x.id===id;})[0]; if(!g){ toast('Nicht gefunden'); return; }
    _pkEdit=JSON.parse(JSON.stringify(g)); delete _pkEdit._default;
    _pkEdit._anpassenVon=id; _pkEdit.scope='org'; _pkEdit._new=false;
    openPkEditor('GEMA-Punkt für Firma anpassen');
    return;
  }
  var src = scope==='global'? stdGlobalMerged() : stdOrgAll();
  var p=src.filter(function(x){return x.id===id;})[0]; if(!p){ toast('Nicht gefunden'); return; }
  _pkEdit=JSON.parse(JSON.stringify(p)); _pkEdit.scope=scope; _pkEdit._new=false;
  openPkEditor('Prüfpunkt bearbeiten');
};

window.prPkSave=function(){
  var p=_pkEdit; if(!p) return;
  var neuBez=($id('pkBez').value||'').trim(); if(!neuBez){ toast('Bezeichnung fehlt'); return; }
  var alt = p._new? '' : (p.bezeichnung||'');
  var scope = p._new ? ($id('pkScope')?$id('pkScope').value:'org') : p.scope;
  var bt=bauteilCollect('pkBt_');
  /* Firmen-Anpassung eines GEMA-Punkts: NEUE Org-Record-Id (KRITISCH — der
     STD-Pool ist über die Record-Id gekeyt; ein Save unter der GEMA-Id würde
     den GLOBALEN Punkt für alle Firmen überschreiben) + basisId-Verknüpfung.
     Beim Weiterbearbeiten einer bestehenden Anpassung bleibt basisId erhalten. */
  var anpNeu = !!p._anpassenVon;
  var recId = anpNeu ? uid('prstd') : p.id;
  var basisId = p._anpassenVon || p.basisId || null;
  var rec={ id:recId, scope:(anpNeu?'org':scope), orgId:((anpNeu||scope!=='global')?myOrgId():null),
    bezeichnung:neuBez, anlagenart:$id('pkArt').value, untergruppe:($id('pkUnter').value||'').trim(),
    antworttyp:$id('pkTyp').value, pflicht:$id('pkPflicht').value==='1', standardbewertung:$id('pkStdBw').value,
    empfehlung:($id('pkEmpf').value||'').trim(), aktiv:p.aktiv!==false, reihenfolge:parseInt($id('pkReih').value,10)||0,
    bauteil:bt.bauteil, bauteilFelder:bt.bauteilFelder,
    status:'aktiv', ersteller:(anpNeu?{userId:(me()||{}).id||'',name:myName()}:(p.ersteller||{userId:(me()||{}).id||'',name:myName()})), erstelltAm:(anpNeu?new Date().toISOString():(p.erstelltAm||new Date().toISOString())),

/* Freigabe-Kern: normaler Vorschlag → aktiver Punkt; Änderungsvorschlag
   (aenderungZu) → AKTUALISIERT den Ziel-Punkt (Version +1, Protokoll) und
   entfernt den Vorschlags-Record. Rückgabe = der wirksame Punkt. */
function applyVorschlag(rec, grund){
  var jetzt=new Date().toISOString();
  if(rec.aenderungZu && rec.aenderungZu.id){
    var src = rec.scope==='global' ? stdGlobalMerged() : stdOrgAll();
    var target = src.filter(function(x){return x.id===rec.aenderungZu.id;})[0];
    if(target){
      var t=JSON.parse(JSON.stringify(target)); delete t._default;
      t.scope=rec.scope; t.orgId = rec.scope==='global' ? null : myOrgId();
      var altBez=t.bezeichnung;
      t.bezeichnung=rec.bezeichnung;
      t.untergruppe=rec.untergruppe||t.untergruppe;
      t.antworttyp=rec.antworttyp||t.antworttyp;
      if(rec.empfehlung) t.empfehlung=rec.empfehlung;
      t.status='aktiv'; t.aktiv=t.aktiv!==false;
      t.version=(t.version||1)+1; t.geaendertAm=jetzt;
      t.log=(t.log||[]).slice(0,60);
      t.log.unshift({alt:altBez,neu:t.bezeichnung,von:myName(),am:jetzt,grund:'Anpassung übernommen (Vorschlag von '+((rec.vorschlagVon||{}).name||'—')+')',status:'aktiv'});
      saveRec(STD_POOL,STD_PF,t);
      delRec(STD_POOL,STD_PF,rec.id);
      return t;
    }
    // Ziel nicht mehr vorhanden → als neuer Punkt freigeben (Fallthrough)
  }
  var out=JSON.parse(JSON.stringify(rec));
  out.status='aktiv'; out.aktiv=true; out.geaendertAm=jetzt;
  if(out.scope==='global') out.orgId=null;
  out.log=(out.log||[]).slice(0,60);
  out.log.unshift({alt:'',neu:out.bezeichnung,von:myName(),am:jetzt,grund:grund||'Freigegeben',status:'aktiv'});
  saveRec(STD_POOL,STD_PF,out);
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   BERICHT (Print-Fenster A4) — gebrandet wie Offerte/Schadensbericht
   ═══════════════════════════════════════════════════════════════════════ */
/* Branding-Helfer (Kontrastschutz, dupliziert nach Kanon gema_schaden_pdf):
   Firmenfarbe wird NIE 1:1 als Text-/Flächenfarbe genutzt, sondern Richtung
   Schwarz skaliert, bis der WCAG-Kontrast gegen Weiss >= 4.5:1 ist. */
function _hexToRgb(hex){
  hex=String(hex||'').trim().replace(/^#/,'');
  if(hex.length===3) hex=hex.charAt(0)+hex.charAt(0)+hex.charAt(1)+hex.charAt(1)+hex.charAt(2)+hex.charAt(2);
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return { r:parseInt(hex.slice(0,2),16), g:parseInt(hex.slice(2,4),16), b:parseInt(hex.slice(4,6),16) };
}
function _rgbToHex(r,g,b){ function x(n){ n=Math.max(0,Math.min(255,Math.round(n))); return (n<16?'0':'')+n.toString(16); } return '#'+x(r)+x(g)+x(b); }
function _relLum(rgb){
  var a=[rgb.r,rgb.g,rgb.b].map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
function _contrastVsWhite(rgb){ return 1.05/(_relLum(rgb)+0.05); }
function _darkenForWhiteBg(hex, target){
  var rgb=_hexToRgb(hex); if(!rgb) return null;
  if(_contrastVsWhite(rgb)>=target) return _rgbToHex(rgb.r,rgb.g,rgb.b);
  var f=1.0;
  for(var i=0;i<40;i++){ f-=0.025; var c={r:rgb.r*f,g:rgb.g*f,b:rgb.b*f}; if(_contrastVsWhite(c)>=target) return _rgbToHex(c.r,c.g,c.b); }
  return '#1f2933';
}
function _lightTint(hex, whiteMix){
  var rgb=_hexToRgb(hex); if(!rgb) return null;
  var m=whiteMix==null?0.92:whiteMix;
  return _rgbToHex(rgb.r+(255-rgb.r)*m, rgb.g+(255-rgb.g)*m, rgb.b+(255-rgb.b)*m);
}
/* org.settings.pdfFarben → {acc, deep, forest, tint}; ohne Branding GEMA-Default
   (Modul-Cyan + Navy als Verlauf-Tail — Muster gema_schaden_pdf). */
function prBrand(){
  var o=org(), pf=o&&o.settings&&o.settings.pdfFarben;
  if(pf && pf.primary && _hexToRgb(pf.primary)){
    var acc=_darkenForWhiteBg(pf.primary,4.5);
    var deep=_darkenForWhiteBg(pf.primary,7)||acc;
    var forest=(pf.secondary&&_darkenForWhiteBg(pf.secondary,4.5))||deep;
    return { acc:acc, deep:deep, forest:forest, tint:_lightTint(pf.primary)||'#eef2f6' };
  }
  return { acc:'#0e7490', deep:'#155e75', forest:'#0f172a', tint:'#ecfeff' };
}
/* Empfehlung → Liste: mehrere Zeilen/Punkte werden als <ul> gerendert.
   EINE Split-Regel für Bericht UND Auswahl-Chips (prEmpfItems, Engine). */
function empfItems(e){ return prEmpfItems(e); }
function empfHtml(e){

  if(typeof GemaSync!=='undefined' && GemaSync.bindCollection){
    var bindP=Promise.all([
      GemaSync.bindCollection(MK,STD_POOL,STD_PF,'id'),
      GemaSync.bindCollection(MK,OVR_POOL,OVR_PF,'id'),
      GemaSync.bindCollection(MK,OBJ_POOL,OBJ_PF,'id'),
      GemaSync.bindCollection(MK,BEG_POOL,BEG_PF,'id')
    ]);
    Promise.race([bindP,timeout]).then(function(){ _cloudLoaded=true; _objFilterInit(); render(); openDeepLink(); });
    bindP.then(function(){ _bootDone=true; _preBootApply(); _cloudLoaded=true; render(); prFotoUpload(); })
         .catch(function(){ _bootDone=true; _preBootApply(); _cloudLoaded=true; render(); prFotoUpload(); });
  } else { _bootDone=true; _cloudLoaded=true; render(); openDeepLink(); prFotoUpload(); }
  // Fotos, die beim letzten Mal offline aufgenommen wurden, nachsenden
  setInterval(prFotoUpload, 90000);
  // Feedback 29.07.2026 «Infos vom Handy übertragen sich nicht»: die Seite
  // pullte nur beim Boot — ein auf dem Handy erfasster Stand erschien auf dem
  // bereits offenen Desktop/iPad erst nach einem Reload. Beim Sichtbarwerden
  // des Tabs (Throttle 45 s) werden die Pools neu gepullt und die Liste neu
  // gezeichnet. Bei OFFENEM Editor (Feedback 30.07.2026 «Änderungen im Bereich
  // Prüfpunkt müssen in die aktuell offenen Berichte übernommen werden»)
  // werden die Standardlisten-Pools trotzdem gepullt und die offene Begehung
  // via syncOffeneBegehung nachgezogen (ergänzt/aktualisiert nur Definitionen,
  // nie Antworten/Fotos); neu gezeichnet wird NUR ohne fokussiertes
  // Eingabefeld — eine laufende Eingabe wird nie unter den Händen ersetzt.
  var _lastRepull=0;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible' || !_bootDone) return;
    var now=Date.now(); if(now-_lastRepull<45000) return; _lastRepull=now;
    if(typeof GemaSync==='undefined' || !GemaSync.bindCollection) return;
    var ed=$id('edOv'), edOffen=!!(ed && ed.classList.contains('open'));
    var pools=[
      GemaSync.bindCollection(MK,STD_POOL,STD_PF,'id'),
      GemaSync.bindCollection(MK,OVR_POOL,OVR_PF,'id'),
      GemaSync.bindCollection(MK,OBJ_POOL,OBJ_PF,'id')
    ];
    if(!edOffen) pools.push(GemaSync.bindCollection(MK,BEG_POOL,BEG_PF,'id'));
    Promise.all(pools).then(function(){
      if(edOffen){
        try{ syncOffeneBegehung(); }catch(e){}
        var ae=document.activeElement;
        var tippt=!!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName||''));
        if(!tippt) renderEditor();
      } else { render(); }
      prFotoUpload();
    }).catch(function(){});
  });
  window.addEventListener('gema-objekte-loaded',function(){ _objFilterInit(); if(_tab==='begehungen') { fillObjektFilter(); renderBegList(); } });
  if(typeof GemaObjekte!=='undefined' && GemaObjekte.ready){ GemaObjekte.ready.then(function(){ _objFilterInit(); if(_tab==='begehungen'){ fillObjektFilter(); renderBegList(); } }).catch(function(){}); }
  if(typeof GemaFeedback!=='undefined') GemaFeedback.init('pruefliste','Prüfliste');
}
function openDeepLink(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('tab')==='verwaltung' && _tab!=='verwaltung'){ _tab='verwaltung'; render(); }
    var beg=q.get('beg');
    if(beg){ var b=begById(beg); if(b){ _cur=JSON.parse(JSON.stringify(b)); openEditor(); } }
  }catch(e){}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();

/* Test-Hooks */
window._prHooks={ begVisible:begVisible, stdGlobalMerged:stdGlobalMerged, stdOrgAll:stdOrgAll, effektivePunkte:effektivePunkte,
  vorschlaege:vorschlaegeVisible, saveRec:saveRec, delRec:delRec, cached:cached, POOLS:{STD:STD_POOL,OVR:OVR_POOL,OBJ:OBJ_POOL,BEG:BEG_POOL},
  rechte:function(){ return {begehung:prCanBegehung(),manage:prCanManageOrg(),super:prIsSuper()}; }, render:render, nextNr:nextNr,
  aktuelle:function(){ return _cur; }, refreshTitelbild:refreshTitelbild,
  renderEditor:renderEditor, saveBegC:function(){ saveBeg(_cur); }, syncOffene:syncOffeneBegehung,
  imgSrc:imgSrc, fotoQ:_fotoQAll, fotoQInit:_fotoQInit, fotoUpload:prFotoUpload };
/* Kurzzugriff auf die offene Begehung (Tests + Titelbild-Refresh) */
window.prCurrent=function(){ return _cur; };
window.prRefreshTitelbild=refreshTitelbild;

})();
/* fixLeadingZero (Kanon) */
function fixLeadingZero(el){ var v=el.value.trim(); if(v===''){return;} if(/^\./.test(v))v='0'+v; if(/^-\./.test(v))v='-0'+v.slice(1); el.value=String(parseFloat(v)); }
