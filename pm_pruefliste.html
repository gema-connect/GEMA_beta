<!DOCTYPE html>
<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_recent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GEMA"/>
<title>Prüfliste – GEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#0e7490;--acc-bg:#ecfeff;--acc-bd:#a5f3fc;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --viol:#7c3aed;--viol-bg:#f5f3ff;--viol-bd:#ddd6fe;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}

/* NAV */
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}

/* PAGE */
.pg{max-width:1100px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:16px 20px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a 0%,#334155 45%,#0e7490 100%);position:relative;overflow:hidden;box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hero-title{font-size:17px;font-weight:900;color:#fff;letter-spacing:-.2px}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;line-height:1.4}

/* TABBAR */
.tabbar{display:flex;gap:6px;margin-bottom:12px;background:var(--sur);border:1.5px solid var(--brd);border-radius:12px;padding:5px}
.tabbar button{flex:1;padding:9px 8px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--acc);color:#fff}

/* TOOLBAR */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tb select{flex:1;min-width:150px;padding:11px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);color:var(--txt);outline:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13.5px;font-weight:700;cursor:pointer;min-height:44px;white-space:nowrap;transition:.12s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.ghost{border-style:dashed;background:transparent;color:var(--mut)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12.5px}

/* STATUS-CHIPS FILTER */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.kpi b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.kpi span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}

/* KARTEN */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:.12s}
.card:active{transform:scale(.985)}
.card-bar{height:5px}
.card-bd{padding:12px 14px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-nr{font-size:12px;font-weight:900;color:var(--acc);background:var(--acc-bg);border:1px solid var(--acc-bd);border-radius:6px;padding:2px 8px}
.card-title{font-size:14.5px;font-weight:800;line-height:1.3;margin-bottom:4px;word-break:break-word}
.card-meta{font-size:12px;color:var(--mut);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-left:auto;white-space:nowrap}
.b-offen{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.b-abgeschlossen{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.empty{padding:38px 16px;text-align:center;color:var(--mut);font-size:14px;background:var(--sur);border:1.5px dashed var(--brd2);border-radius:14px}

/* VOLLBILD-EDITOR */
.ov{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;flex-direction:column}
.ov.open{display:flex}
.ov-hd{background:var(--sur);border-bottom:1.5px solid var(--brd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0}
.ov-back{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:17px;cursor:pointer;flex-shrink:0}
.ov-title{font-size:15px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* Aktionsleiste OBEN (Muster pm_erp #edFt): kleine, einheitliche Buttons, horizontal scrollbar */
.ov-ft{background:var(--sur);border-bottom:1.5px solid var(--brd);padding:7px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.ov-ft::-webkit-scrollbar{height:0}
.ov-ft .btn{flex:0 0 auto;min-width:auto;min-height:32px;padding:6px 12px;font-size:12.5px;border-radius:8px;font-weight:700}
.ov-ft .gema-feedback-btn{margin-left:auto;flex:0 0 auto;padding:6px 11px;font-size:12px}
.wrap{max-width:820px;margin-left:auto;margin-right:auto}
.sec{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sec-hd{padding:11px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.sec-hd h3{font-size:13.5px;font-weight:800}
.sec-hd .hint{font-size:11px;color:var(--mut);font-weight:600;margin-left:auto}
.sec-bd{padding:13px 14px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:15px;background:var(--sur);color:var(--txt);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{min-height:70px;resize:vertical;line-height:1.45}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fld-row{grid-template-columns:1fr}}

/* ANLAGE + PRÜFPUNKTE */
.anlage{border:1.5px solid var(--brd2);border-radius:14px;margin-bottom:12px;background:var(--sur);overflow:hidden}
.anlage-hd{padding:10px 12px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anlage-ic{font-size:18px;flex-shrink:0}
.anlage-hd input{flex:1;min-width:120px;padding:9px 10px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;font-weight:700;background:var(--sur);outline:none}
.anlage-hd input.small{flex:0 1 150px;font-weight:600;font-size:13px}
.anlage-bd{padding:11px 12px}
.pkt{border:1.5px solid var(--brd);border-radius:11px;padding:10px;margin-bottom:8px;background:var(--sur2)}
.pkt-hd{display:flex;align-items:flex-start;gap:8px}
.pkt-t{flex:1;min-width:0}
.pkt-name{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.pkt-sub{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:5px}
.q-global{background:#eef2ff;color:#4338ca}
.q-org{background:var(--acc-bg);color:var(--acc)}
.q-objekt{background:var(--viol-bg);color:var(--viol)}
.q-begehung{background:var(--amber-bg);color:var(--amber)}
.pflicht-star{color:var(--red);font-weight:900}
.pkt-tools{display:flex;gap:5px;flex-shrink:0}
.icobtn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.icobtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.icobtn .cnt{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.ans{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ans-btn{padding:8px 12px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer;min-height:40px}
.ans-btn.on{color:#fff}
.ans-btn.on.on-gut{background:var(--grn);border-color:var(--grn)}
.ans-btn.on.on-maessig{background:var(--amber);border-color:var(--amber)}
.ans-btn.on.on-schlecht{background:var(--red);border-color:var(--red)}
.ans-btn.on.on-nicht_bewertet{background:var(--mut);border-color:var(--mut)}
.ans input.numin,.ans input.txtin{padding:9px 11px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;background:var(--sur);outline:none;min-height:40px}
.ans input.numin{width:120px}.ans input.txtin{flex:1;min-width:150px}
.bw-chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.bw-gut{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.bw-maessig{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.bw-schlecht{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.bw-nicht_bewertet{background:#f1f5f9;color:var(--mut);border:1px solid var(--brd2)}
.pkt-more{margin-top:9px;padding-top:9px;border-top:1px dashed var(--brd2);display:none}
.pkt-more.open{display:block}
.pkt-more label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin:8px 0 4px}
.pkt-more select,.pkt-more textarea{width:100%;padding:9px 10px;border:1.5px solid var(--brd2);border-radius:9px;font-size:13.5px;background:var(--sur);outline:none}
.pkt-more textarea{min-height:54px;resize:vertical;line-height:1.4}
.fotos{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.foto{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1.5px solid var(--brd);background:#000}
.foto img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.foto .fx{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:6px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;line-height:1}
.art-grid{display:flex;gap:7px;flex-wrap:wrap}
.art-chip{padding:9px 13px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:42px}
.art-chip:active{background:var(--acc-bg);border-color:var(--acc-bd)}

/* BEWERTUNGS-KPI (Begehung) */
.bwkpi{display:flex;gap:7px;flex-wrap:wrap}
.bwkpi .b{flex:1;min-width:78px;border:1.5px solid var(--brd);border-radius:11px;padding:8px 10px;text-align:center;background:var(--sur)}
.bwkpi .b b{font-size:19px;font-weight:900;display:block}
.bwkpi .b span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}

/* VERWALTUNG-Tabellen/Zeilen */
.vseg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.vseg button{padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);font-size:13px;font-weight:800;color:var(--mut);cursor:pointer}
.vseg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vrow{border:1.5px solid var(--brd);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:var(--sur);display:flex;align-items:flex-start;gap:10px}
.vrow.inaktiv{opacity:.55}
.vrow .vt{flex:1;min-width:0}
.vrow .vn{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.vrow .vs{font-size:11px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vrow .vtools{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:5px;background:#f1f5f9;color:var(--mut)}
.subhd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.subhd::after{content:'';flex:1;height:1px;background:var(--brd)}

/* MODALS */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:15px;font-weight:900;flex:1}
.modal-x{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer}
.modal-bd{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0}
.modal-ft .btn{flex:1}
.dup{background:var(--amber-bg);border:1.5px solid var(--amber-bd);border-radius:11px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:#92400e}
.dup .dupitem{display:flex;gap:8px;align-items:center;margin-top:6px}
.dup .dupitem .dn{flex:1;font-weight:700}
.radio-list{display:flex;flex-direction:column;gap:7px}
.radio-list label{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:600}
.radio-list label.on{border-color:var(--acc);background:var(--acc-bg)}
.radio-list input{margin-top:2px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1200;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media print{.g-nav,.no-print{display:none!important}}
</style>
<script src="gema_db.js"></script>
<script src="gema_feedback.js"></script><script src="gema_notify.js"></script><script src="gema_notify_ui.js"></script><script src="gema_chat.js"></script>
<script src="gema_objekte_api.js"></script>
<script src="gema_storage.js"></script>
<script src="gema_dialog.js"></script><script src="gema_print_a4.js"></script>

</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/*ENGINE-START*/
/* DOM-frei, Node-testbar (window._prEngine). Alle Bewertungs-/Duplikat-/
   Merge-Logik lebt hier. */

var PR_ANTWORTTYPEN = {
  ja_nein_nb: { label:'Ja / Nein / n.b.', kurz:'Ja/Nein', kind:'select', optionen:[
    { v:'ja',   l:'Ja',                bewertung:'gut' },
    { v:'nein', l:'Nein',              bewertung:'schlecht' },
    { v:'nb',   l:'nicht beurteilbar', bewertung:'nicht_bewertet' } ] },
  /* «nicht vorhanden» ist KEIN Mangel: es gibt nichts zu beurteilen → Zustand
     entfällt (grau, nicht bearbeitbar) statt «schlecht» (User-Entscheid 07/2026). */
  vorhanden_nb: { label:'vorhanden / nicht vorhanden / n.b.', kurz:'Vorhanden', kind:'select', optionen:[
    { v:'vorhanden',       l:'vorhanden',          bewertung:'gut' },
    { v:'nicht_vorhanden', l:'nicht vorhanden',    bewertung:'nicht_bewertet' },
    { v:'nb',              l:'nicht beurteilbar',  bewertung:'nicht_bewertet' } ] },
  zustand: { label:'gut / mässig / schlecht / nicht geprüft', kurz:'Zustand', kind:'select', optionen:[
    { v:'gut',            l:'gut',            bewertung:'gut' },
    { v:'maessig',        l:'mässig',         bewertung:'maessig' },
    { v:'schlecht',       l:'schlecht',       bewertung:'schlecht' },
    { v:'nicht_geprueft', l:'nicht geprüft',  bewertung:'nicht_bewertet' } ] },
  auffaellig: { label:'keine Auffälligkeit / Auffälligkeit', kurz:'Auffälligkeit', kind:'select', optionen:[
    { v:'keine',     l:'keine Auffälligkeit',      bewertung:'gut' },
    { v:'vorhanden', l:'Auffälligkeit vorhanden',  bewertung:'schlecht' } ] },
  zahl: { label:'Zahleneingabe',     kurz:'Zahl', kind:'zahl' },
  text: { label:'kurze Texteingabe', kurz:'Text', kind:'text' }
};
var PR_ANTWORTTYP_DEFAULT = 'ja_nein_nb';

var PR_BEWERTUNGEN = {
  gut:            { label:'gut',           farbe:'#16a34a' },
  maessig:        { label:'mässig',        farbe:'#d97706' },
  schlecht:       { label:'schlecht',      farbe:'#dc2626' },
  nicht_bewertet: { label:'nicht bewertet', farbe:'#94a3b8' }
};

function prAutoBewertung(antworttyp, antwortV){
  var t = PR_ANTWORTTYPEN[antworttyp];
  if(!t || !t.optionen) return 'nicht_bewertet';
  var o = null; for(var i=0;i<t.optionen.length;i++){ if(t.optionen[i].v===antwortV){o=t.optionen[i];break;} }
  return (o && o.bewertung) || 'nicht_bewertet';
}
function prAntwortLabel(antworttyp, antwortV){
  var t = PR_ANTWORTTYPEN[antworttyp];
  if(!t) return antwortV==null?'':String(antwortV);
  if(t.kind==='zahl'||t.kind==='text') return (antwortV==null||antwortV==='')?'':String(antwortV);
  var o = (t.optionen||[]).filter(function(x){return x.v===antwortV;})[0];
  return o ? o.l : (antwortV==null?'':String(antwortV));
}
function prIstNegativ(bw){ return bw==='schlecht'||bw==='maessig'; }
/* «nicht vorhanden» → Zustand entfällt (auch für Altdaten mit gespeicherter
   Bewertung «schlecht» — Anzeige/Aggregation erzwingen den grauen Zustand). */
function prZustandEntfaellt(p){ return !!(p && p.antworttyp==='vorhanden_nb' && p.antwort==='nicht_vorhanden'); }

/* Zustands-Zusammenzug: zeilen=[{antwort,bewertung,antworttyp?}] */
function prBegehungBewertung(zeilen){
  var z = { gut:0, maessig:0, schlecht:0, nicht_bewertet:0, offen:0, total:0 };
  (zeilen||[]).forEach(function(r){
    z.total++;
    var beantwortet = r.antwort!==undefined && r.antwort!==null && r.antwort!=='';
    if(!beantwortet){ z.offen++; return; }
    var b = prZustandEntfaellt(r) ? 'nicht_bewertet' : (r.bewertung||'nicht_bewertet');
    z[b] = (z[b]||0)+1;
  });
  var gesamt = 'nicht_bewertet';
  if(z.schlecht>0) gesamt='schlecht';
  else if(z.maessig>0) gesamt='maessig';
  else if(z.gut>0) gesamt='gut';
  return { gut:z.gut, maessig:z.maessig, schlecht:z.schlecht, nicht_bewertet:z.nicht_bewertet, offen:z.offen, total:z.total, gesamt:gesamt };
}

/* Normalisierung + Ähnlichkeit (Duplikat-Erkennung) */
function prNorm(s){
  return String(s||'').toLowerCase()
    .replace(/[äöü]/g,function(m){return {'ä':'ae','ö':'oe','ü':'ue'}[m];})
    .replace(/ß/g,'ss')
    .replace(/[^a-z0-9 ]+/g,' ')
    .replace(/\s+/g,' ').trim();
}
function prTokens(s){ return prNorm(s).split(' ').filter(Boolean); }
function prAehnlichkeit(a,b){
  var ta={}, tb={}, na=0, nb=0;
  prTokens(a).forEach(function(t){ if(!ta[t]){ta[t]=1;na++;} });
  prTokens(b).forEach(function(t){ if(!tb[t]){tb[t]=1;nb++;} });
  if(!na||!nb) return 0;
  var inter=0, uni={}; Object.keys(ta).forEach(function(t){ uni[t]=1; if(tb[t])inter++; }); Object.keys(tb).forEach(function(t){ uni[t]=1; });
  var jac = inter/Object.keys(uni).length;
  var xa=prNorm(a), xb=prNorm(b);
  var sub = (xa&&xb&&(xa.indexOf(xb)>=0||xb.indexOf(xa)>=0)) ? 0.25 : 0;
  return Math.min(1, jac+sub);
}
function prFindeAehnliche(bezeichnung, anlagenart, punkte, schwelle){
  if(schwelle==null) schwelle=0.6;
  return (punkte||[]).map(function(p){
      return { punkt:p, sim: prAehnlichkeit(bezeichnung,p.bezeichnung) + (p.anlagenart===anlagenart?0.1:0) };
    })
    .filter(function(x){ return x.sim>=schwelle; })
    .sort(function(x,y){ return y.sim-x.sim; })
    .map(function(x){ return { punkt:x.punkt, aehnlichkeit:Math.min(1,x.sim) }; });
}

/* Effektive Prüfpunktliste einer Anlagenart (global + org + objekt gemergt).
   ctx = {global:[], org:[], objekt:[], overrides:{punktId:{aktiv:false}}, objektId} */
function prEffektivePunkte(anlagenart, ctx){
  ctx = ctx || {};
  var overrides = ctx.overrides || {};
  function aktiv(p){ return p.aktiv!==false && p.status!=='vorschlag' && p.status!=='abgelehnt'; }
  function passt(p){ return p.anlagenart===anlagenart && aktiv(p) && overrides[p.id]==null; }
  var glob = (ctx.global||[]).filter(passt);
  var org  = (ctx.org||[]).filter(passt);
  var obj  = (ctx.objekt||[]).filter(function(p){ return p.anlagenart===anlagenart && aktiv(p) && p.objektId===ctx.objektId; });
  var seen = {}, out = [];
  function add(arr, quelle){ arr.forEach(function(p){
    var k = prNorm(p.bezeichnung)+'|'+(p.untergruppe||'');
    if(seen[k]) return; seen[k]=1;
    var c={}; for(var kk in p){ if(p.hasOwnProperty(kk)) c[kk]=p[kk]; } c.quelle=quelle; out.push(c);
  }); }
  add(org,'org'); add(glob,'global'); add(obj,'objekt');
  out.sort(function(a,b){ return (a.reihenfolge||0)-(b.reihenfolge||0) || prNorm(a.bezeichnung).localeCompare(prNorm(b.bezeichnung)); });
  return out;
}

/* Default-Katalog → Record-Form (stabile ids prstd_def_<i>). */
function prDefaultRecords(){
  return PR_DEFAULT_KATALOG.map(function(d,i){

function cached(key){
  try{ if(typeof GemaSync!=='undefined' && GemaSync.getCached) return GemaSync.getCached(key)||[]; }catch(e){}
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function _preBootApply(){
  _preBoot.forEach(function(op){
    var all = cached(op.k).slice();
    if(op.t==='save'){ var i=all.findIndex(function(x){return x&&x.id===op.rec.id;}); if(i>=0)all[i]=op.rec; else all.push(op.rec); }
    else { all = all.filter(function(x){return x&&x.id!==op.id;}); }
    try{ localStorage.setItem(op.k, JSON.stringify(all)); }catch(e){}
  });
  _preBoot=[];
}
function saveRec(storageKey, prefix, rec){
  rec.updatedAt = new Date().toISOString();
  var all = cached(storageKey).slice();
  var i = all.findIndex(function(x){return x&&x.id===rec.id;});
  if(i>=0) all[i]=rec; else all.push(rec);
  try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
  if(!_bootDone) _preBoot.push({t:'save', k:storageKey, rec:rec});
  if(typeof GemaSync!=='undefined' && GemaSync.saveRecord) GemaSync.saveRecord(MK, prefix+rec.id, rec).catch(function(){});
}
function delRec(storageKey, prefix, id){
  var all = cached(storageKey).filter(function(x){return x&&x.id!==id;});
  try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
  if(!_bootDone) _preBoot.push({t:'del', k:storageKey, id:id});
  if(typeof GemaSync!=='undefined' && GemaSync.deleteRecord) GemaSync.deleteRecord(MK, prefix+id).catch(function(){});
}

function stdGlobalMerged(){
  var byId={};
  prDefaultRecords().forEach(function(d){ byId[d.id]=d; });
  cached(STD_POOL).forEach(function(r){ if(r && r.scope==='global') byId[r.id]=r; });
  // Tombstones (deleted:true) blenden auch die GEMA-Basis-Seeds dauerhaft aus
  // (Muster Armaturen-Katalog: Default-Löschung via Tombstone-Record gleicher id).
  return Object.keys(byId).map(function(k){ return byId[k]; }).filter(function(r){ return !r.deleted; });
}
function stdOrgAll(){ var oid=myOrgId(); return cached(STD_POOL).filter(function(r){ return r && r.scope==='org' && r.orgId===oid; }); }
function stdOrgAktiv(){ return stdOrgAll().filter(function(r){ return r.status==='aktiv' && r.aktiv!==false; }); }
function overrideMap(){ var oid=myOrgId(), m={}; cached(OVR_POOL).forEach(function(r){ if(r && r.orgId===oid && r.punktId) m[r.punktId]=r; }); return m; }
function objAll(objektId){ var oid=myOrgId(); return cached(OBJ_POOL).filter(function(r){ return r && r.orgId===oid && (!objektId || r.objektId===objektId); }); }
function begVisible(){ var oid=myOrgId(); return cached(BEG_POOL).filter(function(b){ return b && b.orgId===oid; }).sort(function(a,b){ return (b.datum||'').localeCompare(a.datum||'') || (b.id>a.id?1:-1); }); }

function renderPunkt(a, ai, p, pi, abg){
  var t=PR_ANTWORTTYPEN[p.antworttyp]||PR_ANTWORTTYPEN[PR_ANTWORTTYP_DEFAULT];
  var entf=prZustandEntfaellt(p);   // nicht vorhanden → Zustand entfällt (grau, gesperrt)
  var bw=entf?'nicht_bewertet':(p.bewertung||'nicht_bewertet');
  var bwLbl=entf?'entfällt':((PR_BEWERTUNGEN[bw]||{}).label||'—');
  var qClass='q-'+(p.quelle||'global');
  var qLbl={global:'Standard',org:'Firma',objekt:'Objekt',begehung:'individuell'}[p.quelle||'global'];
  var fotoN=(p.fotos||[]).length;
  var h='<div class="pkt" id="pkt_'+ai+'_'+pi+'"><div class="pkt-hd"><div class="pkt-t">'
    +'<div class="pkt-name">'+(p.pflicht?'<span class="pflicht-star">*</span> ':'')+esc(p.bezeichnung)+'</div>'
    +'<div class="pkt-sub"><span class="q-badge '+qClass+'">'+esc(qLbl)+'</span>'+(p.untergruppe?'<span>'+esc(p.untergruppe)+'</span>':'')+'<span class="bw-chip bw-'+bw+'">'+esc(bwLbl)+'</span></div>'
    +'</div><div class="pkt-tools">';
  h+='<button class="icobtn" title="Notiz / Empfehlung / Foto" onclick="prTogglePkt('+ai+','+pi+')">📝'+(fotoN||p.bemerkung||p.empfehlung?'<span class="cnt">'+(fotoN||'•')+'</span>':'')+'</button>';
  if(p.individuell && !abg) h+='<button class="row-del" title="Punkt entfernen" onclick="prDelPunkt('+ai+','+pi+')">🗑</button>';
  h+='</div></div>';

  /* Antwort */
  h+='<div class="ans">';
  if(t.kind==='select'){
    t.optionen.forEach(function(o){
      var on = (p.antwort===o.v);
      h+='<button class="ans-btn'+(on?' on on-'+(o.bewertung||'nicht_bewertet'):'')+'" '+(abg?'disabled':'')+' onclick="prSetAntwort('+ai+','+pi+',\''+o.v+'\')">'+esc(o.l)+'</button>';
    });
  } else if(t.kind==='zahl'){
    h+='<input class="numin" type="text" inputmode="decimal" '+(abg?'disabled':'')+' placeholder="0.0" value="'+esc(p.antwort==null?'':p.antwort)+'" onblur="fixLeadingZero(this)" onchange="prSetAntwortRaw('+ai+','+pi+',this.value)">';
    h+=bwInlineBtns(ai,pi,bw,abg);
  } else {
    h+='<input class="txtin" type="text" '+(abg?'disabled':'')+' placeholder="Eingabe…" value="'+esc(p.antwort==null?'':p.antwort)+'" onchange="prSetAntwortRaw('+ai+','+pi+',this.value)">';
    h+=bwInlineBtns(ai,pi,bw,abg);
  }
  h+='</div>';

  /* Mehr (Zustand/Bemerkung/Empfehlung/Foto) */
  var openCls = p._open?'open':'';
  h+='<div class="pkt-more '+openCls+'" id="more_'+ai+'_'+pi+'">';
  h+='<label>Zustand</label><select '+((abg||entf)?'disabled':'')+' onchange="prSetBewertung('+ai+','+pi+',this.value)">'
    + Object.keys(PR_BEWERTUNGEN).map(function(k){ return '<option value="'+k+'" '+(bw===k?'selected':'')+'>'+esc(PR_BEWERTUNGEN[k].label)+'</option>'; }).join('') +'</select>';
  if(entf) h+='<div style="font-size:11px;color:var(--mut);margin-top:3px">Nicht vorhanden — der Zustand entfällt und ist nicht bearbeitbar.</div>';
  h+='<label>Bemerkung</label><textarea '+(abg?'disabled':'')+' placeholder="Beobachtung / Bemerkung…" onchange="prPktField('+ai+','+pi+',\'bemerkung\',this.value)">'+esc(p.bemerkung||'')+'</textarea>';
  h+='<label>Empfehlung</label><textarea '+(abg?'disabled':'')+' placeholder="Empfohlene Massnahme…" onchange="prPktField('+ai+','+pi+',\'empfehlung\',this.value)">'+esc(p.empfehlung||'')+'</textarea>';
  h+='<label>Fotos</label><div class="fotos" id="fotos_'+ai+'_'+pi+'">'+ (p.fotos||[]).map(function(f,fi){ return '<div class="foto"><img src="'+esc(imgSrc(f))+'" onclick="prLightbox(this.src)">'+(abg?'':'<button class="fx" onclick="prDelFoto('+ai+','+pi+','+fi+')">✕</button>')+'</div>'; }).join('')
    + (abg?'':'<button class="icobtn" style="width:64px;height:64px" onclick="prAddFoto('+ai+','+pi+')">📷</button>') +'</div>';
  h+='</div>';
  h+='</div>';
  return h;
}

/* Fotos */
var _prPhotoInput=null, _photoTarget=null;
window.prAddFoto=function(ai,pi){
  _photoTarget={ai:ai,pi:pi};
  if(_prPhotoInput && _prPhotoInput.parentNode){ try{_prPhotoInput.parentNode.removeChild(_prPhotoInput);}catch(e){} }
  _prPhotoInput=null;
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.style.cssText='position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0;pointer-events:none';
  inp.onchange=function(){
    var file=inp.files&&inp.files[0];
    if(inp.parentNode){ try{inp.parentNode.removeChild(inp);}catch(e){} }
    if(_prPhotoInput===inp) _prPhotoInput=null;
    if(!file) return;
    if(file.size>10*1024*1024){ GemaDialog.alert({title:'Datei zu gross',message:'Maximal 10 MB Originalgrösse.'}); return; }
    prResizeStoreFoto(file);
  };
  document.body.appendChild(inp); _prPhotoInput=inp; inp.click();
};
function prResizeStoreFoto(file){
  var reader=new FileReader();
  reader.onerror=function(){ GemaDialog.alert({title:'Fehler',message:'Foto konnte nicht gelesen werden.'}); };
  reader.onload=function(e){
    var img=new Image();
    img.onerror=function(){ GemaDialog.alert({title:'Fehler',message:'Foto-Format nicht unterstützt.'}); };
    img.onload=function(){
      var maxW=1600, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var du=c.toDataURL('image/jpeg',0.82);
      if(du.length>2*1024*1024) du=c.toDataURL('image/jpeg',0.5);
      if(du.length>2*1024*1024){ GemaDialog.alert({title:'Foto zu gross',message:'Bitte kleineres Bild verwenden.'}); return; }
      var t=_photoTarget; if(!t||!_cur) return;
      var begRef=_cur;   // Referenz halten: Upload endet evtl. NACH dem Editor-Schliessen
      var p=begRef.anlagen[t.ai].punkte[t.pi]; p.fotos=p.fotos||[];
      var foto={dataUrl:du, kommentar:''}; p.fotos.push(foto); p._open=true;
      saveBeg(begRef); refreshPunkt(t.ai,t.pi);
      // Auslagern nach Storage (Record klein halten)
      if(typeof window.GemaStorage!=='undefined' && GemaStorage.isConfigured && GemaStorage.isConfigured()){
        var oid=(myOrgId()||'org').replace(/[^A-Za-z0-9_-]/g,'');
        GemaStorage.uploadDataUrl(du,'pruefliste/'+oid).then(function(res){
          if(res&&res.url){ foto.url=res.url; delete foto.dataUrl; saveBeg(begRef); }
        }).catch(function(){});
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

window.prAddUseExisting=function(pid){

  var p=all.filter(function(x){return x.id===pid;})[0]; if(!p){ toast('Nicht gefunden'); return; }
  var quelle = p.scope==='global'?'global':(p.scope==='org'?'org':(p.objektId?'objekt':'org'));
  addPunktZeile(_addPktAnlage, {

function addPunktZeile(ai, zeile){

window.prAddPktSave=function(){
  if(!_cur || _addPktAnlage<0) return;
  var bez=($id('apBez').value||'').trim();
  if(!bez){ toast('Bezeichnung fehlt'); $id('apBez').focus(); return; }
  var art=$id('apArt').value, unter=($id('apUnter').value||'').trim(), typ=$id('apTyp').value, empf=($id('apEmpf').value||'').trim();
  var bem=($id('apBem')?$id('apBem').value:'').trim();
  var jetzt=new Date().toISOString();

  // Änderungsvorschlag zu einem bestehenden Standardpunkt (Duplikat-Flow)
  if(_addPktAnpassung){
    var ap=_addPktAnpassung;
    var av={ id:uid('prstd'), scope:ap.scope, orgId:myOrgId(), bezeichnung:bez, anlagenart:art, untergruppe:unter, antworttyp:typ,
      pflicht:false, standardbewertung:'schlecht', empfehlung:empf, aktiv:true, reihenfolge:9999,
      status:'vorschlag', aenderungZu:{id:ap.id, bezeichnung:ap.bezeichnung},
      vorschlagVon:{userId:(me()||{}).id||'',name:myName()}, vorschlagFuer:ap.scope,
      ersteller:{userId:(me()||{}).id||'',name:myName()}, erstelltAm:jetzt, version:1,
      log:[{alt:ap.bezeichnung,neu:bez,von:myName(),am:jetzt,grund:'Anpassung vorgeschlagen',status:'vorschlag'}] };
    saveRec(STD_POOL,STD_PF,av);
    notifyVorschlag(av);
    addPunktZeile(_addPktAnlage, {
      key:uid('pk'), punktId:ap.id, quelle:'begehung', individuell:true, _open:!!bem,
      bezeichnung:bez, untergruppe:unter, antworttyp:typ, pflicht:false,
      standardbewertung:'schlecht', empfehlungVorlage:empf,
      antwort:null, bewertung:'nicht_bewertet', bemerkung:bem, empfehlung:'', fotos:[] });
    prAddPktClose();
    toast('Anpassung vorgeschlagen — Punkt in Begehung übernommen');
    return;
  }

  var scope=(document.querySelector('input[name="apScope"]:checked')||{}).value||'begehung';
  var punktId='';
  // Speicherziel anlegen
  if(scope==='objekt'){
    var rec={ id:uid('probj'), orgId:myOrgId(), objektId:_cur.objektId, objektName:_cur.objektName, bezeichnung:bez, anlagenart:art,
      untergruppe:unter, antworttyp:typ, empfehlung:empf, standardbewertung:'schlecht', aktiv:true,
      ersteller:{userId:(me()||{}).id||'',name:myName()}, erstelltAm:jetzt };
    saveRec(OBJ_POOL,OBJ_PF,rec); punktId=rec.id;
    toast('Objekt-Prüfpunkt gespeichert');
  } else if(scope==='org' || scope==='global'){
    var v={ id:uid('prstd'), scope:scope, orgId:myOrgId(), bezeichnung:bez, anlagenart:art, untergruppe:unter, antworttyp:typ,
      pflicht:false, standardbewertung:'schlecht', empfehlung:empf, aktiv:true, reihenfolge:9999,
      status:'vorschlag', vorschlagVon:{userId:(me()||{}).id||'',name:myName()}, vorschlagFuer:scope,
      ersteller:{userId:(me()||{}).id||'',name:myName()}, erstelltAm:jetzt, version:1,
      log:[{alt:'',neu:bez,von:myName(),am:jetzt,grund:'Vorschlag erstellt',status:'vorschlag'}] };
    saveRec(STD_POOL,STD_PF,v); punktId=v.id;
    notifyVorschlag(v);
    toast('Vorschlag eingereicht');
  }

  addPunktZeile(_addPktAnlage, {
    key:uid('pk'), punktId:punktId, quelle:(scope==='objekt'?'objekt':'begehung'), individuell:true, _open:!!bem,
    bezeichnung:bez, untergruppe:unter, antworttyp:typ, pflicht:false,
    standardbewertung:'schlecht', empfehlungVorlage:empf,
    antwort:null, bewertung:'nicht_bewertet', bemerkung:bem, empfehlung:'', fotos:[] });
  prAddPktClose();
};

/* ═══════════════════════════════════════════════════════════════════════

window.prObjPktDel=function(id){

function renderStandardliste(){
  var el=$id('vContent'); if(!el) return;
  var canM=prCanManage(), canSuper=prIsSuper();
  var arts=prAnlagenarten();
  var ovr=overrideMap();
  var h='';
  /* Filter + Neu */
  h+='<div class="tb no-print"><select id="stdArtF" onchange="prStdArtF(this.value)"><option value="">Alle Anlagenarten</option>'
    + arts.map(function(a){ return '<option value="'+esc(a.id)+'" '+(a.id===_stdArtFilter?'selected':'')+'>'+esc(a.label)+'</option>'; }).join('') +'</select>';
  if(canM) h+='<button class="btn pri" onclick="prPkNew()">＋ Prüfpunkt</button>';
  h+='</div>';
  if(!canM) h+='<div class="empty" style="text-align:left;padding:12px 14px">Nur Lesen — Standardpunkte pflegen Abteilungsleiter/Admin. Neue Punkte kannst du in einer Begehung über «Prüfpunkt ergänzen» vorschlagen.</div>';

  var glob=stdGlobalMerged().filter(function(p){ return p.status!=='vorschlag'; });
  var orgP=stdOrgAll().filter(function(p){ return p.status!=='vorschlag' && p.status!=='abgelehnt'; });
  if(_stdArtFilter){ glob=glob.filter(function(p){return p.anlagenart===_stdArtFilter;}); orgP=orgP.filter(function(p){return p.anlagenart===_stdArtFilter;}); }
  function sortP(a,b){ return (a.reihenfolge||0)-(b.reihenfolge||0) || prNorm(a.bezeichnung).localeCompare(prNorm(b.bezeichnung)); }
  glob.sort(sortP); orgP.sort(sortP);

  if(orgP.length){
    h+='<div class="subhd">🏢 Firmen-Standardpunkte</div>';
    orgP.forEach(function(p){ h+=stdRow(p,'org',canM,canSuper,ovr); });
  }
  h+='<div class="subhd">🌐 GEMA-Standardpunkte</div>';
  if(!glob.length) h+='<div class="empty">Keine Punkte.</div>';
  glob.forEach(function(p){ h+=stdRow(p,'global',canM,canSuper,ovr); });
  el.innerHTML=h;
}
window.prStdArtF=function(v){ _stdArtFilter=v; renderStandardliste(); };
function stdRow(p, scope, canM, canSuper, ovr){
  var t=PR_ANTWORTTYPEN[p.antworttyp]||{};
  var deaktiviert = (p.aktiv===false) || (scope==='global' && ovr[p.id]);
  var canEditThis = scope==='global' ? canSuper : canM;
  var h='<div class="vrow'+(deaktiviert?' inaktiv':'')+'"><div class="vt">';
  h+='<div class="vn">'+(p.pflicht?'<span class="pflicht-star">*</span> ':'')+esc(p.bezeichnung)+'</div>';
  h+='<div class="vs"><span class="mini">'+esc(prArt(p.anlagenart).label)+'</span>'+(p.untergruppe?'<span class="mini">'+esc(p.untergruppe)+'</span>':'')
    +'<span class="mini">'+esc(t.kurz||p.antworttyp)+'</span>'
    +(p._default?'<span class="mini">GEMA-Basis</span>':'')
    +(deaktiviert?'<span class="mini" style="background:#fee2e2;color:#b91c1c">Inaktiv'+(scope==='global'&&ovr[p.id]?' (Firma)':'')+'</span>':'')
    +'</div></div><div class="vtools">';
  if(canEditThis){
    h+='<button class="btn sm" onclick="prPkEdit(\''+esc(p.id)+'\',\''+scope+'\')">✏️</button>';
    h+='<button class="btn sm" onclick="prPkLog(\''+esc(p.id)+'\',\''+scope+'\')" title="Änderungsprotokoll">🕘</button>';
    if(scope==='global'){
      h+='<button class="btn sm" onclick="prPkToggleGlobal(\''+esc(p.id)+'\')">'+(p.aktiv===false?'Aktiv':'Inaktiv')+'</button>';
      h+='<button class="btn sm red" onclick="prPkDelGlobal(\''+esc(p.id)+'\')">🗑</button>';
    } else {
      h+='<button class="btn sm" onclick="prPkToggleOrg(\''+esc(p.id)+'\')">'+(p.aktiv===false?'Aktiv':'Inaktiv')+'</button>';
      h+='<button class="btn sm red" onclick="prPkDelOrg(\''+esc(p.id)+'\')">🗑</button>';
    }
  } else if(canM && scope==='global'){
    // Org-Manager darf globalen Punkt für die eigene Firma ausblenden
    h+='<button class="btn sm" onclick="prPkHideForOrg(\''+esc(p.id)+'\')">'+(ovr[p.id]?'Einblenden':'Für Firma ausblenden')+'</button>';
  }
  h+='</div></div>';
  return h;
}

window.prPkSave=function(){

    bezeichnung:neuBez, anlagenart:$id('pkArt').value, untergruppe:($id('pkUnter').value||'').trim(),

    geaendertAm:new Date().toISOString(), version:(p.version||1)+(p._new?0:1), log:(p.log||[]).slice(0,60) };

/* Freigabe-Kern: normaler Vorschlag → aktiver Punkt; Änderungsvorschlag
   (aenderungZu) → AKTUALISIERT den Ziel-Punkt (Version +1, Protokoll) und
   entfernt den Vorschlags-Record. Rückgabe = der wirksame Punkt. */
function applyVorschlag(rec, grund){
  var jetzt=new Date().toISOString();
  if(rec.aenderungZu && rec.aenderungZu.id){
    var src = rec.scope==='global' ? stdGlobalMerged() : stdOrgAll();
    var target = src.filter(function(x){return x.id===rec.aenderungZu.id;})[0];
    if(target){
      var t=JSON.parse(JSON.stringify(target)); delete t._default;
      t.scope=rec.scope; t.orgId = rec.scope==='global' ? null : myOrgId();
      var altBez=t.bezeichnung;
      t.bezeichnung=rec.bezeichnung;
      t.untergruppe=rec.untergruppe||t.untergruppe;
      t.antworttyp=rec.antworttyp||t.antworttyp;
      if(rec.empfehlung) t.empfehlung=rec.empfehlung;
      t.status='aktiv'; t.aktiv=t.aktiv!==false;
      t.version=(t.version||1)+1; t.geaendertAm=jetzt;
      t.log=(t.log||[]).slice(0,60);
      t.log.unshift({alt:altBez,neu:t.bezeichnung,von:myName(),am:jetzt,grund:'Anpassung übernommen (Vorschlag von '+((rec.vorschlagVon||{}).name||'—')+')',status:'aktiv'});
      saveRec(STD_POOL,STD_PF,t);
      delRec(STD_POOL,STD_PF,rec.id);
      return t;
    }
    // Ziel nicht mehr vorhanden → als neuer Punkt freigeben (Fallthrough)
  }
  var out=JSON.parse(JSON.stringify(rec));
  out.status='aktiv'; out.aktiv=true; out.geaendertAm=jetzt;
  if(out.scope==='global') out.orgId=null;
  out.log=(out.log||[]).slice(0,60);
  out.log.unshift({alt:'',neu:out.bezeichnung,von:myName(),am:jetzt,grund:grund||'Freigegeben',status:'aktiv'});
  saveRec(STD_POOL,STD_PF,out);
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   BERICHT (Print-Fenster A4) — gebrandet wie Offerte/Schadensbericht
   ═══════════════════════════════════════════════════════════════════════ */
/* Branding-Helfer (Kontrastschutz, dupliziert nach Kanon gema_schaden_pdf):
   Firmenfarbe wird NIE 1:1 als Text-/Flächenfarbe genutzt, sondern Richtung
   Schwarz skaliert, bis der WCAG-Kontrast gegen Weiss >= 4.5:1 ist. */
function _hexToRgb(hex){
  hex=String(hex||'').trim().replace(/^#/,'');
  if(hex.length===3) hex=hex.charAt(0)+hex.charAt(0)+hex.charAt(1)+hex.charAt(1)+hex.charAt(2)+hex.charAt(2);
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return { r:parseInt(hex.slice(0,2),16), g:parseInt(hex.slice(2,4),16), b:parseInt(hex.slice(4,6),16) };
}
function _rgbToHex(r,g,b){ function x(n){ n=Math.max(0,Math.min(255,Math.round(n))); return (n<16?'0':'')+n.toString(16); } return '#'+x(r)+x(g)+x(b); }
function _relLum(rgb){
  var a=[rgb.r,rgb.g,rgb.b].map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
function _contrastVsWhite(rgb){ return 1.05/(_relLum(rgb)+0.05); }
function _darkenForWhiteBg(hex, target){
  var rgb=_hexToRgb(hex); if(!rgb) return null;
  if(_contrastVsWhite(rgb)>=target) return _rgbToHex(rgb.r,rgb.g,rgb.b);
  var f=1.0;
  for(var i=0;i<40;i++){ f-=0.025; var c={r:rgb.r*f,g:rgb.g*f,b:rgb.b*f}; if(_contrastVsWhite(c)>=target) return _rgbToHex(c.r,c.g,c.b); }
  return '#1f2933';
}
function _lightTint(hex, whiteMix){
  var rgb=_hexToRgb(hex); if(!rgb) return null;
  var m=whiteMix==null?0.92:whiteMix;
  return _rgbToHex(rgb.r+(255-rgb.r)*m, rgb.g+(255-rgb.g)*m, rgb.b+(255-rgb.b)*m);
}
/* org.settings.pdfFarben → {acc, deep, forest, tint}; ohne Branding GEMA-Default
   (Modul-Cyan + Navy als Verlauf-Tail — Muster gema_schaden_pdf). */
function prBrand(){
  var o=org(), pf=o&&o.settings&&o.settings.pdfFarben;
  if(pf && pf.primary && _hexToRgb(pf.primary)){
    var acc=_darkenForWhiteBg(pf.primary,4.5);
    var deep=_darkenForWhiteBg(pf.primary,7)||acc;
    var forest=(pf.secondary&&_darkenForWhiteBg(pf.secondary,4.5))||deep;
    return { acc:acc, deep:deep, forest:forest, tint:_lightTint(pf.primary)||'#eef2f6' };
  }
  return { acc:'#0e7490', deep:'#155e75', forest:'#0f172a', tint:'#ecfeff' };
}

  (b.anlagen||[]).forEach(function(a){
    var art=prArt(a.anlagenart);
    h+='<div class="anl"><h2>'+E(art.ic||'')+' '+E(a.name||art.label)+'</h2><div class="s">'+(a.standort?'Standort: '+E(a.standort):'')+'</div></div>';
    h+='<table class="pk"><thead><tr><th style="width:40%">Prüfpunkt</th><th>Antwort</th><th>Zustand</th><th style="width:32%">Bemerkung</th></tr></thead><tbody>';
    (a.punkte||[]).forEach(function(p){
      var entf=prZustandEntfaellt(p);
      var bwk=entf?'nicht_bewertet':(p.bewertung||'nicht_bewertet');
      var bwLbl=entf?'entfällt':((PR_BEWERTUNGEN[bwk]||{}).label||'—');
      var hatFotos=(p.fotos||[]).some(function(f){ return !!imgSrc(f); });
      var bem='';
      if(p.bemerkung) bem+=E(p.bemerkung);
      /* Empfehlung: bei Fotos unter dem Foto-Block (unten), sonst in der Tabelle */
      if(p.empfehlung && !hatFotos) bem+=empfHtml(p.empfehlung);
      h+='<tr><td>'+(p.pflicht?'* ':'')+E(p.bezeichnung)+(p.untergruppe?'<br><span style="font-size:9pt;color:#555">'+E(p.untergruppe)+'</span>':'')+'</td>'
        +'<td>'+E(prAntwortLabel(p.antworttyp,p.antwort)||'—')+'</td>'
        +'<td class="bw bw-'+bwk+'">'+E(bwLbl)+'</td>'
        +'<td>'+(bem||'—')+'</td></tr>';
    });
    h+='</tbody></table>';
    /* Foto-Blöcke pro Prüfpunkt: 2 Bilder pro Zeile über die Seitenbreite,
       Empfehlung(en) direkt unter den Bildern. */
    (a.punkte||[]).forEach(function(p){
      var fotos=(p.fotos||[]).map(function(f){ return imgSrc(f); }).filter(Boolean);
      if(!fotos.length) return;
      h+='<div class="pblock'+(fotos.length<=4?' avoid':'')+'">'
        +'<div class="pblock-t">'+E(p.bezeichnung)+(p.untergruppe?' <span class="u">· '+E(p.untergruppe)+'</span>':'')+'</div>'
        +'<div class="pgrid">'+fotos.map(function(s){ return '<img src="'+E(s)+'">'; }).join('')+'</div>'
        +empfHtml(p.empfehlung)
        +'</div>';
    });
  });
  if(!(b.anlagen||[]).length) h+='<p style="color:#666">Keine Anlagen erfasst.</p>';
  h+='<div class="ft" style="margin-top:20px">Erstellt: '+E(fmtDatum(heute()))+' · '+E(orgName||'GEMA')+' · GEMA Prüfliste</div>';
  h+='</body></html>';
  w.document.write(h); w.document.close();
  if(window.GemaPrintA4) GemaPrintA4.apply(w);
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */
function boot(){
  if(!$id('prRoot')) return; // «Kein Zugriff»: gema_auth hat den Body ersetzt
  _objFilterInit();
  render();
  var timeout=new Promise(function(r){ setTimeout(r,6000); });
  if(typeof GemaSync!=='undefined' && GemaSync.bindCollection){
    var bindP=Promise.all([
      GemaSync.bindCollection(MK,STD_POOL,STD_PF,'id'),
      GemaSync.bindCollection(MK,OVR_POOL,OVR_PF,'id'),
      GemaSync.bindCollection(MK,OBJ_POOL,OBJ_PF,'id'),
      GemaSync.bindCollection(MK,BEG_POOL,BEG_PF,'id')
    ]);
    Promise.race([bindP,timeout]).then(function(){ _cloudLoaded=true; _objFilterInit(); render(); openDeepLink(); });
    bindP.then(function(){ _bootDone=true; _preBootApply(); _cloudLoaded=true; render(); })
         .catch(function(){ _bootDone=true; _preBootApply(); _cloudLoaded=true; render(); });
  } else { _bootDone=true; _cloudLoaded=true; render(); openDeepLink(); }
  window.addEventListener('gema-objekte-loaded',function(){ _objFilterInit(); if(_tab==='begehungen') { fillObjektFilter(); renderBegList(); } });
  if(typeof GemaObjekte!=='undefined' && GemaObjekte.ready){ GemaObjekte.ready.then(function(){ _objFilterInit(); if(_tab==='begehungen'){ fillObjektFilter(); renderBegList(); } }).catch(function(){}); }
  if(typeof GemaFeedback!=='undefined') GemaFeedback.init('pruefliste','Prüfliste');
}
function openDeepLink(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('tab')==='verwaltung' && _tab!=='verwaltung'){ _tab='verwaltung'; render(); }
    var beg=q.get('beg');
    if(beg){ var b=begById(beg); if(b){ _cur=JSON.parse(JSON.stringify(b)); openEditor(); } }
  }catch(e){}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();

  rechte:function(){ return {begehung:prCanBegehung(),manage:prCanManageOrg(),super:prIsSuper()}; }, render:render, nextNr:nextNr };

/* fixLeadingZero (Kanon) */
function fixLeadingZero(el){ var v=el.value.trim(); if(v===''){return;} if(/^\./.test(v))v='0'+v; if(/^-\./.test(v))v='-0'+v.slice(1); el.value=String(parseFloat(v)); }
