<!doctype html>
<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_recent.js"></script>
<meta charset="utf-8"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GEMA"/>
<title>GEMA – Prüfungen (Schule)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f3f5fb;--sur:#fff;--sur2:#f7f8fc;
  --brd:#e0e4ef;--brd2:#c8cfdf;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --teal:#0f766e;--teal-bg:#f0fdfa;--teal-bd:#99f6e4;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amb:#d97706;--amb-bg:#fffbeb;--amb-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#93c5fd;
  --r:12px;--r-sm:8px;--r-lg:18px;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --sans:'DM Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overflow-x:hidden;overflow-x:clip}
::placeholder{color:#cbd5e1}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);box-shadow:var(--sh-sm)}
.g-nav-inner{padding:0 24px;height:52px;display:flex;align-items:center;gap:0}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:14px}
.g-nav-bc{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.bc-cat{color:var(--mut);text-decoration:none;font-weight:600}
.bc-sep{color:var(--mut2)}
.bc-cur{font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.gema-feedback-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.g-page{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.hero{background:linear-gradient(135deg,#0f172a,#134e4a 55%,#0f766e);border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:18px}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-left{display:flex;align-items:center;gap:14px;min-width:0}
.hero-ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.hero-title{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hero-sub{font-size:12.5px;color:#a7c3c0;margin-top:2px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--brd);flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 16px;font-size:13.5px;font-weight:800;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--teal);border-color:var(--teal)}
/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tb-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.tb-btn:hover{background:var(--sur2)}
.tb-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.tb-btn.primary:hover{background:#0d5f59}
.tb-sel{border:1.5px solid var(--brd2);border-radius:10px;padding:8px 11px;font-size:13px;background:var(--sur);color:var(--txt)}
.tb-search{flex:1;min-width:170px;border:1.5px solid var(--brd2);border-radius:10px;padding:9px 12px;font-size:13.5px;background:var(--sur)}
.tb-spacer{flex:1}
/* Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.card-bar{height:5px;background:linear-gradient(90deg,#0f766e,#14b8a6)}
.card-body{padding:13px 16px 11px;flex:1}
.card-tt{font-size:14.5px;font-weight:800;line-height:1.3}
.card-sub{font-size:12px;color:var(--mut);margin-top:2px}
.card-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--txt2)}
.card-ft{padding:8px 16px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.teal{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd)}
.badge.grey{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.badge.amb{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bd)}
.badge.grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.badge.blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.empty{background:var(--sur);border:1.5px dashed var(--brd2);border-radius:var(--r-lg);padding:44px 20px;text-align:center;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:10px}
.spinner-wrap{display:flex;justify-content:center;padding:50px 0}
/* Overlays */
.ov{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ov.open{display:block}
.ov-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ov-back{border:1.5px solid var(--brd2);background:var(--sur);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.ov-title{font-size:15.5px;font-weight:900;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-body{max-width:1000px;margin:0 auto;padding:18px 20px 100px}
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:16px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:9px;padding:12px 18px;border-bottom:1px solid var(--brd);background:var(--sur2);flex-wrap:wrap}
.panel-hd-title{font-size:13.5px;font-weight:800}
.panel-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:16px 18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--brd2);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;background:var(--sur);color:var(--txt)}
.inp:focus{outline:none;border-color:var(--teal)}
textarea.inp{min-height:70px;resize:vertical}
.inp.sm{padding:6px 9px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#0d5f59}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--sur);border:1.5px solid var(--brd2);color:var(--txt2)}
.btn.ghost:hover{background:var(--sur2)}
.btn.danger{background:var(--red-bg);border:1.5px solid var(--red-bd);color:var(--red)}
.btn.grn{background:var(--grn);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Aufgaben-Zeilen (Prüfung) */
.aufg-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--brd)}
.aufg-row:last-child{border-bottom:none}
.aufg-nr{width:26px;height:26px;border-radius:8px;background:var(--sur2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.aufg-typ{font-size:15px;flex-shrink:0}
.aufg-tt{font-weight:700;font-size:13px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aufg-pt{width:64px}
.aufg-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{border:1px solid var(--brd2);background:var(--sur);border-radius:7px;width:28px;height:28px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sur2)}
/* Pool-Karten */
.pool-tt{font-weight:800;font-size:13.5px;line-height:1.3}
.pool-frage{font-size:12px;color:var(--txt2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pool-hist{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.6}
/* Modals (2. Ebene) */
.modal-bg{position:fixed;inset:0;z-index:1200;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--sur);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.3);width:100%;max-width:760px;margin-bottom:40px}
.modal-hd{display:flex;align-items:center;gap:9px;padding:14px 20px;border-bottom:1px solid var(--brd)}
.modal-hd-title{font-size:14.5px;font-weight:900;flex:1}
.modal-x{border:none;background:none;font-size:19px;cursor:pointer;color:var(--mut)}
.modal-body{padding:18px 20px;max-height:calc(100vh - 190px);overflow-y:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--brd);flex-wrap:wrap}
/* MC-Optionen Editor */
.mc-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mc-korrekt{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--grn);white-space:nowrap;cursor:pointer}
/* Feld-Zeilen */
.feld-row{display:grid;grid-template-columns:1.4fr .6fr .8fr .5fr 34px;gap:7px;margin-bottom:7px;align-items:center}
.feld-head{font-size:11px;font-weight:800;color:var(--mut)}
/* Bild-Chips */
.img-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-chip{position:relative;width:86px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--brd2);background:var(--sur2)}
.img-chip img{width:100%;height:100%;object-fit:cover}
.img-chip .x{position:absolute;top:2px;right:2px;background:rgba(15,23,42,.72);color:#fff;border:none;border-radius:6px;width:20px;height:20px;font-size:11px;cursor:pointer}
.img-chip .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:22px}
/* Lösung-Box */
.loes-box{background:var(--grn-bg);border:1px solid var(--grn-bd);border-radius:10px;padding:11px 13px;font-size:13px;margin-top:9px;white-space:pre-wrap}
.loes-label{font-size:11px;font-weight:900;color:var(--grn);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
/* Monitor */
.mon-table{width:100%;border-collapse:collapse;font-size:13px}
.mon-table th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:7px 8px;border-bottom:1.5px solid var(--brd)}
.mon-table td{padding:8px;border-bottom:1px solid var(--brd)}
/* Korrektur */
.kor-ans{background:var(--sur2);border:1px solid var(--brd);border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:8px}
.kor-line{padding:1px 4px;border-radius:4px;cursor:pointer}
.kor-line:hover{background:#fef9c3}
.kor-line.marked{background:#fde68a;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px}
.kor-mc-opt{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;border:1px solid var(--brd);margin-bottom:5px;font-size:13px}
.kor-mc-opt.selected{border-color:var(--blue-bd);background:var(--blue-bg)}
.kor-mc-opt.correct{border-color:var(--grn-bd);background:var(--grn-bg)}
.kor-mc-opt.selected.wrong{border-color:var(--red-bd);background:var(--red-bg)}
.kor-files{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.kor-file{width:130px;border:1px solid var(--brd2);border-radius:10px;overflow:hidden;background:var(--sur)}
.kor-file img{width:100%;height:90px;object-fit:cover;display:block;cursor:zoom-in}
.kor-file .nm{font-size:10.5px;padding:4px 6px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kor-file .act{display:flex;gap:4px;padding:0 5px 6px}
.pt-input{width:76px;border:1.5px solid var(--brd2);border-radius:8px;padding:7px 9px;font-size:15px;font-weight:800;text-align:center}
/* Annotation */
#annOv{position:fixed;inset:0;z-index:1500;background:rgba(15,23,42,.92);display:none;flex-direction:column}
#annOv.open{display:flex}
.ann-tools{display:flex;align-items:center;gap:7px;padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px;background:#0f172a;flex-wrap:wrap}
.ann-tool{border:1.5px solid #334155;background:#1e293b;color:#e2e8f0;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.ann-tool.active{background:#0f766e;border-color:#14b8a6}
.ann-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px}
#annCanvas{background:#fff;border-radius:6px;max-width:100%;touch-action:none;cursor:crosshair}
/* Notenspiegel */
.ns-grid{display:flex;gap:12px;flex-wrap:wrap}
.ns-kpi{background:var(--sur2);border:1px solid var(--brd);border-radius:11px;padding:9px 16px;text-align:center;min-width:86px}
.ns-kpi .v{font-size:19px;font-weight:900}
.ns-kpi .l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.foot{margin-top:36px;text-align:center;color:var(--mut2);font-size:12px}
@media(max-width:640px){
  .g-page{padding:14px 14px 70px}
  .hero{padding:14px 16px}
  .hero-title{font-size:17px}
  .hero-pills{display:none}
  .ov-body{padding:14px 12px 110px}
  .grid2,.grid3{grid-template-columns:1fr}
  .feld-row{grid-template-columns:1fr .5fr .7fr .5fr 30px}
}
</style>
<link rel="stylesheet" href="gema_responsive.css"/>
</head>

<script>
(function(){
'use strict';

var S=window.GemaSchule;
var _cloudLoaded=false;
var _tab='pruef';
var _openPfId=null;
var _monTimer=null;

var TYP_ICON={freitext:'✍️',mc:'☑️',berechnung:'🧮'};
var TYP_LABEL={freitext:'Freitext',mc:'Multiple Choice',berechnung:'Berechnung'};

function me(){return (typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentUser())||null;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function toLocalInput(iso){
  if(!iso)return '';
  var d=new Date(iso);
  if(isNaN(d))return '';
  var p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function fromLocalInput(v){
  if(!v)return '';
  var d=new Date(v);
  return isNaN(d)?'':d.toISOString();
}
function userById(id){
  var users=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers)?(GemaAuth.getUsers()||[]):[];
  return users.find(function(u){return u.id===id;})||null;
}
function statusBadge(p){
  var u=me();
  if(p.status==='entwurf')return '<span class="badge grey">Entwurf</span>';
  var r=S.rest(p,u?u.id:'',Date.now());
  if(r.phase==='geplant')return '<span class="badge blue">Geplant</span>';
  if(r.phase==='laufend')return '<span class="badge grn">● Läuft</span>';
  if(r.phase==='toleranz')return '<span class="badge amb">Toleranzzeit</span>';
  return p.publiziertAm?'<span class="badge teal">Publiziert</span>':'<span class="badge grey">Beendet</span>';
}
function pfPhaseKey(p){
  if(p.status==='entwurf')return 'entwurf';
  if(p.publiziertAm)return 'publiziert';
  var r=S.rest(p,'',Date.now());
  if(r.phase==='geplant')return 'geplant';
  if(r.phase==='laufend'||r.phase==='toleranz')return 'laufend';
  return 'beendet';
}

// ═══════ Tabs / Hero ═══════
window.switchTab=function(t){
  _tab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t);});
  document.getElementById('sec-pruef').style.display=t==='pruef'?'':'none';
  document.getElementById('sec-pool').style.display=t==='pool'?'':'none';
  if(t==='pool')renderPool();else renderPruefListe();
};
function renderHero(){
  var pf=S.pruefungenForDozent();
  var pool=S.aufgabenPool();
  document.getElementById('heroPills').innerHTML=
    '<span class="hero-pill">'+pf.length+' Prüfungen</span>'+
    '<span class="hero-pill">'+pool.length+' Pool-Aufgaben</span>';
}

// ═══════ Prüfungs-Liste ═══════
function klasseName(kid){
  var k=S.klasseById(kid);
  return k?k.name:'—';
}
function renderPruefListe(){
  renderHero();
  var host=document.getElementById('pfListe');
  var kf=document.getElementById('pfKlasseFilter');
  // Klassen-Filter befüllen (Auswahl erhalten)
  var cur=kf.value;
  kf.innerHTML='<option value="">Alle Klassen</option>'+S.klassenForDozent().map(function(k){
    return '<option value="'+esc(k.id)+'"'+(k.id===cur?' selected':'')+'>'+esc(k.name)+'</option>';
  }).join('');
  var sf=document.getElementById('pfStatusFilter').value;
  var list=S.pruefungenForDozent().filter(function(p){
    if(kf.value&&p.klasseId!==kf.value)return false;
    if(sf&&pfPhaseKey(p)!==sf)return false;
    return true;
  });
  list.sort(function(a,b){return String(b.geaendertAm||'').localeCompare(String(a.geaendertAm||''));});
  if(!list.length){
    host.innerHTML=_cloudLoaded
      ?'<div class="empty"><div class="big">📝</div><div style="font-weight:800;font-size:15px;margin-bottom:5px">Noch keine Prüfung</div><div style="font-size:12.5px">Erstelle eine Prüfung und stelle sie aus dem Aufgaben-Pool zusammen.</div></div>'
      :'<div class="spinner-wrap"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="90 60" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg></div>';
    return;
  }
  host.innerHTML='<div class="grid">'+list.map(function(p){
    return '<div class="card" onclick="pfOpen(\''+p.id+'\')">'+
      '<div class="card-bar"></div>'+
      '<div class="card-body">'+
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="card-tt">'+esc(p.titel||'Ohne Titel')+'</div>'+statusBadge(p)+'</div>'+
        '<div class="card-sub">'+esc(klasseName(p.klasseId))+(p.teil?' · '+esc(p.teil):'')+'</div>'+
        '<div class="card-meta">'+
          '<span class="chip">'+(p.aufgaben||[]).length+' Aufgaben</span>'+
          '<span class="chip">'+S.totalPunkte(p)+' P.</span>'+
          (p.startAm?'<span class="chip">🕒 '+S.fmtZeit(p.startAm)+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="card-ft"><span>Geändert '+S.fmtDatum(p.geaendertAm)+'</span><span style="color:var(--teal);font-weight:800">Öffnen →</span></div>'+
    '</div>';
  }).join('')+'</div>';
}

// ═══════ Prüfung: Neu / Öffnen / Detail ═══════
var DEFAULT_REGELN='Einzelarbeit: Die Prüfung wird selbstständig gelöst. Zusammenarbeit ist nicht erlaubt.\nErlaubte Hilfsmittel: siehe Angabe oben.\nTäuschungsversuch: Abschreiben oder der Gebrauch unerlaubter Hilfsmittel führt zur Note 1.0.\nDie Antworten werden direkt in GEMA eingetragen; pro Aufgabe können Dateien (Fotos/PDF) hochgeladen werden.\nNach Ablauf der Zeit (inkl. Toleranzzeit) wird der aktuelle Stand automatisch abgegeben.';
window.pfNeu=function(){
  var klassen=S.klassenForDozent().filter(function(k){return !k.archiviert;});
  if(!klassen.length){
    GemaDialog.alert({title:'Neue Prüfung',message:'Bitte zuerst eine Klasse anlegen (Klassen & Lernmittel).'});
    return;
  }
  GemaDialog.prompt({title:'Neue Prüfung',placeholder:'z.B. Modulprüfung Kaltwasser — Teil 1: Fragen',defaultValue:''}).then(function(titel){
    if(titel===null)return;
    var k0=klassen[0];
    var p={
      titel:String(titel||'Neue Prüfung').trim()||'Neue Prüfung',
      klasseId:k0.id,teil:'',lehrgang:k0.lehrgang||'',ort:'',hilfsmittel:'Keine',
      regeln:DEFAULT_REGELN,
      aufgaben:[],startAm:'',endeAm:'',toleranzMin:10,
      mischen:false,nachAbgabeEinsehen:true,loesungNachPublish:false,rundung:'zehntel',
      status:'entwurf',verlaengerungen:{}
    };
    S.savePruefung(p).then(function(){renderPruefListe();pfOpen(p.id);});
  });
};
window.pfOpen=function(id){
  _openPfId=id;
  document.getElementById('pfOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderPfDetail();
  startMonitor();
};
window.pfClose=function(){
  _openPfId=null;
  stopMonitor();
  document.getElementById('pfOv').classList.remove('open');
  document.body.style.overflow='';
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  renderPruefListe();
};
function pf(){return _openPfId?S.pruefungFull(_openPfId):null;}
function pfSave(p,rerender){
  return S.savePruefung(p).then(function(){if(rerender!==false)renderPfDetail();});
}

function renderPfDetail(){
  var p=pf();
  var body=document.getElementById('pfOvBody');
  if(!p){body.innerHTML='<div class="empty">Prüfung nicht gefunden.</div>';return;}
  document.getElementById('pfOvTitle').textContent=p.titel||'Prüfung';
  document.getElementById('pfOvBadge').innerHTML=statusBadge(p);
  var phase=pfPhaseKey(p);
  var h='';

  // ── Grunddaten ──
  h+='<div class="panel"><div class="panel-hd"><span>📋</span><span class="panel-hd-title">Grunddaten</span></div>'+
    '<div class="panel-body">'+
    '<div class="grid2">'+
      '<div class="fg"><label>Titel</label><input class="inp" id="pfTitel" value="'+esc(p.titel)+'" onblur="pfGrundSave()"/></div>'+
      '<div class="fg"><label>Teil / Inhalt</label><input class="inp" id="pfTeil" value="'+esc(p.teil||'')+'" placeholder="z.B. Teil 1: Fragen" onblur="pfGrundSave()"/></div>'+
      '<div class="fg"><label>Klasse</label><select class="inp" id="pfKlasse" onchange="pfGrundSave()">'+
        S.klassenForDozent().map(function(k){return '<option value="'+esc(k.id)+'"'+(k.id===p.klasseId?' selected':'')+'>'+esc(k.name)+'</option>';}).join('')+
      '</select></div>'+
      '<div class="fg"><label>Lehrgang</label><input class="inp" id="pfLehrgang" value="'+esc(p.lehrgang||'')+'" placeholder="z.B. HF Gebäudetechnik" onblur="pfGrundSave()"/></div>'+
      '<div class="fg"><label>Ort</label><input class="inp" id="pfOrt" value="'+esc(p.ort||'')+'" placeholder="z.B. AGS Basel, Schulhaus Vogelsang" onblur="pfGrundSave()"/></div>'+
      '<div class="fg"><label>Hilfsmittel</label><input class="inp" id="pfHilfsmittel" value="'+esc(p.hilfsmittel||'')+'" placeholder="z.B. Keine / Alle" onblur="pfGrundSave()"/></div>'+

    '<div class="fg"><label>Regeln (eine pro Zeile — erscheinen für Studierende und im PDF)</label><textarea class="inp" id="pfRegeln" onblur="pfGrundSave()">'+esc(p.regeln||'')+'</textarea></div>'+

    '<div class="panel-body">'+
    (aufg.length?aufg.map(function(a,i){
      return '<div class="aufg-row">'+
        '<div class="aufg-nr">'+(i+1)+'</div>'+
        '<div class="aufg-typ">'+(TYP_ICON[a.typ]||'❓')+'</div>'+
        '<div class="aufg-tt" title="'+esc(a.titel)+'">'+esc(a.titel||'(ohne Titel)')+'</div>'+
        '<input class="inp sm aufg-pt" type="text" inputmode="decimal" value="'+esc(a.punkte)+'" onblur="aufgPunkte('+i+',this.value)" title="Punkte"/>'+
        '<div class="aufg-actions">'+
          '<button class="icon-btn" onclick="aufgMove('+i+',-1)" title="Nach oben">↑</button>'+
          '<button class="icon-btn" onclick="aufgMove('+i+',1)" title="Nach unten">↓</button>'+
          '<button class="icon-btn" onclick="aufgVorschau('+i+')" title="Vorschau mit Lösung">👁</button>'+
          '<button class="icon-btn" onclick="aufgEdit('+i+')" title="Bearbeiten">✏️</button>'+
          '<button class="icon-btn" onclick="aufgWeg('+i+')" title="Entfernen">🗑</button>'+
        '</div>'+
      '</div>';
    }).join(''):'<div style="color:var(--mut);font-size:13px">Noch keine Aufgaben — füge sie aus dem Pool ein oder erstelle neue.</div>')+
    '</div></div>';

  // ── Planung & Optionen ──
  h+='<div class="panel"><div class="panel-hd"><span>📅</span><span class="panel-hd-title">Planung & Optionen</span>'+
    '<div class="right">'+
    (p.status==='entwurf'
      ?'<button class="btn grn sm" onclick="pfAufschalten()">📤 Aufschalten</button>'
      :(phase==='geplant'?'<button class="btn ghost sm" onclick="pfZurueckziehen()">↩ Zurückziehen (Entwurf)</button>':''))+
    '</div></div>'+
    '<div class="panel-body">'+
    '<div class="grid3">'+
      '<div class="fg"><label>Prüfungsbeginn</label><input class="inp" type="datetime-local" id="pfStart" value="'+toLocalInput(p.startAm)+'" onchange="pfPlanSave()"/></div>'+
      '<div class="fg"><label>Prüfungsende</label><input class="inp" type="datetime-local" id="pfEnde" value="'+toLocalInput(p.endeAm)+'" onchange="pfPlanSave()"/></div>'+
      '<div class="fg"><label>Toleranzzeit (Minuten)</label><input class="inp" type="text" inputmode="decimal" id="pfToleranz" value="'+esc(p.toleranzMin!=null?p.toleranzMin:10)+'" onblur="pfPlanSave()"/></div>'+
    '</div>'+
    '<div class="grid2" style="margin-top:4px">'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="pfMischen" '+(p.mischen?'checked':'')+' onchange="pfPlanSave()" style="width:16px;height:16px;accent-color:var(--teal)"/> 🔀 Aufgaben pro Studierendem mischen (inkl. MC-Antworten)</label>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="pfEinsehen" '+(p.nachAbgabeEinsehen!==false?'checked':'')+' onchange="pfPlanSave()" style="width:16px;height:16px;accent-color:var(--teal)"/> 👁 Studierende sehen ihre Abgabe nach Prüfungsende</label>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="pfLoesPub" '+(p.loesungNachPublish?'checked':'')+' onchange="pfPlanSave()" style="width:16px;height:16px;accent-color:var(--teal)"/> ✅ Musterlösung nach Veröffentlichung anzeigen</label>'+
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600">Notenrundung: <select class="inp sm" id="pfRundung" style="width:auto" onchange="pfPlanSave()"><option value="zehntel"'+(p.rundung!=='halb'?' selected':'')+'>Zehntelnoten</option><option value="halb"'+(p.rundung==='halb'?' selected':'')+'>Halbe Noten</option></select></label>'+
    '</div>'+
    (p.status!=='entwurf'&&p.startAm?'<div style="margin-top:12px;font-size:12.5px;color:var(--mut)">Fenster: <b>'+S.fmtZeit(p.startAm)+'</b> bis <b>'+S.fmtZeit(p.endeAm)+'</b> · Toleranz '+(p.toleranzMin||0)+' Min. · Dauer '+(p.startAm&&p.endeAm?Math.round((Date.parse(p.endeAm)-Date.parse(p.startAm))/60000)+' Min.':'—')+'</div>':'')+
    '</div></div>';

  // ── Verlängerungen ──
  var klasse=S.klasseById(p.klasseId);
  var studs=(klasse&&klasse.studentIds||[]).map(function(sid){return userById(sid)||{id:sid,name:sid};});
  h+='<div class="panel"><div class="panel-hd"><span>⏱</span><span class="panel-hd-title">Verlängerungen & Nachschreiber</span></div>'+
    '<div class="panel-body">'+
    (studs.length?'<div style="font-size:12px;color:var(--mut);margin-bottom:10px">Zusatzzeit (Nachteilsausgleich) verlängert das Prüfungsende. Ein individuelles Fenster (Nachschreiber) ersetzt Beginn/Ende für diese Person.</div>'+
      '<div style="overflow-x:auto"><table class="mon-table"><tr><th>Studierende(r)</th><th>Zusatz (Min.)</th><th>Eigener Beginn</th><th>Eigenes Ende</th></tr>'+
      studs.map(function(s){
        var v=(p.verlaengerungen||{})[s.id]||{};
        return '<tr><td style="font-weight:700">'+esc(s.name||s.username||'')+'</td>'+
          '<td><input class="inp sm" style="width:74px" type="text" inputmode="decimal" value="'+esc(v.zusatzMin||'')+'" onblur="verlSave(\''+esc(s.id)+'\',\'zusatzMin\',this.value)"/></td>'+
          '<td><input class="inp sm" type="datetime-local" value="'+toLocalInput(v.startAm)+'" onchange="verlSave(\''+esc(s.id)+'\',\'startAm\',this.value)"/></td>'+
          '<td><input class="inp sm" type="datetime-local" value="'+toLocalInput(v.endeAm)+'" onchange="verlSave(\''+esc(s.id)+'\',\'endeAm\',this.value)"/></td></tr>';
      }).join('')+'</table></div>'
    :'<div style="color:var(--mut);font-size:13px">Keine Studierenden in der Klasse.</div>')+
    '</div></div>';

  // ── Durchführung (Monitor) ──
  if(p.status!=='entwurf'){
    h+='<div class="panel"><div class="panel-hd"><span>📡</span><span class="panel-hd-title">Live-Monitor</span>'+
      '<div class="right"><span id="monStamp" style="font-size:11px;color:var(--mut)"></span><button class="btn ghost sm" onclick="monRefresh()">↻ Aktualisieren</button></div></div>'+
      '<div class="panel-body" id="monBody"><div style="color:var(--mut);font-size:13px">Lade Abgaben …</div></div></div>';
  }

  // ── Abgaben & Korrektur / Publish ──
  if(p.status!=='entwurf'){
    h+='<div class="panel"><div class="panel-hd"><span>🖊</span><span class="panel-hd-title">Korrektur & Resultate</span>'+
      '<div class="right">'+
        (p.publiziertAm
          ?'<span class="badge teal">Publiziert am '+S.fmtDatum(p.publiziertAm)+'</span><button class="btn ghost sm" onclick="pfUnpublish()">↩ Zurückziehen</button>'
          :'<button class="btn grn sm" onclick="pfPublish()">📣 Resultate veröffentlichen</button>')+
      '</div></div>'+
      '<div class="panel-body" id="korListe"><div style="color:var(--mut);font-size:13px">Lade Abgaben …</div></div></div>';
  }
  body.innerHTML=h;
  if(p.status!=='entwurf')monRefresh();
}

// Grunddaten / Planung speichern
window.pfGrundSave=function(){
  var p=pf();if(!p)return;
  p.titel=document.getElementById('pfTitel').value.trim()||p.titel;
  p.teil=document.getElementById('pfTeil').value.trim();
  p.klasseId=document.getElementById('pfKlasse').value;
  p.lehrgang=document.getElementById('pfLehrgang').value.trim();
  p.ort=document.getElementById('pfOrt').value.trim();
  p.hilfsmittel=document.getElementById('pfHilfsmittel').value.trim();
  p.regeln=document.getElementById('pfRegeln').value;
  document.getElementById('pfOvTitle').textContent=p.titel;
  pfSave(p,false);
};
window.pfPlanSave=function(){
  var p=pf();if(!p)return;
  p.startAm=fromLocalInput(document.getElementById('pfStart').value);
  p.endeAm=fromLocalInput(document.getElementById('pfEnde').value);
  p.toleranzMin=parseFloat(document.getElementById('pfToleranz').value)||0;
  p.mischen=document.getElementById('pfMischen').checked;
  p.nachAbgabeEinsehen=document.getElementById('pfEinsehen').checked;
  p.loesungNachPublish=document.getElementById('pfLoesPub').checked;
  p.rundung=document.getElementById('pfRundung').value;
  pfSave(p,false);
};
window.verlSave=function(sid,feld,val){
  var p=pf();if(!p)return;
  p.verlaengerungen=p.verlaengerungen||{};
  var v=p.verlaengerungen[sid]||{};
  if(feld==='zusatzMin')v.zusatzMin=parseFloat(val)||0;
  else v[feld]=fromLocalInput(val);
  if(!v.zusatzMin&&!v.startAm&&!v.endeAm)delete p.verlaengerungen[sid];
  else p.verlaengerungen[sid]=v;
  pfSave(p,false);
};

// Aufschalten / Zurückziehen / Löschen / Publish
window.pfAufschalten=function(){
  var p=pf();if(!p)return;
  if(!(p.aufgaben||[]).length){GemaDialog.alert({title:'Aufschalten',message:'Die Prüfung hat noch keine Aufgaben.'});return;}
  if(!p.startAm||!p.endeAm){GemaDialog.alert({title:'Aufschalten',message:'Bitte Prüfungsbeginn und Prüfungsende setzen.'});return;}
  if(Date.parse(p.endeAm)<=Date.parse(p.startAm)){GemaDialog.alert({title:'Aufschalten',message:'Das Prüfungsende muss nach dem Beginn liegen.'});return;}
  var klasse=S.klasseById(p.klasseId);
  GemaDialog.confirm({
    title:'Prüfung aufschalten',
    message:'«'+p.titel+'» für die Klasse «'+(klasse?klasse.name:'—')+'» aufschalten? Die Studierenden werden benachrichtigt und sehen die Prüfung ab '+S.fmtZeit(p.startAm)+'.',
    confirmLabel:'Aufschalten'
  }).then(function(ok){
    if(!ok)return;
    p.status='geplant';
    pfSave(p);
    var poolIds=(p.aufgaben||[]).map(function(a){return a.poolId;}).filter(Boolean);
    S.touchAufgabenVerwendet(poolIds,p.titel);
    if(klasse)S.notifyKlasse(klasse,{
      eventKey:'schule_pruefung_geplant',typ:'aktion',
      titel:'Prüfung aufgeschaltet: '+p.titel,
      text:'Beginn '+S.fmtZeit(p.startAm)+' · Dauer '+Math.round((Date.parse(p.endeAm)-Date.parse(p.startAm))/60000)+' Min.',
      link:'ab_pruefung_live.html?p='+p.id
    });
  });
};
window.pfZurueckziehen=function(){
  var p=pf();if(!p)return;
  GemaDialog.confirm({title:'Zurückziehen',message:'Prüfung zurück in den Entwurf? Studierende sehen sie dann nicht mehr.',confirmLabel:'Zurückziehen'}).then(function(ok){
    if(!ok)return;
    p.status='entwurf';
    pfSave(p);
  });
};
window.pfLoeschen=function(){
  var p=pf();if(!p)return;
  GemaDialog.confirm({title:'Prüfung löschen',message:'«'+p.titel+'» inkl. aller Abgaben endgültig löschen?',confirmLabel:'Löschen',danger:true}).then(function(ok){
    if(!ok)return;
    S.deletePruefung(p.id).catch(function(){});
    pfClose();
  });
};
window.pfPublish=function(){
  var p=pf();if(!p)return;
  S.loadAbgaben(p.id).then(function(abgaben){
    var offen=0;
    abgaben.forEach(function(a){
      var ap=S.abgabePunkte(p,a);
      if(ap.offen>0)offen++;
    });
    var msg='Resultate für alle Studierenden veröffentlichen? Sie sehen dann Note, Punkte und Kommentare'+(p.loesungNachPublish?' sowie die Musterlösung':'')+'.';
    if(offen>0)msg='⚠ Bei '+offen+' Abgabe(n) sind noch nicht alle Aufgaben bepunktet. '+msg;
    GemaDialog.confirm({title:'Resultate veröffentlichen',message:msg,confirmLabel:'Veröffentlichen'}).then(function(ok){
      if(!ok)return;
      p.publiziertAm=new Date().toISOString();
      pfSave(p);
      var klasse=S.klasseById(p.klasseId);
      if(klasse)S.notifyKlasse(klasse,{
        eventKey:'schule_resultate_publiziert',typ:'erfolg',
        titel:'Resultate: '+p.titel,
        text:'Die Prüfung wurde korrigiert — Note und Feedback sind jetzt einsehbar.',
        link:'ab_pruefung_live.html?p='+p.id
      });
    });
  });
};
window.pfUnpublish=function(){
  var p=pf();if(!p)return;
  GemaDialog.confirm({title:'Veröffentlichung zurückziehen',message:'Studierende sehen ihre Resultate danach nicht mehr.',confirmLabel:'Zurückziehen',danger:true}).then(function(ok){
    if(!ok)return;
    p.publiziertAm='';
    pfSave(p);
  });
};

// ═══════ Aufgaben in der Prüfung ═══════
window.aufgPunkte=function(i,val){
  var p=pf();if(!p||!p.aufgaben[i])return;
  p.aufgaben[i].punkte=parseFloat(String(val).replace(',','.'))||0;
  pfSave(p);
};
window.aufgMove=function(i,dir){
  var p=pf();if(!p)return;
  var j=i+dir;
  if(j<0||j>=p.aufgaben.length)return;
  var t=p.aufgaben[i];p.aufgaben[i]=p.aufgaben[j];p.aufgaben[j]=t;
  pfSave(p);
};
window.aufgWeg=function(i){
  var p=pf();if(!p)return;
  GemaDialog.confirm({title:'Aufgabe entfernen',message:'Aufgabe aus der Prüfung entfernen? (Im Pool bleibt sie erhalten.)',confirmLabel:'Entfernen',danger:true}).then(function(ok){
    if(!ok)return;
    p.aufgaben.splice(i,1);
    pfSave(p);
  });
};
window.aufgVorschau=function(i){
  var p=pf();if(!p||!p.aufgaben[i])return;
  pvOpen(p.aufgaben[i],'Aufgabe '+(i+1)+' · '+(p.aufgaben[i].punkte||0)+' P.');
};
window.aufgEdit=function(i){
  var p=pf();if(!p||!p.aufgaben[i])return;
  edOpen({mode:'exam',aufgabe:JSON.parse(JSON.stringify(p.aufgaben[i])),onSave:function(a){
    var pp=pf();if(!pp)return;
    pp.aufgaben[i]=a;
    pfSave(pp);
  }});
};
window.aufgNeu=function(){
  edOpen({mode:'exam-neu',aufgabe:null,onSave:function(a,auchPool){
    var pp=pf();if(!pp)return;
    a.id=S.uid('a');
    if(auchPool){
      var poolItem=JSON.parse(JSON.stringify(a));
      poolItem.id=S.uid('aufg');
      delete poolItem.poolId;
      S.saveAufgabe(poolItem);
      a.poolId=poolItem.id;
    }
    pp.aufgaben.push(a);
    pfSave(pp);
  }});
};

// ═══════ Pool-Picker ═══════
window.pickOpen=function(){
  document.getElementById('pickModalBg').classList.add('open');
  pickRender();
};
window.pickClose=function(){document.getElementById('pickModalBg').classList.remove('open');};
window.pickRender=function(){
  var q=(document.getElementById('pickSearch').value||'').toLowerCase();
  var typ=document.getElementById('pickTyp').value;
  var list=S.aufgabenPool().filter(function(a){
    if(typ&&a.typ!==typ)return false;
    if(q&&((a.titel||'')+' '+(a.frage||'')+' '+(a.thema||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  list.sort(function(a,b){return String(b.geaendertAm||'').localeCompare(String(a.geaendertAm||''));});
  document.getElementById('pickListe').innerHTML=list.length?list.map(function(a){
    return '<div style="border:1px solid var(--brd);border-radius:11px;padding:11px 13px;margin-bottom:9px">'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
        '<span>'+(TYP_ICON[a.typ]||'')+'</span><b style="flex:1;min-width:120px">'+esc(a.titel||'(ohne Titel)')+'</b>'+
        '<span class="chip">'+(a.punkte||0)+' P.</span>'+
        (a.privat?'<span class="chip">🔒 privat</span>':'')+
      '</div>'+
      '<div class="pool-frage">'+nl2br((a.frage||'').slice(0,220))+'</div>'+
      '<div class="pool-hist">🕒 Verwendet: '+(a.zuletztVerwendetAm?S.fmtDatum(a.zuletztVerwendetAm)+(a.zuletztVerwendetIn?' («'+esc(a.zuletztVerwendetIn)+'»)':''):'noch nie')+' · ✏️ Geändert: '+S.fmtDatum(a.geaendertAm||a.erstelltAm)+'</div>'+
      '<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">'+
        '<button class="btn ghost sm" onclick="pickVorschau(\''+a.id+'\')">👁 Mit Lösung ansehen</button>'+
        '<button class="btn ghost sm" onclick="pickAnpassen(\''+a.id+'\')">✏️ Anpassen & Einfügen</button>'+
        '<button class="btn primary sm" onclick="pickEinfuegen(\''+a.id+'\')">＋ Einfügen</button>'+
      '</div>'+
    '</div>';
  }).join(''):'<div style="color:var(--mut);font-size:13px;text-align:center;padding:20px 0">Keine passenden Aufgaben im Pool.</div>';
};
function poolToExamAufgabe(poolItem){
  var a=JSON.parse(JSON.stringify(poolItem));
  a.poolId=poolItem.id;
  a.id=S.uid('a');
  delete a.zuletztVerwendetAm;delete a.zuletztVerwendetIn;
  delete a.erstelltAm;delete a.geaendertAm;delete a.erstelltVon;delete a.erstelltVonName;delete a.privat;delete a.orgId;
  return a;
}
window.pickEinfuegen=function(poolId){
  var item=S.aufgabeById(poolId);if(!item)return;
  var p=pf();if(!p)return;
  p.aufgaben.push(poolToExamAufgabe(item));
  pfSave(p);
  pickClose();
};
window.pickAnpassen=function(poolId){
  var item=S.aufgabeById(poolId);if(!item)return;
  pickClose();
  edOpen({mode:'exam',aufgabe:poolToExamAufgabe(item),onSave:function(a){
    var p=pf();if(!p)return;
    p.aufgaben.push(a);
    pfSave(p);
  }});
};
window.pickVorschau=function(poolId){
  var item=S.aufgabeById(poolId);if(!item)return;
  pvOpen(item,(TYP_LABEL[item.typ]||'')+' · '+(item.punkte||0)+' P.');
};

// ═══════ Vorschau (immer MIT Lösung) ═══════
function pvOpen(a,subtitle){
  document.getElementById('pvTitle').textContent=a.titel||'Vorschau';
  document.getElementById('pvBody').innerHTML=
    '<div style="font-size:12px;color:var(--mut);margin-bottom:9px">'+esc(subtitle||'')+'</div>'+
    aufgabeHtml(a,true);
  document.getElementById('pvModalBg').classList.add('open');
}
window.pvClose=function(){document.getElementById('pvModalBg').classList.remove('open');};
function bildChipsHtml(bilder){
  if(!bilder||!bilder.length)return '';
  return '<div class="img-chips">'+bilder.map(function(b){
    var src=S.dateiSrc(b);
    var isPdf=(b.type==='application/pdf');
    return '<a class="img-chip" href="'+esc(src)+'" target="_blank" rel="noopener" title="'+esc(b.name||'')+'">'+
      (isPdf?'<div class="pdf">📄</div>':'<img src="'+esc(src)+'" alt=""/>')+'</a>';
  }).join('')+'</div>';
}
function aufgabeHtml(a,mitLoesung){
  var h='<div style="font-size:13.5px;white-space:pre-wrap">'+esc(a.frage||'')+'</div>'+bildChipsHtml(a.bilder);
  if(a.typ==='mc'){
    h+='<div style="margin-top:10px">'+(a.mcOptionen||[]).map(function(o){
      return '<div class="kor-mc-opt'+(mitLoesung&&o.korrekt?' correct':'')+'">'+(mitLoesung&&o.korrekt?'✅':'◻️')+' '+esc(o.text||'')+'</div>';
    }).join('')+'</div>';
  }
  if(a.typ==='berechnung'){
    if((a.tools||[]).length){
      h+='<div style="margin-top:9px;font-size:12px"><b>Freigeschaltete Tools:</b> '+(a.tools||[]).map(function(t){return '<span class="chip">🧮 '+esc(S.moduleLabel(t))+'</span>';}).join(' ')+'</div>';
    }
    if((a.antwortFelder||[]).length){
      h+='<div style="margin-top:9px;font-size:12.5px"><b>Antwortfelder:</b></div>'+(a.antwortFelder||[]).map(function(f){
        return '<div style="font-size:12.5px;color:var(--txt2);margin-top:3px">• '+esc(f.label||'')+(f.einheit?' ['+esc(f.einheit)+']':'')+(mitLoesung&&f.loesung!=null&&f.loesung!==''?' — <b style="color:var(--grn)">Lösung: '+esc(f.loesung)+(f.toleranzPct?' (±'+esc(f.toleranzPct)+'%)':'')+'</b>':'')+'</div>';
      }).join('');

}

// Formularwerte in ED.a einsammeln (vor Re-Render/ Save)
function edCollect(){
  var a=ED.a;
  var g=function(id){var el=document.getElementById(id);return el?el.value:undefined;};
  if(g('edTyp')!==undefined)a.typ=g('edTyp');
  if(g('edPunkte')!==undefined)a.punkte=parseFloat(String(g('edPunkte')).replace(',','.'))||0;
  if(g('edTitel')!==undefined)a.titel=g('edTitel').trim();
  if(g('edFrage')!==undefined)a.frage=g('edFrage');
  if(g('edLoesung')!==undefined)a.loesung=g('edLoesung');
  if(g('edThema')!==undefined)a.thema=g('edThema').trim();
  var up=document.getElementById('edUpload');if(up)a.uploadErlaubt=up.checked;
  var pv=document.getElementById('edPrivat');if(pv)a.privat=pv.checked;
  var mm=document.getElementById('edMcMehrfach');if(mm)a.mcMehrfach=mm.checked;
  // MC-Optionen
  var rows=document.querySelectorAll('#edMcRows .mc-row');
  if(rows.length||a.typ==='mc'){
    var opts=[];
    rows.forEach(function(r,i){
      var old=(a.mcOptionen||[])[i]||{id:S.uid('o')};
      opts.push({id:old.id,text:r.querySelector('[data-mctext]').value,korrekt:r.querySelector('[data-mckorrekt]').checked});
    });
    if(rows.length)a.mcOptionen=opts;
  }
  // Antwortfelder
  var frows=document.querySelectorAll('#edFelder .feld-row');
  if(frows.length){
    var felder=[];
    frows.forEach(function(r,i){
      var old=(a.antwortFelder||[])[i]||{id:S.uid('f')};
      felder.push({
        id:old.id,
        label:r.querySelector('[data-flabel]').value,
        einheit:r.querySelector('[data-feinheit]').value,
        loesung:r.querySelector('[data-floesung]').value,
        toleranzPct:r.querySelector('[data-ftol]').value
      });
    });
    a.antwortFelder=felder;
  }
  // Tools
  var tchecks=document.querySelectorAll('#edTools input[data-tool]');
  if(tchecks.length){
    var tools=[];
    tchecks.forEach(function(c){if(c.checked)tools.push(c.getAttribute('data-tool'));});
    a.tools=tools;
  }
}
window.edSave=function(){
  edCollect();
  var a=ED.a;
  if(!a.titel&&!a.frage){GemaDialog.alert({title:'Aufgabe',message:'Bitte mindestens Titel oder Frage erfassen.'});return;}
  if(!a.titel)a.titel=(a.frage||'').slice(0,60);
  if(a.typ==='mc'){
    a.mcOptionen=(a.mcOptionen||[]).filter(function(o){return (o.text||'').trim();});
    if(a.mcOptionen.length<2){GemaDialog.alert({title:'Multiple Choice',message:'Bitte mindestens zwei Antwort-Optionen erfassen.'});return;}
    if(!a.mcOptionen.some(function(o){return o.korrekt;})){GemaDialog.alert({title:'Multiple Choice',message:'Bitte mindestens eine richtige Option markieren.'});return;}
  }
  if(a.typ==='berechnung'){
    a.antwortFelder=(a.antwortFelder||[]).filter(function(f){return (f.label||'').trim();});
  }
  var ctx=ED.ctx;
  var auchPool=document.getElementById('edPoolSave').checked;
  edClose();
  if(ctx&&ctx.onSave)ctx.onSave(a,auchPool);
};

// ═══════ Live-Monitor + Abgaben ═══════
var _abgCache=[];
function startMonitor(){
  stopMonitor();
  _monTimer=setInterval(function(){
    var p=pf();
    if(!p||p.status==='entwurf')return;
    var r=S.rest(p,'',Date.now());
    if(r.phase==='laufend'||r.phase==='toleranz'||r.phase==='geplant')monRefresh(true);
  },12000);
}
function stopMonitor(){if(_monTimer){clearInterval(_monTimer);_monTimer=null;}}
window.monRefresh=function(silent){
  var p=pf();if(!p||p.status==='entwurf')return;
  S.loadAbgaben(p.id).then(function(abgaben){
    _abgCache=abgaben;
    renderMonitor(p,abgaben);
    renderKorListe(p,abgaben);
    var st=document.getElementById('monStamp');
    if(st)st.textContent='Stand '+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });
};
function relTime(iso){
  if(!iso)return '—';
  var s=Math.round((Date.now()-Date.parse(iso))/1000);
  if(s<60)return 'vor '+s+' s';
  if(s<3600)return 'vor '+Math.round(s/60)+' min';
  return S.fmtZeit(iso);
}
function renderMonitor(p,abgaben){
  var host=document.getElementById('monBody');
  if(!host)return;
  var klasse=S.klasseById(p.klasseId);
  var studs=(klasse&&klasse.studentIds||[]).map(function(sid){return userById(sid)||{id:sid,name:sid};});
  if(!studs.length){host.innerHTML='<div style="color:var(--mut);font-size:13px">Keine Studierenden in der Klasse.</div>';return;}
  var byUid={};
  abgaben.forEach(function(a){byUid[a.userId]=a;});
  var gestartet=0,abgegeben=0;
  var rows=studs.map(function(s){
    var a=byUid[s.id];
    var status,fs='';
    if(!a||!a.gestartetAm)status='<span class="badge grey">Nicht gestartet</span>';
    else if(a.abgegebenAm){
      abgegeben++;gestartet++;
      status='<span class="badge grn">✓ Abgegeben</span>'+(a.verspaetet?' <span class="badge amb">verspätet</span>':'')+(a.autoAbgabe?' <span class="badge blue">auto</span>':'');
    }else{
      gestartet++;
      status='<span class="badge blue">✍ In Arbeit</span>';
    }
    if(a){
      var f=S.fortschritt(p,a);
      fs=f.beantwortet+' / '+f.total;
    }
    return '<tr><td style="font-weight:700">'+esc(s.name||'')+'</td><td>'+status+'</td><td>'+fs+'</td><td style="color:var(--mut)">'+relTime(a&&(a.abgegebenAm||a.letzteAktivitaet))+'</td></tr>';
  }).join('');
  host.innerHTML='<div class="ns-grid" style="margin-bottom:13px">'+
    '<div class="ns-kpi"><div class="v">'+studs.length+'</div><div class="l">Klasse</div></div>'+
    '<div class="ns-kpi"><div class="v">'+gestartet+'</div><div class="l">Gestartet</div></div>'+
    '<div class="ns-kpi"><div class="v">'+abgegeben+'</div><div class="l">Abgegeben</div></div>'+
  '</div>'+
  '<div style="overflow-x:auto"><table class="mon-table"><tr><th>Name</th><th>Status</th><th>Fortschritt</th><th>Letzte Aktivität</th></tr>'+rows+'</table></div>';
}
// Korrigierbare Abgaben: eingereichte IMMER; nach Prüfungsende (inkl.
// Toleranz + Verlängerungen) zusätzlich nie abgegebene Autosave-Stände —
// sonst wären Antworten von Studierenden, die einfach den Browser
// schliessen, nicht korrigierbar.
function korGradeList(p,abgaben){
  return abgaben.filter(function(a){
    if(a.userId===p.erstelltVon)return false; // eigene Test-Abgabe des Dozenten
    if(a.abgegebenAm)return true;
    if(!a.gestartetAm)return false;
    return S.phase(p,a.userId,Date.now())==='beendet';
  });
}
function renderKorListe(p,abgaben){
  var host=document.getElementById('korListe');
  if(!host)return;
  var max=S.totalPunkte(p);
  var eingereicht=korGradeList(p,abgaben);
  if(!eingereicht.length){host.innerHTML='<div style="color:var(--mut);font-size:13px">Noch keine Abgaben.</div>';return;}
  var noten=[];
  var rows=eingereicht.map(function(a,i){
    var ap=S.abgabePunkte(p,a);
    var note=(a.noteManuell!=null&&a.noteManuell!=='')?parseFloat(a.noteManuell):S.note(ap.punkte,max,p.rundung);
    if(ap.offen===0&&note!=null)noten.push(note);
    var fertig=ap.offen===0;
    return '<tr><td style="font-weight:700">'+esc(a.userName||'')+'</td>'+
      '<td>'+(a.abgegebenAm?S.fmtZeit(a.abgegebenAm)+(a.verspaetet?' <span class="badge amb">verspätet</span>':''):'<span class="badge amb">nicht abgegeben — Autosave-Stand</span>')+'</td>'+
      '<td>'+ap.punkte+' / '+max+(fertig?'':' <span class="badge amb">'+ap.offen+' offen</span>')+'</td>'+
      '<td style="font-weight:900;color:'+S.noteFarbe(note)+'">'+(fertig?S.noteFmt(note):'—')+'</td>'+
      '<td><button class="btn primary sm" onclick="korOpen('+i+')">🖊 Korrigieren</button></td></tr>';
  }).join('');
  var ns=S.notenspiegel(noten);
  host.innerHTML=
    (ns.n?'<div class="ns-grid" style="margin-bottom:13px">'+
      '<div class="ns-kpi"><div class="v">'+ns.n+'</div><div class="l">Korrigiert</div></div>'+
      '<div class="ns-kpi"><div class="v">'+S.noteFmt(ns.avg)+'</div><div class="l">Ø Note</div></div>'+
      '<div class="ns-kpi"><div class="v">'+S.noteFmt(ns.min)+'–'+S.noteFmt(ns.max)+'</div><div class="l">Spanne</div></div>'+
      '<div class="ns-kpi"><div class="v">'+ns.bestanden+'/'+ns.n+'</div><div class="l">≥ 4.0</div></div>'+
    '</div>':'')+
    '<div style="overflow-x:auto"><table class="mon-table"><tr><th>Name</th><th>Abgegeben</th><th>Punkte</th><th>Note</th><th></th></tr>'+rows+'</table></div>';
}

// ═══════ Korrektur ═══════
var KOR={list:[],idx:0,p:null,dirty:false,saveTimer:null};
window.korOpen=function(i){
  var p=pf();if(!p)return;
  KOR.p=p;
  KOR.list=korGradeList(p,_abgCache);
  KOR.idx=Math.max(0,Math.min(i,KOR.list.length-1));
  document.getElementById('korOv').classList.add('open');
  renderKor();
};
window.korClose=function(){
  korFlush();
  document.getElementById('korOv').classList.remove('open');
  monRefresh(true);
};
window.korPrev=function(){korFlush();if(KOR.idx>0){KOR.idx--;renderKor();}};
window.korNext=function(){korFlush();if(KOR.idx<KOR.list.length-1){KOR.idx++;renderKor();}};
function korAbg(){return KOR.list[KOR.idx];}
function korSaveSoon(){
  KOR.dirty=true;
  document.getElementById('korSaveState').textContent='speichert …';
  clearTimeout(KOR.saveTimer);
  KOR.saveTimer=setTimeout(korFlush,900);
}
function korFlush(){
  clearTimeout(KOR.saveTimer);
  if(!KOR.dirty)return;
  KOR.dirty=false;
  var a=korAbg();if(!a)return;
  var u=me();
  a.korrigiertVon=u?(u.name||u.username):'';
  a.korrigiertAm=new Date().toISOString();
  S.saveAbgabeDozent(a).then(function(){
    var el=document.getElementById('korSaveState');
    if(el)el.textContent='✓ gespeichert';
  }).catch(function(){
    // dirty wieder setzen — der nächste Flush (Navigation/Speichern)
    // holt den Push nach, die Korrektur geht nicht verloren.
    KOR.dirty=true;
    var el=document.getElementById('korSaveState');
    if(el)el.textContent='⚠ offline — wird nachgeholt';
  });
}
function renderKor(){
  var p=KOR.p,a=korAbg();
  var body=document.getElementById('korBody');
  if(!p||!a){body.innerHTML='<div class="empty">Keine Abgabe.</div>';return;}
  document.getElementById('korTitle').textContent='Korrektur — '+(a.userName||'');
  document.getElementById('korPos').textContent=(KOR.idx+1)+' / '+KOR.list.length;
  document.getElementById('korSaveState').textContent='';
  a.korrektur=a.korrektur||{};
  var max=S.totalPunkte(p);
  var h='';
  h+='<div class="panel"><div class="panel-body" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+
    '<div><b>'+esc(a.userName||'')+'</b><div style="font-size:12px;color:var(--mut)">'+(a.abgegebenAm?'Abgegeben: '+S.fmtZeit(a.abgegebenAm)+(a.verspaetet?' · <span style="color:var(--amb);font-weight:700">verspätet</span>':'')+(a.autoAbgabe?' · Auto-Abgabe':''):'<span style="color:var(--amb);font-weight:700">Nicht abgegeben — Autosave-Stand (letzte Aktivität '+S.fmtZeit(a.letzteAktivitaet)+')</span>')+'</div></div>'+
    '<div style="margin-left:auto;display:flex;gap:16px;align-items:center">'+
      '<div style="text-align:center"><div style="font-size:19px;font-weight:900" id="korTotal">–</div><div style="font-size:10.5px;color:var(--mut);font-weight:700">PUNKTE / '+max+'</div></div>'+
      '<div style="text-align:center"><div style="font-size:19px;font-weight:900" id="korNote">–</div><div style="font-size:10.5px;color:var(--mut);font-weight:700">NOTE</div></div>'+
      '<div><label style="font-size:10.5px;color:var(--mut);font-weight:700;display:block">NOTE MANUELL</label><input class="pt-input" id="korNoteMan" type="text" inputmode="decimal" value="'+esc(a.noteManuell==null?'':a.noteManuell)+'" placeholder="auto" onblur="korNoteManuell(this.value)"/></div>'+
    '</div>'+
  '</div></div>';
  (p.aufgaben||[]).forEach(function(aufg,i){
    var ant=(a.antworten||{})[aufg.id]||{};
    var kor=a.korrektur[aufg.id]||{};
    var auto=S.autoPunkte(aufg,ant);
    h+='<div class="panel"><div class="panel-hd"><span>'+(TYP_ICON[aufg.typ]||'')+'</span><span class="panel-hd-title">Aufgabe '+(i+1)+' — '+esc(aufg.titel||'')+'</span>'+
      '<div class="right"><span class="chip">max. '+(aufg.punkte||0)+' P.</span></div></div>'+
      '<div class="panel-body">'+
      '<div style="font-size:13px;color:var(--txt2);white-space:pre-wrap">'+esc(aufg.frage||'')+'</div>'+bildChipsHtml(aufg.bilder);
    // Antwort
    if(aufg.typ==='mc'){
      var sel=ant.mc||[];
      h+='<div style="margin-top:10px">'+(aufg.mcOptionen||[]).map(function(o){
        var isSel=sel.indexOf(o.id)>=0;
        var cls='kor-mc-opt'+(isSel?' selected':'')+(o.korrekt?' correct':'')+(isSel&&!o.korrekt?' wrong':'');
        return '<div class="'+cls+'">'+(isSel?'☑':'◻')+' '+esc(o.text||'')+(o.korrekt?' <span style="margin-left:auto;font-size:11px;color:var(--grn);font-weight:800">richtig</span>':'')+'</div>';
      }).join('')+'</div>';
    }else{
      var txt=(ant.text||'').trim();
      if(txt){
        var marked=kor.markierteZeilen||[];
        h+='<div class="kor-ans">'+txt.split('\n').map(function(line,li){
          return '<div class="kor-line'+(marked.indexOf(li)>=0?' marked':'')+'" onclick="korMarkLine(\''+aufg.id+'\','+li+',this)">'+esc(line||' ')+'</div>';
        }).join('')+'</div><div style="font-size:11px;color:var(--mut);margin-top:3px">Tipp: Zeile anklicken = markieren</div>';
      }else{
        h+='<div class="kor-ans" style="color:var(--mut)">Keine Text-Antwort.</div>';
      }
    }
    // Zahlenfelder
    if(aufg.typ==='berechnung'&&(aufg.antwortFelder||[]).length){
      h+='<div style="overflow-x:auto;margin-top:9px"><table class="mon-table"><tr><th>Feld</th><th>Antwort</th><th>Lösung</th><th></th></tr>'+
        (aufg.antwortFelder||[]).map(function(f){
          var w=(ant.werte||{})[f.id];
          var hasLoes=f.loesung!=null&&f.loesung!=='';
          var ok=hasLoes?S.wertOk(f,w):null;
          return '<tr><td>'+esc(f.label||'')+(f.einheit?' ['+esc(f.einheit)+']':'')+'</td>'+
            '<td style="font-weight:800">'+esc(w==null||w===''?'—':w)+'</td>'+
            '<td style="color:var(--grn);font-weight:700">'+(hasLoes?esc(f.loesung)+(f.toleranzPct?' ±'+esc(f.toleranzPct)+'%':''):'—')+'</td>'+
            '<td>'+(ok==null?'':(ok?'<span class="badge grn">✓</span>':'<span class="badge red">✗</span>'))+'</td></tr>';
        }).join('')+'</table></div>';
    }
    // Dateien
    if((ant.dateien||[]).length){
      h+='<div class="kor-files">'+(ant.dateien||[]).map(function(d,di){
        var annot=kor.annotiert&&kor.annotiert[di];
        var src=annot?(annot.url||annot.dataUrl):S.dateiSrc(d);
        var isPdf=(d.type==='application/pdf')&&!annot;
        return '<div class="kor-file">'+
          (isPdf?'<a href="'+esc(S.dateiSrc(d))+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;height:90px;font-size:30px;text-decoration:none">📄</a>'
                :'<img src="'+esc(src)+'" onclick="window.open(\''+esc(src)+'\',\'_blank\')"/>')+
          '<div class="nm">'+esc(d.name||'Datei')+(annot?' · ✏️ annotiert':'')+'</div>'+
          (!isPdf?'<div class="act"><button class="btn ghost sm" style="flex:1" onclick="annOpen(\''+aufg.id+'\','+di+')">🖊 Annotieren</button></div>':'')+
        '</div>';
      }).join('')+'</div>';
    }
    // Musterlösung
    if(aufg.loesung||(aufg.loesungBilder||[]).length){
      h+='<div class="loes-box"><div class="loes-label">Musterlösung</div>'+esc(aufg.loesung||'')+bildChipsHtml(aufg.loesungBilder)+'</div>';
    }
    // Punkte + Kommentar
    h+='<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:flex-start">'+
      '<div><label style="font-size:11px;font-weight:800;color:var(--mut);display:block;margin-bottom:4px">PUNKTE (max. '+(aufg.punkte||0)+')</label>'+
        '<input class="pt-input" type="text" inputmode="decimal" value="'+esc(kor.punkte==null?'':kor.punkte)+'" onblur="korPunkte(\''+aufg.id+'\',this.value)"/>'+
        (auto.auto?'<button class="btn ghost sm" style="margin-left:7px" onclick="korAuto(\''+aufg.id+'\','+auto.punkte+')" title="Vorkorrektur übernehmen">⚡ '+auto.punkte+' P.</button>':'')+
      '</div>'+
      '<div style="flex:1;min-width:200px"><label style="font-size:11px;font-weight:800;color:var(--mut);display:block;margin-bottom:4px">KOMMENTAR AN STUDIERENDE</label>'+
        '<textarea class="inp" style="min-height:44px" onblur="korKommentar(\''+aufg.id+'\',this.value)">'+esc(kor.kommentar||'')+'</textarea></div>'+
    '</div>';
    h+='</div></div>';
  });
  body.innerHTML=h;
  korUpdateTotals();
  document.getElementById('korOv').scrollTop=0;
}
function korUpdateTotals(){
  var p=KOR.p,a=korAbg();
  if(!p||!a)return;
  var max=S.totalPunkte(p);
  var ap=S.abgabePunkte(p,a);
  var note=(a.noteManuell!=null&&a.noteManuell!=='')?parseFloat(a.noteManuell):S.note(ap.punkte,max,p.rundung);
  a.totalPunkte=ap.punkte;
  a.note=note;
  var elT=document.getElementById('korTotal');
  var elN=document.getElementById('korNote');
  if(elT)elT.textContent=ap.punkte+(ap.offen?' ('+ap.offen+' offen)':'');
  if(elN){elN.textContent=ap.offen&&(a.noteManuell==null||a.noteManuell==='')?'–':S.noteFmt(note);elN.style.color=S.noteFarbe(note);}
}
window.korPunkte=function(aufgId,val){
  var a=korAbg();if(!a)return;
  a.korrektur[aufgId]=a.korrektur[aufgId]||{};
  var p=KOR.p.aufgaben.find(function(x){return x.id===aufgId;});
  var v=String(val).trim()===''?'':parseFloat(String(val).replace(',','.'));
  if(v!==''&&p&&isFinite(v)){
    if(v<0)v=0;
    if(v>(parseFloat(p.punkte)||0))v=parseFloat(p.punkte)||0;
  }
  a.korrektur[aufgId].punkte=(v===''||!isFinite(v))?'':v;
  korUpdateTotals();
  korSaveSoon();
};
window.korAuto=function(aufgId,punkte){
  var a=korAbg();if(!a)return;
  a.korrektur[aufgId]=a.korrektur[aufgId]||{};
  a.korrektur[aufgId].punkte=punkte;
  korSaveSoon();
  renderKor();
};
window.korKommentar=function(aufgId,val){
  var a=korAbg();if(!a)return;
  a.korrektur[aufgId]=a.korrektur[aufgId]||{};
  a.korrektur[aufgId].kommentar=val;
  korSaveSoon();
};
window.korMarkLine=function(aufgId,li,el){
  var a=korAbg();if(!a)return;
  a.korrektur[aufgId]=a.korrektur[aufgId]||{};
  var m=a.korrektur[aufgId].markierteZeilen=a.korrektur[aufgId].markierteZeilen||[];
  var ix=m.indexOf(li);
  if(ix>=0)m.splice(ix,1);else m.push(li);
  el.classList.toggle('marked',ix<0);
  korSaveSoon();
};
window.korNoteManuell=function(val){
  var a=korAbg();if(!a)return;
  a.noteManuell=String(val).trim()===''?'':parseFloat(String(val).replace(',','.'));
  korUpdateTotals();
  korSaveSoon();
};

// ═══════ Annotation (Stift/Pfeil/Marker/Text auf Bildern) ═══════
var ANN={aufgId:null,di:0,tool:'pen',strokes:[],cur:null,img:null,ctx:null,canvas:null,drag:null};
window.annOpen=function(aufgId,di){
  var a=korAbg();if(!a)return;
  var d=((a.antworten||{})[aufgId]||{}).dateien[di];
  if(!d)return;
  var kor=(a.korrektur[aufgId]||{});
  var src=(kor.annotiert&&kor.annotiert[di])?(kor.annotiert[di].url||kor.annotiert[di].dataUrl):S.dateiSrc(d);
  ANN.aufgId=aufgId;ANN.di=di;ANN.strokes=[];ANN.tool='pen';
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    ANN.img=img;
    var c=document.getElementById('annCanvas');
    var maxW=Math.min(1400,img.width);
    var scale=maxW/img.width;
    c.width=Math.round(img.width*scale);
    c.height=Math.round(img.height*scale);
    ANN.canvas=c;ANN.ctx=c.getContext('2d');
    annRedraw();
    document.getElementById('annOv').classList.add('open');
    document.querySelectorAll('.ann-tool[data-tool]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tool')==='pen');});
  };
  img.onerror=function(){GemaDialog.alert({title:'Annotation',message:'Bild konnte nicht geladen werden.'});};
  img.src=src;
};
window.annTool=function(t){
  ANN.tool=t;
  document.querySelectorAll('.ann-tool[data-tool]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tool')===t);});
};
window.annUndo=function(){ANN.strokes.pop();annRedraw();};
window.annCancel=function(){document.getElementById('annOv').classList.remove('open');};
function annRedraw(){
  var ctx=ANN.ctx,c=ANN.canvas;
  if(!ctx)return;
  ctx.clearRect(0,0,c.width,c.height);
  ctx.drawImage(ANN.img,0,0,c.width,c.height);
  ANN.strokes.concat(ANN.cur?[ANN.cur]:[]).forEach(function(s){
    if(s.type==='pen'||s.type==='marker'){
      ctx.strokeStyle=s.type==='marker'?'rgba(250,204,21,.45)':'#dc2626';
      ctx.lineWidth=s.type==='marker'?16:3;
      ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();
      s.pts.forEach(function(p,i){if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);});
      ctx.stroke();
    }else if(s.type==='arrow'){
      var x1=s.pts[0][0],y1=s.pts[0][1],x2=s.pts[1][0],y2=s.pts[1][1];
      ctx.strokeStyle='#dc2626';ctx.fillStyle='#dc2626';ctx.lineWidth=3.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      var ang=Math.atan2(y2-y1,x2-x1);
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-13*Math.cos(ang-0.45),y2-13*Math.sin(ang-0.45));
      ctx.lineTo(x2-13*Math.cos(ang+0.45),y2-13*Math.sin(ang+0.45));
      ctx.closePath();ctx.fill();
    }else if(s.type==='text'){
      ctx.font='700 22px "DM Sans",sans-serif';
      ctx.fillStyle='#dc2626';
      ctx.fillText(s.text,s.pts[0][0],s.pts[0][1]);
    }
  });
}
function annPos(e){
  var c=ANN.canvas;
  var r=c.getBoundingClientRect();
  var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  var cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return [cx*c.width/r.width,cy*c.height/r.height];
}
function annDown(e){
  if(!document.getElementById('annOv').classList.contains('open'))return;
  e.preventDefault();
  var p=annPos(e);
  if(ANN.tool==='text'){
    GemaDialog.prompt({title:'Text-Anmerkung',placeholder:'z.B. Einheit fehlt!',defaultValue:''}).then(function(t){
      if(t===null||!String(t).trim())return;
      ANN.strokes.push({type:'text',text:String(t).trim(),pts:[p]});
      annRedraw();
    });
    return;
  }
  if(ANN.tool==='arrow'){ANN.cur={type:'arrow',pts:[p,p]};}
  else ANN.cur={type:ANN.tool,pts:[p]};
}
function annMove(e){
  if(!ANN.cur)return;
  e.preventDefault();
  var p=annPos(e);
  if(ANN.cur.type==='arrow')ANN.cur.pts[1]=p;
  else ANN.cur.pts.push(p);
  annRedraw();
}
function annUp(){
  if(!ANN.cur)return;
  ANN.strokes.push(ANN.cur);
  ANN.cur=null;
  annRedraw();
}
window.annSave=function(){
  var a=korAbg();if(!a||!ANN.canvas)return;
  var dataUrl=ANN.canvas.toDataURL('image/jpeg',0.88);
  var u=me();
  var store=function(meta){
    a.korrektur[ANN.aufgId]=a.korrektur[ANN.aufgId]||{};
    a.korrektur[ANN.aufgId].annotiert=a.korrektur[ANN.aufgId].annotiert||{};
    a.korrektur[ANN.aufgId].annotiert[ANN.di]=meta;
    korSaveSoon();
    document.getElementById('annOv').classList.remove('open');
    renderKor();
  };
  if(typeof GemaStorage!=='undefined'&&GemaStorage.uploadDataUrl){
    GemaStorage.uploadDataUrl(dataUrl,'schule/'+(u?u.orgId:'org')+'/korrektur').then(function(r){
      store({url:r.url});
    }).catch(function(){store({dataUrl:dataUrl});});
  }else store({dataUrl:dataUrl});
};

    'li{margin-bottom:1mm}'+
    '.regeln{font-size:10pt}'+
    '.footer-note{font-size:8.5pt;color:#64748b;margin-top:2mm}'+
    '.pb{page-break-before:always}';
  var h='<h1>'+esc(p.titel)+(mitLoesung?' <span style="color:#dc2626">(Lösungen)</span>':'')+'</h1>'+
    '<div class="meta">'+esc(klasse?klasse.name:'')+(p.lehrgang?' · '+esc(p.lehrgang):'')+'</div>'+
    '<table><tr><th style="width:40%">Inhalt</th><th style="width:30%">Zeit</th><th>Hilfsmittel</th></tr>'+
    '<tr><td>'+esc(p.teil||p.titel)+'</td><td>'+dauer+'</td><td>'+esc(p.hilfsmittel||'—')+'</td></tr></table>'+
    '<table><tr><th>Ort</th><th>Datum / Zeit</th><th>Lehrgang / Klasse</th></tr>'+
    '<tr><td>'+esc(p.ort||'—')+'</td><td>'+(p.startAm?esc(S.fmtZeit(p.startAm)):'—')+'</td><td>'+esc((p.lehrgang||'')+(klasse?' · '+klasse.name:''))+'</td></tr></table>'+
    '<table><tr><td style="width:32%"><b>Name / Vorname</b></td><td></td></tr></table>'+
    '<table><tr><th>Inhalt</th><th style="width:20%">Max. Punkte</th><th style="width:20%">Erreichte Punkte</th><th style="width:15%">Note</th></tr>'+
    '<tr><td>'+esc(p.teil||p.titel)+'</td><td>'+max+'</td><td></td><td></td></tr>'+
    '<tr><td><b>Total</b></td><td><b>'+max+'</b></td><td></td><td></td></tr></table>'+
    '<div class="footer-note">Notenschlüssel: Note = 5 × erreichte Punkte ÷ Maximalpunkte + 1, gerundet auf '+(p.rundung==='halb'?'halbe Noten':'Zehntelnoten')+'.</div>'+
    '<table style="margin-top:4mm"><tr><th style="width:32%">Korrektor</th><th style="width:34%">Visum</th><th>Datum</th></tr>'+
    '<tr><td>'+esc(p.erstelltVonName||(u?u.name:''))+'</td><td></td><td></td></tr></table>'+
    (regeln.length?'<h2>Regeln</h2><ul class="regeln">'+regeln.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>':'');
  h+='<h2 class="pb">Aufgaben</h2>';
  (p.aufgaben||[]).forEach(function(a,i){
    h+='<div class="aufg"><div class="aufg-head"><span>Aufgabe '+(i+1)+' — '+esc(a.titel||'')+'</span><span>'+(a.punkte||0)+' P.</span></div>'+
      '<div class="frage">'+esc(a.frage||'')+'</div>';
    (a.bilder||[]).forEach(function(b){
      var src=S.dateiSrc(b);
      if(b.type!=='application/pdf')h+='<img src="'+esc(src)+'"/>';
      else h+='<div class="footer-note">📄 Beilage: '+esc(b.name||'Datenblatt')+'</div>';
    });
    if(a.typ==='mc'){
      (a.mcOptionen||[]).forEach(function(o){
        h+='<div class="mc">'+(mitLoesung&&o.korrekt?'☑':'☐')+' '+esc(o.text||'')+'</div>';
      });
    }else if(a.typ==='berechnung'&&(a.antwortFelder||[]).length){
      h+='<table><tr><th>Grösse</th><th style="width:30%">Resultat</th><th style="width:18%">Einheit</th></tr>'+
        (a.antwortFelder||[]).map(function(f){
          return '<tr><td>'+esc(f.label||'')+'</td><td>'+(mitLoesung?'<b style="color:#15803d">'+esc(f.loesung==null?'':f.loesung)+'</b>':'')+'</td><td>'+esc(f.einheit||'')+'</td></tr>';
        }).join('')+'</table>'+
        (mitLoesung?'':'<div class="answer-space small"></div>');
    }else if(!mitLoesung){
      h+='<div class="answer-space"></div>';
    }
    if(mitLoesung&&(a.loesung||(a.loesungBilder||[]).length)){
      h+='<div class="loesung"><b>Lösung:</b> '+esc(a.loesung||'');
      (a.loesungBilder||[]).forEach(function(b){
        if(b.type!=='application/pdf')h+='<img src="'+esc(S.dateiSrc(b))+'"/>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  var win=window.open('','_blank');
  if(!win){GemaDialog.alert({title:'PDF',message:'Pop-up wurde blockiert — bitte Pop-ups für GEMA erlauben.'});return;}
  win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(p.titel)+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,900&display=swap" rel="stylesheet">'+
    '<style>'+css+'</style></head><body>'+h+
    '<div style="position:fixed;top:10px;right:10px;background:#0f172a;color:#fff;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer" class="no-print" onclick="window.print()">🖨 Drucken / Als PDF speichern</div>'+
    '<style>@media print{.no-print{display:none}}</style>'+
    '</body></html>');
  win.document.close();
};

// ═══════ Boot ═══════
document.addEventListener('DOMContentLoaded',function(){
  // Studierende haben hier nichts verloren → Runner
  if(typeof GemaAuth!=='undefined'&&!GemaAuth.can('write','pruefungen')){
    location.replace('ab_pruefung_live.html'+location.search);
    return;
  }
  // Annotation-Events
  var c=document.getElementById('annCanvas');
  c.addEventListener('mousedown',annDown);
  c.addEventListener('mousemove',annMove);
  window.addEventListener('mouseup',annUp);
  c.addEventListener('touchstart',annDown,{passive:false});
  c.addEventListener('touchmove',annMove,{passive:false});
  c.addEventListener('touchend',annUp);
  // 1) Cache-Render
  try{renderPruefListe();}catch(e){}
  // 2) Cloud-Pull (mit Lösungen — Dozenten-Seite)
  var t=new Promise(function(res){setTimeout(res,6000);});
  Promise.race([S.bind({loesungen:true}),t]).then(function(){
    _cloudLoaded=true;
    renderPruefListe();
    if(_tab==='pool')renderPool();
    if(_openPfId)renderPfDetail();
    try{
      var params=new URLSearchParams(location.search);
      var pid=params.get('p');
      if(pid&&S.pruefungById(pid))pfOpen(pid);
      var kid=params.get('klasse');
      if(kid){document.getElementById('pfKlasseFilter').value=kid;renderPruefListe();}
    }catch(e){}
  });
  if(typeof GemaFeedback!=='undefined')GemaFeedback.init('pruefungen','Prüfungen (Schule)');
});
window.renderPruefListe=renderPruefListe;
window.renderPool=renderPool;
})();
</script>
<script src="gema_scroll.js"></script>
<script src="gema_mobile_menu.js"></script>
</body>
