<style>
:root{
  --bg:#f4f6fb;--sur:#fff;--sur2:#f8faff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --acc:#0e7490;--acc-bg:#ecfeff;--acc-bd:#a5f3fc;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1!important}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap;text-decoration:none}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pg{max-width:1180px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:14px 20px;margin-bottom:12px;background:linear-gradient(135deg,#083344 0%,#0e7490 60%,#22d3ee 100%);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.hero-in{display:flex;align-items:center;gap:12px}
.hero-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hero-title{font-size:16.5px;font-weight:900;color:#fff}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.vtabs{display:inline-flex;border:1.5px solid var(--brd2);border-radius:11px;overflow:hidden;background:var(--sur);flex-wrap:wrap}
.vtab{padding:9px 14px;border:none;background:transparent;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;min-height:40px}
.vtab.on{background:var(--acc);color:#fff}
.card{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card-hd{padding:11px 15px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-hd h3{font-size:13.5px;font-weight:900}
.card-hd .sub{font-size:11px;color:var(--mut);font-weight:600}
.card-bd{padding:13px 15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:11px 13px}
.kpi .v{font-size:21px;font-weight:900}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);margin-top:1px}
.kpi.warn{border-color:var(--red-bd);background:var(--red-bg)}
.kpi.warn .v{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid;white-space:nowrap}
.b-out{background:var(--sur);color:var(--mut);border-color:var(--brd2)}
.b-grn{background:var(--grn-bg);color:var(--grn);border-color:var(--grn-bd)}
.b-amber{background:var(--amber-bg);color:#b45309;border-color:var(--amber-bd)}
.b-red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.b-acc{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.itm{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.itm-bd{padding:12px 13px}
.itm-title{font-size:14px;font-weight:900}
.itm-meta{font-size:11.5px;color:var(--mut);line-height:1.65;margin-top:3px}
.itm-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ma-card{cursor:pointer}
.ma-top{display:flex;align-items:center;gap:10px}
.ak-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;object-fit:cover}
.ak-av-ini{display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);border:1.5px solid var(--acc-bd);color:var(--acc);font-size:13px;font-weight:900}
.ma-rest{margin-left:auto;text-align:right}
.ma-rest .rv{font-size:17px;font-weight:900}
.ma-rest .rl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--sur2);border:1px solid var(--brd);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px}
.bar-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:700;margin-top:4px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
.t th{background:var(--sur2);border-bottom:2px solid var(--brd2);text-align:left;padding:7px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);white-space:nowrap}
.t td{border-bottom:1px solid var(--brd);padding:8px;vertical-align:top}
.t tr.storno td{opacity:.55;text-decoration:line-through}
.t tr.storno td .badge{text-decoration:none}
.t-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(8,20,40,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--sur);border-radius:18px 18px 0 0;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hd h3{font-size:14.5px;font-weight:900;flex:1}
.modal-x{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--brd2);background:var(--sur2);font-size:14px;cursor:pointer}
.modal-bd{padding:13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ft{padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-ft .btn{flex:1;min-width:110px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--brd2);border-radius:10px;font-size:14px;background:var(--sur);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld .hint{font-size:10.5px;color:var(--mut);margin-top:3px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:520px){.fld-row{grid-template-columns:1fr}}
.ig{display:flex;align-items:stretch}
.ig input{border-radius:10px 0 0 10px!important;border-right:none!important;flex:1;min-width:0}
.ig .ig-u{display:flex;align-items:center;padding:0 11px;border:1.5px solid var(--brd2);border-left:none;border-radius:0 10px 10px 0;background:var(--sur2);font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap}
.seg{display:inline-flex;border:1.5px solid var(--brd2);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{padding:8px 14px;border:none;background:transparent;font-size:12.5px;font-weight:800;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gchip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--brd2);background:var(--sur);font-size:11.5px;font-weight:800;color:var(--mut);cursor:pointer}
.gchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.steppr{display:flex;align-items:center;gap:0;border:1.5px solid var(--brd2);border-radius:10px;overflow:hidden;width:max-content}
.steppr button{width:40px;min-height:42px;border:none;background:var(--sur2);font-size:17px;font-weight:900;color:var(--txt2);cursor:pointer}
.steppr input{width:56px;border:none!important;text-align:center;font-size:15px;font-weight:800;padding:8px 4px;outline:none}
.restbox{border:1.5px solid var(--brd2);border-radius:11px;padding:10px 12px;background:var(--sur2);font-size:13px;font-weight:800;margin-top:4px}
.restbox.neg{border-color:var(--red-bd);background:var(--red-bg);color:var(--red)}
.restbox .warn{display:block;font-size:11px;font-weight:700;margin-top:3px}
.saldorow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--brd)}
.saldorow b{font-variant-numeric:tabular-nums}
.saldorow.tot{border-bottom:none;font-size:14px;font-weight:900;padding-top:8px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:1400;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px}
.suchrow input{flex:1;min-width:160px;padding:9px 13px;border:1.5px solid var(--brd2);border-radius:10px;font-size:13.5px;outline:none;background:var(--sur)}
.suchrow input:focus{border-color:var(--acc)}
.ov-tbl input{width:100%;padding:7px 9px;border:1.5px solid var(--brd2);border-radius:8px;font-size:13px;outline:none}
@media print{.g-nav,.no-print{display:none!important}}
</style>

<script>
function fixLeadingZero(el){
  let v = el.value.trim();
  if (v === '') return;
  if (/^\./.test(v)) v = '0' + v;
  if (/^-\./.test(v)) v = '-0' + v.slice(1);
  if(!isNaN(parseFloat(v))) el.value = String(parseFloat(v));
}
</script>

  var AK_KATS = [
    {id:'tshirt',     label:'T-Shirt / Polo',    icon:'👕'},
    {id:'pullover',   label:'Pullover / Hoodie', icon:'🧶'},
    {id:'jacke',      label:'Jacke',             icon:'🧥'},
    {id:'hose',       label:'Hose',              icon:'👖'},
    {id:'shorts',     label:'Shorts',            icon:'🩳'},
    {id:'schuhe',     label:'Schuhe',            icon:'👟'},
    {id:'muetze',     label:'Mütze / Cap',       icon:'🧢'},
    {id:'handschuhe', label:'Handschuhe',        icon:'🧤'},
    {id:'zubehoer',   label:'Zubehör',           icon:'🎒'},
    {id:'sonstiges',  label:'Sonstiges',         icon:'📦'}
  ];
  function akKat(id){
    for(var i=0;i<AK_KATS.length;i++){ if(AK_KATS[i].id===id) return AK_KATS[i]; }
    return AK_KATS[AK_KATS.length-1];
  }
  function akParams(settings){
    var s = settings || {};
    var out = {};
    Object.keys(AK_DEFAULTS).forEach(function(k){
      out[k] = (s[k] !== undefined && s[k] !== null) ? s[k] : AK_DEFAULTS[k];
    });
    out.budget = Number(out.budget) || 0;
    out.startMonat = Math.min(12, Math.max(1, parseInt(out.startMonat, 10) || 1));
    if(!AK_PLEN[out.periode]) out.periode = 'jahr';
    out.kumulierbar = !!out.kumulierbar;
    out.mitarbeiterSicht = out.mitarbeiterSicht !== false;
    out.budgets = s.budgets || {};
    return out;
  }
  function _pad(n){ return (n<10?'0':'') + n; }
  function akIso(d){ return d.getFullYear() + '-' + _pad(d.getMonth()+1) + '-' + _pad(d.getDate()); }
  function akParse(iso){
    var p = String(iso||'').split('-');
    return new Date(+p[0] || 1970, (+p[1] || 1) - 1, +p[2] || 1);
  }
  // Periode, die das Datum enthält — verankert am Startmonat
  function akPeriodeVon(cfg, dateIso){
    var len = AK_PLEN[cfg.periode] || 12, m0 = (cfg.startMonat || 1) - 1;
    var d = akParse(dateIso);
    var start = new Date(d.getFullYear(), m0, 1);
    if(start > d) start = new Date(d.getFullYear() - 1, m0, 1);
    for(var i=0;i<12;i++){
      var next = new Date(start.getFullYear(), start.getMonth() + len, 1);
      if(next <= d) start = next; else break;
    }
    var bis = new Date(start.getFullYear(), start.getMonth() + len, 0); // letzter Tag
    return { von: akIso(start), bis: akIso(bis), key: akIso(start).slice(0,7) };
  }
  var AK_MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  function akPeriodeLabel(cfg, p){
    var von = akParse(p.von), bis = akParse(p.bis);
    if((AK_PLEN[cfg.periode] || 12) === 12 && (cfg.startMonat || 1) === 1) return String(von.getFullYear());
    return AK_MON[von.getMonth()] + ' ' + von.getFullYear() + ' – ' + AK_MON[bis.getMonth()] + ' ' + bis.getFullYear();
  }
  function akNaechstePeriode(cfg, p){
    var b = akParse(p.bis);
    return akPeriodeVon(cfg, akIso(new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1)));
  }
  function akBudgetFor(cfg, userId){
    var o = cfg.budgets && cfg.budgets[userId];
    if(o && o.betrag !== undefined && o.betrag !== null && o.betrag !== '') return Number(o.betrag) || 0;
    return cfg.budget;
  }
  // Kumulations-Anker: spätestes von budgetAb / user.ab; ohne Anker zählt nur die aktuelle Periode
  function akAnker(cfg, userId, aktuellePeriode){
    var o = (cfg.budgets && cfg.budgets[userId]) || {};
    var cands = [cfg.budgetAb, o.ab].filter(Boolean).sort();
    return cands.length ? cands[cands.length - 1] : aktuellePeriode.von;
  }
  function akSaldo(cfg, userId, bezuege, heuteIso){
    var P = akPeriodeVon(cfg, heuteIso);
    var budget = akBudgetFor(cfg, userId);
    var own = (bezuege || []).filter(function(b){ return b && b.userId === userId && !b.storniert; });
    function sumIn(q){
      var s = 0;
      own.forEach(function(b){ if(b.datum >= q.von && b.datum <= q.bis) s += Number(b.total) || 0; });
      return s;
    }
    var verbraucht = sumIn(P);
    var uebertrag = 0, perioden = 0;
    if(cfg.kumulierbar){
      var q = akPeriodeVon(cfg, akAnker(cfg, userId, P)), guard = 0;
      while(q.von < P.von && guard++ < 400){
        uebertrag += budget - sumIn(q);
        perioden++;
        q = akNaechstePeriode(cfg, q);
      }
    }
    var verfuegbar = budget + uebertrag;
    var rest = verfuegbar - verbraucht;
    return { periode:P, budget:budget, uebertrag:uebertrag, uebertragPerioden:perioden,
             verfuegbar:verfuegbar, verbraucht:verbraucht, rest:rest, negativ: rest < -0.004 };
  }
  function akFmtChf(v){
    var n = Number(v) || 0; var neg = n < -0.004; n = Math.abs(n);
    var parts = n.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    return (neg ? '−' : '') + parts[0] + '.' + parts[1];
  }
  w.AK_DEFAULTS = AK_DEFAULTS; w.AK_PLEN = AK_PLEN; w.AK_KATS = AK_KATS; w.akKat = akKat;
  w.akParams = akParams; w.akPeriodeVon = akPeriodeVon; w.akPeriodeLabel = akPeriodeLabel;
  w.akNaechstePeriode = akNaechstePeriode; w.akBudgetFor = akBudgetFor; w.akAnker = akAnker;
  w.akSaldo = akSaldo; w.akFmtChf = akFmtChf;
})(typeof window !== 'undefined' ? window : globalThis);
/*ENGINE-END*/
</script>

<script>
(function(){
  'use strict';
  var MK = 'arbeitskleider';
  var LSA = 'gema_ak_artikel_pool_v1', PFA = 'akart:';
  var LSB = 'gema_ak_bezug_pool_v1',   PFB = 'akbez:';
  var TAB = 'uebersicht', _cloudLoaded = false, _suche = '';
  var _logUser = '', _logZeit = 'aktuell';

  function $id(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function todayIso(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function uid(p){ return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function toast(msg){
    var t = $id('toast'); if(!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function fmtDatum(iso){
    if(!iso) return '—';
    var p = String(iso).slice(0,10).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
  }

  function user(){ return (typeof GemaAuth !== 'undefined') ? GemaAuth.getCurrentUser() : null; }
  function org(){
    var u = user(); if(!u) return null;
    var os = (GemaAuth.getOrgs && GemaAuth.getOrgs()) || [];
    return os.find(function(o){ return o.id === u.orgId; }) || null;
  }
  function params(){
    var o = org();
    return akParams(o && o.settings && o.settings.arbeitskleider);
  }
  function isManager(){
    var u = user(); if(!u) return false;
    var r = u.roleIds || [];
    if(r.indexOf('role_admin') >= 0 || r.indexOf('role_magaziner') >= 0) return true;
    try{ if(GemaAuth.can && GemaAuth.can('admin', MK)) return true; }catch(e){}
    return false;
  }
  function sichtAktiv(){ return params().mitarbeiterSicht !== false; }

  function cached(key){
    try{ if(typeof GemaSync !== 'undefined' && GemaSync.getCached) return GemaSync.getCached(key) || []; }catch(e){}
    try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; }
  }
  // PreBoot-Journal (Muster pm_plaene): Writes im Boot-Fenster (laufender
  // bindCollection-GET) würden vom danach eintreffenden Cloud-Snapshot
  // überschrieben — das Journal legt sie nach dem Bind wieder über den Cache.
  var _preBoot = [], _bootDone = false;
  function _preBootApply(){
    _preBoot.forEach(function(op){
      var all = cached(op.k).slice();
      if(op.t === 'save'){
        var i = all.findIndex(function(x){ return x && x.id === op.rec.id; });
        if(i >= 0) all[i] = op.rec; else all.push(op.rec);
      } else {
        all = all.filter(function(x){ return x && x.id !== op.id; });
      }
      try{ localStorage.setItem(op.k, JSON.stringify(all)); }catch(e){}
    });
    _preBoot = [];
  }
  function saveRec(storageKey, prefix, rec){
    var all = cached(storageKey).slice();
    var i = all.findIndex(function(x){ return x && x.id === rec.id; });
    if(i >= 0) all[i] = rec; else all.push(rec);
    try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
    if(!_bootDone) _preBoot.push({ t:'save', k: storageKey, rec: rec });
    if(typeof GemaSync !== 'undefined' && GemaSync.saveRecord){
      GemaSync.saveRecord(MK, prefix + rec.id, rec).catch(function(){});
    }
  }
  function delRec(storageKey, prefix, id){
    var all = cached(storageKey).filter(function(x){ return x && x.id !== id; });
    try{ localStorage.setItem(storageKey, JSON.stringify(all)); }catch(e){}
    if(!_bootDone) _preBoot.push({ t:'del', k: storageKey, id: id });
    if(typeof GemaSync !== 'undefined' && GemaSync.deleteRecord){
      GemaSync.deleteRecord(MK, prefix + id).catch(function(){});
    }
  }

  function artikelAll(){
    var u = user(); if(!u) return [];
    var arr = cached(LSA).filter(function(a){ return a && a.orgId === u.orgId; });
    arr.sort(function(a, b){
      var ka = AK_KATS.findIndex(function(k){ return k.id === a.kategorie; });
      var kb = AK_KATS.findIndex(function(k){ return k.id === b.kategorie; });
      if(ka !== kb) return ka - kb;
      return String(a.name||'').localeCompare(String(b.name||''), 'de');
    });
    return arr;
  }
  function bezuegeAll(){
    var u = user(); if(!u) return [];
    var arr = cached(LSB).filter(function(b){ return b && b.orgId === u.orgId; });
    arr.sort(function(a, b){
      if(a.datum !== b.datum) return a.datum < b.datum ? 1 : -1;
      return (b.ts || '') < (a.ts || '') ? -1 : 1;
    });
    return arr;
  }
  function orgUsers(){
    var u = user(); if(!u) return [];
    var us = ((GemaAuth.getUsers && GemaAuth.getUsers()) || []).filter(function(x){
      return x && x.orgId === u.orgId && x.active !== false && (x.status || 'aktiv') !== 'inaktiv';
    });
    us.sort(function(a, b){ return String(a.name||'').localeCompare(String(b.name||''), 'de'); });
    return us;
  }
  function userById(id){
    return ((GemaAuth.getUsers && GemaAuth.getUsers()) || []).find(function(x){ return x && x.id === id; }) || null;
  }
  function saldoFor(userId){ return akSaldo(params(), userId, bezuegeAll(), todayIso()); }

  function avatarHtml(u, size){
    size = size || 38;
    var st = 'width:' + size + 'px;height:' + size + 'px;';
    if(u && u.avatar) return '<img class="ak-av" style="' + st + '" src="' + esc(u.avatar) + '" alt=""/>';
    var ini = String((u && u.name) || '?').trim().split(/\s+/).map(function(x){ return x.charAt(0); }).slice(0,2).join('').toUpperCase();
    return '<span class="ak-av ak-av-ini" style="' + st + '">' + esc(ini || '?') + '</span>';
  }
  function restFarbe(s){
    if(s.negativ) return 'var(--red)';
    if(s.verfuegbar > 0 && s.rest / s.verfuegbar < 0.2) return '#b45309';
    return 'var(--grn)';
  }
  function barHtml(s){
    var pct = s.verfuegbar > 0 ? Math.min(100, Math.round(s.verbraucht / s.verfuegbar * 100)) : (s.verbraucht > 0 ? 100 : 0);
    var col = s.negativ ? 'var(--red)' : (pct >= 80 ? 'var(--amber)' : 'var(--acc)');
    return '<div class="bar"><i style="width:' + pct + '%;background:' + col + '"></i></div>' +
      '<div class="bar-meta"><span>bezogen CHF ' + akFmtChf(s.verbraucht) + '</span><span>verfügbar CHF ' + akFmtChf(s.verfuegbar) + '</span></div>';
  }

  // ── Rendering ─────────────────────────────────────────────────────
  function render(){
    var host = $id('akContent'); if(!host) return;
    var u = user(); if(!u){ return; }
    var mgr = isManager();
    try{ renderToolbar(mgr); }catch(e){}
    try{
      if(!mgr){
        renderMitarbeiterSicht(host);
      } else if(TAB === 'katalog'){ renderKatalog(host); }
      else if(TAB === 'log'){ renderLog(host); }
      else if(TAB === 'einstellungen'){ renderEinstellungen(host); }
      else { renderUebersicht(host); }
    }catch(e){
      host.innerHTML = '<div class="card"><div class="card-bd" style="color:var(--red);font-size:12.5px">Fehler beim Rendern: ' + esc(e.message) + '</div></div>';
    }
  }

  function renderToolbar(mgr){
    var tabs = $id('akTabs'), tbAr = $id('btnArtikel'), tbBz = $id('btnBezug'), tbWrap = $id('akToolbar');
    if(!tabs) return;
    if(!mgr){ if(tbWrap) tbWrap.style.display = 'none'; return; }
    if(tbWrap) tbWrap.style.display = '';
    var T = [
      {id:'uebersicht',    l:'📊 Übersicht'},
      {id:'katalog',       l:'👕 Katalog'},
      {id:'log',           l:'📋 Log'},
      {id:'einstellungen', l:'⚙️ Einstellungen'}
    ];
    tabs.innerHTML = T.map(function(t){
      return '<button class="vtab' + (TAB === t.id ? ' on' : '') + '" data-tab="' + t.id + '" onclick="akTab(\'' + t.id + '\')">' + t.l + '</button>';
    }).join('');
    if(tbAr) tbAr.style.display = (TAB === 'katalog') ? '' : 'none';
    if(tbBz) tbBz.style.display = '';
  }
  window.akTab = function(t){ TAB = t; render(); };

  function spinnerHtml(){
    return '<div class="empty"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 40"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg><div style="margin-top:8px">Daten werden geladen …</div></div>';
  }
  function ladend(){
    return !_cloudLoaded && artikelAll().length === 0 && bezuegeAll().length === 0;
  }

  // ── Übersicht (Manager) ───────────────────────────────────────────
  function renderUebersicht(host){
    var cfg = params(), us = orgUsers(), bez = bezuegeAll();
    var P = akPeriodeVon(cfg, todayIso());
    var salden = us.map(function(x){ return { u:x, s:saldoFor(x.id) }; });
    var sumVerb = 0, sumRest = 0, negCount = 0;
    salden.forEach(function(e){ sumVerb += e.s.verbraucht; sumRest += Math.max(0, e.s.rest); if(e.s.negativ) negCount++; });
    var html = '';
    html += '<div class="kpis">' +
      '<div class="kpi"><div class="v">' + us.length + '</div><div class="l">Mitarbeitende</div></div>' +
      '<div class="kpi"><div class="v">CHF ' + akFmtChf(sumVerb) + '</div><div class="l">Bezogen · ' + esc(akPeriodeLabel(cfg, P)) + '</div></div>' +
      '<div class="kpi"><div class="v">CHF ' + akFmtChf(sumRest) + '</div><div class="l">Budget offen</div></div>' +
      '<div class="kpi' + (negCount ? ' warn' : '') + '"><div class="v">' + negCount + '</div><div class="l">Überzogen</div></div>' +
      '</div>';
    html += '<div class="tb suchrow no-print"><input id="akSuche" type="text" placeholder="Mitarbeiter suchen …" value="' + esc(_suche) + '" oninput="akSucheInput(this.value)"/>' +
      '<span class="badge b-acc">Periode: ' + esc(akPeriodeLabel(cfg, P)) + '</span>' +
      (cfg.kumulierbar ? '<span class="badge b-out">kumulierbar</span>' : '') + '</div>';
    html += '<div class="grid" id="akMaGrid">' + maGridHtml(salden) + '</div>';
    if(ladend()) html = spinnerHtml();
    host.innerHTML = html;
  }
  function maGridHtml(salden){
    var q = _suche.trim().toLowerCase();
    var list = salden.filter(function(e){ return !q || String(e.u.name||'').toLowerCase().indexOf(q) >= 0; });
    if(!list.length) return '<div class="empty">Keine Mitarbeitenden gefunden.</div>';
    return list.map(function(e){
      var s = e.s, u = e.u;
      return '<div class="itm ma-card" onclick="akMaDetail(\'' + esc(u.id) + '\')">' +
        '<div class="itm-bd">' +
          '<div class="ma-top">' + avatarHtml(u, 38) +
            '<div style="min-width:0"><div class="itm-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(u.name || u.username || '—') + '</div>' +
            '<div class="itm-meta" style="margin-top:0">Budget CHF ' + akFmtChf(s.budget) + (s.uebertrag ? ' · Übertrag ' + (s.uebertrag > 0 ? '+' : '') + akFmtChf(s.uebertrag) : '') + '</div></div>' +
            '<div class="ma-rest"><div class="rv" style="color:' + restFarbe(s) + '">' + akFmtChf(s.rest) + '</div><div class="rl">Rest CHF</div></div>' +
          '</div>' +
          barHtml(s) +
          '<div class="itm-acts no-print"><button class="btn sm pri" onclick="event.stopPropagation();akBezugNeu(\'' + esc(u.id) + '\')">🛒 Bezug</button>' +
          '<button class="btn sm" onclick="event.stopPropagation();akMaDetail(\'' + esc(u.id) + '\')">Details</button></div>' +
        '</div></div>';
    }).join('');
  }
  window.akSucheInput = function(v){
    _suche = v;
    var grid = $id('akMaGrid');
    if(grid){
      var us = orgUsers();
      grid.innerHTML = maGridHtml(us.map(function(x){ return { u:x, s:saldoFor(x.id) }; }));
    }
  };

  // ── Katalog ───────────────────────────────────────────────────────
  function renderKatalog(host){
    if(ladend()){ host.innerHTML = spinnerHtml(); return; }
    var arts = artikelAll();
    if(!arts.length){
      host.innerHTML = '<div class="card"><div class="card-bd"><div class="empty">Noch keine Artikel im Katalog.<br/>Lege mit «＋ Artikel» T-Shirts, Hosen, Jacken etc. mit Preis an.</div></div></div>';
      return;
    }
    var html = '';
    AK_KATS.forEach(function(k){
      var inKat = arts.filter(function(a){ return (a.kategorie || 'sonstiges') === k.id; });
      if(!inKat.length) return;
      html += '<div class="card"><div class="card-hd"><h3>' + k.icon + ' ' + esc(k.label) + '</h3><span class="sub">' + inKat.length + ' Artikel</span></div>' +
        '<div class="card-bd"><div class="grid">' +
        inKat.map(function(a){
          return '<div class="itm"><div class="itm-bd">' +
            '<div style="display:flex;align-items:flex-start;gap:8px">' +
              '<div style="flex:1;min-width:0"><div class="itm-title">' + esc(a.name) + '</div>' +
              '<div class="itm-meta">CHF ' + akFmtChf(a.preis) + (a.groessen && a.groessen.length ? ' · Grössen: ' + esc(a.groessen.join(', ')) : '') + '</div></div>' +
              (a.aktiv === false ? '<span class="badge b-out">inaktiv</span>' : '<span class="badge b-grn">aktiv</span>') +
            '</div>' +
            '<div class="itm-acts no-print"><button class="btn sm" onclick="akArtikelEdit(\'' + esc(a.id) + '\')">✏️ Bearbeiten</button>' +
            '<button class="btn sm red" onclick="akArtikelDel(\'' + esc(a.id) + '\')">🗑</button></div>' +
          '</div></div>';
        }).join('') +
        '</div></div></div>';
    });
    host.innerHTML = html;
  }

  // ── Log ───────────────────────────────────────────────────────────
  function renderLog(host){
    if(ladend()){ host.innerHTML = spinnerHtml(); return; }
    var cfg = params(), bez = bezuegeAll(), us = orgUsers();
    var P = akPeriodeVon(cfg, todayIso());
    var list = bez.filter(function(b){
      if(_logUser && b.userId !== _logUser) return false;
      if(_logZeit === 'aktuell' && !(b.datum >= P.von && b.datum <= P.bis)) return false;
      return true;
    });
    var html = '<div class="card"><div class="card-hd"><h3>📋 Bezugs-Log</h3><span class="sub">' + list.length + ' Einträge</span>' +
      '<span style="flex:1"></span>' +
      '<select class="btn sm" style="font-weight:700" onchange="akLogUser(this.value)">' +
        '<option value="">Alle Mitarbeitenden</option>' +
        us.map(function(x){ return '<option value="' + esc(x.id) + '"' + (_logUser === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select>' +
      '<select class="btn sm" style="font-weight:700" onchange="akLogZeit(this.value)">' +
        '<option value="aktuell"' + (_logZeit === 'aktuell' ? ' selected' : '') + '>' + esc(akPeriodeLabel(cfg, P)) + '</option>' +
        '<option value="alle"' + (_logZeit === 'alle' ? ' selected' : '') + '>Alle Perioden</option>' +
      '</select>' +
      '<button class="btn sm" onclick="akCsv()">⬇ CSV</button>' +
      '</div><div class="card-bd"><div class="t-wrap">';
    if(!list.length){
      html += '<div class="empty">Keine Bezüge im gewählten Zeitraum.</div>';
    } else {
      html += '<table class="t"><thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Artikel</th><th>Menge</th><th style="text-align:right">Total CHF</th><th>Erfasst von</th><th></th></tr></thead><tbody>' +
        list.map(function(b){ return logRowHtml(b, true); }).join('') +
        '</tbody></table>';
    }
    html += '</div></div></div>';
    host.innerHTML = html;
  }
  function logRowHtml(b, mitAktion){
    var kat = akKat(b.kategorie || 'sonstiges');
    var belegLink = '';
    if(b.beleg && (b.beleg.url || b.beleg.dataUrl)){
      belegLink = ' <a href="' + esc(b.beleg.url || b.beleg.dataUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📎</a>';
    }
    return '<tr' + (b.storniert ? ' class="storno"' : '') + '>' +

  window.akCsv = function(){
    var cfg = params(), P = akPeriodeVon(cfg, todayIso());
    var list = bezuegeAll().filter(function(b){
      if(_logUser && b.userId !== _logUser) return false;
      if(_logZeit === 'aktuell' && !(b.datum >= P.von && b.datum <= P.bis)) return false;
      return true;
    });
    var rows = [['Datum','Mitarbeiter','Artikel','Kategorie','Groesse','Menge','Preis','Total','Typ','Erfasst von','Bemerkung','Status']];
    list.forEach(function(b){
      rows.push([fmtDatum(b.datum), b.userName || '', b.artikelName || '', akKat(b.kategorie || 'sonstiges').label,
        b.groesse || '', b.menge || 1, (Number(b.preis) || 0).toFixed(2), (Number(b.total) || 0).toFixed(2),
        b.typ === 'frei' ? 'frei' : 'Katalog', (b.erfasstVon && b.erfasstVon.name) || '', b.bemerkung || '',
        b.storniert ? 'storniert' : 'ok']);
    });
    var csv = '﻿' + rows.map(function(r){
      return r.map(function(c){ c = String(c == null ? '' : c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'Arbeitskleider_Log_' + todayIso() + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  };

          if(!inKat.length) return '';
          return '<optgroup label="' + k.icon + ' ' + esc(k.label) + '">' +
            inKat.map(function(a){ return '<option value="' + esc(a.id) + '"' + (BZ.artikelId === a.id ? ' selected' : '') + '>' + esc(a.name) + ' — CHF ' + akFmtChf(a.preis) + '</option>'; }).join('') +
            '</optgroup>';
        }).join('') +
        '</select></div>' +
        '<div class="fld" id="bz_groessen_wrap"' + (art && art.groessen && art.groessen.length ? '' : ' style="display:none"') + '><label>Grösse</label><div class="gchips" id="bz_groessen">' + bzGroessenHtml(art) + '</div></div>';
    } else {
      host.innerHTML = '<div class="fld"><label>Bezeichnung *</label><input id="bz_frei_name" type="text" value="' + esc(BZ.name) + '" oninput="akBzFreiName(this.value)" placeholder="z.B. Sicherheitsschuhe (Quittung)"/></div>' +
        '<div class="fld-row">' +
        '<div class="fld"><label>Kategorie</label><select id="bz_frei_kat" onchange="akBzFreiKat(this.value)">' +
          AK_KATS.map(function(k){ return '<option value="' + k.id + '"' + (BZ.kategorie === k.id ? ' selected' : '') + '>' + k.icon + ' ' + esc(k.label) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="fld"><label>Beleg / Quittung</label><input id="bz_beleg" type="file" accept="image/*,application/pdf" onchange="akBzBeleg(this)"/>' +
        '<div class="hint" id="bz_beleg_hint">' + (BZ.belegName ? '📎 ' + esc(BZ.belegName) : 'Foto oder PDF, optional') + '</div></div>' +
        '</div>';
    }
  }
  function bzGroessenHtml(art){
    if(!art || !art.groessen || !art.groessen.length) return '';
    return art.groessen.map(function(g){
      return '<button type="button" class="gchip' + (BZ.groesse === g ? ' on' : '') + '" onclick="akBzGroesse(\'' + esc(g).replace(/'/g, "\\'") + '\')">' + esc(g) + '</button>';
    }).join('');
  }
  window.akBzTyp = function(t){
    if(!BZ) return;
    BZ.typ = t;
    var sa = $id('bz_seg_art'), sf = $id('bz_seg_frei');
    if(sa) sa.classList.toggle('on', t === 'artikel');
    if(sf) sf.classList.toggle('on', t === 'frei');
    if(t === 'frei'){ BZ.artikelId = ''; BZ.groesse = ''; }
    bzRenderBody(); bzRest();
  };
  window.akBzUser = function(v){ if(BZ){ BZ.userId = v; bzRest(); } };
  window.akBzArtikel = function(id){
    if(!BZ) return;
    BZ.artikelId = id; BZ.groesse = '';
    var art = artikelAll().find(function(a){ return a.id === id; });
    if(art){
      BZ.preis = art.preis; BZ.name = art.name; BZ.kategorie = art.kategorie || 'sonstiges';
      var pe = $id('bz_preis'); if(pe) pe.value = String(art.preis);
    }
    var wrap = $id('bz_groessen_wrap'), chips = $id('bz_groessen');
    if(wrap) wrap.style.display = (art && art.groessen && art.groessen.length) ? '' : 'none';
    if(chips) chips.innerHTML = bzGroessenHtml(art);
    bzRest();
  };
  window.akBzGroesse = function(g){
    if(!BZ) return;
    BZ.groesse = (BZ.groesse === g) ? '' : g;
    var art = artikelAll().find(function(a){ return a.id === BZ.artikelId; });
    var chips = $id('bz_groessen'); if(chips) chips.innerHTML = bzGroessenHtml(art);
  };
  window.akBzMenge = function(d){
    if(!BZ) return;
    BZ.menge = Math.max(1, (parseInt(BZ.menge, 10) || 1) + d);
    var e = $id('bz_menge'); if(e) e.value = String(BZ.menge);
    bzRest();
  };
  window.akBzMengeInput = function(v){
    if(!BZ) return;
    BZ.menge = Math.max(1, parseInt(v, 10) || 1);
    var e = $id('bz_menge'); if(e) e.value = String(BZ.menge);
    bzRest();
  };
  window.akBzPreis = function(v){ if(BZ){ BZ.preis = v; bzRest(); } };
  window.akBzFreiName = function(v){ if(BZ) BZ.name = v; };
  window.akBzFreiKat = function(v){ if(BZ) BZ.kategorie = v; };
  window.akBzBeleg = function(inp){
    if(!BZ || !inp.files || !inp.files[0]) return;
    var f = inp.files[0];
    var hint = $id('bz_beleg_hint');
    if(f.type === 'application/pdf'){
      if(f.size > 8 * 1024 * 1024){ toast('PDF zu gross (max. 8 MB)'); inp.value = ''; return; }
      var r = new FileReader();
      r.onload = function(){ BZ.belegDataUrl = r.result; BZ.belegName = f.name; if(hint) hint.textContent = '📎 ' + f.name; };
      r.onerror = function(){ toast('Beleg konnte nicht gelesen werden'); };
      r.readAsDataURL(f);
      return;
    }
    var img = new Image(), rd = new FileReader();
    rd.onload = function(){
      img.onload = function(){
        var max = 1600, w = img.width, h = img.height;
        if(Math.max(w, h) > max){ var sc = max / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        BZ.belegDataUrl = c.toDataURL('image/jpeg', 0.82);
        BZ.belegName = f.name;
        if(hint) hint.textContent = '📎 ' + f.name;
      };
      img.onerror = function(){ toast('Bild konnte nicht gelesen werden'); };
      img.src = rd.result;
    };
    rd.onerror = function(){ toast('Beleg konnte nicht gelesen werden'); };
    rd.readAsDataURL(f);
  };
  function bzTotal(){
    return Math.max(1, parseInt(BZ.menge, 10) || 1) * (parseFloat(BZ.preis) || 0);
  }
  function bzRest(){
    var box = $id('bz_rest'); if(!box || !BZ) return;
    var s = saldoFor(BZ.userId);
    var nach = s.rest - bzTotal();
    var neg = nach < -0.004;
    box.className = 'restbox' + (neg ? ' neg' : '');
    box.innerHTML = 'Rest nach Bezug: <b>CHF ' + akFmtChf(nach) + '</b> <span style="color:var(--mut);font-weight:600">(aktuell CHF ' + akFmtChf(s.rest) + ')</span>' +
      (neg ? '<span class="warn">⚠ Budget wird überschritten — der Bezug wird trotzdem erfasst und rot ausgewiesen.</span>' : '');
  }
  window.akBezugSave = function(){
    var me = user(); if(!me || !isManager() || !BZ) return;
    var zielUser = userById(BZ.userId);
    if(!zielUser){ toast('Mitarbeiter fehlt'); return; }
    var preis = parseFloat(($id('bz_preis') || {}).value);
    if(isNaN(preis) || preis < 0){ toast('Preis fehlt'); return; }
    var artikelName = '', kategorie = BZ.kategorie || 'sonstiges', artikelId = '';
    if(BZ.typ === 'artikel'){
      var art = artikelAll().find(function(a){ return a.id === BZ.artikelId; });
      if(!art){ toast('Bitte Artikel wählen'); return; }
      artikelName = art.name; kategorie = art.kategorie || 'sonstiges'; artikelId = art.id;
      if(art.groessen && art.groessen.length && !BZ.groesse){ toast('Bitte Grösse wählen'); return; }
    } else {
      artikelName = (($id('bz_frei_name') || {}).value || '').trim();
      if(!artikelName){ toast('Bezeichnung fehlt'); return; }
    }
    var menge = Math.max(1, parseInt(BZ.menge, 10) || 1);
    var rec = {
      id: uid('akb'), orgId: me.orgId,
      userId: zielUser.id, userName: zielUser.name || zielUser.username || '',
      typ: BZ.typ, artikelId: artikelId, artikelName: artikelName, kategorie: kategorie,
      groesse: BZ.groesse || '', menge: menge, preis: preis, total: Math.round(menge * preis * 100) / 100,
      datum: ($id('bz_datum') || {}).value || todayIso(),
      bemerkung: (($id('bz_bem') || {}).value || '').trim(),
      erfasstVon: { userId: me.id, name: me.name || '' },
      ts: new Date().toISOString()
    };
    var btn = $id('bz_save'); if(btn){ btn.disabled = true; }
    var belegPromise = Promise.resolve(null);
    if(BZ.typ === 'frei' && BZ.belegDataUrl){
      var dataUrl = BZ.belegDataUrl, name = BZ.belegName || 'Beleg';
      if(typeof GemaStorage !== 'undefined' && GemaStorage.uploadDataUrl){
        belegPromise = GemaStorage.uploadDataUrl(dataUrl, 'arbeitskleider/' + me.orgId)
          .then(function(res){ return { name: name, url: res.url }; })
          .catch(function(){
            return (dataUrl.length <= 2.5 * 1024 * 1024) ? { name: name, dataUrl: dataUrl } : null;
          });
      } else {
        belegPromise = Promise.resolve((dataUrl.length <= 2.5 * 1024 * 1024) ? { name: name, dataUrl: dataUrl } : null);
      }
    }
    belegPromise.then(function(beleg){
      if(beleg) rec.beleg = beleg;
      saveRec(LSB, PFB, rec);
      var sNach = saldoFor(rec.userId);
      if(typeof GemaNotify !== 'undefined' && rec.userId !== me.id && sichtAktiv()){
        try{
          GemaNotify.push({
            eventKey: 'kleider_bezug', empfaengerUserId: rec.userId, modul: MK, typ: 'info',
            titel: 'Arbeitskleider: Bezug erfasst',
            text: (rec.menge > 1 ? rec.menge + '× ' : '') + rec.artikelName + (rec.groesse ? ' (' + rec.groesse + ')' : '') +
              ' — CHF ' + akFmtChf(rec.total) + ' · Rest: CHF ' + akFmtChf(sNach.rest),
            link: 'if_arbeitskleider.html'
          });
        }catch(e){}
      }
      akCloseModal();
      toast('Bezug erfasst — Rest CHF ' + akFmtChf(sNach.rest));
      render();
    });
  };

  // ── Storno ────────────────────────────────────────────────────────
  window.akStorno = function(id){
    if(!isManager()) return;
    var b = bezuegeAll().find(function(x){ return x.id === id; });
    if(!b || b.storniert) return;
    GemaDialog.prompt({
      title: 'Bezug stornieren',
      message: '«' + b.artikelName + '» (' + (b.userName || '') + ', CHF ' + akFmtChf(b.total) + ') stornieren? Der Eintrag bleibt im Log sichtbar, zählt aber nicht mehr ans Budget.',
      placeholder: 'Grund (optional)'
    }).then(function(grund){
      if(grund === null) return;
      var me = user();
      var rec = Object.assign({}, b, { storniert: { am: new Date().toISOString(), von: (me && me.name) || '', grund: (grund || '').trim() } });
      saveRec(LSB, PFB, rec);
      if(typeof GemaNotify !== 'undefined' && me && rec.userId !== me.id && sichtAktiv()){
        try{
          GemaNotify.push({
            eventKey: 'kleider_bezug', empfaengerUserId: rec.userId, modul: MK, typ: 'warnung',
            titel: 'Arbeitskleider: Bezug storniert',
            text: rec.artikelName + ' (CHF ' + akFmtChf(rec.total) + ') wurde storniert' + (rec.storniert.grund ? ' — ' + rec.storniert.grund : ''),
            link: 'if_arbeitskleider.html'
          });
        }catch(e){}
      }
      akCloseModal();
      toast('Bezug storniert'); render();
    });
  };

  // ── Modal-Infrastruktur ───────────────────────────────────────────
  function showModal(inner){
    var host = $id('akModalHost'); if(!host) return;
    host.innerHTML = '<div class="modal-bg open" onclick="if(event.target===this)akCloseModal()"><div class="modal">' + inner + '</div></div>';
    if(typeof GemaScroll !== 'undefined' && GemaScroll.lock) try{ GemaScroll.lock(); }catch(e){}
  }
  window.akCloseModal = function(){
    var host = $id('akModalHost'); if(host) host.innerHTML = '';
    BZ = null;
    if(typeof GemaScroll !== 'undefined' && GemaScroll.unlock) try{ GemaScroll.unlock(); }catch(e){}
  };
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $id('akModalHost') && $id('akModalHost').firstChild) window.akCloseModal();
  });

  // ── Boot ──────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function(){
    if(!$id('akContent') || !$id('akTabs')) return;   // Kein-Zugriff-Body (gema_auth hat ersetzt)
    var u = user(); if(!u) return;
    try{
      var qp = new URLSearchParams(location.search);
      var t = qp.get('tab');
      if(t && ['uebersicht','katalog','log','einstellungen'].indexOf(t) >= 0) TAB = t;
    }catch(e){}
    render();
    var timeout = new Promise(function(r){ setTimeout(r, 6000); });
    if(typeof GemaSync !== 'undefined' && GemaSync.bindCollection){
      var bindP = Promise.all([
        GemaSync.bindCollection(MK, LSA, PFA, 'id'),
        GemaSync.bindCollection(MK, LSB, PFB, 'id')
      ]);
      // Spinner-Flag über das Race (max. 6 s warten) …
      Promise.race([bindP, timeout]).then(function(){ _cloudLoaded = true; render(); });
      // … das Journal aber erst anwenden, wenn der Bind WIRKLICH fertig ist
      // (der Cloud-Snapshot könnte sonst nach dem Race Boot-Writes wegwischen).
      bindP.then(function(){ _bootDone = true; _preBootApply(); _cloudLoaded = true; render(); })
           .catch(function(){ _bootDone = true; _preBootApply(); _cloudLoaded = true; render(); });
    } else {
      _bootDone = true; _cloudLoaded = true; render();
    }
  });

  // Test-Hooks
  window._akHooks = {
    render: render, params: params, isManager: isManager, sichtAktiv: sichtAktiv,
    artikelAll: artikelAll, bezuegeAll: bezuegeAll, orgUsers: orgUsers, saldoFor: saldoFor,
    setTab: function(t){ TAB = t; render(); }, getTab: function(){ return TAB; },
    cloudLoaded: function(){ return _cloudLoaded; }, getBZ: function(){ return BZ; }
  };
})();
</script>
<script src="gema_scroll.js"></script>
<script src="gema_mobile_menu.js"></script>
</body>
</html>
