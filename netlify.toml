# GEMA Netlify Konfiguration
#
# Functions: claude-rewrite.js dient als Proxy für Anthropic API,
# damit der ANTHROPIC_API_KEY nicht im Frontend liegt.
#
# Vor dem Deploy in Netlify-Settings hinterlegen:
#   ANTHROPIC_API_KEY = sk-ant-...

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/claude-rewrite"
  to   = "/.netlify/functions/claude-rewrite"
  status = 200

# SPA-Fallback NICHT notwendig — wir haben echte .html-Dateien.
