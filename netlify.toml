# GEMA Netlify Konfiguration
#
# Functions: claude-rewrite.js (Text-Ueberarbeitung) und claude-extract.js
# (Dokument-Analyse Wareneingang) dienen als Proxy für die Anthropic API,
# damit der ANTHROPIC_API_KEY nicht im Frontend liegt.
#
# Vor dem Deploy in Netlify-Settings hinterlegen:
#   ANTHROPIC_API_KEY = sk-ant-...

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Netlify Secrets Scanning (Smart Detection) schlaegt auf den Supabase
  # anon-Key an, der by design OEFFENTLICH im Client-JS liegt (gema_sync.js,
  # gema_autosave.js, gema_db.js, gema_objekte_api.js) — er ist der
  # publizierbare Browser-Key; die Zugriffskontrolle machen RLS-Policies
  # (siehe SECURITY_RLS_ANLEITUNG.md). Er wird deshalb gezielt gesafelistet.
  # Echte Secrets (SUPABASE_SERVICE_KEY, GEMA_JWT_SECRET, ANTHROPIC_API_KEY)
  # werden weiterhin gescannt und blockieren den Build, falls sie je in
  # Repo/Build-Output auftauchen.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqaGJxanZheWd2aGlldmpnZHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2ODk5OTUsImV4cCI6MjA4ODI2NTk5NX0.n3AbrEKTWWhI2tnDaf7-Z-QI9o9pJiP1E7BsHVuZY9k"
  # Die Projekt-URL ist ebenfalls oeffentlich — falls sie als Env-Variable
  # gepflegt wird, soll ihr Wert im Client-Code den Build nicht blockieren.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/claude-rewrite"
  to   = "/.netlify/functions/claude-rewrite"
  status = 200

[[redirects]]
  from = "/api/claude-extract"
  to   = "/.netlify/functions/claude-extract"
  status = 200

[[redirects]]
  from = "/api/rev-share"
  to   = "/.netlify/functions/rev-share"
  status = 200

[[redirects]]
  from = "/api/goodel-share"
  to   = "/.netlify/functions/goodel-share"
  status = 200

[[redirects]]
  from = "/api/claude-formfields"
  to   = "/.netlify/functions/claude-formfields"
  status = 200

[[redirects]]
  from = "/api/form-watch"
  to   = "/.netlify/functions/form-watch"
  status = 200

[[redirects]]
  from = "/api/claude-plan"
  to   = "/.netlify/functions/claude-plan"
  status = 200

# DataSelect-Artikelkatalog (dataselect.ch, DataExpert®BIM): server-seitiger
# Proxy, damit der Browser die API ohne CORS abrufen kann und allfaellige
# Zugangsdaten (DATASELECT_API_KEY) serverseitig bleiben. Genutzt im ERP-
# Positions-Editor («🔎 DataSelect») zum Einfuegen von Artikeln inkl. Bild.
[[redirects]]
  from = "/api/dataselect"
  to   = "/.netlify/functions/dataselect"
  status = 200

# Handelsregister: server-seitiger Proxy, damit der Browser ohne CORS
# abfragen kann. Standardquelle ist LINDAS SPARQL (Open Data der
# Bundesverwaltung, Graph des Bundesamts fuer Justiz) — OHNE Zugangsdaten
# nutzbar. Fallback ist die Zefix Public REST API, falls ZEFIX_USER/
# ZEFIX_PASSWORD hinterlegt sind (bzw. ZEFIX_SOURCE=rest). Genutzt am
# Firma-Feld der ERP-Dialoge (Kunde, Zustelladresse, Absender).
[[redirects]]
  from = "/api/zefix"
  to   = "/.netlify/functions/zefix"
  status = 200

# Stripe-Checkout (VORBEREITET): erstellt eine Checkout-Session fuer
# Abo-Bestellungen von sys_preise.html. Antwortet mit 501, solange
# STRIPE_SECRET_KEY nicht in den Netlify-Env-Variablen gesetzt ist.
[[redirects]]
  from = "/api/stripe-checkout"
  to   = "/.netlify/functions/stripe-checkout"
  status = 200

# Geplante Function: prüft täglich alle hinterlegten Behördenformular-URLs
# server-seitig und meldet Änderungen dem GEMA-Admin (Modul «Behörden &
# Formulare»). Braucht SUPABASE_SERVICE_KEY; ohne Key No-Op.
[functions."form-watch-cron"]
  schedule = "@daily"

# Same-Origin-Proxy zur Supabase-API (REST + Storage) — Fallback fuer
# Geraete, auf denen *.supabase.co blockiert ist (Firewall/Werbeblocker/
# DNS-Filter/Antivirus): gema_sync.js schaltet automatisch auf /sb/* um,
# sobald der direkte Weg nicht erreichbar ist. Netlify leitet Header
# (apikey/Authorization) transparent weiter.
[[redirects]]
  from = "/sb/*"
  to   = "https://fjhbqjvaygvhievjgdtm.supabase.co/:splat"
  status = 200
  force = true

# SPA-Fallback NICHT notwendig — wir haben echte .html-Dateien.
