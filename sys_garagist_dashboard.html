<!doctype html>
<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_recent.js"></script>
<meta charset="utf-8"/>
<meta name="theme-color" content="#0d9488"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Werkstatt-Dashboard – GEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;--bg2:#edf0f7;--sur:#fff;--brd:#e2e7f0;--brd2:#cdd4e4;
  --txt:#111827;--txt2:#374151;--mut:#6b7280;
  --teal:#0d9488;--teal-bg:#ecfeff;--teal-brd:#a5f3fc;
  --grn:#16a34a;--grn-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
  --amb:#d97706;--amb-bg:#fffbeb;
  --r:14px;--r-sm:9px;--r-lg:20px;
  --sh:0 4px 16px rgba(0,0,0,.08);
  --sans:"DM Sans",system-ui,sans-serif
}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}

.g-nav{background:#fff;border-bottom:1.5px solid var(--brd);position:sticky;top:0;z-index:200}
.g-nav-inner{padding:0 24px;height:52px;display:flex;align-items:center;gap:16px}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.g-nav-bc{display:flex;align-items:center;gap:6px;font-size:13px;margin-left:4px;color:var(--txt2);font-weight:700}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.g-nav-btn{font-size:12px;font-weight:600;color:var(--mut);background:var(--bg2);border:1.5px solid var(--brd);border-radius:8px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.g-nav-btn:hover{background:var(--brd);color:var(--txt)}

.g-page{max-width:1100px;margin:0 auto;padding:24px 24px 60px}

/* HERO */
.hero{background:linear-gradient(135deg,#0f172a 0%,#0d9488 60%,#14b8a6 100%);color:#fff;border-radius:var(--r-lg);padding:32px 36px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(20,184,166,.3) 0%,transparent 50%);pointer-events:none}
.hero-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(255,255,255,.18);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(22px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.hero p{font-size:14px;color:rgba(255,255,255,.78);max-width:640px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;font-size:12px}
.hero-meta-item{padding:6px 12px;background:rgba(255,255,255,.12);border-radius:8px}
.hero-meta-item b{color:#fff;font-weight:800;margin-right:4px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi-card{background:var(--sur);border:1.5px solid var(--brd);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:.15s}
.kpi-card:hover{border-color:var(--teal);transform:translateY(-1px);box-shadow:var(--sh)}
.kpi-card.active{border-color:var(--teal);background:var(--teal-bg)}
.kpi-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:800;color:var(--txt)}
.kpi-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi-card.faellig .kpi-val{color:var(--amb)}
.kpi-card.ueberfaellig .kpi-val{color:var(--red)}

/* TABS */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--brd);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:0 0 auto;padding:10px 16px;background:none;border:none;border-bottom:2.5px solid transparent;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap;transition:.15s}
.tab-btn:hover{color:var(--txt2)}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.fz-card{background:var(--sur);border:1.5px solid var(--brd);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.fz-card:hover{border-color:var(--teal);box-shadow:var(--sh)}
.fz-status-bar{height:4px;border-radius:4px;margin:-16px -16px 4px}
.fz-status-bar.green{background:var(--grn)}
.fz-status-bar.amber{background:var(--amb)}
.fz-status-bar.red{background:var(--red)}
.fz-card-hd{display:flex;align-items:flex-start;gap:10px}
.fz-icon{width:40px;height:40px;background:var(--teal-bg);border:1.5px solid var(--teal-brd);border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.fz-name{font-size:14px;font-weight:700;color:var(--txt);line-height:1.3}
.fz-plate{font-size:11.5px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.fz-meta{font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.fz-meta b{color:var(--txt2);font-weight:600}
.fz-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.fz-act{flex:1 1 110px;padding:7px 10px;border-radius:8px;border:1.5px solid var(--brd2);background:#fff;color:var(--txt2);font-size:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.fz-act.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.fz-act:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.fz-due-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.fz-due-pill.green{background:var(--grn-bg);color:var(--grn)}
.fz-due-pill.amber{background:var(--amb-bg);color:var(--amb)}
.fz-due-pill.red{background:var(--red-bg);color:var(--red)}

/* HISTORY LIST */
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--sur);border:1.5px solid var(--brd);border-radius:10px;padding:12px 14px}
.hist-item-hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hist-art{font-size:13px;font-weight:700;color:var(--txt)}
.hist-meta{font-size:11.5px;color:var(--mut)}
.hist-cost{margin-left:auto;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-bg);padding:2px 8px;border-radius:4px}
.hist-desc{margin-top:4px;font-size:12.5px;color:var(--txt2);white-space:pre-wrap}

/* PROFILE */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.profile-card{background:var(--sur);border:1.5px solid var(--brd);border-radius:var(--r);padding:18px}
.profile-card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:12px}
.profile-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--brd);font-size:13px}
.profile-row:last-child{border-bottom:none}
.profile-row b{color:var(--txt2);font-weight:600}
.profile-row span{color:var(--txt);font-weight:600;text-align:right}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--mut);font-size:14px}
.empty-ico{font-size:42px;margin-bottom:10px;opacity:.5}

/* DASH TOOLBAR */
.dash-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
/* 16px verhindert den iOS-Auto-Zoom beim Fokussieren des Suchfelds */
.dash-toolbar input[type="search"]{flex:1;min-width:220px;padding:9px 14px;border:1.5px solid var(--brd);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.dash-toolbar input[type="search"]:focus{outline:none;border-color:var(--teal)}
.dash-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:#fff;border:1.5px solid var(--brd);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--txt2);cursor:pointer;user-select:none}
.dash-toggle input{accent-color:var(--teal)}

/* QUICK KM MODAL */
.km-mini-btn{background:none;border:none;cursor:pointer;color:var(--teal);font-size:13px;padding:0 4px;margin-left:4px}
.km-mini-btn:hover{text-decoration:underline}

/* RESPONSIVE */
@media(max-width:760px){
  .g-page{padding:14px 12px 40px}
  .g-nav-inner{padding:0 14px}
  .hero{padding:22px 18px;border-radius:var(--r)}
  .kpi-row{grid-template-columns:1fr 1fr;gap:8px}
  .kpi-val{font-size:22px}
  .profile-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .kpi-row{grid-template-columns:1fr}
  .card-grid{grid-template-columns:1fr}
  .hero h1{font-size:20px}
  .hero p{font-size:13px}
  .hero-meta-item{font-size:11px;padding:4px 9px}
}
</style>
</head>

<script>
(function(){
  function esc(s){if(s===null||s===undefined)return '';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
  function fmtDate(d){if(!d)return '—';var x=new Date(d);if(isNaN(x.getTime()))return '—';return x.toLocaleDateString('de-CH');}
  function fmtKm(k){if(!k)return '—';return parseInt(k,10).toLocaleString('de-CH')+' km';}
  function getMe(){try{return GemaAuth.getCurrentUser();}catch(e){return null;}}

  // ── DATA LOAD ────────────────────────────────────────────────
  // Kanonischer Lese-Pfad: GemaSync.getCached (per-Record-Pool 'gema_vehicles',
  // gecacht von bindCollection). _GemaDB/localStorage nur als Fallback.
  function _dashReadVehicles(){
    try{
      if(typeof GemaSync!=='undefined'&&GemaSync.getCached){
        var c=GemaSync.getCached('gema_vehicles');
        if(Array.isArray(c))return c;
      }
    }catch(e){}
    try{
      var raw=(typeof _GemaDB!=='undefined'&&_GemaDB.c&&_GemaDB.c['gema_vehicles'])||null;
      if(!raw)raw=localStorage.getItem('gema_vehicles');
      if(raw){var a=JSON.parse(raw);if(Array.isArray(a))return a;}
    }catch(e){}
    return [];
  }
  var vehicles=_dashReadVehicles();

  var me=getMe();
  if(!me){
    location.href='sys_login.html';
    return;
  }
  // Werkstatt-Sicht: alle User mit role_garagist in derselben Org wie
  // der aktuelle User. Vehicles werden ueber den Lead-Garagist
  // (v.garagistUserId) angekoppelt — wenn dessen orgId mit meiner
  // identisch ist, sieht die ganze Werkstatt das Fahrzeug.
  var werkstattUserIds=[];
  var werkstattMembers=[];
  try{
    if(typeof GemaAuth!=='undefined' && me.orgId){
      var allUsers=GemaAuth.getUsers()||[];
      werkstattMembers=allUsers.filter(function(u){
        return u && u.orgId===me.orgId && u.roleIds && u.roleIds.indexOf('role_garagist')>=0;
      });
      werkstattUserIds=werkstattMembers.map(function(u){return u.id;});
    }
  }catch(e){}
  if(werkstattUserIds.indexOf(me.id)<0)werkstattUserIds.push(me.id);
  function _dashMyVehicles(){
    return vehicles.filter(function(v){
      return v && v.garagistUserId && werkstattUserIds.indexOf(v.garagistUserId)>=0;
    });
  }
  var myVehicles=_dashMyVehicles();

  // ── SERVICE / MFK STATUS ─────────────────────────────────────
  function nextServiceDate(v){
    if(!v.serviceMonths || !v.lastService) return null;
    var d=new Date(v.lastService);
    if(isNaN(d.getTime()))return null;
    d.setMonth(d.getMonth()+parseInt(v.serviceMonths,10));
    return d;
  }
  function daysUntil(dateLike){
    if(!dateLike)return null;
    var d=(dateLike instanceof Date)?dateLike:new Date(dateLike);
    if(isNaN(d.getTime()))return null;
    var t=new Date();t.setHours(0,0,0,0);d.setHours(0,0,0,0);
    return Math.round((d.getTime()-t.getTime())/(24*3600*1000));
  }
  function dueBadge(days){
    if(days===null||days===undefined)return null;
    if(days<0)return {cls:'red',label:'Überfällig'};
    if(days<=7)return {cls:'red',label:days===0?'Heute':'in '+days+' Tagen'};
    if(days<=30)return {cls:'amber',label:'in '+days+' Tagen'};
    return {cls:'green',label:'in '+days+' Tagen'};
  }
  function openFollowUps(v){
    if(!Array.isArray(v.followUps))return [];
    return v.followUps.filter(function(f){return f && !f.completed;});
  }
  function vehicleUrgency(v){
    var s=daysUntil(nextServiceDate(v));
    var m=daysUntil(v.mfk);
    var fups=openFollowUps(v).map(function(f){return daysUntil(f.dueDate);});
    var arr=[s,m].concat(fups).filter(function(x){return x!==null;});
    if(!arr.length)return Infinity;
    return Math.min.apply(null,arr);
  }

  // ── HERO META + KPI ──────────────────────────────────────────
  var greeting=document.getElementById('greetingName');
  greeting.textContent='Hallo '+(me.name||me.username||'Garagist')+' 👋';
  var orgName='';
  try{
    var orgs=(GemaAuth.getOrgs&&GemaAuth.getOrgs())||[];
    var org=orgs.find(function(o){return o.id===me.orgId;});
    if(org)orgName=org.name||'';
  }catch(e){}

  var heroMeta=document.getElementById('heroMeta');
  var heroMetaParts=[];
  if(orgName)heroMetaParts.push('<div class="hero-meta-item"><b>Werkstatt:</b>'+esc(orgName)+'</div>');
  heroMetaParts.push('<div class="hero-meta-item"><b>Heute:</b>'+new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'})+'</div>');
  heroMeta.innerHTML=heroMetaParts.join('');

  // Abgeleitete Listen + KPIs — als Funktion, damit sie nach dem
  // Cloud-Pull (bindCollection) und nach Schreib-Aktionen neu berechnet
  // werden koennen.
  var faelligList=[],ueberfaelligList=[],historieMonat=0,defectVehicles=[];
  function _dashRecompute(){
    myVehicles=_dashMyVehicles();
    faelligList=myVehicles.filter(function(v){
      var s=daysUntil(nextServiceDate(v));
      var m=daysUntil(v.mfk);
      return (s!==null&&s<=30)||(m!==null&&m<=30);
    });
    ueberfaelligList=myVehicles.filter(function(v){
      var s=daysUntil(nextServiceDate(v));
      var m=daysUntil(v.mfk);
      return (s!==null&&s<0)||(m!==null&&m<0);
    });
    var monatStart=new Date();monatStart.setDate(monatStart.getDate()-30);
    // Werkstatt-weit: Eintraege von allen Werkstatt-Mitgliedern
    historieMonat=myVehicles.reduce(function(acc,v){
      if(!Array.isArray(v.serviceHistorie))return acc;
      return acc+v.serviceHistorie.filter(function(e){
        return e && werkstattUserIds.indexOf(e.erledigtVonUserId)>=0 && e.datum && new Date(e.datum)>=monatStart;
      }).length;
    },0);
    defectVehicles=myVehicles.filter(function(v){
      return Array.isArray(v.events) && v.events.some(function(e){return e && e.type==='defekt' && !e.resolved;});
    });
    var kpiRow=document.getElementById('kpiRow');
    kpiRow.innerHTML=''+
      '<div class="kpi-card" data-tab="uebersicht"><div class="kpi-lbl">Zugewiesen</div><div class="kpi-val">'+myVehicles.length+'</div><div class="kpi-sub">Fahrzeuge</div></div>'+
      '<div class="kpi-card '+(defectVehicles.length?'ueberfaellig':'')+'" data-tab="uebersicht"><div class="kpi-lbl">Defekte offen</div><div class="kpi-val">'+defectVehicles.length+'</div><div class="kpi-sub">'+(defectVehicles.length?'zur Bearbeitung':'alle behoben')+'</div></div>'+
      '<div class="kpi-card '+(faelligList.length?'faellig':'')+'" data-tab="anstehend"><div class="kpi-lbl">Anstehend (≤30 T)</div><div class="kpi-val">'+faelligList.length+'</div><div class="kpi-sub">'+(ueberfaelligList.length?ueberfaelligList.length+' überfällig':'inkl. Service & MFK')+'</div></div>'+
      '<div class="kpi-card" data-tab="historie"><div class="kpi-lbl">Erfasst (30 Tage)</div><div class="kpi-val">'+historieMonat+'</div><div class="kpi-sub">Werkstatt-Einträge</div></div>';
  }
  _dashRecompute();

  // ── TAB SWITCH ───────────────────────────────────────────────
  function showTab(name){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name);});
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name);});
  }
  document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){showTab(b.dataset.tab);});});
  // Delegation statt Direkt-Binding: die KPI-Karten werden bei jedem
  // _dashRecompute() neu gerendert (innerHTML) — direkte Listener gingen
  // dabei verloren.
  (function(){
    var kpiRowEl=document.getElementById('kpiRow');
    if(kpiRowEl)kpiRowEl.addEventListener('click',function(ev){
      var c=ev.target&&ev.target.closest?ev.target.closest('.kpi-card[data-tab]'):null;
      if(!c)return;
      showTab(c.dataset.tab);
      window.scrollTo({top:document.querySelector('.tabs').offsetTop-60,behavior:'smooth'});
    });
  })();

  // ── FILTER STATE ─────────────────────────────────────────────
  var _dashState={query:'',onlyFaellig:false};
  function _applyDashFilter(list){
    var q=_dashState.query.trim().toLowerCase();
    return list.filter(function(v){
      if(_dashState.onlyFaellig){
        var s=daysUntil(nextServiceDate(v));
        var m=daysUntil(v.mfk);
        var faellig=(s!==null&&s<=30)||(m!==null&&m<=30);
        if(!faellig)return false;
      }
      if(q){
        var hay=((v.plate||'')+' '+(v.model||'')+' '+(v.nr||'')+' '+(v.driver||'')+' '+(v.dept||'')).toLowerCase();
        if(hay.indexOf(q)<0)return false;
      }
      return true;
    });
  }

  // ── RENDER: ÜBERSICHT ────────────────────────────────────────
  function renderUebersicht(){
    var box=document.getElementById('tab-uebersicht');
    if(!myVehicles.length){
      box.innerHTML='<div class="empty"><div class="empty-ico">🚗</div>Aktuell sind dir keine Fahrzeuge zugewiesen. Sobald ein Magaziner deine Werkstatt einem Fahrzeug zuweist, erscheinen sie hier.</div>';
      return;

    var bar=''+
      '<div class="dash-toolbar">'+
        '<input type="search" id="dashSearch" placeholder="🔍 Suche: Plate, Modell, Nr., Fahrer …" value="'+esc(_dashState.query)+'" />'+
        '<label class="dash-toggle"><input type="checkbox" id="dashOnlyFaellig"'+(_dashState.onlyFaellig?' checked':'')+'/> nur anstehend / überfällig</label>'+
      '</div>';
    var filtered=_applyDashFilter(myVehicles);
    var sorted=filtered.slice().sort(function(a,b){return vehicleUrgency(a)-vehicleUrgency(b);});

  function _openDefects(v){
    if(!Array.isArray(v.events))return [];
    return v.events.filter(function(e){return e && e.type==='defekt' && !e.resolved;});
  }
  function cardHtml(v){
    var s=daysUntil(nextServiceDate(v));
    var m=daysUntil(v.mfk);
    var defects=_openDefects(v);
    var hasDefect=defects.length>0;
    var minDays=Math.min.apply(null,[s,m].filter(function(x){return x!==null;}).concat([Infinity]));
    var statusCls=hasDefect?'red':(isFinite(minDays)?(minDays<0?'red':minDays<=7?'red':minDays<=30?'amber':'green'):'green');
    var sBadge=s!==null?dueBadge(s):null;
    var mBadge=m!==null?dueBadge(m):null;
    var html='<div class="fz-card"><div class="fz-status-bar '+statusCls+'"></div>';
    if(hasDefect){
      html+='<div style="margin:-6px -16px 4px;padding:8px 16px;background:var(--red-bg);border-bottom:1.5px solid #fecaca;color:var(--red);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px"><span>🚨</span>'+defects.length+' offene'+(defects.length>1?' Defektmeldungen':' Defektmeldung')+'</div>';
    }
    html+='<div class="fz-card-hd"><div class="fz-icon">🚗</div><div style="flex:1;min-width:0">';
    html+='<div class="fz-name">'+esc(v.model||'Fahrzeug')+'</div>';
    html+='<div class="fz-plate">'+esc(v.plate||'—')+(v.year?' · '+esc(v.year):'')+'</div>';
    html+='</div>';
    if(v.status==='service'){
      html+='<span style="font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:#ffedd5;color:#7c2d12;border:1px solid #fed7aa;white-space:nowrap">🏭 In der Garage</span>';
    }
    html+='</div>';
    if(hasDefect){
      var d0=defects[0];
      html+='<div style="font-size:12px;color:var(--red);background:var(--red-bg);padding:6px 10px;border-radius:6px"><b>Letzter Defekt:</b> '+esc((d0.detail||d0.label||'').slice(0,120))+'</div>';
    }
    html+='<div class="fz-meta">';
    html+='<div><b>km-Stand:</b> '+fmtKm(v.km)+' <button class="km-mini-btn" onclick="_dashOpenKmEdit(\''+esc(v.id)+'\')">✏ km</button></div>';
    html+='<div><b>Letzter Service:</b> '+fmtDate(v.lastService)+'</div>';
    if(sBadge)html+='<div><b>Nächster Service:</b> <span class="fz-due-pill '+sBadge.cls+'">'+sBadge.label+'</span></div>';
    if(mBadge)html+='<div><b>MFK:</b> <span class="fz-due-pill '+mBadge.cls+'">'+mBadge.label+'</span></div>';
    var fups=openFollowUps(v);
    if(fups.length){
      var soonest=fups.slice().sort(function(a,b){return (a.dueDate||'').localeCompare(b.dueDate||'');})[0];
      var fDays=daysUntil(soonest.dueDate);
      var fBadge=fDays!==null?dueBadge(fDays):null;
      html+='<div><b>📅 Folge-Termin:</b> '+esc((soonest.beschreibung||'').slice(0,40))+(fBadge?' <span class="fz-due-pill '+fBadge.cls+'">'+fBadge.label+'</span>':'')+'</div>';
    }
    html+='</div>';
    html+='<div class="fz-actions">';
    html+='<a class="fz-act primary" href="if_fahrzeug.html?service='+esc(v.id)+'">🛠 Service erfassen</a>';
    if(v.status==='service'){
      html+='<button class="fz-act" style="cursor:pointer;font-family:inherit" onclick="_dashGarageAus(\''+esc(v.id)+'\')">✓ Ausbuchen</button>';
    } else {
      html+='<button class="fz-act" style="cursor:pointer;font-family:inherit" onclick="_dashGarageEin(\''+esc(v.id)+'\')">🏭 Einbuchen</button>';
    }
    html+='<a class="fz-act" href="if_fahrzeug.html?view='+esc(v.id)+'">Details →</a>';
    html+='</div></div>';
    return html;
  }

  // ── RENDER: HISTORIE ─────────────────────────────────────────
  var ART_LABELS={service:'🛠 Service',reparatur:'🔧 Reparatur',mfk:'📋 MFK',pneuwechsel:'🛞 Pneuwechsel',sonstiges:'• Sonstiges'};

    var box=document.getElementById('tab-historie');

      if(!Array.isArray(v.serviceHistorie))return;

  // ── SPEICHERN / LOGGING / NOTIFIKATION ───────────────────────
  // Einzelnes Fahrzeug sichern: lokalen Cache aktualisieren + genau EINE
  // Cloud-Row (GemaSync.saveRecord) — vorher schrieb das Dashboard den
  // ganzen Bestand als Blob an der per-Record-Pipeline vorbei.
  function _dashSaveVehicle(v){
    try{
      var all=_dashReadVehicles().map(function(x){return x.id===v.id?v:x;});
      localStorage.setItem('gema_vehicles',JSON.stringify(all));
    }catch(e){}
    if(typeof GemaSync!=='undefined'&&GemaSync.saveRecord){
      GemaSync.saveRecord('fahrzeugmanagement','vehicle:'+v.id,v).catch(function(e){
        alert('Cloud-Speichern fehlgeschlagen — bitte Verbindung prüfen.');
      });
    } else if(typeof _GemaDB!=='undefined'&&_GemaDB.save){
      try{_GemaDB.save('gema_vehicles',JSON.stringify(vehicles));}catch(e){}
    }
  }
  // Aktivitätslog — Eintrag gehört zur Org des FAHRZEUGS (Auftraggeber),
  // damit der Magaziner ihn in seinem org-gefilterten Log sieht.
  function _dashLog(aktion,beschreibung,v){
    try{
      if(typeof GemaActivityLog==='undefined')return;
      GemaActivityLog.log({modul:'fahrzeug',orgId:v.orgId||undefined,modulRecordId:v.id,modulRecordName:v.plate||v.model||v.id,aktion:aktion,beschreibung:beschreibung||''});
    }catch(e){}
  }
  function _dashNotifyMagaziner(v,eventKey,typ,titel,text){
    try{
      if(typeof GemaNotify==='undefined')return;
      GemaNotify.push({eventKey:eventKey,empfaengerRoleId:'role_magaziner',empfaengerOrgId:v.orgId||'',modul:'fahrzeug',typ:typ,titel:titel,text:text,link:'if_fahrzeug.html?view='+v.id});
    }catch(e){}
  }
  function _dashRerender(){_dashRecompute();renderUebersicht();renderAnstehend();renderHistorie();}

  // ── QUICK KM UPDATE ──────────────────────────────────────────
  window._dashOpenKmEdit=function(vid){
    var v=vehicles.find(function(x){return x.id===vid;});
    if(!v)return;
    var aktuell=v.km?String(v.km):'';
    var neu=window.prompt('Neuen km-Stand eintragen für '+(v.plate||v.model||'Fahrzeug')+'\nAktuell: '+(aktuell||'—'),aktuell);
    if(neu===null)return; // abgebrochen
    neu=neu.trim().replace(/[^0-9]/g,'');
    if(!neu){alert('Ungültige Eingabe.');return;}
    var neuNum=parseInt(neu,10);
    var alt=parseInt(v.km||'0',10);
    if(neuNum<alt){
      if(!window.confirm('Achtung: Neuer km-Stand ('+neuNum.toLocaleString('de-CH')+') ist tiefer als der bisherige ('+alt.toLocaleString('de-CH')+'). Trotzdem speichern?'))return;
    }
    v.km=String(neuNum);
    v.kmUpdatedAt=new Date().toISOString();
    _dashSaveVehicle(v);
    _dashLog('km_update','km-Stand aktualisiert: '+(alt?alt.toLocaleString('de-CH')+' → ':'')+neuNum.toLocaleString('de-CH')+' km',v);
    _dashRerender();
  };

  // ── GARAGE EIN-/AUSBUCHEN ────────────────────────────────────
  // Einbuchen setzt den bestehenden Status «Im Service» ('service') +
  // Vermerk; Ausbuchen zurück auf «Aktiv». Sind Defekte offen, verlangt
  // das Ausbuchen zuerst die Reparatur-Doku (Service-Eintrag Art
  // «Reparatur», Defekte werden als behoben markiert).
  function _openDefectsOf(v){return (v.events||[]).filter(function(e){return e&&e.type==='defekt'&&!e.resolved;});}
  function _dashAddEvent(v,type,label,detail){
    if(!Array.isArray(v.events))v.events=[];
    v.events.unshift({type:type,date:new Date().toISOString(),label:label,detail:detail||''});
  }
  window._dashGarageEin=function(vid){
    var v=vehicles.find(function(x){return x.id===vid;});if(!v)return;
    var grund=window.prompt('Fahrzeug «'+(v.plate||v.model||'')+'» in der Garage einbuchen.\nGrund (optional):','');
    if(grund===null)return;
    var now=new Date().toISOString();
    v.status='service';
    // Einbuchungs-Status in v.garageStatus — v.garage ist der Garage-NAME
    // (String) aus dem Fahrzeug-Formular und bleibt erhalten.
    if(typeof v.garage==='object')v.garage=(v.garage&&v.garage.werkstatt)||'';
    v.garageStatus={eingebuchtAm:now,eingebuchtVonUserId:me.id||'',eingebuchtVonName:me.name||me.username||'',werkstatt:orgName||'',grund:(grund||'').trim()};
    _dashAddEvent(v,'garage','In Garage eingebucht',(grund||'').trim());
    _dashSaveVehicle(v);
    _dashLog('garage_ein','In Garage eingebucht'+(grund?' · '+grund.trim().slice(0,80):''),v);
    _dashNotifyMagaziner(v,'fahrzeug_garage','info','🏭 In Garage: '+(v.plate||v.model||'Fahrzeug'),(me.name||'Garagist')+(grund?' · '+grund.trim().slice(0,100):''));
    _dashRerender();
  };
  window._dashGarageAus=function(vid){
    var v=vehicles.find(function(x){return x.id===vid;});if(!v)return;
    var offen=_openDefectsOf(v);
    if(offen.length){ _dashOpenRepDoku(vid); return; }
    if(!window.confirm('Fahrzeug «'+(v.plate||v.model||'')+'» aus der Garage ausbuchen (Status wieder «Aktiv»)?'))return;
    _dashFinishAusbuchen(v,'');
  };
  function _dashFinishAusbuchen(v,repText){
    var now=new Date().toISOString();
    v.status='aktiv';
    if(typeof v.garage==='object'&&v.garage){v.garageStatus=v.garage;v.garage=v.garageStatus.werkstatt||'';} // Legacy-Migration
    if(v.garageStatus){v.garageStatus.ausgebuchtAm=now;v.garageStatus.ausgebuchtVonName=me.name||me.username||'';}
    _dashAddEvent(v,'garage','Aus Garage ausgebucht','');
    _dashSaveVehicle(v);
    _dashLog('garage_aus','Aus Garage ausgebucht',v);
    _dashNotifyMagaziner(v,'fahrzeug_garage','erfolg','✓ Aus Garage: '+(v.plate||v.model||'Fahrzeug'),(me.name||'Garagist')+' hat das Fahrzeug ausgebucht — wieder verfügbar.'+(repText?' · '+repText.slice(0,80):''));
    _dashRerender();
  }
  // Reparatur-Doku-Overlay: «Was war das Problem / was wurde gemacht?»
  // → Service-Eintrag (Art Reparatur) + offene Defekte als behoben.
  window._dashOpenRepDoku=function(vid){
    var v=vehicles.find(function(x){return x.id===vid;});if(!v)return;
    var offen=_openDefectsOf(v);
    var defListe=offen.map(function(e){return '<li style="margin:2px 0">'+esc((e.detail||e.label||'').slice(0,100))+'</li>';}).join('');
    var old=document.getElementById('dashRepOv');if(old)old.remove();
    var ov=document.createElement('div');ov.id='dashRepOv';
    ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)">'
      +'<h3 style="margin:0 0 4px;font-size:17px;font-weight:800;color:#065f46">🔧 Reparatur dokumentieren & ausbuchen</h3>'
      +'<div style="font-size:12px;color:#64748b;margin-bottom:12px">'+esc(v.model||'')+' · '+esc(v.plate||'')+'</div>'
      +(defListe?'<div style="font-size:12px;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;margin-bottom:12px"><strong>Offene Defekte:</strong><ul style="margin:4px 0 0;padding-left:18px">'+defListe+'</ul></div>':'')
      +'<label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Was war das Problem / was wurde gemacht? *</label>'
      +'<textarea id="dashRepText" rows="4" placeholder="z.B. Anlasser defekt — ersetzt, Probefahrt i.O." style="width:100%;padding:10px 14px;border:1.5px solid #e2e7f0;border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:12px;resize:vertical"></textarea>'
      +'<div style="display:flex;gap:10px;margin-bottom:12px">'
      +'<div style="flex:1"><label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">km-Stand</label>'
      +'<input type="text" inputmode="numeric" id="dashRepKm" value="'+esc(v.km||'')+'" style="width:100%;padding:10px 14px;border:1.5px solid #e2e7f0;border-radius:10px;font-size:14px;font-family:inherit"/></div>'
      +'<div style="flex:1"><label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Kosten (CHF, optional)</label>'
      +'<input type="text" inputmode="decimal" id="dashRepKosten" placeholder="z.B. 480.00" style="width:100%;padding:10px 14px;border:1.5px solid #e2e7f0;border-radius:10px;font-size:14px;font-family:inherit"/></div>'
      +'</div>'
      +'<div style="display:flex;gap:8px;justify-content:flex-end">'
      +'<button onclick="document.getElementById(\'dashRepOv\').remove()" style="padding:9px 18px;border-radius:8px;border:1px solid #e2e7f0;background:#fff;cursor:pointer;font-weight:600;font-family:inherit">Abbrechen</button>'
      +'<button onclick="_dashSaveRepDoku(\''+esc(vid)+'\')" style="padding:9px 18px;border-radius:8px;border:none;background:#065f46;color:#fff;cursor:pointer;font-weight:700;font-family:inherit">✓ Speichern & ausbuchen</button>'
      +'</div></div>';
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
    document.body.appendChild(ov);
  };
  window._dashSaveRepDoku=function(vid){
    var v=vehicles.find(function(x){return x.id===vid;});if(!v)return;
    var text=(document.getElementById('dashRepText').value||'').trim();
    if(!text){alert('Bitte beschreiben, was das Problem war / gemacht wurde.');return;}
    var km=(document.getElementById('dashRepKm').value||'').trim().replace(/[^0-9]/g,'');
    var kosten=(document.getElementById('dashRepKosten').value||'').trim();
    var now=new Date().toISOString();
    var heute=now.split('T')[0];
    if(!Array.isArray(v.serviceHistorie))v.serviceHistorie=[];
    v.serviceHistorie.push({
      datum:heute, km:km||'', art:'reparatur', beschreibung:text, kosten:kosten||'',
      werkstatt:orgName||'', erledigtVonUserId:me.id||'', erledigtVonName:me.name||me.username||'',
      erstelltAm:now
    });
    if(!v.lastService||heute>v.lastService)v.lastService=heute;
    if(km){
      var kmNum=parseInt(km,10)||0;
      if(!v.lastServiceKm||kmNum>parseInt(v.lastServiceKm,10))v.lastServiceKm=km;
      if(!v.km||kmNum>parseInt(v.km,10)){v.km=km;v.kmUpdatedAt=now;}
    }
    var changed=0;
    (v.events||[]).forEach(function(e){
      if(e&&e.type==='defekt'&&!e.resolved){
        e.resolved=true;e.resolvedAt=now;
        e.resolvedByUserId=me.id||'';e.resolvedByName=me.name||me.username||'';
        e.resolvedNote=text.slice(0,200);
        changed++;
      }
    });
    _dashAddEvent(v,'reparatur','Reparatur: '+text.slice(0,60),text+(kosten?' | CHF '+kosten:''));
    _dashLog('reparatur','Reparatur dokumentiert: '+text.slice(0,100)+(kosten?' · CHF '+kosten:''),v);
    if(changed)_dashLog('defekt_erledigt',changed+' Defekt'+(changed>1?'e':'')+' behoben',v);
    _dashNotifyMagaziner(v,'fahrzeug_service_erledigt','erfolg','🔧 Reparatur erledigt: '+(v.plate||v.model||'Fahrzeug'),text.slice(0,140)+(changed?' · '+changed+' Defekt'+(changed>1?'e':'')+' behoben':''));
    var ovEl=document.getElementById('dashRepOv');if(ovEl)ovEl.remove();
    _dashFinishAusbuchen(v,text);
  };

  // ── INIT ─────────────────────────────────────────────────────
  renderUebersicht();
  renderAnstehend();
  renderHistorie();
  renderProfil();

  // Fahrzeug-Pool frisch aus der Cloud ziehen (per-Record) — der lokale
  // Cache kann veraltet sein (Aenderungen des Magaziners auf anderem
  // Geraet). Danach alles neu berechnen und rendern.
  if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection){
    GemaSync.bindCollection('fahrzeugmanagement','gema_vehicles','vehicle:','id').then(function(){
      vehicles=_dashReadVehicles();
      _dashRerender();
    }).catch(function(){});
  }

  // URL-Param: ?tab=anstehend o.ä.
  try{
    var p=new URLSearchParams(location.search);
    var t=p.get('tab');
    if(t)showTab(t);
  }catch(e){}

  // Logout
  var logoutBtn=document.getElementById('logoutBtn');
  if(logoutBtn)logoutBtn.addEventListener('click',function(){
    try{if(GemaAuth.logout)GemaAuth.logout();}catch(e){}
    location.href='sys_login.html';
  });
})();
</script>

<script>
// Feedback-Knopf: OHNE init() injiziert GemaFeedback sein Overlay nie und
// der Knopf tut nichts (CLAUDE.md «Feedback-Button-Regel»).
document.addEventListener('DOMContentLoaded',function(){try{GemaFeedback.init('garagist_dashboard','Werkstatt-Dashboard');}catch(e){}});
</script>
</body>
