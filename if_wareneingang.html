<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-font-smoothing:antialiased}
::placeholder{color:#cbd5e1}

/* ── Nav ── */
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e0e4ef;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.g-nav-inner{padding:0 16px;height:52px;display:flex;align-items:center}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:12px;flex-shrink:0}
.g-nav-mark{height:28px;display:flex;align-items:center}
.g-nav-bc{display:flex;align-items:center;gap:3px;flex:1;min-width:0;overflow:hidden}
.g-nav-bc .bc-cat{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;white-space:nowrap}
.g-nav-bc .bc-sep{font-size:12px;color:#94a3b8;padding:0 2px}
.g-nav-bc .bc-cur{font-size:12px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.gema-feedback-btn{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#dc2626;cursor:pointer}

/* ── Page + Hero ── */
.pg{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a5f 55%,#0c4a2e);border-radius:20px;padding:20px 22px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 90% -20%,rgba(56,189,248,.22),transparent);pointer-events:none}
.hero-in{display:flex;align-items:center;gap:13px;position:relative}
.hero-ic{width:46px;height:46px;flex:none;border-radius:13px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:24px}
.hero-title{font-size:21px;font-weight:900;letter-spacing:-.3px}
.hero-sub{font-size:12.5px;color:#cbd5e1;margin-top:3px;max-width:720px;line-height:1.45}

/* ── Tabs ── */
.tb{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.vtab{background:#fff;border:1.5px solid #e2e8f0;border-radius:11px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;color:#475569;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.vtab.on{background:#0f172a;border-color:#0f172a;color:#fff}
.vtab .cnt{font-size:11px;background:rgba(148,163,184,.25);border-radius:999px;padding:1px 7px;font-weight:800}
.vtab.on .cnt{background:rgba(255,255,255,.22)}

/* ── Cards / controls ── */
.card{background:#fff;border:1px solid #e6eaf2;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h3{font-size:14.5px;font-weight:800;margin-bottom:4px}
.card .desc{font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.45}
.btn{background:#fff;border:1.5px solid #dbe2ee;border-radius:10px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;color:#334155;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#94a3b8}
.btn.pri{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.pri:hover{background:#0e6a63}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.ghost{background:transparent;border-color:transparent;color:#64748b}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#64748b;margin:0 0 5px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid #dbe2ee;border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;color:#0f172a;background:#fff}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
textarea.in{resize:vertical;min-height:64px;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.col{flex:1;min-width:150px}
.hint{font-size:11.5px;color:#94a3b8;line-height:1.4}
.warnbox{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:9px 12px;font-size:12px;color:#92400e;margin:8px 0}
.infobox{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 12px;font-size:12px;color:#1e40af;margin:8px 0}

/* ── Tables ── */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gt{border-collapse:collapse;width:100%;min-width:520px}
table.gt th{background:#f8fafc;text-align:left;padding:8px 9px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#64748b;border-bottom:1.5px solid #e2e8f0;white-space:nowrap}
table.gt td{padding:8px 9px;font-size:13px;border-bottom:1px solid #eef2f7;vertical-align:middle}
table.gt tr:hover td{background:#fafcff}
table.gt td.num,table.gt th.num{text-align:right;white-space:nowrap}
table.gt input.cell,table.gt select.cell{width:100%;border:1px solid #e2e8f0;border-radius:7px;padding:6px 7px;font:inherit;font-size:12.5px;background:#fff}
table.gt input.cell.mini{max-width:74px;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap;border:1px solid}
.b-offen{color:#b45309;background:#fffbeb;border-color:#fcd34d}
.b-teil{color:#2563eb;background:#eff6ff;border-color:#bfdbfe}
.b-ok{color:#16a34a;background:#f0fdf4;border-color:#bbf7d0}
.b-komplett{color:#16a34a;background:#f0fdf4;border-color:#bbf7d0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569}
.tag-flag{color:#dc2626;font-weight:800}

/* ── Overview list ── */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar .in{width:auto;flex:0 0 auto;font-size:12.5px;padding:7px 10px}
.filterbar .search{flex:1;min-width:160px}
.lief-card{border:1px solid #e6eaf2;border-radius:14px;padding:13px 14px;margin-bottom:10px;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.12s}
.lief-card:hover{border-color:#0f766e;box-shadow:0 3px 12px rgba(15,118,110,.09)}
.lief-card .lc-ic{width:40px;height:40px;border-radius:11px;background:#ecfdf5;color:#0f766e;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.lief-card .lc-main{flex:1;min-width:0}
.lief-card .lc-t{font-size:14px;font-weight:800}
.lief-card .lc-meta{font-size:12px;color:#64748b;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.lief-card .lc-r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e6eaf2;border-radius:14px;padding:12px 13px;cursor:pointer}
.kpi.on{border-color:#0f766e;background:#f0fdfa}
.kpi .k-n{font-size:22px;font-weight:900;line-height:1}
.kpi .k-l{font-size:11px;color:#64748b;margin-top:4px;font-weight:700}

/* ── Stepper ── */
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:9px 11px;border-radius:11px;border:1.5px solid #e2e8f0;background:#fff;font-size:12px;font-weight:700;color:#94a3b8;display:flex;gap:8px;align-items:center}
.step.on{border-color:#0f766e;color:#0f766e;background:#f0fdfa}
.step.done{color:#16a34a;border-color:#bbf7d0}
.step .sn{width:20px;height:20px;border-radius:999px;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:none}
.step.on .sn{background:#0f766e;color:#fff}
.step.done .sn{background:#16a34a;color:#fff}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal{background:#fff;border-radius:18px;width:100%;max-width:760px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:17px;font-weight:900;margin-bottom:3px}
.modal .msub{font-size:12.5px;color:#64748b;margin-bottom:14px}
.modal-x{float:right;border:none;background:#f1f5f9;width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;color:#475569}

/* ── Label preview ── */
.lblbox{border:1px dashed #cbd5e1;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);margin:0 auto;overflow:hidden;position:relative;display:flex;flex-direction:column}
.lblbox .lb-pad{flex:1;display:flex;flex-direction:column;padding:6px 7px;overflow:hidden}
.lblbox .lb-eye{font-size:10px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lblbox .lb-addrwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;min-height:0}
.lblbox .lb-addr{font-weight:900;line-height:1.05;color:#0f172a}
.lblbox .lb-city{font-size:11px;font-weight:700;color:#334155;margin-top:2px;text-align:center;line-height:1.1;word-break:break-word}
.lblbox .lb-art{font-size:11px;color:#1e293b;margin-top:3px;text-align:center;line-height:1.2;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lblbox .lb-foot{display:flex;justify-content:space-between;gap:6px;font-size:8.5px;color:#64748b;font-weight:700;border-top:1px solid #eef2f7;padding-top:3px;margin-top:3px}
.previewwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:#f8fafc;border-radius:12px}

.mut{color:#94a3b8}
.empty{text-align:center;padding:44px 16px;color:#94a3b8}
.empty .em-ic{font-size:40px;margin-bottom:8px}
.spin{width:34px;height:34px;margin:30px auto;display:block}
#weToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:12000;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90vw;text-align:center}
#weToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pastebox{border:2px dashed #cbd5e1;border-radius:12px;padding:16px;min-height:96px;background:#fbfdff;font-size:13px;color:#334155;outline:none}
.pastebox:focus{border-color:#0f766e;background:#f0fdfa}
.assist-th{cursor:pointer}
@media print{.g-nav,.no-print{display:none!important}}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero-sub{display:none}
  .lief-card{flex-wrap:wrap}
}
</style>

var _tab='ueber';

/* ══════════════════ Utils ══════════════════ */
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function _now(){return new Date().toISOString();}
function uid(p){return (p||'we')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function num(v){if(v==null)return 0;var n=parseInt(String(v).replace(/[^\d\-]/g,''),10);return isNaN(n)?0:n;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fD(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d))return E(iso);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
function toast(m){var t=document.getElementById('weToast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}
function $(id){return document.getElementById(id);}

/* ══════════════════ Auth / Rechte ══════════════════ */
function user(){try{return GemaAuth.getCurrentUser();}catch(e){return null;}}
function userName(){var u=user();return u?(u.name||u.username||''):'';}
function org(){try{return GemaAuth.getCurrentOrg&&GemaAuth.getCurrentOrg();}catch(e){return null;}}
function orgId(){var o=org();return (o&&o.id)||(user()&&user().orgId)||'';}
function canEdit(){try{return !!GemaAuth.can('write','wareneingang');}catch(e){return false;}}

/* ══════════════════ Einstellungen (org.settings.wareneingang) ══════════════════ */
function settings(){
  var o=org();var s=(o&&o.settings&&o.settings.wareneingang)||{};
  return {
    labelW:parseFloat(s.labelW)||49,
    labelH:parseFloat(s.labelH)||23,
    showArtikel:s.showArtikel!==false,
    numberLabels:s.numberLabels!==false,
    // Projektquelle: 'beides' (flexibel, Default) | 'gema' (nur GEMA-Objekte
    // referenzieren) | 'frei' (nur freie Adressen, unabhängig von GEMA)
    projektModus:(s.projektModus==='gema'||s.projektModus==='frei')?s.projektModus:'beides',
    standardObjektId:s.standardObjektId||'',
    lager:s.lager||{name:'Lager / kein Projekt',strasse:'',plz:'',ort:''}
  };
}
function saveSettings(patch){
  var o=org();if(!o){toast('Keine Firma zugeordnet');return false;}
  var cur=(o.settings&&o.settings.wareneingang)||{};
  var next=Object.assign({},cur,patch);
  try{GemaAuth.updateOrgSettings(o.id,{wareneingang:next});return true;}catch(e){toast('Speichern fehlgeschlagen');return false;}
}

/* ══════════════════ Pool-Zugriff (per-Record via GemaSync) ══════════════════ */
function poolRead(pool){
  try{if(typeof GemaSync!=='undefined'&&GemaSync.getCached)return GemaSync.getCached(pool)||[];}catch(e){}
  try{var a=JSON.parse(localStorage.getItem(pool)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}
}
function poolWrite(pool,arr){try{localStorage.setItem(pool,JSON.stringify(arr));}catch(e){}}
function saveRec(pool,prefix,rec){
  var arr=poolRead(pool);var i=-1;for(var k=0;k<arr.length;k++){if(arr[k]&&arr[k].id===rec.id){i=k;break;}}
  if(i>=0)arr[i]=rec;else arr.unshift(rec);
  poolWrite(pool,arr);
  // Cloud-Fehler NICHT stumm schlucken: saveRecord hat keinen Outbox-Support —
  // ein gescheiterter Push bliebe nur lokal und wuerde beim naechsten
  // Cloud-Pull ueberschrieben. Der User muss es sehen.
  try{if(typeof GemaSync!=='undefined'&&GemaSync.saveRecord)GemaSync.saveRecord(MODULE,prefix+rec.id,rec).catch(function(){toast('⚠ Nicht in der Cloud gespeichert — Verbindung prüfen und erneut speichern');});}catch(e){}
  return rec;
}
function delRec(pool,prefix,id){
  poolWrite(pool,poolRead(pool).filter(function(x){return x&&x.id!==id;}));
  try{if(typeof GemaSync!=='undefined'&&GemaSync.deleteRecord)GemaSync.deleteRecord(MODULE,prefix+id).catch(function(){toast('⚠ Löschung nicht in die Cloud übertragen — Verbindung prüfen');});}catch(e){}
}

/* ══════════════════ Domänen-Accessoren ══════════════════ */
function lieferungen(){
  return poolRead(POOL_L).filter(function(l){return l&&l.orgId===orgId();})
    .sort(function(a,b){return (b.importDatum||'').localeCompare(a.importDatum||'');});
}
function liefById(id){return poolRead(POOL_L).find(function(l){return l&&l.id===id;})||null;}

function posStatus(p){var m=num(p.menge),e=num(p.eingegangenMenge);if(e<=0)return 'offen';if(m>0&&e>=m)return 'eingegangen';return 'teilweise';}
function liefStatus(l){
  var ps=(l.positionen||[]).map(posStatus);if(!ps.length)return 'offen';
  if(ps.every(function(s){return s==='eingegangen';}))return 'komplett';
  if(ps.some(function(s){return s!=='offen';}))return 'teilweise';
  return 'offen';
}

/* Projekte = GemaObjekte (Kernprinzip: Daten einmal erfassen) */
function projekte(){
  try{return (GemaObjekte.getAll()||[]).map(function(o){return {objektId:o.id,name:o.name||'Ohne Name',strasse:o.strasse||'',plz:o.plz||'',ort:o.ort||''};});}
  catch(e){return [];}
}
function lagerProjekt(){var l=settings().lager||{};return {objektId:'',istLager:true,name:l.name||'Lager / kein Projekt',strasse:l.strasse||'',plz:l.plz||'',ort:l.ort||''};}
// Lager-Position: wird im Wareneingang kontrolliert, aber NICHT als Etikette gedruckt.
function isLagerProj(p){
  if(!p||p.objektId)return false;
  if(p.istLager)return true;
  // Legacy (ohne Flag): kein Objekt + keine echte Adresse ODER Name = Lager-Name
  var lag=lagerProjekt();
  if(!(p.strasse||'').trim()&&!(p.ort||'').trim())return true;
  if((p.name||'')===lag.name&&!(p.strasse||'').trim())return true;
  return false;
}
function projModus(){return settings().projektModus;}       // 'beides' | 'gema' | 'frei'
function gemaObjekteAn(){return projModus()!=='frei';}       // dürfen GEMA-Objekte referenziert werden?
function freieAdrAn(){return projModus()!=='gema';}          // dürfen freie Adressen erfasst werden?
function defaultProjekt(){
  var s=settings();
  // Nur wenn GEMA-Objekte erlaubt sind: Standard-Objekt referenzieren.
  if(gemaObjekteAn()&&s.standardObjektId){var p=projekte().find(function(x){return x.objektId===s.standardObjektId;});if(p)return p;}
  return lagerProjekt();
}
function projAdrLines(p){
  if(!p)return [];
  var l=[];if(p.strasse)l.push(p.strasse);var po=[p.plz,p.ort].filter(Boolean).join(' ');if(po)l.push(po);
  return l;
}
function projLabel(p){
  if(!p)return '—';
  var a=projAdrLines(p);
  return p.name+(a.length?' · '+a.join(', '):'');
}

/* Lieferanten = KOMPLETT FREI (kein Produkt-/Lieferantenkatalog). Als
   Autocomplete dient nur die eigene Historie dieses Moduls. */
function lieferantHistory(){
  var seen={},out=[];
  poolRead(POOL_L).forEach(function(l){var f=(l&&l.lieferantFirma||'').trim();if(f&&l.orgId===orgId()&&!seen[f.toLowerCase()]){seen[f.toLowerCase()]=1;out.push(f);}});
  poolRead(POOL_M).forEach(function(m){var f=(m&&m.lieferantFirma||'').trim();if(f&&m.orgId===orgId()&&!seen[f.toLowerCase()]){seen[f.toLowerCase()]=1;out.push(f);}});
  return out.sort(function(a,b){return a.localeCompare(b);});
}
function lieferantKey(firma){return (firma||'').trim().toLowerCase();}

/* Mappings (per Lieferant-Name + Quelle) */
function mappings(){return poolRead(POOL_M).filter(function(m){return m&&m.orgId===orgId();});}
function findMapping(firma,quelle){
  var key=lieferantKey(firma);if(!key)return null;
  return mappings().find(function(m){
    if(m.quelle!==quelle)return false;
    return m.lieferantKey===key || lieferantKey(m.lieferantFirma)===key;   // key + Legacy-Firma-Match
  })||null;
}
function saveMapping(firma,quelle,config){
  var ex=findMapping(firma,quelle);
  var rec=ex||{id:uid('wemap'),orgId:orgId(),lieferantKey:lieferantKey(firma),lieferantFirma:firma,quelle:quelle};
  rec.lieferantKey=lieferantKey(firma);
  rec.lieferantFirma=firma||rec.lieferantFirma;
  rec.config=config;rec.aktualisiert=_now();
  saveRec(POOL_M,PREFIX_M,rec);
  return rec;
}

/* ══════════════════ Tabs ══════════════════ */
window.weTab=function(t){
  _tab=t;
  ['ueber','import','etikette','einst'].forEach(function(n){
    var pane=$('tab_'+n);if(pane)pane.style.display=(n===t)?'':'none';
  });
  document.querySelectorAll('.vtab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===t);});
  if(t==='ueber')renderUeber();
  if(t==='import')renderImport();
  if(t==='etikette')renderEtikette();
  if(t==='einst')renderEinst();
};

/* ══════════════════ TAB: Übersicht (Sammelpool + Wareneingangsmodus) ══════════════════ */
var _fStatus='',_fLief='',_fProj='',_fSearch='',_fSort='datum';
function renderUeber(){
  var host=$('tab_ueber');if(!host)return;
  var all=lieferungen();
  $('cntUeber').textContent=all.length;
  if(!_cloudLoaded&&!all.length){host.innerHTML=spinnerHtml('Lieferungen werden geladen …');return;}

  // KPIs
  var cOffen=0,cTeil=0,cKomplett=0;
  all.forEach(function(l){var s=liefStatus(l);if(s==='offen')cOffen++;else if(s==='teilweise')cTeil++;else cKomplett++;});
  var kpis='<div class="kpis">'
    +kpi('all',all.length,'Lieferungen')
    +kpi('offen',cOffen,'Offen')
    +kpi('teilweise',cTeil,'Teilweise')
    +kpi('komplett',cKomplett,'Komplett')
    +'</div>';

  // Filterbar
  var liefOpts=uniqueLief(all).map(function(f){return '<option value="'+E(f)+'"'+(f===_fLief?' selected':'')+'>'+E(f)+'</option>';}).join('');
  var projOpts=uniqueProj(all).map(function(p){return '<option value="'+E(p)+'"'+(p===_fProj?' selected':'')+'>'+E(p)+'</option>';}).join('');
  var bar='<div class="filterbar no-print">'
    +'<input class="in search" id="fSearch" placeholder="🔍 Suche Artikel, Bestell-Nr, Projekt …" value="'+E(_fSearch)+'" oninput="weFilterSearch(this.value)">'
    +'<select class="in" id="fLief" onchange="weFilterSet(\'lief\',this.value)"><option value="">Alle Lieferanten</option>'+liefOpts+'</select>'
    +'<select class="in" id="fProj" onchange="weFilterSet(\'proj\',this.value)"><option value="">Alle Projekte</option>'+projOpts+'</select>'
    +'<select class="in" id="fSort" onchange="weFilterSet(\'sort\',this.value)">'
      +'<option value="datum"'+(_fSort==='datum'?' selected':'')+'>Neueste zuerst</option>'
      +'<option value="lief"'+(_fSort==='lief'?' selected':'')+'>Lieferant A–Z</option>'
      +'<option value="status"'+(_fSort==='status'?' selected':'')+'>Status</option>'
    +'</select>'
    +(canEdit()?'<button class="btn pri" onclick="weTab(\'import\')">＋ Import</button>':'')
    +'</div>';

  var list=applyFilters(all);
  var body;
  if(!all.length){
    body='<div class="empty"><div class="em-ic">📦</div><div style="font-weight:800;font-size:15px;color:#475569">Noch keine Lieferungen</div>'
      +'<div style="margin-top:6px">Importiere eine Bestellung aus einer eingefügten Tabelle oder einem PDF.</div>'
      +(canEdit()?'<div style="margin-top:14px"><button class="btn pri" onclick="weTab(\'import\')">⬇ Erste Lieferung importieren</button></div>':'')+'</div>';
  } else if(!list.length){
    body='<div class="empty"><div class="em-ic">🔍</div>Keine Lieferung passt zu den Filtern.</div>';
  } else {
    body=list.map(liefCardHtml).join('');
  }
  host.innerHTML=kpis+bar+'<div id="ueberList">'+body+'</div>';
}
function kpi(key,n,label){
  var on=(key==='all'&&_fStatus==='')||(key===_fStatus);
  return '<div class="kpi'+(on?' on':'')+'" onclick="weFilterStatus(\''+(key==='all'?'':key)+'\')"><div class="k-n">'+n+'</div><div class="k-l">'+label+'</div></div>';
}
function uniqueLief(arr){var s={};arr.forEach(function(l){if(l.lieferantFirma)s[l.lieferantFirma]=1;});return Object.keys(s).sort();}
function uniqueProj(arr){var s={};arr.forEach(function(l){(l.positionen||[]).forEach(function(p){if(p.projekt&&p.projekt.name)s[p.projekt.name]=1;});});return Object.keys(s).sort();}
function applyFilters(arr){
  var out=arr.filter(function(l){
    if(_fStatus&&liefStatus(l)!==_fStatus)return false;
    if(_fLief&&l.lieferantFirma!==_fLief)return false;
    if(_fProj&&!(l.positionen||[]).some(function(p){return p.projekt&&p.projekt.name===_fProj;}))return false;
    if(_fSearch){
      var hay=(l.bestellnummer+' '+l.lieferantFirma+' '+(l.positionen||[]).map(function(p){return p.artikelNr+' '+p.bezeichnung+' '+(p.projekt&&p.projekt.name||'');}).join(' ')).toLowerCase();
      if(hay.indexOf(_fSearch.toLowerCase())<0)return false;
    }
    return true;
  });
  if(_fSort==='lief')out.sort(function(a,b){return (a.lieferantFirma||'').localeCompare(b.lieferantFirma||'');});
  else if(_fSort==='status'){var ord={offen:0,teilweise:1,komplett:2};out.sort(function(a,b){return ord[liefStatus(a)]-ord[liefStatus(b)];});}
  return out;
}
window.weFilterSearch=function(v){_fSearch=v;var l=applyFilters(lieferungen());/*re-render list only*/renderUeberList(l);};
function renderUeberList(list){/* light rerender of just the list keeps focus in search */
  var cont=$('ueberList');if(!cont)return;
  if(!list.length){cont.innerHTML='<div class="empty"><div class="em-ic">🔍</div>Keine Lieferung passt zu den Filtern.</div>';return;}
  cont.innerHTML=list.map(liefCardHtml).join('');
}
window.weFilterSet=function(k,v){if(k==='lief')_fLief=v;else if(k==='proj')_fProj=v;else if(k==='sort')_fSort=v;renderUeber();};
window.weFilterStatus=function(s){_fStatus=s;renderUeber();};

function liefCardHtml(l){
  var st=liefStatus(l);
  var badge=statusBadge(st);
  var posN=(l.positionen||[]).length;
  var offenPos=(l.positionen||[]).filter(function(p){return posStatus(p)!=='eingegangen';}).length;
  var projSet={};(l.positionen||[]).forEach(function(p){if(p.projekt&&p.projekt.name)projSet[p.projekt.name]=1;});
  var projs=Object.keys(projSet);
  var projTxt=projs.length===0?'—':(projs.length===1?projs[0]:projs.length+' Projekte');
  var editBtn=canEdit()?'<button class="btn sm" title="Lieferung bearbeiten" onclick="event.stopPropagation();weEditLief(\''+l.id+'\')">✏️</button>':'';
  return '<div class="lief-card" onclick="weOpenLief(\''+l.id+'\')">'
    +'<div class="lc-ic">🚚</div>'
    +'<div class="lc-main">'
      +'<div class="lc-t">'+E(l.lieferantFirma||'Lieferant?')+(l.bestellnummer?' <span class="mut" style="font-weight:600">· '+E(l.bestellnummer)+'</span>':'')+'</div>'
      +'<div class="lc-meta"><span>📅 '+fD(l.bestelldatum||l.importDatum)+'</span><span>📍 '+E(projTxt)+'</span><span>📦 '+posN+' Position'+(posN!==1?'en':'')+'</span>'+(offenPos>0?'<span class="tag-flag">⏳ '+offenPos+' offen</span>':'')+'</div>'
    +'</div>'
    +'<div class="lc-r">'+badge+'<div style="display:flex;gap:6px;align-items:center">'+editBtn+'<span class="mut" style="font-size:11px">Details →</span></div></div>'
  +'</div>';
}
function statusBadge(s){
  if(s==='komplett'||s==='eingegangen')return '<span class="badge b-komplett">✓ '+(s==='eingegangen'?'Eingegangen':'Komplett')+'</span>';
  if(s==='teilweise')return '<span class="badge b-teil">◐ Teilweise</span>';
  return '<span class="badge b-offen">○ Offen</span>';
}
function spinnerHtml(txt){
  return '<div class="empty"><svg class="spin" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#e2e8f0" stroke-width="4"/><path d="M22 4a18 18 0 0 1 18 18" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="0.9s" repeatCount="indefinite"/></path></svg><div>'+E(txt||'Laden …')+'</div></div>';
}

/* ── Detail-Modal mit Wareneingangsmodus ── */
window.weOpenLief=function(id){
  var l=liefById(id);if(!l){toast('Lieferung nicht gefunden');return;}
  renderLiefModal(l);
};
function renderLiefModal(l){
  var ed=canEdit();
  var rows=(l.positionen||[]).map(function(p,i){
    var st=posStatus(p);
    var m=num(p.menge),e=num(p.eingegangenMenge);
    var recCtrls=ed?(
        '<div style="display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap">'
        +'<input class="cell mini" inputmode="numeric" value="'+e+'" onchange="weSetEingang(\''+l.id+'\',\''+p.id+'\',this.value)" title="eingegangene Menge">'
        +'<span class="mut" style="font-size:11px">/ '+m+'</span>'
        +'<button class="btn sm" onclick="weInc(\''+l.id+'\',\''+p.id+'\',1)" title="+1">＋1</button>'
        +'<button class="btn sm" onclick="weComplete(\''+l.id+'\',\''+p.id+'\')" title="komplett erhalten">✓ voll</button>'
        +'</div>'
      ):(e+' / '+m);
    var lag=isLagerProj(p.projekt);
    var projLine=(p.projekt&&p.projekt.name)?'<br><span class="mut" style="font-size:11px">'+(lag?'📦':'📍')+' '+E(p.projekt.name)+'</span>':'';
    return '<tr>'
      +'<td><strong>'+E(p.posNr||(i+1))+'</strong></td>'
      +'<td>'+E(p.artikelNr||'—')+'</td>'
      +'<td><strong>'+E(p.bezeichnung||'—')+'</strong>'+projLine+'</td>'
      +'<td class="num">'+recCtrls+'</td>'
      +'<td>'+statusBadge(st)+'</td>'
      +'<td class="num">'+(lag?'<span class="chip" title="Lager — keine Etikette">📦</span>':'<button class="btn sm" onclick="wePrintPos(\''+l.id+'\',\''+p.id+'\')" title="Etiketten dieser Position">🏷</button>')+'</td>'
      +'</tr>';
  }).join('');

  var head='<div class="row" style="margin-bottom:12px">'
    +infoCol('Lieferant',E(l.lieferantFirma||'—'))
    +infoCol('Bestell-Nr',E(l.bestellnummer||'—'))
    +infoCol('Bestelldatum',fD(l.bestelldatum||l.importDatum))
    +infoCol('Status',statusBadge(liefStatus(l)))
    +'</div>';
  if(l.notiz)head+='<div class="infobox">📝 '+E(l.notiz)+'</div>';

  var actions='<div class="row no-print" style="margin-top:14px;gap:8px">'
    +(ed?'<button class="btn pri" onclick="weEditLief(\''+l.id+'\')">✏️ Bearbeiten</button>':'')
    +'<button class="btn" onclick="wePrintLief(\''+l.id+'\')">🏷 Alle Etiketten drucken</button>'
    +(ed?'<button class="btn" onclick="weReceiveAll(\''+l.id+'\')">✓ Alles als eingegangen</button>':'')
    +(ed?'<button class="btn danger" onclick="weDeleteLief(\''+l.id+'\')">🗑 Löschen</button>':'')
    +'<span style="flex:1"></span>'
    +'<button class="btn" onclick="weCloseModal()">Schliessen</button>'
    +'</div>';

  showModal(
    '<button class="modal-x" onclick="weCloseModal()">✕</button>'
    +'<h2>🚚 '+E(l.lieferantFirma||'Lieferung')+'</h2>'
    +'<div class="msub">Wareneingang kontrollieren — Menge erfassen, Etiketten drucken.</div>'
    +head
    +'<div class="tblwrap"><table class="gt"><thead><tr><th title="Positionsnummer im Dokument">Pos-Nr</th><th>Art-Nr</th><th>Bezeichnung</th><th class="num">Eingegangen</th><th>Status</th><th class="num">🏷</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +actions
  ,'860px');
}
function infoCol(l,v){return '<div class="col"><label class="fl">'+l+'</label><div style="font-size:13.5px;font-weight:600">'+v+'</div></div>';}

function _updatePos(liefId,posId,fn){
  var l=liefById(liefId);if(!l)return null;
  var p=(l.positionen||[]).find(function(x){return x.id===posId;});if(!p)return null;
  fn(p);p.status=posStatus(p);
  l.status=liefStatus(l);l.updatedAt=_now();
  saveRec(POOL_L,PREFIX_L,l);
  return l;
}
window.weSetEingang=function(liefId,posId,v){var l=_updatePos(liefId,posId,function(p){var m=num(p.menge);p.eingegangenMenge=Math.min(m||999999,Math.max(0,num(v)));});if(l){renderLiefModal(l);renderUeber();}};
window.weInc=function(liefId,posId,d){var l=_updatePos(liefId,posId,function(p){var m=num(p.menge);p.eingegangenMenge=Math.min(m||999999,num(p.eingegangenMenge)+d);});if(l){renderLiefModal(l);renderUeber();}};
window.weComplete=function(liefId,posId){var l=_updatePos(liefId,posId,function(p){p.eingegangenMenge=num(p.menge);});if(l){renderLiefModal(l);renderUeber();toast('Position komplett erhalten');}};
window.weReceiveAll=function(liefId){

      +'<div class="col"><label class="fl">Bestelldatum</label><input class="in" type="date" value="'+E(l.bestelldatum)+'" oninput="weLEditHead(&#39;bestelldatum&#39;,this.value)"></div>'

window.weLEditHead=function(f,v){if(LEDIT)LEDIT[f]=v;};
window.weLEdit=function(i,f,v){if(LEDIT&&LEDIT.positionen[i])LEDIT.positionen[i][f]=(f==='menge')?num(v):v;};
window.weLEditDel=function(i){if(!LEDIT)return;LEDIT.positionen.splice(i,1);renderLiefEdit();};
window.weLEditAdd=function(){if(!LEDIT)return;LEDIT.positionen.push(mkPos('','',1,LEDIT.positionen.length));renderLiefEdit();};
window.weLEditProj=function(i){if(!LEDIT||!LEDIT.positionen[i])return;weOpenProjektPicker(LEDIT.positionen[i].projekt,function(pj){LEDIT.positionen[i].projekt=pj;renderLiefEdit();});};
window.weLEditBulkProj=function(){if(!LEDIT)return;var base=(LEDIT.positionen[0]&&LEDIT.positionen[0].projekt)||defaultProjekt();weOpenProjektPicker(base,function(pj){LEDIT.positionen.forEach(function(x){x.projekt=Object.assign({},pj);});renderLiefEdit();toast('Projekt/Adresse auf alle Zeilen gesetzt');});};
window.weEditCancel=function(){var id=LEDIT&&LEDIT.id;LEDIT=null;if(id)weOpenLief(id);else weCloseModal();};
window.weLEditDelLief=function(){var id=LEDIT&&LEDIT.id;if(id)weDeleteLief(id);};
window.weLEditSave=function(){
  if(!LEDIT)return;
  if(!(LEDIT.lieferantFirma||'').trim()){toast('Bitte Lieferant eingeben');return;}
  var l=liefById(LEDIT.id);if(!l){toast('Lieferung nicht gefunden');return;}
  var pos=LEDIT.positionen.filter(function(p){return (p.bezeichnung||'').trim()||(p.artikelNr||'').trim();});
  if(!pos.length){toast('Mindestens eine Position mit Bezeichnung/Art-Nr nötig');return;}
  pos.forEach(function(p,i){p.sortindex=i;p.menge=num(p.menge);p.eingegangenMenge=Math.max(0,Math.min(num(p.eingegangenMenge),p.menge||999999));p.status=posStatus(p);});
  l.lieferantFirma=LEDIT.lieferantFirma.trim();
  l.bestellnummer=(LEDIT.bestellnummer||'').trim();
  l.bestelldatum=LEDIT.bestelldatum||today();
  l.notiz=(LEDIT.notiz||'').trim();
  l.positionen=pos;l.status=liefStatus(l);l.updatedAt=_now();
  saveRec(POOL_L,PREFIX_L,l);
  LEDIT=null;renderUeber();weOpenLief(l.id);toast('Lieferung gespeichert');
};

/* ══════════════════ Etiketten (HTML + window.print) ══════════════════ */
// labelObj: {projekt, artikel, artikelNr, lieferant, datum, idx, total}
function labelsFromPos(l,p){
  var s=settings();var out=[];var m=Math.max(1,num(p.menge));
  for(var i=1;i<=m;i++){
    out.push({projekt:p.projekt||defaultProjekt(),artikel:p.bezeichnung,artikelNr:p.artikelNr,lieferant:l.lieferantFirma,datum:l.bestelldatum||l.importDatum,idx:i,total:m});
  }
  return out;
}
function labelsFromLief(l){
  // Lager-Positionen bekommen KEINE Etikette (nur Wareneingangs-Kontrolle).
  var out=[];(l.positionen||[]).forEach(function(p){if(isLagerProj(p.projekt))return;out=out.concat(labelsFromPos(l,p));});return out;
}
window.wePrintLief=function(liefId){var l=liefById(liefId);if(!l)return;var labels=labelsFromLief(l);if(!labels.length){toast('Nur Lager-Positionen — keine Etiketten zu drucken');return;}printLabels(labels);};
window.wePrintPos=function(liefId,posId){var l=liefById(liefId);if(!l)return;var p=(l.positionen||[]).find(function(x){return x.id===posId;});if(!p)return;if(isLagerProj(p.projekt)){toast('Lager-Position — keine Etikette');return;}printLabels(labelsFromPos(l,p));};

// «…strasse» → «…str.» NUR für den Etikettendruck (Daten bleiben unverändert).
function abbrevStrasse(s){return String(s||'').replace(/strasse/gi,function(m){return m.charAt(0)==='S'?'Str.':'str.';});}
function labelInner(lbl,s){
  var p=lbl.projekt||{};
  var strasse=abbrevStrasse((p.strasse||'').trim());   // Strasse+Nr, gekürzt, DOMINANT
  var ort=(p.ort||'').trim();                            // Ort klein, KEINE PLZ
  var nm=(p.name||'').trim();
  var bigLines,cityLine='';
  if(strasse){ bigLines=[strasse]; cityLine=ort; }
  else if(ort){ bigLines=[ort]; }                        // nur Ort → Ort gross
  else { bigLines=[nm]; }                                // Fallback: Bezeichnung
  // Eyebrow nur bei echtem Projektnamen (GEMA-Objekt), nicht wenn Name = Adresse
  var eyebrow=(nm && nm!==strasse && nm!==(p.strasse||'').trim() && nm!==ort)?nm:'';
  var startFs=Math.max(13,Math.round(s.labelH*3.7795*0.36));
  var artHtml='';
  if(s.showArtikel&&(lbl.artikel||lbl.artikelNr)){
    artHtml='<div class="lb-art">'+E(lbl.artikel||'')+(lbl.artikelNr?' <span class="mut">'+E(lbl.artikelNr)+'</span>':'')+'</div>';
  }
  // Lieferant erscheint bewusst NICHT auf der Etikette (User-Vorgabe) — nur Datum.
  var footL=(lbl.datum?fD(lbl.datum):'');
  var footR=(s.numberLabels&&lbl.total>1)?(lbl.idx+' / '+lbl.total):'';
  return '<div class="lb-pad">'
    +(eyebrow?'<div class="lb-eye">'+E(eyebrow)+'</div>':'')
    +'<div class="lb-addrwrap"><div class="lb-addr" style="font-size:'+startFs+'px">'+bigLines.map(E).join('<br>')+'</div>'
      +(cityLine?'<div class="lb-city">'+E(cityLine)+'</div>':'')
      +artHtml+'</div>'
    +((footL||footR)?'<div class="lb-foot"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+footL+'</span><span>'+footR+'</span></div>':'')
    +'</div>';
}
function fitScript(){
  // Skaliert die Strasse (.lb-addr) herunter, bis der GESAMTE Adressblock
  // (Strasse + Ort + Artikel) passt — nie abschneiden.
  return '(function(){function fit(wrap){var a=wrap.querySelector(".lb-addr");if(!a)return;var fs=parseFloat(getComputedStyle(a).fontSize)||24;var g=0;while((wrap.scrollHeight>wrap.clientHeight+0.5||wrap.scrollWidth>wrap.clientWidth+0.5)&&fs>6&&g<600){fs-=1;a.style.fontSize=fs+"px";g++;}}var w=document.querySelectorAll(".lb-addrwrap");for(var i=0;i<w.length;i++)fit(w[i]);})();';
}
function printLabels(labels){
  var s=settings();
  var w=window.open('','_blank');
  if(!w){toast('Pop-up blockiert — bitte erlauben');return;}
  var css='*{box-sizing:border-box;margin:0;padding:0}'
    +'html,body{font-family:"DM Sans",system-ui,sans-serif;color:#000;background:#e2e8f0}'
    +'@page{size:'+s.labelW+'mm '+s.labelH+'mm;margin:0}'
    +'.lbl{width:'+s.labelW+'mm;height:'+s.labelH+'mm;overflow:hidden;background:#fff;display:flex;flex-direction:column;page-break-after:always;break-after:page;margin:0 auto 3mm}'
    +'.lb-pad{flex:1;display:flex;flex-direction:column;padding:1.4mm 1.6mm;overflow:hidden}'
    +'.lb-eye{font-size:2.1mm;font-weight:800;color:#333;text-transform:uppercase;letter-spacing:.2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
    +'.lb-addrwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;min-height:0}'
    +'.lb-addr{font-weight:900;line-height:1.04;color:#000}'
    +'.lb-city{font-size:2.9mm;font-weight:700;color:#000;margin-top:.8mm;text-align:center;line-height:1.05;word-break:break-word}'
    +'.lb-art{font-size:2.3mm;margin-top:1mm;text-align:center;line-height:1.15;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
    +'.lb-foot{display:flex;justify-content:space-between;gap:1mm;font-size:1.7mm;color:#333;font-weight:700;padding-top:.6mm}'
    +'.mut{color:#555;font-weight:600}'
    +'.bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;background:#0f172a;color:#fff;padding:9px 14px;font-size:12.5px}'
    +'.bar button{padding:8px 14px;border-radius:8px;border:none;background:#0f766e;color:#fff;font-weight:800;cursor:pointer;font-family:inherit}'
    +'.bar button.sec{background:#475569}'
    +'.bar .h{color:#cbd5e1;font-size:11.5px}'
    +'@media print{.bar{display:none!important}.lbl{margin:0!important}}';
  var pages=labels.map(function(lbl){return '<div class="lbl">'+labelInner(lbl,s)+'</div>';}).join('');
  var h='<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Etiketten ('+labels.length+')</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">'
    +'<style>'+css+'</style></head><body>'
    +'<div class="bar no-print"><button onclick="window.print()">🖨 '+labels.length+' Etikette'+(labels.length!==1?'n':'')+' drucken</button><button class="sec" onclick="window.close()">Schliessen</button><span class="h">Drucker: 100% / «tatsächliche Grösse» · Ränder «keine» · Format '+s.labelW+'×'+s.labelH+' mm</span></div>'
    +pages
    +'<scr'+'ipt>'+fitScript()+'<\/scr'+'ipt></body></html>';
  w.document.write(h);w.document.close();
}

/* Live-Vorschau (gleiches Markup, unskaliert) */
function renderPreview(container,lbl){
  var s=settings();
  var pxmm=3.5;// on-screen scale
  container.innerHTML='<div class="lblbox" style="width:'+(s.labelW*pxmm)+'px;height:'+(s.labelH*pxmm)+'px">'+labelInner(lbl,s)+'</div>';
  var wrap=container.querySelector('.lb-addrwrap');var addr=container.querySelector('.lb-addr');
  if(wrap&&addr){var fs=parseFloat(getComputedStyle(addr).fontSize)||22;var g=0;while((wrap.scrollHeight>wrap.clientHeight+0.5||wrap.scrollWidth>wrap.clientWidth+0.5)&&fs>6&&g<600){fs-=1;addr.style.fontSize=fs+'px';g++;}}
}

var IMP=null;
function newImp(){return {schritt:1,lieferantFirma:'',quelle:'ki',grid:null,pdfExtract:null,positionen:[],bestellnummer:'',bestelldatum:today(),notiz:'',bulkProjObj:null,kiFileB64:null,kiFileName:'',kiFileType:'',kiText:'',kiBusy:false};}

/* HTML paste → grid */
function handleHtmlPaste(html,text){
  var grid=null;
  if(html){grid=extractHtmlGrid(html);}
  if((!grid||!grid.rows.length)&&text){grid=extractTextGrid(text);}
  if(!grid||!grid.rows.length){$('impExtractOut').innerHTML='<div class="warnbox">Keine Tabelle erkannt. Bitte als Tabelle (nicht als Bild) kopieren, oder Zeilen manuell erfassen.</div>'+manualStartBtn();return;}
  IMP.grid=grid;
  var mp=findMapping(IMP.lieferantFirma,'html');
  if(mp&&mp.config&&mp.config.cols&&colsValid(mp.config.cols,grid.maxCols)){
    IMP.positionen=applyGridMapping(grid,mp.config);
    IMP.schritt=3;renderImport();
  } else {
    renderMappingAssistant(grid,'html');
  }
}
function extractHtmlGrid(html){
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    var tables=Array.prototype.slice.call(doc.querySelectorAll('table'));
    if(!tables.length)return null;
    // Kandidat: Tabelle mit den meisten Datenzeilen (Mail-Layout-Tabellen haben wenige)
    var best=null,bestScore=-1;
    tables.forEach(function(t){
      var rows=Array.prototype.slice.call(t.querySelectorAll('tr')).map(function(tr){
        return Array.prototype.slice.call(tr.querySelectorAll('td,th')).map(function(td){return (td.textContent||'').replace(/\s+/g,' ').trim();});
      }).filter(function(r){return r.some(function(c){return c!=='';});});
      var cols=rows.reduce(function(m,r){return Math.max(m,r.length);},0);
      var score=(cols>=2?rows.length*cols:0);
      if(score>bestScore){bestScore=score;best=rows;}
    });
    if(!best||best.length<1)return null;
    var maxCols=best.reduce(function(m,r){return Math.max(m,r.length);},0);
    return {rows:best,maxCols:maxCols};
  }catch(e){return null;}
}
function extractTextGrid(text){
  var lines=String(text).split(/\r?\n/).map(function(l){return l.replace(/\s+$/,'');}).filter(function(l){return l.trim();});
  if(!lines.length)return null;
  var rows=lines.map(function(l){
    if(l.indexOf('\t')>=0)return l.split('\t').map(function(c){return c.trim();});
    return l.split(/\s{2,}/).map(function(c){return c.trim();});
  });
  var maxCols=rows.reduce(function(m,r){return Math.max(m,r.length);},0);
  if(maxCols<2)return null;
  return {rows:rows,maxCols:maxCols};
}
function colsValid(cols,maxCols){return cols&&typeof cols.bezeichnung==='number'&&cols.bezeichnung<maxCols;}

// Datum robust nach YYYY-MM-DD (ISO, dd.mm.yyyy, dd/mm/yyyy)
function parseDateLoose(s){
  if(!s)return '';s=String(s).trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){var y=m[3].length===2?('20'+m[3]):m[3];return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
  return '';
}

/* PDF → grid */
function ensurePdfJs(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;}catch(e){}return res(window.pdfjsLib);}
    var s=document.createElement('script');s.src=PDFJS_SRC;
    s.onload=function(){if(window.pdfjsLib){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;}catch(e){}res(window.pdfjsLib);}else rej(new Error('pdfjs missing'));};
    s.onerror=function(){rej(new Error('pdfjs load failed'));};
    document.head.appendChild(s);
  });
}
window.weImpPdf=function(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  IMP.kiPendingFile=f;   // für «Mit KI analysieren»-Fallback wiederverwenden
  $('pdfStatus').textContent='PDF wird gelesen …';
  var fr=new FileReader();
  fr.onload=function(){
    var data=new Uint8Array(fr.result);
    ensurePdfJs().then(function(pdfjs){
      return pdfjs.getDocument({data:data}).promise;
    }).then(function(pdf){
      var items=[];var chain=Promise.resolve();
      for(var pg=1;pg<=pdf.numPages;pg++){
        (function(pg){chain=chain.then(function(){return pdf.getPage(pg).then(function(page){return page.getTextContent().then(function(tc){
          tc.items.forEach(function(it){
            if(!it.str||!it.str.trim())return;
            var tr=it.transform;items.push({str:it.str,x:tr[4],y:tr[5],w:it.width||0,page:pg});
          });
        });});});})(pg);
      }
      return chain.then(function(){return items;});
    }).then(function(items){
      var grid=pdfItemsToGrid(items);
      $('pdfStatus').textContent='';
      if(!grid||!grid.rows.length){$('impExtractOut').innerHTML='<div class="warnbox">Kein Text erkannt (evtl. gescanntes PDF ohne Text-Layer). Bitte Zeilen manuell erfassen.</div>'+manualStartBtn();return;}
      IMP.grid=grid;IMP.pdfExtract={items:items};
      var mp=findMapping(IMP.lieferantFirma,'pdf');
      if(mp&&mp.config&&(mp.config.bands||mp.config.cols)){
        IMP.positionen=mp.config.bands?applyPdfBands(items,mp.config):applyGridMapping(grid,mp.config);
        IMP.schritt=3;renderImport();
      } else {
        renderMappingAssistant(grid,'pdf');
      }
    }).catch(function(err){
      $('pdfStatus').textContent='';
      $('impExtractOut').innerHTML='<div class="warnbox">PDF konnte nicht gelesen werden ('+E(err&&err.message||'Fehler')+'). Bitte Tabelle einfügen oder manuell erfassen.</div>'+manualStartBtn();
    });
  };
  fr.readAsArrayBuffer(f);
};
// PDF-Textitems → Zeilen (nach y) × Spalten (Cluster nach x)
function pdfItemsToGrid(items){
  if(!items.length)return null;
  // pro Seite gruppieren, dann Zeilen bilden
  var byPage={};items.forEach(function(it){(byPage[it.page]=byPage[it.page]||[]).push(it);});
  var allRows=[];var colStarts=[];
  Object.keys(byPage).forEach(function(pg){
    var arr=byPage[pg].slice().sort(function(a,b){return b.y-a.y||a.x-b.x;});
    var rows=[];var cur=null;var curY=null;var yTol=4;
    arr.forEach(function(it){
      if(cur&&Math.abs(it.y-curY)<=yTol){cur.push(it);}
      else{cur=[it];curY=it.y;rows.push(cur);}
    });
    rows.forEach(function(r){r.sort(function(a,b){return a.x-b.x;});r.forEach(function(it){colStarts.push(it.x);});allRows.push(r);});
  });
  // Spaltengrenzen: x-Startwerte clustern (Lücke > 14px = neue Spalte)
  colStarts.sort(function(a,b){return a-b;});
  var bounds=[];var last=null;
  colStarts.forEach(function(x){if(last===null||x-last>14){bounds.push(x);}last=x;});
  if(!bounds.length)bounds=[0];
  function colOf(x){var c=0;for(var i=0;i<bounds.length;i++){if(x>=bounds[i]-1)c=i;else break;}return c;}
  var rows=allRows.map(function(r){
    var cells=[];r.forEach(function(it){var c=colOf(it.x);cells[c]=(cells[c]?cells[c]+' ':'')+it.str.trim();});
    for(var i=0;i<bounds.length;i++)if(cells[i]==null)cells[i]='';
    return cells.map(function(c){return (c||'').replace(/\s+/g,' ').trim();});
  }).filter(function(r){return r.some(function(c){return c!=='';});});
  var maxCols=bounds.length;
  IMP.__pdfBounds=bounds;
  return {rows:rows,maxCols:maxCols,bounds:bounds};
}

/* Mapping-Assistent (html & pdf, spaltenbasiert) */
function renderMappingAssistant(grid,quelle){

    +'<div class="row">'
      +'<div class="col"><label class="fl">Pos-Nr = </label><select class="in" id="mapPos">'+colOpts(guess.posNr)+'</select></div>'
      +'<div class="col"><label class="fl">Art-Nr = </label><select class="in" id="mapArt">'+colOpts(guess.artikelNr)+'</select></div>'
      +'<div class="col"><label class="fl">Bezeichnung = </label><select class="in" id="mapBez">'+colOpts(guess.bezeichnung)+'</select></div>'
      +'<div class="col"><label class="fl">Menge = </label><select class="in" id="mapMenge">'+colOpts(guess.menge)+'</select></div>'
      +'<div class="col" style="max-width:150px"><label class="fl">Kopfzeilen übersp.</label><input class="in" id="mapSkip" inputmode="numeric" value="'+(guess.skip||0)+'"></div>'
    +'</div>'
    +'<div class="tblwrap" style="margin-top:10px;max-height:230px;overflow:auto"><table class="gt"><thead><tr>'+ths+'</tr></thead><tbody>'+previewRows+'</tbody></table></div>'
    +'<div class="row no-print" style="margin-top:12px"><button class="btn" onclick="weImpBack()">← Zurück</button><span style="flex:1"></span><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#475569"><input type="checkbox" id="mapSave" checked> Mapping merken</label><button class="btn pri" onclick="weImpApplyMapping(\''+quelle+'\')">Übernehmen →</button></div>';
}
function guessCols(grid){
  var g={posNr:'',artikelNr:'',bezeichnung:'',menge:'',skip:0};
  var head=null,headIdx=-1;
  for(var r=0;r<Math.min(3,grid.rows.length);r++){
    var joined=grid.rows[r].join(' ').toLowerCase();
    if(/art|nr|bezeich|menge|anzahl|stk|pos/.test(joined)){head=grid.rows[r];headIdx=r;break;}
  }
  if(head){
    head.forEach(function(c,i){
      var t=(c||'').toLowerCase();
      if(g.posNr===''&&/^pos\.?$|position|^p\.?$/.test(t))g.posNr=i;
      if(g.artikelNr===''&&/art.*nr|artikel|nummer|^nr/.test(t)&&i!==g.posNr)g.artikelNr=i;
      if(g.bezeichnung===''&&/bezeich|beschr|benennung|text|artikel/.test(t)&&i!==g.artikelNr&&i!==g.posNr)g.bezeichnung=i;
      if(g.menge===''&&/menge|anzahl|stk|stück|qty/.test(t))g.menge=i;
    });
    g.skip=headIdx+1;
  }
  if(g.bezeichnung===''){ // längste Textspalte
    var lens=[];var mc=grid.maxCols;
    for(var c=0;c<mc;c++){var tot=0,n=0;grid.rows.forEach(function(row){var v=row[c]||'';if(v){tot+=v.length;n++;}});lens[c]=n?tot/n:0;}
    var bi=0;for(var c2=1;c2<mc;c2++)if(lens[c2]>lens[bi])bi=c2;g.bezeichnung=bi;
  }
  if(g.menge===''){ // Spalte mit den meisten kleinen Ganzzahlen
    var mc2=grid.maxCols;var scores=[];
    for(var c=0;c<mc2;c++){var sc=0;grid.rows.forEach(function(row){var v=(row[c]||'').trim();if(/^\d{1,4}$/.test(v))sc++;});scores[c]=sc;}
    var mi=-1,mv=0;for(var c3=0;c3<mc2;c3++){if(c3!==g.bezeichnung&&scores[c3]>mv){mv=scores[c3];mi=c3;}}
    if(mi>=0)g.menge=mi;
  }
  return g;
}
window.weImpApplyMapping=function(quelle){
  var pos=($('mapPos')||{}).value||'',art=$('mapArt').value,bez=$('mapBez').value,menge=$('mapMenge').value,skip=num($('mapSkip').value);
  if(bez===''){toast('Bezeichnung-Spalte wählen');return;}
  var cols={posNr:pos===''?null:parseInt(pos,10),artikelNr:art===''?null:parseInt(art,10),bezeichnung:parseInt(bez,10),menge:menge===''?null:parseInt(menge,10),skip:skip};
  var config;

    // aus Spaltenindizes x-Bänder ableiten (stabiler für PDF)
    config={bands:colsToBands(IMP.grid.bounds,cols),skip:skip,cols:cols};
    IMP.positionen=applyPdfBands(IMP.pdfExtract.items,config);
  } else {
    config={cols:cols,skip:skip};
    IMP.positionen=applyGridMapping(IMP.grid,config);
  }
  if($('mapSave')&&$('mapSave').checked&&IMP.lieferantFirma){
    saveMapping(IMP.lieferantFirma,quelle,config);

};
function colsToBands(bounds,cols){
  function band(ci){if(ci==null||ci<0)return null;var xMin=bounds[ci]-3;var xMax=(ci+1<bounds.length?bounds[ci+1]-3:99999);return {xMin:xMin,xMax:xMax};}
  return {posNr:band(cols.posNr),artikelNr:band(cols.artikelNr),bezeichnung:band(cols.bezeichnung),menge:band(cols.menge)};
}
function applyGridMapping(grid,config){
  var cols=config.cols||{};var skip=config.skip||0;
  var out=[];
  grid.rows.forEach(function(r,ri){
    if(ri<skip)return;
    var bez=cols.bezeichnung!=null?(r[cols.bezeichnung]||''):'';
    var art=cols.artikelNr!=null?(r[cols.artikelNr]||''):'';
    var menge=cols.menge!=null?num(r[cols.menge]):0;
    var posNr=cols.posNr!=null?(r[cols.posNr]||''):'';
    if(!bez.trim()&&!art.trim())return;
    out.push(mkPos(art,bez,menge,out.length,posNr));
  });
  return out;
}
function applyPdfBands(items,config){
  var bands=config.bands||{};var skip=config.skip||0;
  // Zeilen bilden (nach y je Seite)
  var byPage={};items.forEach(function(it){(byPage[it.page]=byPage[it.page]||[]).push(it);});
  var rows=[];
  Object.keys(byPage).forEach(function(pg){
    var arr=byPage[pg].slice().sort(function(a,b){return b.y-a.y||a.x-b.x;});
    var cur=null,curY=null;
    arr.forEach(function(it){if(cur&&Math.abs(it.y-curY)<=4){cur.push(it);}else{cur=[it];curY=it.y;rows.push(cur);}});
  });
  function pick(row,band){
    if(!band)return '';
    return row.filter(function(it){var cx=it.x+(it.w||0)/2;return cx>=band.xMin&&cx<=band.xMax;}).sort(function(a,b){return a.x-b.x;}).map(function(it){return it.str.trim();}).join(' ').replace(/\s+/g,' ').trim();
  }
  var out=[];
  rows.forEach(function(row,ri){
    if(ri<skip)return;
    var bez=pick(row,bands.bezeichnung);
    var art=pick(row,bands.artikelNr);
    var menge=num(pick(row,bands.menge));
    var posNr=pick(row,bands.posNr);
    if(!bez&&!art)return;
    out.push(mkPos(art,bez,menge,out.length,posNr));
  });
  return out;
}
function mkPos(art,bez,menge,idx,posNr){
  return {id:uid('pos'),sortindex:idx,posNr:(posNr==null?'':String(posNr)).trim(),artikelNr:(art||'').trim(),bezeichnung:(bez||'').trim(),menge:menge||0,eingegangenMenge:0,status:'offen',projekt:defaultProjekt()};
}

  if(!QE.name&&!QE.strasse&&!QE.ort){toast('Bitte Adresse oder Name eingeben');return;}
  var labels=[];var n=Math.max(1,num(QE.anzahl));
  for(var i=1;i<=n;i++){var lbl=qeLabel();lbl.idx=i;lbl.total=n;labels.push(lbl);}
  printLabels(labels);
};

/* ══════════════════ TAB: Einstellungen ══════════════════ */
function renderEinst(){
  var host=$('tab_einst');if(!host)return;
  var s=settings();var ed=canEdit();
  var projOpts='<option value="">📦 Lager / kein Projekt (Freitext unten)</option>'+projekte().map(function(p){return '<option value="'+p.objektId+'"'+(s.standardObjektId===p.objektId?' selected':'')+'>'+E(p.name)+(p.ort?' · '+E(p.ort):'')+'</option>';}).join('');
  var maps=mappings();
  var mapRows=maps.length?maps.map(function(m){
    return '<tr><td>'+E(m.lieferantFirma||m.lieferantKey||'—')+'</td><td><span class="chip">'+E((m.quelle||'').toUpperCase())+'</span></td><td class="mut" style="font-size:11px">'+mapSummary(m)+'</td><td class="num">'+(ed?'<button class="btn sm danger" onclick="weDelMapping(\''+m.id+'\')">✕</button>':'')+'</td></tr>';
  }).join(''):'<tr><td colspan="4" class="mut" style="text-align:center;padding:16px">Noch keine Mappings — entstehen automatisch beim ersten Import je Lieferant.</td></tr>';

  var stdRow = gemaObjekteAn()
    ? '<div class="row"><div class="col"><label class="fl">Standardprojekt (GEMA-Objekt)</label><select class="in" id="setStdProj" '+(ed?'':'disabled')+'>'+projOpts+'</select></div></div>'
    : '<div class="infobox">Modus «Nur freie Adressen» aktiv — es wird kein GEMA-Objekt referenziert. Standard ist die Lager-Adresse unten.</div>';

  host.innerHTML=
    '<div class="card"><h3>📍 Projektquelle</h3><div class="desc">Sollen Lieferungen die GEMA-Objekt-Stammdaten referenzieren oder frei/unabhängig erfasst werden? Betrifft Import-Zuordnung, Schnell-Etikette und Standardprojekt.</div>'
    +'<div class="row"><div class="col"><label class="fl">Modus</label><select class="in" id="setProjModus" '+(ed?'':'disabled')+'>'
      +'<option value="beides"'+(s.projektModus==='beides'?' selected':'')+'>Flexibel — GEMA-Objekte referenzieren ODER freie Adressen</option>'
      +'<option value="gema"'+(s.projektModus==='gema'?' selected':'')+'>Nur GEMA-Objekte referenzieren</option>'
      +'<option value="frei"'+(s.projektModus==='frei'?' selected':'')+'>Nur freie Objekte / Adressen (unabhängig von GEMA)</option>'
    +'</select></div></div>'
    +(ed?'<div class="row" style="margin-top:12px"><button class="btn pri" onclick="weSaveProjModus()">Speichern</button></div>':'')
    +'</div>'

    +'<div class="card"><h3>🏷 Etiketten-Format</h3><div class="desc">Massgeblich für <code>@page</code> und das ganze Layout. Standard = 49 × 23 mm (wie Werkzeug-Etiketten, Zebra ZD421).</div>'
    +'<div class="row"><div class="col" style="max-width:160px"><label class="fl">Breite (mm)</label><input class="in" id="setW" inputmode="decimal" onblur="fixLeadingZero(this)" value="'+s.labelW+'" '+(ed?'':'disabled')+'></div>'
    +'<div class="col" style="max-width:160px"><label class="fl">Höhe (mm)</label><input class="in" id="setH" inputmode="decimal" onblur="fixLeadingZero(this)" value="'+s.labelH+'" '+(ed?'':'disabled')+'></div>'
    +'<div class="col"><label class="fl">Optionen</label>'
      +'<label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-top:4px"><input type="checkbox" id="setArt" '+(s.showArtikel?'checked':'')+' '+(ed?'':'disabled')+'> Artikel (Bezeichnung + Nr) auf Etikette</label>'
      +'<label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-top:6px"><input type="checkbox" id="setNum" '+(s.numberLabels?'checked':'')+' '+(ed?'':'disabled')+'> Durchnummerieren «1 / N»</label>'
    +'</div></div>'
    +(ed?'<div class="row" style="margin-top:12px"><button class="btn pri" onclick="weSaveFormat()">Speichern</button><button class="btn" onclick="weSetPreview()">👁 Vorschau</button></div>':'')
    +'<div id="setPrev" style="margin-top:12px"></div>'
    +'</div>'

    +'<div class="card"><h3>📦 Standard / Lager-Adresse</h3><div class="desc">Vorauswahl für neue Lieferungen ohne Projektzuordnung (Lagerbestellungen).</div>'
    +stdRow
    +'<div class="row" style="margin-top:10px"><div class="col"><label class="fl">Lager-Bezeichnung (Freitext)</label><input class="in" id="setLagerName" value="'+E(s.lager.name)+'" '+(ed?'':'disabled')+'></div></div>'
    +'<div class="row" style="margin-top:10px"><div class="col"><label class="fl">Lager-Strasse</label><input class="in" id="setLagerStr" value="'+E(s.lager.strasse)+'" '+(ed?'':'disabled')+'></div><div class="col" style="max-width:140px"><label class="fl">PLZ</label><input class="in" id="setLagerPlz" value="'+E(s.lager.plz)+'" '+(ed?'':'disabled')+'></div><div class="col"><label class="fl">Ort</label><input class="in" id="setLagerOrt" value="'+E(s.lager.ort)+'" '+(ed?'':'disabled')+'></div></div>'
    +(ed?'<div class="row" style="margin-top:12px"><button class="btn pri" onclick="weSaveStd()">Speichern</button></div>':'')
    +'</div>'

    +'<div class="card"><h3>🧭 Lieferanten-Spalten-Mappings</h3><div class="desc">Pro Lieferant + Quelle (HTML/PDF) gespeicherte Spaltenzuordnung. Wird beim Import automatisch genutzt.</div>'
    +'<div class="tblwrap"><table class="gt"><thead><tr><th>Lieferant</th><th>Quelle</th><th>Zuordnung</th><th></th></tr></thead><tbody>'+mapRows+'</tbody></table></div>'
    +'</div>';
}
function mapSummary(m){
  var c=m.config||{};var cols=c.cols||{};
  if(c.bands){return 'x-Bänder (PDF), Kopfzeilen: '+(c.skip||0);}
  return 'Art-Nr Sp '+(cols.artikelNr!=null?cols.artikelNr+1:'—')+' · Bez Sp '+(cols.bezeichnung!=null?cols.bezeichnung+1:'—')+' · Menge Sp '+(cols.menge!=null?cols.menge+1:'—')+' · Kopf '+(c.skip||0);
}
window.weSaveFormat=function(){
  var w=parseFloat($('setW').value)||49,h=parseFloat($('setH').value)||23;
  if(w<10||w>200||h<8||h>200){toast('Format 10–200 × 8–200 mm');return;}
  if(saveSettings({labelW:w,labelH:h,showArtikel:$('setArt').checked,numberLabels:$('setNum').checked}))toast('Format gespeichert');
};
window.weSetPreview=function(){var c=$('setPrev');if(!c)return;
  // temporär Werte anwenden für Vorschau
  var lbl={projekt:{objektId:'',name:'Neubau Sonnenweg',strasse:'Musterstrasse 12',plz:'8005',ort:'Zürich'},artikel:'WC-Spülkasten',artikelNr:'AB-123',lieferant:'Muster AG',datum:_now(),idx:1,total:3};
  c.innerHTML='<div class="previewwrap"></div>';renderPreview(c.querySelector('.previewwrap'),lbl);
};
window.weSaveProjModus=function(){
  var v=($('setProjModus')||{}).value||'beides';
  if(saveSettings({projektModus:v})){toast('Projektquelle gespeichert');renderEinst();}
};
window.weSaveStd=function(){
  var lager={name:$('setLagerName').value.trim()||'Lager / kein Projekt',strasse:$('setLagerStr').value.trim(),plz:$('setLagerPlz').value.trim(),ort:$('setLagerOrt').value.trim()};
  var patch={lager:lager};var sp=$('setStdProj');if(sp)patch.standardObjektId=sp.value;
  if(saveSettings(patch))toast('Standardprojekt gespeichert');
};
window.weDelMapping=function(id){
  GemaDialog.confirm({title:'Mapping löschen',message:'Spalten-Mapping löschen? Beim nächsten Import dieses Lieferanten wird neu zugeordnet.',confirmLabel:'Löschen',danger:true}).then(function(ok){
    if(!ok)return;delRec(POOL_M,PREFIX_M,id);renderEinst();toast('Mapping gelöscht');
  });
};

/* ══════════════════ Boot ══════════════════ */
document.addEventListener('DOMContentLoaded',function(){
  renderUeber();
  var boot=function(){_cloudLoaded=true;renderUeber();
    var m=location.search.match(/[?&]l=([a-zA-Z0-9_\-]+)/);if(m){var l=liefById(decodeURIComponent(m[1]));if(l)weOpenLief(l.id);}
  };
  if(typeof GemaSync!=='undefined'&&GemaSync.bindCollection){
    Promise.race([
      Promise.all([
        GemaSync.bindCollection(MODULE,POOL_L,PREFIX_L,'id'),
        GemaSync.bindCollection(MODULE,POOL_M,PREFIX_M,'id')
      ]),
      new Promise(function(res){setTimeout(res,6000);})
    ]).then(boot).catch(boot);
  } else { _cloudLoaded=true; boot(); }
  window.addEventListener('gema-objekte-loaded',function(){if(_tab==='ueber')renderUeber();});
  if(typeof GemaFeedback!=='undefined')GemaFeedback.init('wareneingang','Wareneingang');
});

})();
