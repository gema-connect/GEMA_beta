<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Revisionsunterlagen</title>
<!-- Oeffentliche Bauherren-Ansicht — bewusst OHNE gema_auth.js / gema_sync.js.
     Laedt das Dossier ueber die Netlify-Function rev-share (Token in ?t=). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root{--accent:#3730a3;--accent-deep:#1e1b4b;--tint:#eef2ff;--ink:#0f172a;--mut:#5b6472;--brd:#dbe0ea;--bg:#eef1f6;--sur:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}
.wrap{max-width:900px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.top{background:var(--sur);border-bottom:2px solid var(--accent);padding:16px;position:sticky;top:0;z-index:5}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
.top-logo{max-height:40px;max-width:150px;object-fit:contain}
.top-t{flex:1;min-width:0}
.top-t .org{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.top-t .doc{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:9px;border:1.5px solid var(--brd);background:var(--sur);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{background:var(--sur);border:1.5px solid var(--brd);border-radius:16px;padding:20px;margin:16px 0}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:24px;font-weight:900;line-height:1.1;margin:6px 0 4px}
.hero .obj{font-size:15px;font-weight:700}
.hero .adr{font-size:13px;color:var(--mut);margin-top:2px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:560px){.meta{grid-template-columns:1fr}}
.meta .lbl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.meta .val{font-size:13.5px;font-weight:600;white-space:pre-line;margin-top:2px}
.kap{background:var(--sur);border:1.5px solid var(--brd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.kap-h{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.kap-h:hover{background:var(--tint)}
.kap-nr{font-weight:900;color:var(--accent);min-width:34px}
.kap-ti{flex:1;font-weight:800;font-size:14.5px}
.kap-e2 .kap-ti{font-weight:700;font-size:13.5px}
.kap-cv{font-size:16px;color:var(--mut);transition:.15s}
.kap.open .kap-cv{transform:rotate(90deg)}
.kap-bd{display:none;padding:0 16px 14px;border-top:1px solid var(--brd)}
.kap.open .kap-bd{display:block}
.kap-desc{font-size:12.5px;color:var(--mut);margin:10px 0}
.blk-body{font-size:13.5px;line-height:1.6;color:#000;white-space:pre-wrap;margin:10px 0}
.blk-h{font-size:13px;font-weight:800;color:var(--accent);margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
th,td{border:1px solid var(--brd);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--tint);font-weight:800;color:var(--accent-deep)}
.att{display:flex;align-items:center;gap:10px;border:1.5px solid var(--brd);border-radius:10px;padding:11px 13px;margin:8px 0;text-decoration:none;color:inherit}
.att:hover{border-color:var(--accent)}
.att .ic{font-size:20px}
.att .nm{flex:1;font-weight:700;font-size:13.5px}
.att .mt{font-size:11px;color:var(--mut)}
.att.ph{background:#fffbeb;border-color:#fcd34d;cursor:default}
.att.na{opacity:.6;cursor:default}
.msg{max-width:520px;margin:80px auto;text-align:center;padding:24px;background:var(--sur);border:1.5px solid var(--brd);border-radius:16px}
.msg .ic{font-size:40px}
.msg h2{font-size:18px;font-weight:900;margin:10px 0 6px}
.msg p{font-size:13.5px;color:var(--mut);line-height:1.6}
.spin{width:34px;height:34px;margin:0 auto}
@media print{.top .btn,.no-print{display:none!important}.top{position:static}}
</style>
</head>
<body>
<div id="app">
  <div class="msg"><div class="spin"><svg width="34" height="34" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M13 3 a10 10 0 0 1 10 10" fill="none" stroke="#3730a3" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 13 13" to="360 13 13" dur="0.9s" repeatCount="indefinite"/></path></svg></div><p style="margin-top:12px">Revisionsunterlagen werden geladen …</p></div>
</div>

<script>
'use strict';
function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){return E(s).replace(/\n/g,'<br>');}
function fD(d){ if(!d)return ''; var p=String(d).split('T')[0].split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d; }

// ── Branding-Kontrastschutz (inline, identisch zu den PDF-Helfern) ──
function _hexToRgb(h){h=String(h||'').trim().replace(/^#/,'');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function _hex(r,g,b){function h(n){n=Math.max(0,Math.min(255,Math.round(n)));return(n<16?'0':'')+n.toString(16);}return'#'+h(r)+h(g)+h(b);}
function _lum(c){var a=[c.r,c.g,c.b].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
function _cvw(c){return 1.05/(_lum(c)+0.05);}
function _darken(hex,t){var c=_hexToRgb(hex);if(!c)return null;if(_cvw(c)>=t)return _hex(c.r,c.g,c.b);var f=1;for(var i=0;i<40;i++){f-=0.025;var x={r:c.r*f,g:c.g*f,b:c.b*f};if(_cvw(x)>=t)return _hex(x.r,x.g,x.b);}return'#1f2933';}
function _tint(hex,m){var c=_hexToRgb(hex);if(!c)return null;m=m==null?0.92:m;return _hex(c.r+(255-c.r)*m,c.g+(255-c.g)*m,c.b+(255-c.b)*m);}
function applyBrand(b){
  if(!b)return;
  if(b.pdfFarben&&b.pdfFarben.primary){
    var acc=_darken(b.pdfFarben.primary,4.5); var deep=_darken(b.pdfFarben.primary,7)||acc; var tint=_tint(b.pdfFarben.primary)||'#eef2ff';
    if(acc){ var r=document.documentElement.style; r.setProperty('--accent',acc); r.setProperty('--accent-deep',deep); r.setProperty('--tint',tint); }
  }
}

var _DT_ICON={datenblatt:'📄',technische_zeichnung:'📐',bedienungsanleitung:'📘',montageanleitung:'🔧',wartungsanleitung:'🛠',konformitaetserklaerung:'✅',zertifikat:'🏅',schema:'🗺',ersatzteilliste:'🧩',garantie:'🛡',sonstiges:'📎'};

function msg(ic,title,text){ document.getElementById('app').innerHTML='<div class="msg"><div class="ic">'+ic+'</div><h2>'+E(title)+'</h2><p>'+E(text)+'</p></div>'; }

function entHtml(e){
  if(e.typ==='text')return '<div class="blk-h">'+E(e.titel||'')+'</div><div class="blk-body">'+nl2br(e.text||'')+'</div>';
  if(e.typ==='tabelle'){
    var h='<div class="blk-h">'+E(e.titel||'')+'</div><div style="overflow-x:auto"><table><thead><tr>'+(e.spalten||[]).map(function(c){return '<th>'+E(c)+'</th>';}).join('')+'</tr></thead><tbody>';
    (e.zeilen||[]).forEach(function(z){ h+='<tr>'+(e.spalten||[]).map(function(c,ci){return '<td>'+E(z[ci]||'')+'</td>';}).join('')+'</tr>'; });
    if(!(e.zeilen||[]).length&&e.tabellenArt==='kontrollblatt'){ for(var i=0;i<10;i++)h+='<tr>'+(e.spalten||[]).map(function(){return '<td style="height:26px">&nbsp;</td>';}).join('')+'</tr>'; }
    h+='</tbody></table></div>'; return h;
  }
  if(e.typ==='verweis')return '<div class="att"><span class="ic">🔗</span><span class="nm">'+E(e.titel||'')+'</span></div>';
  if(e.typ==='platzhalter')return '<div class="att ph"><span class="ic">⚠</span><span class="nm">'+E(e.titel||'')+'</span><span class="mt">'+(e.status==='angefordert'?'in Bearbeitung':'ausstehend')+'</span></div>';
  if(e.typ==='dokument'||e.typ==='produktdok'){
    var ic=_DT_ICON[e.dokTyp]||'📎';
    if(e.url)return '<a class="att" href="'+E(e.url)+'" target="_blank" rel="noopener"><span class="ic">'+ic+'</span><span class="nm">'+E(e.titel||e.name||'')+'</span>'+(e.lieferantFirma?'<span class="mt">'+E(e.lieferantFirma)+'</span>':'')+'<span class="mt">öffnen →</span></a>';
    return '<div class="att na"><span class="ic">'+ic+'</span><span class="nm">'+E(e.titel||e.name||'')+'</span><span class="mt">nur in GEMA einsehbar</span></div>';
  }
  return '';
}

function render(data){
  var d=data.dossier||{}; var b=data.branding||{}; applyBrand(b);
  var db=d.deckblatt||{};
  var logo=(b.logoVector||b.logo)||'';
  var logoHtml=logo?'<img class="top-logo" src="'+E(logo)+'" alt="Logo"/>':'<div style="font-weight:900;font-size:18px;color:var(--accent)">'+E(b.orgName||'GEMA')+'</div>';
  var h='<div class="top"><div class="top-in">'+logoHtml+'<div class="top-t"><div class="org">'+E(b.orgName||'')+'</div><div class="doc">'+E(db.dokumentTitel||d.titel||'Revisionsunterlagen')+'</div></div><button class="btn no-print" onclick="window.print()">🖨 Drucken</button></div></div>';
  h+='<div class="wrap">';
  // Hero
  h+='<div class="hero"><div class="eyebrow">Revisionsunterlagen · Übergabedossier</div><h1>'+E(db.dokumentTitel||'Betriebs- und Wartungsanleitung')+'</h1>';
  h+='<div class="obj">'+E(db.objektName||d.objektName||'')+'</div>';
  var adr=[db.strasse,db.plzOrt].filter(Boolean).join(', '); if(adr)h+='<div class="adr">'+E(adr)+'</div>';
  var meta=[];
  if(db.bauherr)meta.push(['Bauherrschaft',db.bauherr]);
  if(db.architekt)meta.push(['Architekt / Generalplaner',db.architekt]);
  if(db.unternehmer)meta.push(['Unternehmer',db.unternehmer]);
  if(db.anlageNr)meta.push(['Anlage-Nr.',db.anlageNr]);
  if(db.version)meta.push(['Version',db.version]);
  if(db.datum)meta.push(['Datum',fD(db.datum)]);
  if(meta.length)h+='<div class="meta">'+meta.map(function(m){return '<div><div class="lbl">'+E(m[0])+'</div><div class="val">'+E(m[1])+'</div></div>';}).join('')+'</div>';
  h+='</div>';
  // Kapitel
  (d.kapitel||[]).forEach(function(k,i){
    var ents=(k.eintraege||[]);
    var body=(k.beschreibung?'<div class="kap-desc">'+E(k.beschreibung)+'</div>':'')+(k.einleitungText?'<div class="blk-body">'+nl2br(k.einleitungText)+'</div>':'')+ents.map(entHtml).join('');
    if(!body.trim()&&!ents.length&&!k.beschreibung&&!k.einleitungText)body='<div class="kap-desc">—</div>';
    h+='<div class="kap'+(k.ebene===2?' kap-e2':'')+(i===0?' open':'')+'" data-k="'+i+'"><div class="kap-h" onclick="toggleKap('+i+')"><span class="kap-nr">'+E(k.nr)+'</span><span class="kap-ti">'+E(k.titel)+'</span><span class="kap-cv">›</span></div><div class="kap-bd">'+body+'</div></div>';
  });
  h+='<div style="text-align:center;font-size:11px;color:var(--mut);margin-top:20px">Bereitgestellt über GEMA · '+E(b.orgName||'')+'</div>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}
function toggleKap(i){ var el=document.querySelector('.kap[data-k="'+i+'"]'); if(el)el.classList.toggle('open'); }

(function(){
  var t=''; try{ t=new URLSearchParams(location.search).get('t')||''; }catch(e){}
  if(!t){ msg('🔗','Kein gültiger Link','Dieser Link enthält keinen Zugangscode. Bitte verwenden Sie den vollständigen Freigabe-Link oder scannen Sie den QR-Code erneut.'); return; }
  fetch('/.netlify/functions/rev-share?t='+encodeURIComponent(t))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
    .then(function(res){
      if(res.status===404){ msg('🔒','Nicht verfügbar','Diese Revisionsunterlagen wurden nicht gefunden oder die Freigabe wurde deaktiviert. Bitte wenden Sie sich an Ihren Planer.'); return; }
      if(!res.ok){ msg('⚠','Nicht erreichbar','Die Unterlagen konnten momentan nicht geladen werden. Bitte versuchen Sie es später erneut.'); return; }
      try{ render(res.j); document.title='Revisionsunterlagen — '+((res.j.dossier&&res.j.dossier.objektName)||''); }
      catch(e){ msg('⚠','Anzeigefehler','Die Unterlagen konnten nicht dargestellt werden.'); }
    })
    .catch(function(){ msg('⚠','Offline','Es konnte keine Verbindung hergestellt werden. Bitte prüfen Sie Ihre Internetverbindung und laden Sie die Seite neu.'); });
})();
</script>
</body>
</html>
