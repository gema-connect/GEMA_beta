<style>
:root{
  --bg:#f3f5fb;--sur:#fff;--sur2:#f7f8fc;
  --brd:#e0e4ef;--brd2:#c8cfdf;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --teal:#0f766e;--teal-bg:#f0fdfa;--teal-bd:#99f6e4;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amb:#d97706;--amb-bg:#fffbeb;--amb-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#93c5fd;
  --r:12px;--r-sm:8px;--r-lg:18px;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --sh-lg:0 16px 48px rgba(0,0,0,.13),0 4px 16px rgba(0,0,0,.06);
  --sans:'DM Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overflow-x:hidden;overflow-x:clip}
::placeholder{color:#cbd5e1}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);box-shadow:var(--sh-sm)}
.g-nav-inner{padding:0 24px;height:52px;display:flex;align-items:center;gap:0}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:14px}
.g-nav-bc{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.bc-cat{color:var(--mut);text-decoration:none;font-weight:600}
.bc-cat:hover{color:var(--txt)}
.bc-sep{color:var(--mut2)}
.bc-cur{font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.g-nav-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.g-nav-btn:hover{background:var(--sur2)}
.g-nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.gema-feedback-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.g-page{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
/* Hero (kompakt, Modul-Muster) */
.hero{background:linear-gradient(135deg,#0f172a,#134e4a 55%,#0f766e);border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:18px}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-left{display:flex;align-items:center;gap:14px;min-width:0}
.hero-ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.hero-title{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hero-sub{font-size:12.5px;color:#a7c3c0;margin-top:2px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700}
/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tb-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.tb-btn:hover{background:var(--sur2)}
.tb-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.tb-btn.primary:hover{background:#0d5f59}
.tb-spacer{flex:1}
.tb-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600;cursor:pointer}
/* Grid + Karten */
.kl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kl-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:0;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.kl-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.kl-card-bar{height:5px;background:linear-gradient(90deg,#0f766e,#14b8a6)}
.kl-card.archiv .kl-card-bar{background:#cbd5e1}
.kl-card-body{padding:14px 16px 12px;flex:1}
.kl-card-hd{display:flex;align-items:flex-start;gap:10px}
.kl-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-bg);border:1px solid var(--teal-bd);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.kl-name{font-size:15px;font-weight:800;line-height:1.25}
.kl-lehrgang{font-size:12px;color:var(--mut);margin-top:1px}
.kl-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.kl-stat{background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--txt2)}
.kl-card-ft{padding:9px 16px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:800}
.badge.teal{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd)}
.badge.grey{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.badge.amb{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bd)}
.badge.grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.badge.blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
/* Empty / Loader */
.empty{background:var(--sur);border:1.5px dashed var(--brd2);border-radius:var(--r-lg);padding:44px 20px;text-align:center;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:10px}
.spinner-wrap{display:flex;justify-content:center;padding:50px 0;color:var(--mut)}
/* Detail-Overlay */
.ov{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ov.open{display:block}
.ov-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;gap:12px}
.ov-back{border:1.5px solid var(--brd2);background:var(--sur);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.ov-title{font-size:15.5px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-body{max-width:1000px;margin:0 auto;padding:18px 20px 90px}
/* Panels */
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:16px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--brd);background:var(--sur2)}
.panel-hd-title{font-size:13.5px;font-weight:800}
.panel-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-body{padding:16px 18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--brd2);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;background:var(--sur);color:var(--txt)}
.inp:focus{outline:none;border-color:var(--teal)}
textarea.inp{min-height:74px;resize:vertical}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#0d5f59}
.btn.ghost{background:var(--sur);border:1.5px solid var(--brd2);color:var(--txt2)}
.btn.ghost:hover{background:var(--sur2)}
.btn.danger{background:var(--red-bg);border:1.5px solid var(--red-bd);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
/* Code-Anzeige */
.code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code-big{font-size:30px;font-weight:900;letter-spacing:7px;background:var(--teal-bg);border:1.5px dashed var(--teal-bd);color:var(--teal);border-radius:12px;padding:10px 20px;font-variant-numeric:tabular-nums}
/* Studierenden-Liste */
.stud-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--brd)}
.stud-row:last-child{border-bottom:none}
.stud-av{width:32px;height:32px;border-radius:50%;background:var(--teal-bg);border:1px solid var(--teal-bd);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.stud-nm{font-weight:700;font-size:13.5px}
.stud-mail{font-size:12px;color:var(--mut)}
/* Modul-Auswahl */
.mod-cat{margin-bottom:14px}
.mod-cat-title{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.mod-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.mod-check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--brd);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;background:var(--sur)}
.mod-check:hover{border-color:var(--brd2)}
.mod-check.on{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal)}
.mod-check input{width:15px;height:15px;accent-color:var(--teal);flex-shrink:0}
/* Modul-Kacheln (Studierende) */
.mod-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.mod-tile{display:flex;align-items:center;gap:9px;border:1.5px solid var(--brd);border-radius:11px;padding:11px 13px;text-decoration:none;color:var(--txt);font-weight:700;font-size:13px;background:var(--sur);transition:.13s}
.mod-tile:hover{border-color:var(--teal-bd);background:var(--teal-bg)}
.mod-tile .arrow{margin-left:auto;color:var(--teal)}
/* Lernmittel */
.mat-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--brd)}
.mat-row:last-child{border-bottom:none}
.mat-ic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);border:1px solid var(--blue-bd);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mat-tt{font-weight:700;font-size:13.5px}
.mat-meta{font-size:11.5px;color:var(--mut)}
.mat-open{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
/* Prüfungs-Zeile */
.pf-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)}
.pf-row:last-child{border-bottom:none}
.pf-tt{font-weight:700;font-size:13.5px}
.pf-meta{font-size:11.5px;color:var(--mut)}
/* Footer */
.foot{margin-top:36px;text-align:center;color:var(--mut2);font-size:12px}
.foot a{color:var(--mut);text-decoration:none;margin:0 8px}
@media(max-width:640px){
  .g-page{padding:14px 14px 70px}
  .hero{padding:14px 16px}
  .hero-title{font-size:17px}
  .hero-pills{display:none}
  .ov-body{padding:14px 14px 90px}
  .code-big{font-size:22px;letter-spacing:4px;padding:8px 14px}
}
</style>

function me(){return (typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentUser())||null;}
function canEdit(){return typeof GemaAuth!=='undefined'&&GemaAuth.can('write','klassen');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Liste ────────────────────────────────────────────────────────────
function renderHero(){
  var kl=S.meineKlassen().filter(function(k){return !k.archiviert;});
  var pills=document.getElementById('heroPills');
  var nStud=0;kl.forEach(function(k){nStud+=(k.studentIds||[]).length;});
  if(canEdit()){
    pills.innerHTML='<span class="hero-pill">'+kl.length+' Klassen</span><span class="hero-pill">'+nStud+' Studierende</span>';
    document.getElementById('heroSub').textContent='Klassen führen · Berechnungsmodule freischalten · Lernmittel teilen';
  }else{
    pills.innerHTML='<span class="hero-pill">'+kl.length+' Klassen</span>';
    document.getElementById('heroSub').textContent='Deine Klassen · Lernmittel · freigeschaltete Berechnungsmodule';
  }
}
function renderList(){
  var wrap=document.getElementById('listWrap');
  var zeigeArchiv=document.getElementById('chkArchiv').checked;
  var kl=S.meineKlassen().filter(function(k){return zeigeArchiv||!k.archiviert;});
  kl.sort(function(a,b){return String(b.erstelltAm||'').localeCompare(String(a.erstelltAm||''));});
  renderHero();
  if(!kl.length){
    if(!_klCloudLoaded){
      wrap.innerHTML='<div class="spinner-wrap"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="90 60" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg></div>';
      return;
    }
    wrap.innerHTML='<div class="empty"><div class="big">🎓</div><div style="font-weight:800;font-size:15px;margin-bottom:5px">'+(canEdit()?'Noch keine Klasse':'Du bist noch in keiner Klasse')+'</div><div style="font-size:12.5px">'+(canEdit()?'Erstelle deine erste Klasse und teile den Klassencode mit den Studierenden.':'Tritt mit dem Klassencode deines Dozenten einer Klasse bei.')+'</div></div>';
    return;
  }
  var isDoz=canEdit();
  wrap.innerHTML='<div class="kl-grid">'+kl.map(function(k){
    var mats=S.materialForKlasse(k.id).length;
    var pruef=(isDoz?S.pruefungenForDozent():S.pruefungenForStudent()).filter(function(p){return p.klasseId===k.id;}).length;
    return '<div class="kl-card'+(k.archiviert?' archiv':'')+'" onclick="klOpen(\''+k.id+'\')">'+
      '<div class="kl-card-bar"></div>'+
      '<div class="kl-card-body">'+
        '<div class="kl-card-hd"><div class="kl-ic">🎓</div><div style="min-width:0"><div class="kl-name">'+esc(k.name)+'</div><div class="kl-lehrgang">'+esc(k.lehrgang||'')+'</div></div></div>'+
        '<div class="kl-stats">'+
          '<span class="kl-stat">👥 '+(k.studentIds||[]).length+' Studierende</span>'+
          '<span class="kl-stat">🧮 '+(k.module||[]).length+' Module</span>'+
          '<span class="kl-stat">📚 '+mats+' Lernmittel</span>'+
          '<span class="kl-stat">📝 '+pruef+' Prüfungen</span>'+
        '</div>'+
      '</div>'+
      '<div class="kl-card-ft"><span>'+(k.archiviert?'Archiviert':'Erstellt '+S.fmtDatum(k.erstelltAm))+'</span><span style="color:var(--teal);font-weight:800">Öffnen →</span></div>'+
    '</div>';
  }).join('')+'</div>';
}

// ── Klasse anlegen / beitreten ───────────────────────────────────────
window.klNeu=function(){
  GemaDialog.prompt({title:'Neue Klasse',placeholder:'z.B. Kaltwasser HF_GT 2026',defaultValue:''}).then(function(name){
    if(name===null)return;
    name=String(name).trim();
    if(!name){GemaDialog.alert({title:'Klasse',message:'Bitte einen Namen eingeben.'});return;}
    var k={name:name,lehrgang:'',module:[],studentIds:[],archiviert:false};
    S.saveKlasse(k).then(function(){renderList();klOpen(k.id);}).catch(function(){renderList();klOpen(k.id);});
  });
};
window.klBeitreten=function(code){
  var open=function(val){
    if(val===null)return;
    var k=S.findKlasseByCode(val);
    if(!k){GemaDialog.alert({title:'Klasse beitreten',message:'Klassencode nicht gefunden. Bitte Code prüfen — oder die Seite neu laden, falls die Klasse gerade erst erstellt wurde.'});return;}
    var u=me();if(!u)return;
    k.studentIds=k.studentIds||[];
    if(k.studentIds.indexOf(u.id)>=0){GemaDialog.alert({title:'Klasse beitreten',message:'Du bist bereits Mitglied der Klasse «'+k.name+'».'});return;}
    GemaDialog.confirm({title:'Klasse beitreten',message:'Der Klasse «'+k.name+'»'+(k.lehrgang?' ('+k.lehrgang+')':'')+' beitreten?',confirmLabel:'Beitreten'}).then(function(ok){
      if(!ok)return;
      k.studentIds.push(u.id);
      S.saveKlasse(k).catch(function(){});
      S.notifyDozenten(k,{eventKey:'schule_klasse_beitritt',typ:'info',titel:'Neues Klassenmitglied',text:(u.name||u.username)+' ist der Klasse «'+k.name+'» beigetreten.',link:'ab_klassen.html?k='+k.id});
      S.refreshStudentMods();
      renderList();
    });
  };
  if(code){open(code);return;}
  GemaDialog.prompt({title:'Klasse beitreten',placeholder:'Klassencode, z.B. K7M2XA',defaultValue:''}).then(open);
};

// ── Detail ───────────────────────────────────────────────────────────
window.klOpen=function(id){
  _openId=id;
  document.getElementById('klOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderDetail();
};
window.klClose=function(){
  _openId=null;
  document.getElementById('klOv').classList.remove('open');
  document.body.style.overflow='';
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  renderList();
};
function renderDetail(){
  var k=S.klasseById(_openId);
  var body=document.getElementById('ovBody');
  if(!k){body.innerHTML='<div class="empty">Klasse nicht gefunden.</div>';return;}
  document.getElementById('ovTitle').textContent=k.name;
  document.getElementById('ovBadge').style.display=k.archiviert?'':'none';
  body.innerHTML=canEdit()?detailDozentHtml(k):detailStudentHtml(k);
  if(canEdit())bindModulChecks(k);
}

// ── Detail: Dozent ───────────────────────────────────────────────────

         ?'<button class="btn ghost sm" onclick="klArchiv(false)">↩ Reaktivieren</button>'
         :'<button class="btn ghost sm" onclick="klArchiv(true)">🗄 Archivieren</button>')+
       '<button class="btn danger sm" onclick="klLoeschen()">🗑</button>'+
     '</div></div>'+
     '<div class="panel-body">'+
       '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
         '<div class="fg"><label>Klassenname</label><input class="inp" id="klName" value="'+esc(k.name)+'" onblur="klStammSave()"/></div>'+
         '<div class="fg"><label>Lehrgang</label><input class="inp" id="klLehrgang" value="'+esc(k.lehrgang||'')+'" placeholder="z.B. HF Gebäudetechnik" onblur="klStammSave()"/></div>'+
       '</div>'+
     '</div></div>';
  // Einladung
  h+='<div class="panel"><div class="panel-hd"><span>✉️</span><span class="panel-hd-title">Einladung & Klassencode</span></div>'+
     '<div class="panel-body">'+
       '<div class="code-box">'+
         '<div class="code-big">'+esc(k.code||'—')+'</div>'+
         '<div style="display:flex;flex-direction:column;gap:8px">'+
           '<button class="btn primary sm" onclick="klCopyLink()">🔗 Einladungslink kopieren</button>'+
           '<button class="btn ghost sm" onclick="klCopyCode()">📋 Code kopieren</button>'+
           '<button class="btn ghost sm" onclick="klCodeNeu()">↻ Neuen Code erzeugen</button>'+
         '</div>'+
       '</div>'+
       '<div style="font-size:12px;color:var(--mut);margin-top:12px">Studierende registrieren sich selbst unter <b>'+esc(joinLink)+'</b> — sie landen automatisch in dieser Klasse. Bestehende GEMA-Konten treten mit demselben Code über «Klasse beitreten» bei.</div>'+
     '</div></div>';
  // Studierende
  h+='<div class="panel"><div class="panel-hd"><span>👥</span><span class="panel-hd-title">Studierende ('+studs.length+')</span></div>'+
     '<div class="panel-body">'+

         var mail=(s.profile&&s.profile.email)||s.username||'';
         return '<div class="stud-row"><div class="stud-av">'+esc(ini)+'</div>'+
           '<div style="min-width:0"><div class="stud-nm">'+esc(s.name||s.username||'')+'</div><div class="stud-mail">'+esc(mail)+'</div></div>'+
           '<div style="margin-left:auto"><button class="btn ghost sm" onclick="klStudWeg(\''+esc(s.id)+'\')">✕ Entfernen</button></div>'+

       }).join(''):'<div style="color:var(--mut);font-size:13px">Noch keine Studierenden — teile den Klassencode oder Einladungslink.</div>')+

function matListHtml(mats,edit){
  if(!mats.length)return '<div style="color:var(--mut);font-size:13px">Noch keine Lernmittel.</div>';
  return mats.map(function(m){
    var isLink=!!m.link;
    var ic=isLink?'🔗':(m.datei&&m.datei.type==='application/pdf'?'📄':'🖼');
    var src=isLink?m.link:(m.datei?S.dateiSrc(m.datei):'');
    return '<div class="mat-row"><div class="mat-ic">'+ic+'</div>'+
      '<div style="min-width:0"><div class="mat-tt">'+esc(m.titel)+'</div><div class="mat-meta">'+esc(m.vonName||'')+' · '+S.fmtDatum(m.erstelltAm)+(m.beschreibung?' · '+esc(m.beschreibung):'')+'</div></div>'+
      '<div class="mat-open">'+
        (src?'<a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(src)+'">Öffnen</a>':'')+
        (edit?'<button class="btn danger sm" onclick="matWeg(\''+esc(m.id)+'\')">🗑</button>':'')+
      '</div></div>';
  }).join('');
}
function pruefListHtml(pruefungen,linkBase){
  if(!pruefungen.length)return '<div style="color:var(--mut);font-size:13px">Noch keine Prüfungen für diese Klasse.</div>';
  var u=me();
  return pruefungen.map(function(p){
    var r=S.rest(p,u?u.id:'',Date.now());
    var badge=p.status==='entwurf'?'<span class="badge grey">Entwurf</span>':
      (r.phase==='geplant'?'<span class="badge blue">Geplant · '+S.fmtZeit(p.startAm)+'</span>':
       r.phase==='laufend'?'<span class="badge grn">Läuft</span>':
       r.phase==='toleranz'?'<span class="badge amb">Toleranzzeit</span>':
       (p.publiziertAm?'<span class="badge teal">Publiziert</span>':'<span class="badge grey">Beendet</span>'));
    return '<div class="pf-row"><div style="min-width:0"><div class="pf-tt">'+esc(p.titel)+'</div><div class="pf-meta">'+S.totalPunkte(p)+' P. · '+(p.aufgaben||[]).length+' Aufgaben</div></div>'+
      '<div style="margin-left:auto;display:flex;gap:8px;align-items:center">'+badge+
      '<a class="btn ghost sm" style="text-decoration:none" href="'+linkBase+esc(p.id)+'">Öffnen</a></div></div>';
  }).join('');
}

// ── Aktionen: Stammdaten / Code / Studierende ────────────────────────
window.klStammSave=function(){
  var k=S.klasseById(_openId);if(!k)return;
  var name=document.getElementById('klName').value.trim();
  var lg=document.getElementById('klLehrgang').value.trim();
  if(name===k.name&&lg===(k.lehrgang||''))return;
  if(name)k.name=name;
  k.lehrgang=lg;
  S.saveKlasse(k).catch(function(){});
  document.getElementById('ovTitle').textContent=k.name;
};
window.klArchiv=function(on){
  var k=S.klasseById(_openId);if(!k)return;
  k.archiviert=!!on;
  S.saveKlasse(k).catch(function(){});
  renderDetail();
};
window.klLoeschen=function(){
  var k=S.klasseById(_openId);if(!k)return;
  GemaDialog.confirm({title:'Klasse löschen',message:'Klasse «'+k.name+'» endgültig löschen? Lernmittel dieser Klasse werden ebenfalls gelöscht. Prüfungen bleiben im Prüfungs-Cockpit erhalten.',confirmLabel:'Löschen',danger:true}).then(function(ok){
    if(!ok)return;
    S.materialForKlasse(k.id).forEach(function(m){S.deleteMaterial(m.id);});
    S.deleteKlasse(k.id).catch(function(){});
    klClose();
  });
};
window.klCodeNeu=function(){
  var k=S.klasseById(_openId);if(!k)return;
  GemaDialog.confirm({title:'Neuen Code erzeugen',message:'Der bisherige Klassencode wird ungültig — bereits beigetretene Studierende bleiben in der Klasse. Fortfahren?',confirmLabel:'Neuer Code'}).then(function(ok){
    if(!ok)return;
    k.code=S.codeNeu();
    S.saveKlasse(k).catch(function(){});
    renderDetail();
  });
};
function copyText(t,msg){
  var done=function(){GemaDialog.alert({title:'Kopiert',message:msg});};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(function(){window.prompt('Manuell kopieren:',t);});}
  else window.prompt('Manuell kopieren:',t);
}
window.klCopyCode=function(){
  var k=S.klasseById(_openId);if(!k)return;
  copyText(k.code||'','Klassencode «'+k.code+'» in die Zwischenablage kopiert.');
};
window.klCopyLink=function(){
  var k=S.klasseById(_openId);if(!k)return;
  var link=location.origin+location.pathname.replace(/[^\/]*$/,'')+'sys_login.html?klasse='+encodeURIComponent(k.code||'');
  copyText(link,'Einladungslink kopiert — per E-Mail oder Chat an die Studierenden senden.');
};
window.klStudWeg=function(sid){
  var k=S.klasseById(_openId);if(!k)return;
  GemaDialog.confirm({title:'Aus Klasse entfernen',message:'Studierende(n) aus der Klasse entfernen? Das GEMA-Konto bleibt bestehen.',confirmLabel:'Entfernen',danger:true}).then(function(ok){
    if(!ok)return;
    k.studentIds=(k.studentIds||[]).filter(function(x){return x!==sid;});
    S.saveKlasse(k).catch(function(){});
    renderDetail();
  });
};

// ── Modul-Freischaltung ──────────────────────────────────────────────
function bindModulChecks(k){
  var host=document.getElementById('modChecks');
  if(!host)return;
  var mods=S.calcModule();
  var cats={};
  mods.forEach(function(m){(cats[m.cat]=cats[m.cat]||[]).push(m);});
  host.innerHTML=Object.keys(cats).map(function(cat){
    return '<div class="mod-cat"><div class="mod-cat-title">'+esc(cat)+'</div><div class="mod-checks">'+
      cats[cat].map(function(m){
        var on=(k.module||[]).indexOf(m.key)>=0;
        return '<label class="mod-check'+(on?' on':'')+'"><input type="checkbox" data-modkey="'+esc(m.key)+'" '+(on?'checked':'')+'/> '+esc(m.label)+'</label>';
      }).join('')+'</div></div>';
  }).join('');
  host.querySelectorAll('input[data-modkey]').forEach(function(inp){
    inp.addEventListener('change',function(){
      var kk=S.klasseById(_openId);if(!kk)return;
      var key=inp.getAttribute('data-modkey');
      kk.module=kk.module||[];
      if(inp.checked){if(kk.module.indexOf(key)<0)kk.module.push(key);}
      else kk.module=kk.module.filter(function(x){return x!==key;});
      inp.closest('.mod-check').classList.toggle('on',inp.checked);
      S.saveKlasse(kk).catch(function(){});
    });
  });
}

// ── Lernmittel ───────────────────────────────────────────────────────
window.matNeu=function(){
  var k=S.klasseById(_openId);if(!k)return;
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*,application/pdf';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f)return;
    GemaDialog.prompt({title:'Lernmittel-Titel',placeholder:'z.B. Skript Kaltwasser Kapitel 3',defaultValue:f.name.replace(/\.[^.]+$/,'')}).then(function(titel){
      if(titel===null)return;
      S.uploadDatei(f,'schule/'+(k.orgId||'org')+'/lernmittel',{maxMb:10}).then(function(meta){
        var m={klasseId:k.id,titel:titel||f.name,beschreibung:'',datei:meta};
        S.saveMaterial(m).catch(function(){});
        S.notifyKlasse(k,{eventKey:'schule_lernmittel_neu',typ:'info',titel:'Neues Lernmittel: '+(titel||f.name),text:'In der Klasse «'+k.name+'» wurde ein neues Lernmittel bereitgestellt.',link:'ab_klassen.html?k='+k.id});
        renderDetail();
      }).catch(function(e){
        GemaDialog.alert({title:'Upload fehlgeschlagen',message:e&&e.message?e.message:'Bitte erneut versuchen.'});
      });
    });
  };
  inp.click();
};
window.matLinkNeu=function(){
  var k=S.klasseById(_openId);if(!k)return;
  GemaDialog.prompt({title:'Link hinzufügen',placeholder:'https://…',defaultValue:'https://'}).then(function(url){
    if(url===null)return;
    url=String(url).trim();
    if(!/^https?:\/\//i.test(url)){GemaDialog.alert({title:'Link',message:'Bitte eine gültige URL (https://…) eingeben.'});return;}
    GemaDialog.prompt({title:'Titel des Links',placeholder:'z.B. SVGW W3 Merkblatt',defaultValue:''}).then(function(titel){
      if(titel===null)return;
      var m={klasseId:k.id,titel:titel||url,beschreibung:'',link:url};
      S.saveMaterial(m).catch(function(){});
      S.notifyKlasse(k,{eventKey:'schule_lernmittel_neu',typ:'info',titel:'Neues Lernmittel: '+(titel||url),text:'In der Klasse «'+k.name+'» wurde ein neuer Link bereitgestellt.',link:'ab_klassen.html?k='+k.id});
      renderDetail();
    });
  });
};
window.matWeg=function(id){
  GemaDialog.confirm({title:'Lernmittel löschen',message:'Dieses Lernmittel wirklich löschen?',confirmLabel:'Löschen',danger:true}).then(function(ok){
    if(!ok)return;
    S.deleteMaterial(id).catch(function(){});
    renderDetail();
  });
};

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  if(canEdit()){
    document.getElementById('btnNeueKlasse').style.display='';
    document.getElementById('archivToggle').style.display='';
  }
  // 1) Sofort aus dem Cache rendern
  try{renderList();}catch(e){}
  // 2) Cloud-Pull (blockiert die Anzeige nicht)
  var t=new Promise(function(res){setTimeout(res,6000);});
  Promise.race([S.bind({loesungen:false}),t]).then(function(){
    _klCloudLoaded=true;
    if(S.istStudent())S.refreshStudentMods();
    renderList();
    if(_openId)renderDetail();
    S.scanErinnerungen();
    // Deep-Link ?k=<klasseId>
    try{
      var params=new URLSearchParams(location.search);
      var kid=params.get('k');
      if(kid&&S.klasseById(kid))klOpen(kid);
      // Beitritts-Code aus sys_login (?klasse=CODE bei bestehender Session)
      var joinCode=sessionStorage.getItem('gema_klasse_join');
      if(joinCode){
        sessionStorage.removeItem('gema_klasse_join');
        klBeitreten(joinCode);
      }
    }catch(e){}
  });
  window.addEventListener('gema-schule-changed',function(){
    if(!document.getElementById('klOv').classList.contains('open'))renderList();
  });
  if(typeof GemaFeedback!=='undefined')GemaFeedback.init('klassen','Klassen & Lernmittel');
});
window.renderList=renderList;
})();
</script>
<script src="gema_scroll.js"></script>
<script src="gema_mobile_menu.js"></script>
</body>
