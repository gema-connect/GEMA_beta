<!doctype html>
<html lang="de">
<head>
<script src="gema_sync.js"></script>
<script src="gema_auth.js"></script>
<script src="gema_recent.js"></script>
<meta charset="utf-8"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GEMA"/>
<title>GEMA – Klassen & Lernmittel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f3f5fb;--sur:#fff;--sur2:#f7f8fc;
  --brd:#e0e4ef;--brd2:#c8cfdf;
  --txt:#0f172a;--txt2:#334155;--mut:#64748b;--mut2:#94a3b8;
  --teal:#0f766e;--teal-bg:#f0fdfa;--teal-bd:#99f6e4;
  --grn:#16a34a;--grn-bg:#f0fdf4;--grn-bd:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amb:#d97706;--amb-bg:#fffbeb;--amb-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#93c5fd;
  --r:12px;--r-sm:8px;--r-lg:18px;
  --sh-sm:0 1px 4px rgba(0,0,0,.06);
  --sh:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --sh-lg:0 16px 48px rgba(0,0,0,.13),0 4px 16px rgba(0,0,0,.06);
  --sans:'DM Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overflow-x:hidden;overflow-x:clip}
::placeholder{color:#cbd5e1}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.g-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);box-shadow:var(--sh-sm)}
.g-nav-inner{padding:0 24px;height:52px;display:flex;align-items:center;gap:0}
.g-nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:14px}
.g-nav-bc{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.bc-cat{color:var(--mut);text-decoration:none;font-weight:600}
.bc-cat:hover{color:var(--txt)}
.bc-sep{color:var(--mut2)}
.bc-cur{font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.g-nav-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.g-nav-btn:hover{background:var(--sur2)}
.g-nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.gema-feedback-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.g-page{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
/* Hero (kompakt, Modul-Muster) */
.hero{background:linear-gradient(135deg,#0f172a,#134e4a 55%,#0f766e);border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:18px}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-left{display:flex;align-items:center;gap:14px;min-width:0}
.hero-ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.hero-title{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hero-sub{font-size:12.5px;color:#a7c3c0;margin-top:2px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700}
/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tb-btn{border:1.5px solid var(--brd2);background:var(--sur);color:var(--txt2);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.tb-btn:hover{background:var(--sur2)}
.tb-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.tb-btn.primary:hover{background:#0d5f59}
.tb-spacer{flex:1}
.tb-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600;cursor:pointer}
/* Grid + Karten */
.kl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kl-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:0;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.kl-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.kl-card-bar{height:5px;background:linear-gradient(90deg,#0f766e,#14b8a6)}
.kl-card.archiv .kl-card-bar{background:#cbd5e1}
.kl-card-body{padding:14px 16px 12px;flex:1}
.kl-card-hd{display:flex;align-items:flex-start;gap:10px}
.kl-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-bg);border:1px solid var(--teal-bd);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.kl-name{font-size:15px;font-weight:800;line-height:1.25}
.kl-lehrgang{font-size:12px;color:var(--mut);margin-top:1px}
.kl-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.kl-stat{background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--txt2)}
.kl-card-ft{padding:9px 16px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:800}
.badge.teal{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd)}
.badge.grey{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.badge.amb{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bd)}
.badge.grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bd)}
.badge.blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
/* Empty / Loader */
.empty{background:var(--sur);border:1.5px dashed var(--brd2);border-radius:var(--r-lg);padding:44px 20px;text-align:center;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:10px}
.spinner-wrap{display:flex;justify-content:center;padding:50px 0;color:var(--mut)}
/* Detail-Overlay */
.ov{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.ov.open{display:block}
.ov-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;gap:12px}
.ov-back{border:1.5px solid var(--brd2);background:var(--sur);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.ov-title{font-size:15.5px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-body{max-width:1000px;margin:0 auto;padding:18px 20px 90px}
/* Panels */
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:16px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--brd);background:var(--sur2)}
.panel-hd-title{font-size:13.5px;font-weight:800}
.panel-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-body{padding:16px 18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--brd2);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;background:var(--sur);color:var(--txt)}
.inp:focus{outline:none;border-color:var(--teal)}
textarea.inp{min-height:74px;resize:vertical}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#0d5f59}
.btn.ghost{background:var(--sur);border:1.5px solid var(--brd2);color:var(--txt2)}
.btn.ghost:hover{background:var(--sur2)}
.btn.danger{background:var(--red-bg);border:1.5px solid var(--red-bd);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
/* Code-Anzeige */
.code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code-big{font-size:30px;font-weight:900;letter-spacing:7px;background:var(--teal-bg);border:1.5px dashed var(--teal-bd);color:var(--teal);border-radius:12px;padding:10px 20px;font-variant-numeric:tabular-nums}
/* Studierenden-Liste */
.stud-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--brd)}
.stud-row:last-child{border-bottom:none}
.stud-av{width:32px;height:32px;border-radius:50%;background:var(--teal-bg);border:1px solid var(--teal-bd);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.stud-nm{font-weight:700;font-size:13.5px}
.stud-mail{font-size:12px;color:var(--mut)}
/* Modul-Auswahl */
.mod-cat{margin-bottom:14px}
.mod-cat-title{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.mod-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.mod-check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--brd);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;background:var(--sur)}
.mod-check:hover{border-color:var(--brd2)}
.mod-check.on{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal)}
.mod-check input{width:15px;height:15px;accent-color:var(--teal);flex-shrink:0}
/* Modul-Kacheln (Studierende) */
.mod-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.mod-tile{display:flex;align-items:center;gap:9px;border:1.5px solid var(--brd);border-radius:11px;padding:11px 13px;text-decoration:none;color:var(--txt);font-weight:700;font-size:13px;background:var(--sur);transition:.13s}
.mod-tile:hover{border-color:var(--teal-bd);background:var(--teal-bg)}
.mod-tile .arrow{margin-left:auto;color:var(--teal)}
/* Lernmittel */
.mat-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--brd)}
.mat-row:last-child{border-bottom:none}
.mat-ic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);border:1px solid var(--blue-bd);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mat-tt{font-weight:700;font-size:13.5px}
.mat-meta{font-size:11.5px;color:var(--mut)}
.mat-open{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
/* Prüfungs-Zeile */
.pf-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)}
.pf-row:last-child{border-bottom:none}
.pf-tt{font-weight:700;font-size:13.5px}
.pf-meta{font-size:11.5px;color:var(--mut)}
/* Footer */
.foot{margin-top:36px;text-align:center;color:var(--mut2);font-size:12px}
.foot a{color:var(--mut);text-decoration:none;margin:0 8px}
@media(max-width:640px){
  .g-page{padding:14px 14px 70px}
  .hero{padding:14px 16px}
  .hero-title{font-size:17px}
  .hero-pills{display:none}
  .ov-body{padding:14px 14px 90px}
  .code-big{font-size:22px;letter-spacing:4px;padding:8px 14px}
}
/* Upload-Fortschritt (Lernmittel) — ein mehrere MB grosses Skript laedt
   spuerbar lange; ohne Rueckmeldung wirkt die Seite eingefroren. */
.up-bg{position:fixed;inset:0;z-index:12000;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.up-card{background:var(--sur);border-radius:var(--r-lg);box-shadow:var(--sh);padding:22px 24px;width:100%;max-width:380px}
.up-t{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:4px}
.up-f{font-size:12.5px;color:var(--mut);margin-bottom:14px;word-break:break-word}
.up-track{height:8px;border-radius:99px;background:var(--sur2);border:1px solid var(--brd);overflow:hidden}
.up-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--grn));border-radius:99px;transition:width .18s ease}
.up-fill.unbestimmt{width:35%;animation:upSlide 1.1s ease-in-out infinite}
@keyframes upSlide{0%{margin-left:-35%}100%{margin-left:100%}}
.up-s{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12.5px;color:var(--mut)}
.up-pct{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
/* ── Lernmittel-Reader (Feedback 05.08.2026) ─────────────────────────
   Lehrmittel wählen, markieren/beschreiben und komplett oder seitenweise
   teilen. Aufbau wie der Plan-Viewer in pm_planablage: pdf.js auf Canvas,
   SVG-Overlay darüber, Markierungen auf die Seitengrösse normiert (0..1). */
.lm-bg{position:fixed;inset:0;z-index:11800;background:#0f172a;display:none;flex-direction:column}
.lm-bg.on{display:flex}
.lm-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#111827;border-bottom:1px solid #1f2937;flex-wrap:wrap;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.lm-tt{color:#f8fafc;font-weight:800;font-size:13.5px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-btn{height:32px;min-width:32px;padding:0 9px;border-radius:8px;border:1px solid #334155;background:#1f2937;color:#e2e8f0;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.lm-btn:hover{background:#334155}
.lm-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.lm-btn:disabled{opacity:.4;cursor:default}
.lm-farb{width:24px;height:24px;border-radius:50%;border:2px solid #475569;cursor:pointer;padding:0}
.lm-farb.on{border-color:#fff;box-shadow:0 0 0 2px var(--teal)}
.lm-sp{flex:1}
.lm-pg{color:#cbd5e1;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lm-save{color:#94a3b8;font-size:11.5px;min-width:82px;text-align:right}
.lm-body{flex:1;overflow:auto;display:flex;justify-content:center;padding:16px;-webkit-overflow-scrolling:touch}
.lm-stage{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff;align-self:flex-start}
.lm-stage canvas{display:block}
.lm-stage svg{position:absolute;inset:0;touch-action:none}
.lm-shp{cursor:pointer}
.lm-shp.sel{filter:drop-shadow(0 0 3px #0ea5e9)}
.lm-fremd{opacity:.85}
.lm-panel{position:absolute;top:52px;right:12px;z-index:5;background:var(--sur);border:1px solid var(--brd);border-radius:12px;padding:10px 12px;box-shadow:var(--sh);min-width:230px;max-width:min(320px,88vw);max-height:70vh;overflow:auto}
.lm-panel h4{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.lm-nrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt);padding:5px 0;cursor:pointer}
.lm-nrow input{margin:0}
.lm-ndot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lm-nsub{font-size:10.5px;color:var(--mut)}
.lm-leer{color:var(--mut);font-size:12px}
@media(max-width:640px){.lm-tt{max-width:40vw}.lm-hd{gap:5px;padding:7px 8px}.lm-body{padding:8px}}
</style>

</head>

<script>
(function(){
'use strict';

var S=window.GemaSchule;
var _klCloudLoaded=false;
var _openId=null;

function me(){return (typeof GemaAuth!=='undefined'&&GemaAuth.getCurrentUser())||null;}
function canEdit(){return typeof GemaAuth!=='undefined'&&GemaAuth.can('write','klassen');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ── Klassen-Chatgruppe (alle Studierenden + Dozenten) ────────────────
// Stabile Thread-ID pro Klasse (chtgrp_klasse_<id>): Mitglieder-Änderungen
// synchronisieren den BESTEHENDEN Thread (Nachrichten bleiben), ein
// zweiter Aufruf legt nie einen zweiten an (idempotent). Läuft beim Boot
// (Dozent UND Studierende), beim Beitritt und beim Entfernen.
function klChatSync(k){
  try{
    if(typeof GemaChat==='undefined'||!GemaChat.ensureGruppe||!k||!k.id)return;
    GemaChat.ensureGruppe({gruppeId:'klasse_'+k.id,titel:k.name,
      userIds:(k.dozentIds||[]).concat(k.studentIds||[]),
      kontext:{typ:'klasse',refId:k.id,label:k.name,url:'ab_klassen.html?k='+k.id}});
  }catch(e){}
}

// ── Liste ────────────────────────────────────────────────────────────
function renderHero(){
  var kl=S.meineKlassen().filter(function(k){return !k.archiviert;});
  var pills=document.getElementById('heroPills');
  var nStud=0;kl.forEach(function(k){nStud+=(k.studentIds||[]).length;});
  if(canEdit()){
    pills.innerHTML='<span class="hero-pill">'+kl.length+' Klassen</span><span class="hero-pill">'+nStud+' Studierende</span>';
    document.getElementById('heroSub').textContent='Klassen führen · Berechnungsmodule freischalten · Lernmittel teilen';
  }else{
    pills.innerHTML='<span class="hero-pill">'+kl.length+' Klassen</span>';
    document.getElementById('heroSub').textContent='Deine Klassen · Lernmittel · freigeschaltete Berechnungsmodule';
  }
}
function renderList(){
  var wrap=document.getElementById('listWrap');
  var zeigeArchiv=document.getElementById('chkArchiv').checked;
  var kl=S.meineKlassen().filter(function(k){return zeigeArchiv||!k.archiviert;});
  kl.sort(function(a,b){return String(b.erstelltAm||'').localeCompare(String(a.erstelltAm||''));});
  renderHero();
  if(!kl.length){
    if(!_klCloudLoaded){
      wrap.innerHTML='<div class="spinner-wrap"><svg width="34" height="34" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="90 60" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg></div>';
      return;
    }
    wrap.innerHTML='<div class="empty"><div class="big">🎓</div><div style="font-weight:800;font-size:15px;margin-bottom:5px">'+(canEdit()?'Noch keine Klasse':'Du bist noch in keiner Klasse')+'</div><div style="font-size:12.5px">'+(canEdit()?'Erstelle deine erste Klasse und teile den Klassencode mit den Studierenden.':'Tritt mit dem Klassencode deines Dozenten einer Klasse bei.')+'</div></div>';
    return;
  }
  var isDoz=canEdit();
  wrap.innerHTML='<div class="kl-grid">'+kl.map(function(k){
    var mats=S.materialForKlasse(k.id).length;
    var pruef=(isDoz?S.pruefungenForDozent():S.pruefungenForStudent()).filter(function(p){return p.klasseId===k.id;}).length;
    return '<div class="kl-card'+(k.archiviert?' archiv':'')+'" onclick="klOpen(\''+k.id+'\')">'+
      '<div class="kl-card-bar"></div>'+
      '<div class="kl-card-body">'+
        '<div class="kl-card-hd"><div class="kl-ic">🎓</div><div style="min-width:0"><div class="kl-name">'+esc(k.name)+'</div><div class="kl-lehrgang">'+esc(k.lehrgang||'')+'</div></div></div>'+
        '<div class="kl-stats">'+
          '<span class="kl-stat">👥 '+(k.studentIds||[]).length+' Studierende</span>'+
          '<span class="kl-stat">🧮 '+(k.module||[]).length+' Module</span>'+
          '<span class="kl-stat">📚 '+mats+' Lernmittel</span>'+
          '<span class="kl-stat">📝 '+pruef+' Prüfungen</span>'+
        '</div>'+
      '</div>'+
      '<div class="kl-card-ft"><span>'+(k.archiviert?'Archiviert':'Erstellt '+S.fmtDatum(k.erstelltAm))+'</span><span style="color:var(--teal);font-weight:800">Öffnen →</span></div>'+
    '</div>';
  }).join('')+'</div>';
}

// ── Klasse anlegen / beitreten ───────────────────────────────────────
window.klNeu=function(){
  GemaDialog.prompt({title:'Neue Klasse',placeholder:'z.B. Kaltwasser HF_GT 2026',defaultValue:''}).then(function(name){
    if(name===null)return;
    name=String(name).trim();
    if(!name){GemaDialog.alert({title:'Klasse',message:'Bitte einen Namen eingeben.'});return;}
    var k={name:name,lehrgang:'',module:[],studentIds:[],archiviert:false};
    S.saveKlasse(k).then(function(){renderList();klOpen(k.id);}).catch(function(){renderList();klOpen(k.id);});
  });
};
window.klBeitreten=function(code){
  var open=function(val){
    if(val===null)return;
    var k=S.findKlasseByCode(val);
    if(!k){GemaDialog.alert({title:'Klasse beitreten',message:'Klassencode nicht gefunden. Bitte Code prüfen — oder die Seite neu laden, falls die Klasse gerade erst erstellt wurde.'});return;}
    var u=me();if(!u)return;
    k.studentIds=k.studentIds||[];
    if(k.studentIds.indexOf(u.id)>=0){GemaDialog.alert({title:'Klasse beitreten',message:'Du bist bereits Mitglied der Klasse «'+k.name+'».'});return;}
    GemaDialog.confirm({title:'Klasse beitreten',message:'Der Klasse «'+k.name+'»'+(k.lehrgang?' ('+k.lehrgang+')':'')+' beitreten?',confirmLabel:'Beitreten'}).then(function(ok){
      if(!ok)return;
      k.studentIds.push(u.id);
      S.saveKlasse(k).catch(function(){});
      S.notifyDozenten(k,{eventKey:'schule_klasse_beitritt',typ:'info',titel:'Neues Klassenmitglied',text:(u.name||u.username)+' ist der Klasse «'+k.name+'» beigetreten.',link:'ab_klassen.html?k='+k.id});
      S.refreshStudentMods();
      klChatSync(k);
      renderList();
    });
  };
  if(code){open(code);return;}
  GemaDialog.prompt({title:'Klasse beitreten',placeholder:'Klassencode, z.B. K7M2XA',defaultValue:''}).then(open);
};

// ── Detail ───────────────────────────────────────────────────────────
// Selbstheilung (KRITISCH): Verschwindet die geöffnete Klasse aus dem
// lokalen Pool (z.B. weil ein verspäteter Cloud-Snapshot ihn überschrieben
// hat), liefen früher ALLE Handler über `klasseById(_openId) → null` still
// ins Leere — Name tippen und Module anhaken sah funktionierend aus,
// gespeichert wurde nichts. klAktuell() hält deshalb die zuletzt bekannte
// Fassung als Schnappschuss; fehlt die Klasse im Pool, wird auf ihr
// weitergearbeitet und das nächste saveKlasse legt sie wieder in
// Pool + Cloud (Eingaben gehen NIE mehr still verloren).
var _openSnap=null;
function klAktuell(){
  var k=S.klasseById(_openId);
  if(k){_openSnap=k;return k;}          // LIVE-Referenz: Handler mutieren + speichern sofort —
  if(_openSnap&&_openSnap.id===_openId) // der Schnappschuss trägt damit immer den letzten Stand
    return _openSnap;                   // (eine Kopie verlöre bei ZWEI Heilungen die erste Änderung).
  return null;
}
window.klOpen=function(id){
  _openId=id;
  _openSnap=null;
  document.getElementById('klOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderDetail();
};
window.klClose=function(){
  _openId=null;
  _openSnap=null;
  document.getElementById('klOv').classList.remove('open');
  document.body.style.overflow='';
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  renderList();
};
function renderDetail(){
  var k=klAktuell();
  var body=document.getElementById('ovBody');
  if(!k){body.innerHTML='<div class="empty">Klasse nicht gefunden.</div>';return;}
  document.getElementById('ovTitle').textContent=k.name;
  document.getElementById('ovBadge').style.display=k.archiviert?'':'none';
  body.innerHTML=canEdit()?detailDozentHtml(k):detailStudentHtml(k);
  if(canEdit())bindModulChecks(k);
}

// ── Detail: Dozent ───────────────────────────────────────────────────
function detailDozentHtml(k){
  var u=me();
  var users=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers)?(GemaAuth.getUsers()||[]):[];
  var joinLink=location.origin+location.pathname.replace(/[^\/]*$/,'')+'sys_login.html?klasse='+encodeURIComponent(k.code||'');
  var studs=(k.studentIds||[]).map(function(sid){
    return users.find(function(x){return x.id===sid;})||{id:sid,name:'Unbekannt ('+sid+')'};
  });
  var mats=S.materialForKlasse(k.id);
  var pruefungen=S.pruefungenForDozent().filter(function(p){return p.klasseId===k.id;});

  var h='';
  // Stammdaten
  h+='<div class="panel"><div class="panel-hd"><span>🎓</span><span class="panel-hd-title">Stammdaten</span>'+
     '<div class="right">'+
       (k.archiviert
         ?'<button class="btn ghost sm" onclick="klArchiv(false)">↩ Reaktivieren</button>'
         :'<button class="btn ghost sm" onclick="klArchiv(true)">🗄 Archivieren</button>')+
       '<button class="btn danger sm" onclick="klLoeschen()">🗑</button>'+
     '</div></div>'+
     '<div class="panel-body">'+
       '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
         '<div class="fg"><label>Klassenname</label><input class="inp" id="klName" value="'+esc(k.name)+'" onblur="klStammSave()"/></div>'+
         '<div class="fg"><label>Lehrgang</label><input class="inp" id="klLehrgang" value="'+esc(k.lehrgang||'')+'" placeholder="z.B. HF Gebäudetechnik" onblur="klStammSave()"/></div>'+
       '</div>'+
     '</div></div>';
  // Einladung
  h+='<div class="panel"><div class="panel-hd"><span>✉️</span><span class="panel-hd-title">Einladung & Klassencode</span></div>'+
     '<div class="panel-body">'+
       '<div class="code-box">'+
         '<div class="code-big">'+esc(k.code||'—')+'</div>'+
         '<div style="display:flex;flex-direction:column;gap:8px">'+
           '<button class="btn primary sm" onclick="klCopyLink()">🔗 Einladungslink kopieren</button>'+
           '<button class="btn ghost sm" onclick="klCopyCode()">📋 Code kopieren</button>'+
           '<button class="btn ghost sm" onclick="klCodeNeu()">↻ Neuen Code erzeugen</button>'+
         '</div>'+
       '</div>'+
       '<div style="font-size:12px;color:var(--mut);margin-top:12px">Studierende registrieren sich selbst unter <b>'+esc(joinLink)+'</b> — sie landen automatisch in dieser Klasse. Bestehende GEMA-Konten treten mit demselben Code über «Klasse beitreten» bei.</div>'+
     '</div></div>';
  // Studierende
  h+='<div class="panel"><div class="panel-hd"><span>👥</span><span class="panel-hd-title">Studierende ('+studs.length+')</span></div>'+
     '<div class="panel-body">'+
       (studs.length?studs.map(function(s){
         var ini=(s.name||'?').split(/\s+/).map(function(x){return x[0]||'';}).join('').slice(0,2).toUpperCase();
         var mail=(s.profile&&s.profile.email)||s.username||'';
         return '<div class="stud-row"><div class="stud-av">'+esc(ini)+'</div>'+
           '<div style="min-width:0"><div class="stud-nm">'+esc(s.name||s.username||'')+'</div><div class="stud-mail">'+esc(mail)+'</div></div>'+
           '<div style="margin-left:auto"><button class="btn ghost sm" onclick="klStudWeg(\''+esc(s.id)+'\')">✕ Entfernen</button></div>'+
         '</div>';
       }).join(''):'<div style="color:var(--mut);font-size:13px">Noch keine Studierenden — teile den Klassencode oder Einladungslink.</div>')+
     '</div></div>';
  // Module
  h+='<div class="panel"><div class="panel-hd"><span>🧮</span><span class="panel-hd-title">Freigeschaltete Berechnungsmodule ('+(k.module||[]).length+')</span></div>'+

function matListHtml(mats,edit){
  if(!mats.length)return '<div style="color:var(--mut);font-size:13px">Noch keine Lernmittel.</div>';
  return mats.map(function(m){
    var isLink=!!m.link;
    var ic=isLink?'🔗':(m.datei&&m.datei.type==='application/pdf'?'📄':'🖼');
    var src=isLink?m.link:(m.datei?S.dateiSrc(m.datei):'');
    // Feedback 05.08.2026: das Lernmittel ist WÄHLBAR — es öffnet in GEMA
    // (markieren/beschreiben/teilen) statt nur als roher Datei-Link.
    var lesbar=!isLink&&!!src;
    var eigene=lesbar?(S.meineNotiz(m.id)||null):null;
    var nMeine=eigene?lmZaehl(eigene):0;
    var fremde=lesbar?S.notizenFor(m.id).filter(function(n){return !eigene||n.id!==eigene.id;}):[];
    var marken='';
    if(nMeine)marken+=' · <span style="color:var(--teal);font-weight:700">✏ '+nMeine+' eigene Markierung'+(nMeine===1?'':'en')+'</span>';
    if(fremde.length)marken+=' · <span style="color:var(--vio,#7c3aed);font-weight:700">👥 '+fremde.length+' geteilt</span>';
    if(eigene&&eigene.geteilt&&eigene.geteilt.aktiv)marken+=' · <span style="color:var(--grn)">↗ von dir geteilt</span>';
    return '<div class="mat-row"'+(lesbar?' style="cursor:pointer" onclick="lmOpen(\''+esc(m.id)+'\')" title="Öffnen &amp; markieren"':'')+'><div class="mat-ic">'+ic+'</div>'+
      '<div style="min-width:0"><div class="mat-tt">'+esc(m.titel)+'</div><div class="mat-meta">'+esc(m.vonName||'')+' · '+S.fmtDatum(m.erstelltAm)+(m.beschreibung?' · '+esc(m.beschreibung):'')+marken+'</div></div>'+
      '<div class="mat-open" onclick="event.stopPropagation()">'+
        (lesbar?'<button class="btn primary sm" onclick="lmOpen(\''+esc(m.id)+'\')">📖 Öffnen &amp; markieren</button>':'')+
        (src?'<a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(src)+'">'+(lesbar?'↗':'Öffnen')+'</a>':'')+
        (edit?'<button class="btn danger sm" onclick="matWeg(\''+esc(m.id)+'\')">🗑</button>':'')+
      '</div></div>';
  }).join('');
}
// Anzahl Markierungen über alle Seiten einer Notiz
function lmZaehl(n){
  var t=0,s=(n&&n.seiten)||{};
  Object.keys(s).forEach(function(k){t+=(s[k]||[]).length;});
  return t;
}

// Fortschrittsanzeige: der Upload eines mehrere MB grossen Skripts dauert
// spuerbar; ohne Rueckmeldung wirkt die Seite eingefroren und man klickt
// ein zweites Mal.
function upMb(b){return (b/1048576).toFixed(1).replace('.',',')+' MB';}
function upOpen(f){
  document.getElementById('upDatei').textContent=f.name+' · '+upMb(f.size);
  upSet(0,'upload');
  document.getElementById('upOv').style.display='flex';
}
function upSet(pct,phase){
  var fill=document.getElementById('upFill'),p=document.getElementById('upPct'),ph=document.getElementById('upPhase');
  if(!fill)return;
  if(phase==='pruefen'||phase==='fertig'){
    // Nach dem Senden prueft GemaStorage, ob die Datei oeffentlich ladbar
    // ist — das dauert nochmals einen Moment und ist kein Stillstand.
    fill.classList.remove('unbestimmt');fill.style.width='100%';
    p.textContent='100 %';
    ph.textContent=(phase==='fertig')?'Fertig':'Wird geprüft …';
    return;
  }
  fill.classList.remove('unbestimmt');
  fill.style.width=pct+'%';
  p.textContent=pct+' %';
  ph.textContent='Wird übertragen …';
}
function upVerkleinern(){
  // Bilder werden vor dem Upload verkleinert — dafuer gibt es keinen
  // Prozentwert, darum ein laufender Balken statt einer Luege.
  var fill=document.getElementById('upFill');
  if(!fill)return;
  fill.classList.add('unbestimmt');fill.style.width='';
  document.getElementById('upPct').textContent='';
  document.getElementById('upPhase').textContent='Bild wird verkleinert …';
}
function upClose(){var o=document.getElementById('upOv');if(o)o.style.display='none';}
window._upHooks={open:upOpen,set:upSet,verkleinern:upVerkleinern,close:upClose};

window.matNeu=function(){
  var k=klAktuell();if(!k)return;
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*,application/pdf';
  // KRITISCH: Der Input MUSS im DOM haengen. WebKit raeumt einen losgeloesten
  // Input weg, waehrend der Dateidialog offen ist — das change-Event kommt
  // dann nie und die Auswahl verschwindet kommentarlos (iOS-GC-Regel).
  inp.style.display='none';
  document.body.appendChild(inp);
  var weg=function(){try{inp.remove();}catch(e){}};
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f){weg();return;}
    GemaDialog.prompt({title:'Lernmittel-Titel',placeholder:'z.B. Skript Kaltwasser Kapitel 3',defaultValue:f.name.replace(/\.[^.]+$/,'')}).then(function(titel){
      weg();
      if(titel===null)return;
      upOpen(f);
      // Bild: bis der Upload startet laeuft das Verkleinern — dafuer gibt
      // es keinen Prozentwert, also erst ein unbestimmter Balken.
      if(/^image\//.test(f.type))upVerkleinern();
      S.uploadDatei(f,'schule/'+(k.orgId||'org')+'/lernmittel',{maxMb:10,onProgress:upSet}).then(function(meta){
        var m={klasseId:k.id,titel:titel||f.name,beschreibung:'',datei:meta};
        S.saveMaterial(m).catch(function(){});
        S.notifyKlasse(k,{eventKey:'schule_lernmittel_neu',typ:'info',titel:'Neues Lernmittel: '+(titel||f.name),text:'In der Klasse «'+k.name+'» wurde ein neues Lernmittel bereitgestellt.',link:'ab_klassen.html?k='+k.id});
        upClose();
        renderDetail();
      }).catch(function(e){
        upClose();
        GemaDialog.alert({title:'Upload fehlgeschlagen',message:e&&e.message?e.message:'Bitte erneut versuchen.'});
      });
    },function(){weg();});
  };
  inp.click();
};

/* ══════════════════════════════════════════════════════════════════════
   LERNMITTEL-READER (Feedback 05.08.2026)
   «Lehrmittel soll wählbar sein» · «individuell markierbar und beschreibbar»
   · «komplett oder teilweise (Seitenzahlen) geteilt werden können».

   Aufbau bewusst wie der Plan-Viewer in pm_planablage (bewährtes Muster):
   pdf.js rendert die Seite auf ein Canvas, darüber liegt ein SVG-Overlay mit
   derselben Transformation. ALLE Markierungen sind auf die Seitengrösse
   NORMIERT (0..1) — sie sitzen damit unabhängig von Zoom und Gerät richtig.
   Bilder (kein PDF) werden als einseitiges «Dokument» behandelt.

   KRITISCH: Die eigenen Notizen werden IMMER vollständig gespeichert; die
   Freigabe (komplett / Seiten von–bis) ist eine reine LESE-Regel im API
   (`notizSeitenBereich`). Ein Filter beim Speichern würde beim nächsten
   Save die nicht freigegebenen Seiten löschen.
   ══════════════════════════════════════════════════════════════════════ */
var LM={mat:null,klasse:null,pdf:null,seite:1,seiten:1,scale:0,tool:'marker',
        farbe:'#f59e0b',shapes:{},sel:null,dirty:false,temp:'',pts:null,
        bild:null,fremd:{},fremdVis:{},notiz:null};
var LM_FARBEN=['#f59e0b','#dc2626','#2563eb','#16a34a','#7c3aed'];
var LM_TOOLS=[{id:'hand',ic:'🖐',t:'Auswahl'},{id:'marker',ic:'🖍',t:'Markieren'},
              {id:'frei',ic:'✏️',t:'Freihand'},{id:'text',ic:'T',t:'Text'},
              {id:'rect',ic:'▭',t:'Rechteck'}];
var _lmT=null;

function lmId(x){return (x||'shp')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function $lm(id){return document.getElementById(id);}
function lmPdfLib(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib)return res(window.pdfjsLib);
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){
      try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
      res(window.pdfjsLib);
    };
    s.onerror=function(){rej(new Error('pdf.js nicht erreichbar'));};
    document.head.appendChild(s);
  });
}

window.lmOpen=function(matId){
  var mats=[],k=null;
  (S.meineKlassen()||[]).forEach(function(kl){
    S.materialForKlasse(kl.id).forEach(function(m){if(m.id===matId){k=kl;mats.push(m);}});
  });
  var m=mats[0];
  if(!m){GemaDialog.alert({title:'Lernmittel',message:'Dieses Lernmittel ist nicht (mehr) verfügbar.'});return;}
  var src=m.datei?S.dateiSrc(m.datei):'';
  if(!src){GemaDialog.alert({title:'Lernmittel',message:'Zu diesem Eintrag gibt es keine Datei zum Markieren — Links öffnen extern.'});return;}
  LM.mat=m;LM.klasse=k;LM.seite=1;LM.scale=0;LM.sel=null;LM.dirty=false;LM.temp='';LM.pdf=null;LM.bild=null;
  LM.tool='marker';LM.farbe=LM_FARBEN[0];
  LM.notiz=S.meineNotiz(m.id)||{matId:m.id,klasseId:m.klasseId,seiten:{},geteilt:null};
  LM.shapes=JSON.parse(JSON.stringify(LM.notiz.seiten||{}));
  // Fremde (mit mir geteilte) Notizen — Anzeige-Layer, nie editierbar
  LM.fremd={};LM.fremdVis={};
  S.notizenFor(m.id).forEach(function(n){
    var u=me();
    if(u&&n.userId===u.id)return;
    LM.fremd[n.id]=n;LM.fremdVis[n.id]=true;
  });
  $lm('lmTitel').textContent=m.titel||'Lernmittel';
  $lm('lmOv').classList.add('on');
  $lm('lmPanel').style.display='none';
  try{if(window.GemaScroll)GemaScroll.lock();}catch(e){}
  lmTools();lmSaveState('');
  var istPdf=(m.datei&&m.datei.type==='application/pdf')||/\.pdf(\?|$)/i.test(src);
  if(istPdf){
    lmPdfLib().then(function(lib){return lib.getDocument({url:src}).promise;}).then(function(pdf){
      LM.pdf=pdf;LM.seiten=pdf.numPages;lmRender();
    }).catch(function(e){
      lmFehler('PDF konnte nicht geladen werden'+(navigator.onLine?'':' — offline')+'. Über «↗» öffnest du die Datei direkt.');
    });
  }else{
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){LM.bild=img;LM.seiten=1;lmRender();};
    img.onerror=function(){lmFehler('Bild konnte nicht geladen werden.');};
    img.src=src;
  }
};
function lmFehler(txt){
  var c=$lm('lmCanvas');c.width=760;c.height=200;
  var g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#b91c1c';g.font='600 15px system-ui,sans-serif';g.textAlign='center';
  g.fillText(txt,c.width/2,c.height/2);
  lmSizeSvg(c.width,c.height);
  $lm('lmSvg').innerHTML='';
  $lm('lmPg').textContent='–';
}
window.lmClose=function(){
  lmFlush();
  $lm('lmOv').classList.remove('on');
  try{if(window.GemaScroll)GemaScroll.unlock();}catch(e){}
  LM.pdf=null;LM.bild=null;LM.mat=null;
  renderDetail();
};
window.lmSeite=function(d){
  var n=LM.seite+d;
  if(n<1||n>LM.seiten)return;
  lmFlush();LM.seite=n;LM.sel=null;lmRender();
};
window.lmZoom=function(d){
  LM.scale=Math.min(4,Math.max(0.35,(LM.scale||1)+d*0.2));
  lmRender();
};
window.lmTool=function(t){LM.tool=t;LM.sel=null;lmTools();lmDraw();lmDelState();};
window.lmFarbe=function(f){LM.farbe=f;lmTools();};
function lmTools(){
  $lm('lmTools').innerHTML=LM_TOOLS.map(function(t){
    return '<button class="lm-btn'+(LM.tool===t.id?' on':'')+'" title="'+esc(t.t)+'" onclick="lmTool(\''+t.id+'\')">'+t.ic+'</button>';
  }).join('');
  $lm('lmFarben').innerHTML=LM_FARBEN.map(function(f){
    return '<button class="lm-farb'+(LM.farbe===f?' on':'')+'" style="background:'+f+'" onclick="lmFarbe(\''+f+'\')" title="Farbe"></button>';
  }).join('');
  var nb=$lm('lmNotizBtn');
  var anz=Object.keys(LM.fremd).length;
  if(nb)nb.textContent='👥 Notizen'+(anz?' ('+anz+')':'');
}
function lmSizeSvg(w,h){
  var svg=$lm('lmSvg');
  svg.setAttribute('width',w);svg.setAttribute('height',h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  var st=$lm('lmStage');st.style.width=w+'px';st.style.height=h+'px';
}
function lmRender(){
  var body=$lm('lmBody'),c=$lm('lmCanvas');
  if(LM.bild){
    if(!LM.scale)LM.scale=Math.max(0.35,Math.min(2,(body.clientWidth-40)/LM.bild.naturalWidth));
    c.width=Math.round(LM.bild.naturalWidth*LM.scale);
    c.height=Math.round(LM.bild.naturalHeight*LM.scale);
    c.getContext('2d').drawImage(LM.bild,0,0,c.width,c.height);
    lmSizeSvg(c.width,c.height);
    $lm('lmPg').textContent='Bild';
    lmDraw();lmPanelRender();
    return;
  }
  if(!LM.pdf)return;
  LM.pdf.getPage(LM.seite).then(function(page){
    var vw1=page.getViewport({scale:1});
    if(!LM.scale)LM.scale=Math.max(0.35,Math.min(2.5,(body.clientWidth-40)/vw1.width));
    var vp=page.getViewport({scale:LM.scale});
    c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    lmSizeSvg(c.width,c.height);
    $lm('lmPg').textContent='Seite '+LM.seite+' / '+LM.seiten;
    return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }).then(function(){lmDraw();lmPanelRender();}).catch(function(){});
}
function lmW(){return $lm('lmCanvas').width;}
function lmH(){return $lm('lmCanvas').height;}
function lmX(n){return n*lmW();}
function lmY(n){return n*lmH();}
function lmSeiteShapes(){
  var k=String(LM.seite);
  if(!LM.shapes[k])LM.shapes[k]=[];
  return LM.shapes[k];
}
function lmShapeSvg(s,fremd,nameKurz){
  var col=s.farbe||'#f59e0b';
  var sw=Math.max(1.6,lmW()*0.0024);
  var cls='lm-shp'+(LM.sel===s.id?' sel':'')+(fremd?' lm-fremd':'');
  var attr=' class="'+cls+'"'+(fremd?'':' data-sid="'+s.id+'"')+' fill="none" stroke="'+col+'" stroke-width="'+sw+'"';
  if(s.typ==='marker'){
    // Markieren = halbtransparenter Balken (wie ein Leuchtstift)
    var x=lmX(Math.min(s.x1,s.x2)),y=lmY(Math.min(s.y1,s.y2));
    var w=Math.abs(lmX(s.x2)-lmX(s.x1)),h=Math.abs(lmY(s.y2)-lmY(s.y1));
    return '<rect class="'+cls+'"'+(fremd?'':' data-sid="'+s.id+'"')+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(6,h)+'" fill="'+col+'" fill-opacity="0.34" stroke="none" rx="2"/>';
  }
  if(s.typ==='rect')return '<rect'+attr+' x="'+lmX(Math.min(s.x1,s.x2))+'" y="'+lmY(Math.min(s.y1,s.y2))+'" width="'+Math.abs(lmX(s.x2)-lmX(s.x1))+'" height="'+Math.abs(lmY(s.y2)-lmY(s.y1))+'" rx="3"/>';
  if(s.typ==='frei'){
    var pts=(s.pts||[]).map(function(p){return lmX(p[0]).toFixed(1)+','+lmY(p[1]).toFixed(1);}).join(' ');
    return '<polyline'+attr+' points="'+pts+'" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  if(s.typ==='text'){
    var fs=Math.max(11,lmW()*0.016);
    return '<text class="'+cls+'"'+(fremd?'':' data-sid="'+s.id+'"')+' x="'+lmX(s.x1)+'" y="'+lmY(s.y1)+'" fill="'+col+'" font-size="'+fs+'" paint-order="stroke" stroke="#ffffff" stroke-width="'+(fs*0.18)+'">'+esc((nameKurz?nameKurz+': ':'')+(s.text||''))+'</text>';
  }
  return '';
}
// Fremde Notizen dieser Seite (nur freigegebene Seiten — Lese-Regel im API)
function lmFremdShapes(){
  var out=[];
  Object.keys(LM.fremd).forEach(function(id){
    if(!LM.fremdVis[id])return;
    var n=LM.fremd[id];
    var br=S.notizSeitenBereich(n);
    if(br&&(LM.seite<br.von||LM.seite>br.bis))return;
    var arr=(n.seiten||{})[String(LM.seite)]||[];
    var kurz=(n.userName||'').split(' ')[0]||'';
    arr.forEach(function(s){out.push(lmShapeSvg(s,true,s.typ==='text'?kurz:''));});
  });
  return out.join('');
}
function lmDraw(){
  var svg=$lm('lmSvg');
  if(!svg)return;
  svg.innerHTML=lmFremdShapes()+lmSeiteShapes().map(function(s){return lmShapeSvg(s,false,'');}).join('')+(LM.temp||'');
}
function lmDelState(){var b=$lm('lmDel');if(b)b.disabled=!LM.sel;}
window.lmDelSel=function(){
  if(!LM.sel)return;
  var arr=lmSeiteShapes();
  var i=arr.findIndex(function(s){return s.id===LM.sel;});
  if(i>=0){arr.splice(i,1);LM.dirty=true;}
  LM.sel=null;lmDraw();lmDelState();lmQueue();
};
function lmSaveState(t){var e=$lm('lmSave');if(e)e.textContent=t||'';}
function lmQueue(){
  lmSaveState('⏳');
  clearTimeout(_lmT);
  _lmT=setTimeout(lmFlush,900);
}
function lmFlush(){
  clearTimeout(_lmT);_lmT=null;
  if(!LM.mat||!LM.dirty)return;
  LM.dirty=false;
  LM.notiz.matId=LM.mat.id;
  LM.notiz.klasseId=LM.mat.klasseId;
  LM.notiz.seiten=LM.shapes;
  S.saveNotiz(LM.notiz).catch(function(){});
  lmSaveState('✓ gespeichert');
  setTimeout(function(){if($lm('lmSave')&&$lm('lmSave').textContent==='✓ gespeichert')lmSaveState('');},1800);
}

// ── Zeichnen auf dem Overlay ─────────────────────────────────────────
function lmPos(ev){
  var r=$lm('lmSvg').getBoundingClientRect();
  var t=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
  return {x:Math.max(0,Math.min(1,(t.clientX-r.left)/lmW())),
          y:Math.max(0,Math.min(1,(t.clientY-r.top)/lmH()))};
}
function lmNeu(base){
  var u=me();
  return Object.assign({id:lmId('shp'),farbe:LM.farbe,
    von:{userId:u?u.id:'',name:u?(u.name||u.username):''},am:new Date().toISOString()},base);
}
var _lmDown=null;
function lmDown(ev){
  if(!LM.mat)return;
  if(LM.tool==='hand'){
    var sh=ev.target.closest?ev.target.closest('.lm-shp[data-sid]'):null;
    LM.sel=sh?sh.getAttribute('data-sid'):null;
    lmDraw();lmDelState();
    return;
  }
  ev.preventDefault();
  var p=lmPos(ev);
  if(LM.tool==='text'){
    GemaDialog.prompt({title:'Notiz einfügen',placeholder:'z.B. Formel merken — Prüfung'}).then(function(txt){
      if(txt===null)return;txt=String(txt).trim();if(!txt)return;
      lmSeiteShapes().push(lmNeu({typ:'text',x1:p.x,y1:p.y,text:txt}));
      LM.dirty=true;lmDraw();lmQueue();
    });
    return;
  }
  _lmDown=p;
  if(LM.tool==='frei')LM.pts=[[p.x,p.y]];
}
function lmMove(ev){
  if(!_lmDown)return;
  ev.preventDefault();
  var p=lmPos(ev),sw=Math.max(1.6,lmW()*0.0024);
  if(LM.tool==='frei'){
    var last=LM.pts[LM.pts.length-1];
    if(Math.abs(p.x-last[0])+Math.abs(p.y-last[1])>0.004)LM.pts.push([p.x,p.y]);
    LM.temp='<polyline fill="none" stroke="'+LM.farbe+'" stroke-width="'+sw+'" stroke-linecap="round" points="'+LM.pts.map(function(q){return lmX(q[0]).toFixed(1)+','+lmY(q[1]).toFixed(1);}).join(' ')+'"/>';
  }else if(LM.tool==='marker'){
    LM.temp='<rect fill="'+LM.farbe+'" fill-opacity="0.34" x="'+lmX(Math.min(_lmDown.x,p.x))+'" y="'+lmY(Math.min(_lmDown.y,p.y))+'" width="'+Math.abs(lmX(p.x)-lmX(_lmDown.x))+'" height="'+Math.max(6,Math.abs(lmY(p.y)-lmY(_lmDown.y)))+'" rx="2"/>';
  }else if(LM.tool==='rect'){
    LM.temp='<rect fill="none" stroke="'+LM.farbe+'" stroke-width="'+sw+'" x="'+lmX(Math.min(_lmDown.x,p.x))+'" y="'+lmY(Math.min(_lmDown.y,p.y))+'" width="'+Math.abs(lmX(p.x)-lmX(_lmDown.x))+'" height="'+Math.abs(lmY(p.y)-lmY(_lmDown.y))+'"/>';
  }
  lmDraw();
}
function lmUp(ev){
  if(!_lmDown)return;
  var p=lmPos(ev),d=Math.abs(p.x-_lmDown.x)+Math.abs(p.y-_lmDown.y);
  LM.temp='';
  if(LM.tool==='frei'){
    if(LM.pts&&LM.pts.length>2)  {lmSeiteShapes().push(lmNeu({typ:'frei',pts:LM.pts}));LM.dirty=true;}
    LM.pts=null;
  }else if(d>0.008){
    lmSeiteShapes().push(lmNeu({typ:LM.tool,x1:_lmDown.x,y1:_lmDown.y,x2:p.x,y2:p.y}));
    LM.dirty=true;
  }
  _lmDown=null;
  lmDraw();if(LM.dirty)lmQueue();
}

// ── Panel: geteilte Notizen ein-/ausblenden ──────────────────────────
window.lmNotizPanel=function(){
  var p=$lm('lmPanel');
  if(p.style.display!=='none'){p.style.display='none';return;}
  p.style.display='';lmPanelRender();
};
function lmPanelRender(){
  var p=$lm('lmPanel');
  if(!p||p.style.display==='none')return;
  var ids=Object.keys(LM.fremd);
  var rows=ids.length?ids.map(function(id){
    var n=LM.fremd[id];
    var br=S.notizSeitenBereich(n);
    var anz=lmZaehl(n);
    return '<label class="lm-nrow"><input type="checkbox"'+(LM.fremdVis[id]?' checked':'')+' onchange="lmFremdToggle(\''+esc(id)+'\',this.checked)"/>'+
      '<span class="lm-ndot" style="background:'+(n.farbe||'#7c3aed')+'"></span>'+
      '<span style="flex:1;min-width:0"><span style="font-weight:700">'+esc(n.userName||'Unbekannt')+'</span>'+
      '<span class="lm-nsub"> · '+anz+' Markierung'+(anz===1?'':'en')+(br?' · Seiten '+br.von+'–'+br.bis:' · komplett')+'</span></span></label>';
  }).join(''):'<div class="lm-leer">Noch hat niemand seine Notizen mit dir geteilt.</div>';
  var eigen=LM.notiz&&LM.notiz.geteilt&&LM.notiz.geteilt.aktiv;
  p.innerHTML='<h4>👥 Geteilte Notizen</h4>'+rows+
    '<div style="border-top:1px dashed var(--brd);margin-top:8px;padding-top:8px;font-size:11.5px;color:var(--mut)">'+
    (eigen?('Deine Notizen sind geteilt ('+(LM.notiz.geteilt.modus==='seiten'?'Seiten '+LM.notiz.geteilt.von+'–'+LM.notiz.geteilt.bis:'komplett')+').')
          :'Deine Notizen sind privat.')+'</div>';
}
window.lmFremdToggle=function(id,on){LM.fremdVis[id]=!!on;lmDraw();};

// ── Teilen: komplett oder Seiten von–bis ─────────────────────────────
window.lmTeilenOpen=function(){
  if(!LM.mat)return;
  var g=(LM.notiz&&LM.notiz.geteilt)||{};
  var max=LM.seiten||1;
  var k=LM.klasse;
  var personen=[];
  if(k){
    var ids=(k.dozentIds||[]).concat(k.studentIds||[]);
    var u=me();
    var users=[];
    try{users=(typeof GemaAuth!=='undefined'&&GemaAuth.getUsers&&GemaAuth.getUsers())||[];}catch(e){}
    ids.forEach(function(id){
      if(u&&id===u.id)return;
      var us=users.find(function(x){return x.id===id;});
      personen.push({id:id,name:us?(us.name||us.username):id,dozent:(k.dozentIds||[]).indexOf(id)>=0});
    });
  }
  var sel=(g.anUserIds||[]);
  var html='<div style="display:flex;flex-direction:column;gap:12px">'+
    '<div><div style="font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Umfang</div>'+
    '<label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-bottom:5px"><input type="radio" name="lmMod" value="alle" id="lmModAlle"'+(g.modus!=='seiten'?' checked':'')+' onchange="lmTeilenModus()"/> Komplettes Lernmittel</label>'+
    '<label style="display:flex;gap:7px;align-items:center;font-size:13px"><input type="radio" name="lmMod" value="seiten" id="lmModSeiten"'+(g.modus==='seiten'?' checked':'')+' onchange="lmTeilenModus()"/> Nur Seiten</label>'+
    '<div id="lmSeitenBox" style="display:'+(g.modus==='seiten'?'flex':'none')+';gap:8px;align-items:center;margin-top:7px;padding-left:22px">'+
      '<span style="font-size:12.5px;color:var(--mut)">von</span><input class="inp" id="lmVon" type="text" inputmode="numeric" style="width:70px" value="'+esc(String(g.von||1))+'" oninput="lmTeilenSync()">'+
      '<span style="font-size:12.5px;color:var(--mut)">bis</span><input class="inp" id="lmBis" type="text" inputmode="numeric" style="width:70px" value="'+esc(String(g.bis||max))+'" oninput="lmTeilenSync()">'+
      '<span style="font-size:11.5px;color:var(--mut)">von '+max+'</span></div></div>'+
    '<div><div style="font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Mit wem</div>'+
    '<label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-bottom:6px"><input type="checkbox" id="lmAnKlasse"'+(g.anKlasse!==false&&!sel.length?' checked':(g.anKlasse?' checked':''))+' onchange="lmTeilenZiel()"/> Ganze Klasse'+(k?' («'+esc(k.name)+'»)':'')+'</label>'+
    '<div id="lmPersBox" style="max-height:180px;overflow:auto;border:1px solid var(--brd);border-radius:8px;padding:6px 8px">'+
      (personen.length?personen.map(function(pp){
        return '<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;padding:3px 0"><input type="checkbox" class="lm-pers" value="'+esc(pp.id)+'"'+(sel.indexOf(pp.id)>=0?' checked':'')+' onchange="lmTeilenSync()"/> '+esc(pp.name)+(pp.dozent?' <span class="badge teal" style="margin-left:auto">Dozent</span>':'')+'</label>';
      }).join(''):'<div class="lm-leer">Keine weiteren Personen in dieser Klasse.</div>')+'</div>'+
    '<div style="font-size:11.5px;color:var(--mut);margin-top:6px">Einzelne Personen übersteuern «ganze Klasse».</div></div></div>';
  // Startwerte in den State (der Dialog ist beim Bestätigen schon aus dem
  // DOM — GemaDialog entfernt ihn VOR dem resolve; die Werte müssen also
  // laufend mitgeschrieben werden, ein DOM-Read im .then läuft ins Leere).
  _lmTeil={seiten:g.modus==='seiten',von:g.von||1,bis:g.bis||max,
           anKlasse:(g.anKlasse!==false&&!sel.length)||!!g.anKlasse,pers:sel.slice()};
  GemaDialog.confirm({
    title:'Notizen teilen',html:true,message:html,
    confirmLabel:(g.aktiv?'Freigabe aktualisieren':'Teilen'),cancelLabel:'Abbrechen'
  }).then(function(ok){
    if(!ok)return;
    lmTeilenSave();
  });
  setTimeout(function(){lmTeilenZiel();lmTeilenSync();},60);
};
var _lmTeil={seiten:false,von:1,bis:1,anKlasse:true,pers:[]};
// Dialog-Zustand in den State spiegeln (siehe Kommentar oben)
window.lmTeilenSync=function(){
  var modS=document.getElementById('lmModSeiten');
  if(!modS)return;   // Dialog bereits geschlossen — State behalten
  _lmTeil.seiten=!!modS.checked;
  var v=document.getElementById('lmVon'),b=document.getElementById('lmBis');
  if(v)_lmTeil.von=parseInt(v.value,10)||1;
  if(b)_lmTeil.bis=parseInt(b.value,10)||LM.seiten;
  _lmTeil.pers=Array.prototype.slice.call(document.querySelectorAll('.lm-pers:checked')).map(function(c){return c.value;});
  var kl=document.getElementById('lmAnKlasse');
  _lmTeil.anKlasse=!!(kl&&kl.checked)&&!_lmTeil.pers.length;
};
window.lmTeilenModus=function(){
  var b=document.getElementById('lmSeitenBox');
  var s=document.getElementById('lmModSeiten');
  if(b)b.style.display=(s&&s.checked)?'flex':'none';
  lmTeilenSync();
};
window.lmTeilenZiel=function(){
  var kl=document.getElementById('lmAnKlasse'),box=document.getElementById('lmPersBox');
  if(box)box.style.opacity=(kl&&kl.checked)?'.55':'1';
  lmTeilenSync();
};
function lmTeilenSave(){
  lmTeilenSync();
  var seiten=_lmTeil.seiten;
  var von=_lmTeil.von||1,bis=_lmTeil.bis||LM.seiten;
  if(von>bis){var t=von;von=bis;bis=t;}
  von=Math.max(1,Math.min(LM.seiten,von));
  bis=Math.max(1,Math.min(LM.seiten,bis));
  var pers=_lmTeil.pers||[];
  var anKlasse=_lmTeil.anKlasse&&!pers.length;
  if(!anKlasse&&!pers.length){
    GemaDialog.alert({title:'Teilen',message:'Wähle die ganze Klasse oder mindestens eine Person.'});
    return;
  }
  var u=me();
  LM.notiz.geteilt={aktiv:true,modus:seiten?'seiten':'alle',von:von,bis:bis,
    anKlasse:anKlasse,anUserIds:pers,am:new Date().toISOString(),
    vonName:u?(u.name||u.username):''};
  LM.dirty=true;lmFlush();lmPanelRender();
  // Benachrichtigen: gezielt die gewählten Personen, sonst die Klasse
  var txt=(u?(u.name||u.username):'Jemand')+' teilt Notizen zu «'+(LM.mat.titel||'Lernmittel')+'»'+
          (seiten?' (Seiten '+von+'–'+bis+')':'')+'.';
  var link='ab_klassen.html?k='+(LM.mat.klasseId||'');
  if(pers.length){
    pers.forEach(function(id){
      try{GemaNotify.push({eventKey:'schule_lernmittel_neu',empfaengerUserId:id,modul:'schule',typ:'info',
        titel:'Notizen geteilt: '+(LM.mat.titel||'Lernmittel'),text:txt,link:link});}catch(e){}
    });
  }else if(LM.klasse){
    S.notifyKlasse(LM.klasse,{eventKey:'schule_lernmittel_neu',typ:'info',
      titel:'Notizen geteilt: '+(LM.mat.titel||'Lernmittel'),text:txt,link:link});
  }
  GemaDialog.alert({title:'Geteilt',message:'Deine Notizen sind jetzt '+(seiten?('für die Seiten '+von+'–'+bis):'komplett')+' freigegeben. Du kannst die Freigabe jederzeit ändern.'});
}

// Reader-Events (einmalig)
(function lmWire(){
  var svg=$lm('lmSvg');if(!svg)return;
  svg.addEventListener('mousedown',lmDown);
  svg.addEventListener('mousemove',lmMove);
  window.addEventListener('mouseup',lmUp);
  svg.addEventListener('touchstart',lmDown,{passive:false});
  svg.addEventListener('touchmove',lmMove,{passive:false});
  window.addEventListener('touchend',lmUp);
  document.addEventListener('keydown',function(e){
    if(!$lm('lmOv').classList.contains('on'))return;
    if(e.key==='Escape'){lmClose();return;}
    if(e.key==='ArrowRight')lmSeite(1);
    if(e.key==='ArrowLeft')lmSeite(-1);
    if((e.key==='Delete'||e.key==='Backspace')&&LM.sel&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||''))
      {e.preventDefault();lmDelSel();}
  });
  // Debounce nie verlieren (iOS-Safari überspringt beforeunload regelmässig)
  ['beforeunload','pagehide','visibilitychange'].forEach(function(ev){
    window.addEventListener(ev,function(){if(document.visibilityState!=='visible'||ev!=='visibilitychange')lmFlush();});
  });
})();
window._lmHooks={LM:LM,open:function(id){return lmOpen(id);},zaehl:lmZaehl,
  flush:lmFlush,teilenSave:lmTeilenSave,panel:lmPanelRender};

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  if(canEdit()){
    document.getElementById('btnNeueKlasse').style.display='';
    document.getElementById('archivToggle').style.display='';
  }
  // 1) Sofort aus dem Cache rendern
  try{renderList();}catch(e){}
  // 2) Cloud-Pull (blockiert die Anzeige nicht)
  var t=new Promise(function(res){setTimeout(res,6000);});
  Promise.race([S.bind({loesungen:false}),t]).then(function(){
    _klCloudLoaded=true;
    if(S.istStudent())S.refreshStudentMods();
    renderList();
    if(_openId)renderDetail();
    S.scanErinnerungen();
    // Klassen-Chatgruppen anlegen/nachführen (Dozent UND Studierende)
    try{S.meineKlassen().filter(function(k){return !k.archiviert;}).forEach(klChatSync);}catch(e){}
    // Deep-Link ?k=<klasseId>
    try{
      var params=new URLSearchParams(location.search);
      var kid=params.get('k');
      if(kid&&S.klasseById(kid))klOpen(kid);
      // Beitritts-Code aus sys_login (?klasse=CODE bei bestehender Session)
      var joinCode=sessionStorage.getItem('gema_klasse_join');
      if(joinCode){
        sessionStorage.removeItem('gema_klasse_join');
        klBeitreten(joinCode);
      }
    }catch(e){}
  });
  window.addEventListener('gema-schule-changed',function(){
    if(!document.getElementById('klOv').classList.contains('open'))renderList();
  });
  if(typeof GemaFeedback!=='undefined')GemaFeedback.init('klassen','Klassen & Lernmittel');
});
window.renderList=renderList;
})();
